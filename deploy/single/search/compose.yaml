name: morde-search

services:
  searxng:
    image: ghcr.io/searxng/searxng:2026.11.5-3e95f6cd2@sha256:ffad724acd87b8dd312328d18da88ddd42e5c4b1d23231594662620053c13cae
    restart: unless-stopped
    user: "977:977"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      SEARXNG_SECRET: ${CH_SEARXNG_SECRET:?Set CH_SEARXNG_SECRET}
      FORCE_OWNERSHIP: "false"
      GRANIAN_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8189:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    tmpfs:
      - /tmp:mode=1777
      - /var/cache/searxng:uid=977,gid=977,mode=0700
    logging:
      driver: none

