[Unit]
Wants=morde-portal.service

[Service]
EnvironmentFile=-/etc/cloudhost/cloudhost.env
ExecStartPre=/opt/cloudhost/network-policy.sh nftables-before
ExecStartPost=/opt/cloudhost/network-policy.sh preload
ExecStop=
ExecStop=/opt/cloudhost/network-policy.sh nftables-stop
ExecReload=
ExecReload=/opt/cloudhost/network-policy.sh nftables-reload
