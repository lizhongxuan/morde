name: cloudhost

services:
  postgres:
    image: docker.io/library/postgres:16.15-bookworm@sha256:efedf3595f1d6f415c08568ba171029bf54052e754cc9f030e3f2412b21f3d67
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloudhost
      POSTGRES_USER: cloudhost
      POSTGRES_PASSWORD: ${CH_POSTGRES_PASSWORD:?Set CH_POSTGRES_PASSWORD in /etc/cloudhost/cloudhost.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - type: bind
        source: ${CH_POSTGRES_DATA_DIR:?Set CH_POSTGRES_DATA_DIR to a directory on the PostgreSQL data partition}
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    stop_grace_period: 1m

  opensandbox-server:
    image: registry.local/cloudhost/opensandbox-server:release-1.1.1-runtime-8090
    network_mode: host
    restart: unless-stopped
    command: ["--config", "/etc/opensandbox/opensandbox.toml"]
    environment:
      OPENSANDBOX_SERVER_API_KEY: ${CH_OSB_API_KEY:?Set CH_OSB_API_KEY in /etc/cloudhost/cloudhost.env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CH_OSB_CONFIG_FILE:-/etc/opensandbox/opensandbox.toml}:/etc/opensandbox/opensandbox.toml:ro

  caddy:
    image: docker.io/library/caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    network_mode: host
    restart: unless-stopped
    environment:
      CH_CADDY_PORTAL_ADDRESS: ${CH_CADDY_PORTAL_ADDRESS:?Set CH_CADDY_PORTAL_ADDRESS in /etc/cloudhost/cloudhost.env}
      CH_CADDY_HOST_ADDRESS: ${CH_CADDY_HOST_ADDRESS:?Set CH_CADDY_HOST_ADDRESS in /etc/cloudhost/cloudhost.env}
      CH_CADDY_PORTAL_TLS: ${CH_CADDY_PORTAL_TLS-}
      CH_CADDY_HOST_TLS: ${CH_CADDY_HOST_TLS-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  workspace-sync-relay:
    image: ${CH_WORKSPACE_SYNC_RELAY_IMAGE:-local/morde-workspace-sync-relay:unset}
    container_name: morde-syncthing-relay
    profiles: [workspace-sync]
    restart: unless-stopped
    user: "65532:65532"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 64
    command:
      - -listen
      - :22067
      - -keys
      - /var/lib/morde-relay
      - -token
      - ${CH_WORKSPACE_SYNC_RELAY_TOKEN:?Set CH_WORKSPACE_SYNC_RELAY_TOKEN in /etc/cloudhost/cloudhost.env}
      - -status-srv=
      - -pools=
      - -ext-address
      - ${CH_WORKSPACE_SYNC_RELAY_PUBLIC_ADDRESS:-127.0.0.1:22067}
      - -provided-by
      - Morde
    ports:
      - "${CH_WORKSPACE_SYNC_RELAY_BIND_ADDRESS:-127.0.0.1}:${CH_WORKSPACE_SYNC_RELAY_PORT:-22067}:22067/tcp"
    volumes:
      - type: bind
        source: ${CH_WORKSPACE_SYNC_RELAY_STATE_DIR:-/srv/morde-workspace-sync-relay}
        target: /var/lib/morde-relay
        bind:
          create_host_path: false
    networks:
      - workspace_sync_relay

volumes:
  caddy_data:
  caddy_config:

networks:
  workspace_sync_relay:
    driver: bridge
    driver_opts:
      # shortcut: disabling IP masquerading does not enforce an egress ACL; configure the host firewall before external exposure.
      com.docker.network.bridge.enable_ip_masquerade: "false"
