.list-row{display:flex;align-items:center;gap:12px;padding:13px 17px;border-top:1px solid #f1f3f6}.list-row:first-child{border-top:0}.list-row .grow{flex:1;min-width:0}.list-row strong{display:block;font-size:12px}.list-row p{margin:3px 0 0;color:#98a4b4;font-size:11px}.list-row .actions{margin-left:auto}
.checklist{display:grid;gap:10px}.checkline{display:flex;gap:9px;align-items:center;font-size:12px}.checkline input{accent-color:var(--blue)}.empty{padding:34px;text-align:center;color:#99a5b5}.empty strong{display:block;color:#56637a;margin-bottom:4px}.metric{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid #f0f2f6}.metric:first-child{border-top:0}.metric span{color:#8b97a9;font-size:11px}.metric strong{font-size:12px}.progress{height:5px;border-radius:8px;background:#edf0f6;overflow:hidden}.progress i{display:block;height:100%;background:#7088e5;border-radius:8px}

.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.kv div span{display:block;color:#a1abba;font-size:10px;margin-bottom:3px}.kv div strong{font-size:12px}.back{margin-bottom:10px}.desktop-preview{height:260px;border-radius:8px;background:linear-gradient(135deg,#243357,#4a5e88);display:grid;place-items:center;color:#e7edff;text-align:center}.desktop-preview .screen-icon{width:45px;height:45px;margin:0 auto 14px;stroke-width:1.1}.footer-note{text-align:center;color:#adb6c3;font-size:10px;padding:8px}
.panel-header{flex-wrap:wrap}.panel-header>.toolbar{margin-left:auto;justify-content:flex-end}.summary-panel .card{box-shadow:none}.chat-side-actions{display:flex;gap:6px;flex-wrap:wrap;margin:0 4px 12px}.chat-main,.chat-content{min-height:0}.chat-top,.chat-compose{flex-shrink:0}
dialog{border:1px solid var(--line);border-radius:12px;padding:0;width:min(480px,calc(100vw - 30px));box-shadow:0 20px 80px #18243d38;color:var(--ink)}dialog::backdrop{background:#1a294e77}.dialog-head{display:flex;align-items:center;justify-content:space-between;padding:17px 20px;border-bottom:1px solid var(--line)}.dialog-head strong{font-size:14px}.dialog-body{padding:18px 20px}.dialog-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.toast{position:fixed;bottom:22px;right:24px;background:#253249;color:#fff;padding:10px 14px;border-radius:7px;z-index:10;font-size:11px;box-shadow:0 8px 30px #25324925}
@media(max-width:920px){.app{grid-template-columns:64px minmax(0,1fr)}.brand{padding:18px 15px}.brand-text,.nav-link span,.nav-group,.sidebar-bottom .profile,.nav-link:after{display:none}.sidebar-nav{padding:0 10px}.nav-link{justify-content:center;padding:0}.topbar{padding:0 20px}.content{padding:24px 20px}.cols-4{grid-template-columns:repeat(2,1fr)}.cols-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}.sidebar{position:static;height:auto;display:block}.brand{padding:12px 16px}.sidebar-nav{display:flex;overflow:auto;padding:0 9px 8px}.nav-link{min-width:36px;width:36px}.sidebar-bottom{display:none}.topbar{position:static;height:48px}.top-user,.design-label{display:none}.content{padding:20px 14px}.cols-2,.cols-3,.cols-4,.split,.form-row,.kv{grid-template-columns:1fr}.chat{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);min-height:600px}.chat-side{display:block;border-right:0;border-bottom:1px solid var(--line);padding:9px 11px}.chat-side-head{padding-bottom:4px}.chat-side-actions{margin-bottom:0}.chat-side .chat-item{display:none}.panel-header>.toolbar{margin-left:0;justify-content:flex-start}}
</style>

    ['设置与授权',[['connections','模型连接','link'],['clients','客户端','monitor'],['apikeys','API Key','key'],['settings','账户设置','settings']]]
  ];
  const adminNav = [['日常管理',[['admin-overview','总览','grid'],['admin-users','用户','users'],['admin-settings','配置与预算','settings'],['admin-models','平台模型','spark'],['admin-usage','用量与统计','chart'],['admin-quality','质量与风险','shield'],['admin-controls','规则与通知','bell'],['admin-hosts','云端电脑','monitor'],['admin-workspaces','工作区','folder'],['admin-audit','审计','file']]]];
  const extra = {
    'host-new':['创建电脑','hosts'], 'host-entry':['电脑桌面','hosts'], 'project-detail':['项目详情','projects'],
    password:['修改密码','settings'],notifications:['通知',''],download:['下载客户端','clients'],login:['登录',''],register:['注册',''],
    'admin-user-detail':['用户详情','admin-users'],'admin-user-records':['会话记录','admin-users'],
    'admin-host-detail':['电脑详情','admin-hosts'],'admin-workspace-detail':['工作区详情','admin-workspaces'],
    'admin-login':['管理员登录',''],'admin-password':['修改密码',''],'admin-denied':['没有管理权限','']
  };
  const metadata = {};
  userNav.concat(adminNav).forEach(function (group) { group[1].forEach(function (item) { metadata[item[0]] = [item[1], item[0]]; }); });
  Object.keys(extra).forEach(function (key) { metadata[key] = extra[key]; });
  const navigation = document.getElementById('navigation');
  const content = document.getElementById('content');
  const dialog = document.getElementById('demo-dialog');
  const toast = document.querySelector('.toast');
  let toastTimer;
  function icon(name) { return '<svg class="icon" aria-hidden="true"><use href="#i-' + name + '"></use></svg>'; }
  function page(id, changeHash) {
    const template = document.getElementById('view-' + id);
    if (!template || !metadata[id]) return;
    const isAdmin = id.indexOf('admin-') === 0;
    const groups = isAdmin ? adminNav : userNav;
    navigation.innerHTML = groups.map(function (group) {
      return '<div class="nav-group">' + group[0] + '</div>' + group[1].map(function (item) {
        return '<button type="button" class="nav-link' + (metadata[id][1] === item[0] ? ' active' : '') + '" data-go="' + item[0] + '" aria-label="' + item[1] + '" title="' + item[1] + '"' + (metadata[id][1] === item[0] ? ' aria-current="page"' : '') + '>' + icon(item[2]) + '<span>' + item[1] + '</span></button>';
      }).join('');
    }).join('');
    document.getElementById('brand-sub').textContent = isAdmin ? '管理后台' : 'PC 用户端';
    document.getElementById('crumb-mode').textContent = isAdmin ? '管理后台' : 'PC 用户端';
    document.getElementById('crumb-page').textContent = metadata[id][0];
    document.getElementById('profile-sub').textContent = isAdmin ? '管理员' : '个人账号';
    document.getElementById('switch-mode').innerHTML = icon('link') + '<span>' + (isAdmin ? '切换至 PC 用户端' : '切换至管理后台') + '</span>';
    document.getElementById('switch-mode').dataset.go = isAdmin ? 'assistant' : 'admin-overview';
    document.getElementById('switch-mode').setAttribute('aria-label', isAdmin ? '切换至 PC 用户端' : '切换至管理后台');
    content.replaceChildren(template.content.cloneNode(true));
    const note = document.createElement('div');
    note.className = 'footer-note';
    note.textContent = 'Morde 页面设计稿 · 示例数据，仅用于设计预览';
    content.appendChild(note);
    if (changeHash && location.hash !== '#' + id) location.hash = id;
    window.scrollTo(0, 0);
  }
  function message() {
    toast.textContent = '这里是交互示意，未连接真实服务，也不会保存数据。';
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.hidden = true; }, 3000);
  }
  function showDialog(title) {
    document.getElementById('dialog-title').textContent = title;
    dialog.querySelector('[data-demo]').hidden = false;
    const body = document.getElementById('dialog-body');
    if (title.indexOf('模型') !== -1) {
      body.innerHTML = '<div class="form-stack"><div class="notice">设计稿示意：选择预设模型后输入 API 密钥。</div><div class="field"><label>选择模型<select><option>OpenAI GPT</option><option>DeepSeek</option><option>自定义模型</option></select></label></div><div class="field"><label>API 密钥<input type="password" class="input" placeholder="仅作为界面示意，请勿输入真实密钥"></label></div><span class="small muted">保存后可检查连接并在助手中选择模型。</span></div>';
    } else {
      body.innerHTML = '<div class="notice">这里展示操作弹窗的视觉样式。设计稿不连接服务，内容不会保存。</div><div class="field" style="margin-top:16px"><label>名称<input class="input" placeholder="输入名称"></label></div>';
    }
    dialog.showModal();
  }
  document.addEventListener('click', function (event) {
    const target = event.target.closest('button');
    if (!target) return;
    if (target.dataset.go) { if (dialog.open) dialog.close(); page(target.dataset.go, true); return; }
    if (target.dataset.close !== undefined) { dialog.close(); return; }
    if (target.dataset.index !== undefined) {
      document.getElementById('dialog-title').textContent = '页面索引';
      dialog.querySelector('[data-demo]').hidden = true;
      const body = document.getElementById('dialog-body');
      body.innerHTML = '<p class="muted small">选择要预览的用户端或管理后台页面。</p><div class="grid cols-2">' + Object.keys(metadata).map(function (id) {
        return '<button type="button" class="nav-link" data-go="' + id + '"><span>' + (id.indexOf('admin-') === 0 ? '后台 · ' : '用户端 · ') + metadata[id][0] + '</span></button>';
      }).join('') + '</div>';
      body.style.maxHeight = '60vh';
      body.style.overflow = 'auto';
      dialog.showModal();
      return;
    }
    if (target.dataset.tab) {
      const group = target.dataset.tab;
      content.querySelectorAll('[data-tab="' + group + '"]').forEach(function (tab) { tab.classList.toggle('active', tab === target); });
      content.querySelectorAll('[data-group="' + group + '"]').forEach(function (panel) { panel.hidden = panel.id !== target.dataset.panel; });
      return;
    }
    if (target.dataset.modal) { document.getElementById('dialog-body').removeAttribute('style'); showDialog(target.dataset.modal); return; }
    if (target.dataset.demo !== undefined) { if (dialog.open) dialog.close(); message(); }
  });
  window.addEventListener('hashchange', function () { page(location.hash.slice(1) || 'assistant', false); });
  const initial = location.hash.slice(1);
  page(metadata[initial] ? initial : 'assistant', false);
}());
</script>
</body>
</html>
