<!doctype html>
<html lang="zh-CN" class="morde-pc-theme">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline';">
  <title>Morde · PC 审核卡片设计稿</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #334155;
      --muted: #64748b;
      --quiet: #94a3b8;
      --line: #dbeafe;
      --line-strong: #bfdbfe;
      --page: #f8faff;
      --blue: #3b82f6;
      --blue-ink: #2563eb;
      --blue-soft: #eff6ff;
      --amber: #9a6700;
      --amber-bg: #fff7e8;
      --amber-line: #f1dcaf;
      --shadow: 0 8px 20px rgb(96 165 250 / 12%);
      font-family: "Yuanti SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 28px 24px;
      color: var(--ink);
      background: var(--page);
    }

    .approval-list { width: min(100%, 980px); margin: 0 auto; }

    .approval-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 202px;
      gap: 20px;
      align-items: center;
      padding: 17px 20px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .card-content { min-width: 0; }

    .card-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .shield-mark {
      display: grid;
      flex: 0 0 32px;
      width: 32px;
      height: 32px;
      place-items: center;
      border-radius: 10px;
      color: var(--blue-ink);
      background: var(--blue-soft);
    }

    .shield-mark svg { width: 18px; height: 18px; }
    .heading-copy { min-width: 0; flex: 1; }

    .title-line {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    h1 {
      margin: 0;
      color: #293b55;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .pending-tag {
      display: inline-flex;
      align-items: center;
      min-height: 21px;
      padding: 1px 7px;
      border-radius: 999px;
      color: var(--blue-ink);
      background: var(--blue-soft);
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }

    .operation-line,
    .evidence-line {
      display: flex;
      align-items: baseline;
      gap: 9px;
      margin: 11px 0 0 42px;
      color: #465b76;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .evidence-line { margin-top: 5px; color: var(--muted); }

    .field-label {
      flex: 0 0 32px;
      color: var(--quiet);
      font-size: 11px;
      font-weight: 600;
    }

    .meta-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      margin: 11px 0 0 42px;
    }

    .meta-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 23px;
      padding: 2px 8px;
      border: 1px solid #e7edf6;
      border-radius: 7px;
      color: #63748b;
      background: #fbfdff;
      font-size: 11px;
      white-space: nowrap;
    }

    .meta-chip strong { color: #7b8ba1; font-weight: 500; }
    .meta-chip .value { color: #465b76; font-weight: 650; }

    .meta-chip.risk {
      border-color: var(--amber-line);
      color: var(--amber);
      background: var(--amber-bg);
    }

    .meta-chip.risk strong,
    .meta-chip.risk .value { color: var(--amber); }

    .meta-chip.scope {
      border-color: var(--line);
      color: var(--blue-ink);
      background: #f5f9ff;
    }

    .card-side {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 11px;
      padding-left: 18px;
      border-left: 1px solid #edf2fa;
    }

    .expiry {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      color: var(--quiet);
      font-size: 11px;
      line-height: 1.4;
      white-space: nowrap;
    }

    .expiry svg { width: 13px; height: 13px; color: #8ba0bd; }
    .expiry time { color: #64748b; font-weight: 600; }

    .actions { display: flex; gap: 7px; }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 0 12px;
      border: 1px solid transparent;
      border-radius: 10px;
      font: inherit;
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
      cursor: pointer;
    }

    .button:focus-visible { outline: 3px solid #bfdbfe; outline-offset: 2px; }
    .button-reject { flex: 0 0 65px; color: var(--blue-ink); border-color: var(--line-strong); background: #fff; }
    .button-reject:hover { background: #f7faff; }
    .button-allow { flex: 1; color: #fff; border-color: var(--blue); background: var(--blue); box-shadow: 0 4px 10px rgb(96 165 250 / 22%); }
    .button-allow:hover { border-color: #2563eb; background: #2563eb; }

    @media (max-width: 760px) {
      body { padding: 16px 12px; }
      .approval-card { grid-template-columns: 1fr; gap: 14px; padding: 15px; border-radius: 16px; }
      .card-side { gap: 9px; padding: 12px 0 0; border-top: 1px solid #edf2fa; border-left: 0; }
      .expiry { justify-content: flex-start; }
      .actions { justify-content: flex-end; }
      .button-allow { flex: 0 0 auto; }
    }

    @media (max-width: 480px) {
      .operation-line, .evidence-line, .meta-row { margin-left: 0; }
      .field-label { flex-basis: 29px; }
      .meta-row { gap: 5px; }
      .meta-chip { padding: 2px 6px; font-size: 10px; }
    }
  </style>
</head>
<body>
  <main class="approval-list" aria-label="待审核操作">
    <article class="approval-card" aria-labelledby="approval-title">
      <div class="card-content">
        <header class="card-heading">
          <span class="shield-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3.2 5.5 5.8v5.1c0 4.2 2.7 7.6 6.5 9.5 3.8-1.9 6.5-5.3 6.5-9.5V5.8L12 3.2Z"/>
              <path d="m9.2 11.8 1.9 1.9 3.8-4"/>
            </svg>
          </span>
          <div class="heading-copy">
            <div class="title-line">
              <h1 id="approval-title">确认合成测试操作</h1>
              <span class="pending-tag">待审批</span>
            </div>
          </div>
        </header>

        <p class="operation-line"><span class="field-label">操作</span><span>运行本地合成测试</span></p>
        <p class="evidence-line"><span class="field-label">依据</span><span>目标：本地合成资源 · 环境：本地浏览器</span></p>

        <div class="meta-row" aria-label="风险、费用和授权范围">
          <span class="meta-chip risk"><strong>风险</strong><span class="value">未知</span></span>
          <span class="meta-chip"><strong>费用</strong><span class="value">未知</span></span>
          <span class="meta-chip scope">仅本次操作</span>
        </div>
      </div>

      <aside class="card-side" aria-label="审批操作">
        <div class="expiry">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.1" stroke="currentColor" stroke-width="1.3"/><path d="M8 4.6v3.7l2.4 1.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          <span>到期</span>
          <time datetime="2026-11-26T17:06:09+08:00">11月26日 17:06</time>
        </div>
        <div class="actions">
          <button class="button button-reject" type="button">拒绝</button>
          <button class="button button-allow" type="button">允许本次</button>
        </div>
      </aside>
    </article>
  </main>
</body>
</html>
