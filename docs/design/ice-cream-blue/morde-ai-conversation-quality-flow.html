<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Morde AI 对话证据闭环</title>
<style>
:root{color-scheme:light;--paper:#f8faff;--white:#fff;--ink:#334155;--muted:#64748b;--line:#dbeafe;--line-strong:#bfdbfe;--brand:#60a5fa;--brand-deep:#1d4ed8;--brand-soft:#dbeafe;--green:#047857;--green-soft:#d1fae5;--amber:#b45309;--amber-soft:#fef3c7;--font:"Yuanti SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 var(--font)}main{width:min(100%,1540px);margin:0 auto;padding:32px 24px 44px}header{margin:0 0 18px}h1{font-size:26px;line-height:1.3;margin:0 0 7px;font-weight:800}header p{margin:0;color:var(--muted);font-size:14px}.diagram{overflow-x:auto;border:1px solid var(--line);border-radius:24px;background:var(--white)}svg{display:block;width:100%;min-width:980px;height:auto}.suite{margin-top:14px;padding:15px 18px;border:1px solid var(--line);border-radius:18px;background:#fff;color:var(--muted);font-size:13px}.suite b{color:var(--brand-deep)}.suite .tag{display:inline-block;margin:2px 5px 2px 0;padding:3px 10px;border:1px solid var(--line-strong);border-radius:999px;background:var(--brand-soft);color:var(--brand-deep);font-weight:650}footer{margin-top:12px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<main>
  <header>
    <h1>从用户消息到可验证交付</h1>
    <p>普通问答不启动云端电脑；需要执行时由 DSH 主 Agent 协调，在授权边界内留下证据并经独立复核。</p>
  </header>
  <div class="diagram">
    <svg viewBox="0 0 1400 824" role="img" aria-labelledby="diagram-title diagram-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="diagram-title">Morde AI 对话证据闭环数据流</title>
      <desc id="diagram-desc">PC 和 iOS 消息进入 Morde 服务端并持久化，交给 DSH 主 Agent。Agent 通过 Morde 模型网关处理请求，并在授权与审批后使用工具。任务事件、步骤和产物形成证据，交由只读独立验证者复核，最后把简洁结论和任务详情回放入口交还客户端。用例集另经 rubric、匿名盲测和跨模型 Judge 验收。</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#334155" opacity=".10"/></pattern>
        <marker id="arrow" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/></marker>
        <marker id="arrow-muted" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
      </defs>
      <rect width="1400" height="824" fill="#f8faff"/>
      <rect width="1400" height="824" fill="url(#dots)"/>
      <rect x="0" y="144" width="1400" height="138" fill="#eff6ff" opacity=".55"/>
      <rect x="0" y="420" width="1400" height="138" fill="#eff6ff" opacity=".55"/>

      <g font-family="Yuanti SC, PingFang SC, Microsoft YaHei, system-ui, sans-serif">
        <text x="28" y="34" fill="#1d4ed8" font-size="11" font-weight="800" letter-spacing="1.2">DATA FLOW · 对话与证据</text>
        <text x="28" y="111" fill="#64748b" font-size="11" font-weight="700" letter-spacing=".6">参与方 / 责任边界</text>
        <g fill="#64748b" font-size="11" font-weight="750" text-anchor="middle" letter-spacing=".35">
          <text x="265" y="112">01 · 输入</text><text x="463" y="112">02 · 持久化与路由</text><text x="661" y="112">03 · 协调</text>
          <text x="859" y="112">04 · 调用</text><text x="1057" y="112">05 · 证据</text><text x="1255" y="112">06 · 交付</text>
        </g>
        <g stroke="#dbeafe" stroke-width="1">
          <path d="M0 144H1400M0 282H1400M0 420H1400M0 558H1400M0 696H1400"/>
          <path d="M166 126V696"/>
        </g>
        <g fill="#64748b" font-size="11" font-weight="750" text-anchor="middle" letter-spacing=".7">
          <text x="82" y="205"><tspan x="82">USER</tspan><tspan x="82" dy="15">CLIENT</tspan></text>
          <text x="82" y="343"><tspan x="82">SERVER</tspan><tspan x="82" dy="15">DSH RUNTIME</tspan></text>
          <text x="82" y="481"><tspan x="82">AUTHORIZED</tspan><tspan x="82" dy="15">TOOLS</tspan></text>
          <text x="82" y="619"><tspan x="82">EVIDENCE</tspan><tspan x="82" dy="15">&amp; REVIEW</tspan></text>
        </g>

        <!-- Connectors are behind the nodes. -->
        <g fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
          <path d="M345 211H365V351H383"/>
          <path d="M543 351H581"/>
          <path d="M741 351H779" marker-start="url(#arrow)"/>
          <path d="M859 398V410H1057V467"/>
          <path d="M1057 514V605"/>
          <path d="M661 398V714H1057V699"/>
          <path d="M1137 629H1175"/>
          <path d="M1255 605V258"/>
        </g>
        <g fill="#64748b" font-size="10.5" font-weight="600">
          <text x="359" y="322">消息 + 幂等键</text>
          <text x="810" y="335" text-anchor="middle">请求 / 响应</text>
          <text x="947" y="406" text-anchor="middle">经授权的调用</text>
          <text x="1071" y="573">审批 · 工具结果</text>
          <text x="804" y="710" text-anchor="middle">步骤 · 结论 · 产物</text>
          <text x="1270" y="430">结论 + 详情入口</text>
        </g>

        <g>
          <g>
            <rect x="185" y="164" width="160" height="94" rx="18" fill="#fff" stroke="#bfdbfe" stroke-width="1.5"/>
            <rect x="197" y="176" width="52" height="20" rx="10" fill="#dbeafe"/><text x="223" y="190" fill="#1d4ed8" font-size="10" font-weight="750" text-anchor="middle">PC / iOS</text>
            <text x="265" y="218" fill="#334155" font-size="15" font-weight="750" text-anchor="middle">用户消息</text>
            <text x="265" y="239" fill="#64748b" font-size="11.5" text-anchor="middle">会话 ID · 原始记录</text>
          </g>
          <g>
            <rect x="383" y="304" width="160" height="94" rx="18" fill="#fff" stroke="#bfdbfe" stroke-width="1.5"/>
            <rect x="395" y="316" width="52" height="20" rx="10" fill="#dbeafe"/><text x="421" y="330" fill="#1d4ed8" font-size="10" font-weight="750" text-anchor="middle">SERVER</text>
            <text x="463" y="358" fill="#334155" font-size="14" font-weight="750" text-anchor="middle">持久化与路由</text>
            <text x="463" y="379" fill="#64748b" font-size="11.5" text-anchor="middle">消息 / 任务 · 幂等</text>
          </g>
          <g>
            <rect x="581" y="304" width="160" height="94" rx="18" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
            <rect x="593" y="316" width="52" height="20" rx="10" fill="#dbeafe"/><text x="619" y="330" fill="#1d4ed8" font-size="10" font-weight="750" text-anchor="middle">DSH</text>
            <text x="661" y="358" fill="#334155" font-size="14" font-weight="750" text-anchor="middle">主 Agent 协调</text>
            <text x="661" y="379" fill="#64748b" font-size="11.5" text-anchor="middle">按需委派 DSH 子 Agent</text>
          </g>
          <g>
            <rect x="779" y="304" width="160" height="94" rx="18" fill="#fff" stroke="#bfdbfe" stroke-width="1.5"/>
            <rect x="791" y="316" width="52" height="20" rx="10" fill="#dbeafe"/><text x="817" y="330" fill="#1d4ed8" font-size="10" font-weight="750" text-anchor="middle">GATEWAY</text>
            <text x="859" y="358" fill="#334155" font-size="14" font-weight="750" text-anchor="middle">Morde 模型网关</text>
            <text x="859" y="379" fill="#64748b" font-size="11.5" text-anchor="middle">模型调用 · 不开放工具</text>
          </g>
          <g>
            <rect x="977" y="467" width="160" height="94" rx="18" fill="#fff" stroke="#bfdbfe" stroke-width="1.5"/>
            <rect x="989" y="479" width="52" height="20" rx="10" fill="#fef3c7"/><text x="1015" y="493" fill="#b45309" font-size="10" font-weight="750" text-anchor="middle">GATED</text>
            <text x="1057" y="521" fill="#334155" font-size="14" font-weight="750" text-anchor="middle">授权工具执行</text>
            <text x="1057" y="542" fill="#64748b" font-size="11.5" text-anchor="middle">不可逆动作先审批</text>
          </g>
          <g>
            <rect x="977" y="605" width="160" height="94" rx="18" fill="#fff" stroke="#bfdbfe" stroke-width="1.5"/>
            <rect x="989" y="617" width="52" height="20" rx="10" fill="#dbeafe"/><text x="1015" y="631" fill="#1d4ed8" font-size="10" font-weight="750" text-anchor="middle">TASK LOG</text>
            <text x="1057" y="659" fill="#334155" font-size="14" font-weight="750" text-anchor="middle">证据与回放</text>
            <text x="1057" y="680" fill="#64748b" font-size="11.5" text-anchor="middle">Task Events · Steps · Artifacts</text>
          </g>
          <g>
            <rect x="1175" y="605" width="160" height="94" rx="18" fill="#fff" stroke="#bfdbfe" stroke-width="1.5"/>
            <rect x="1187" y="617" width="52" height="20" rx="10" fill="#d1fae5"/><text x="1213" y="631" fill="#047857" font-size="10" font-weight="750" text-anchor="middle">REVIEW</text>
            <text x="1255" y="659" fill="#334155" font-size="14" font-weight="750" text-anchor="middle">独立只读复核</text>
            <text x="1255" y="680" fill="#64748b" font-size="11.5" text-anchor="middle">不同 Agent / Session</text>
          </g>
          <g>
            <rect x="1175" y="164" width="160" height="94" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
            <rect x="1187" y="176" width="52" height="20" rx="10" fill="#dbeafe"/><text x="1213" y="190" fill="#1d4ed8" font-size="10" font-weight="750" text-anchor="middle">RESULT</text>
            <text x="1255" y="218" fill="#334155" font-size="14" font-weight="750" text-anchor="middle">简洁结论</text>
            <text x="1255" y="239" fill="#64748b" font-size="11.5" text-anchor="middle">状态 · 任务详情 / 回放</text>
          </g>
        </g>

        <g>
          <rect x="28" y="730" width="1344" height="68" rx="18" fill="#fff" stroke="#dbeafe"/>
          <text x="48" y="756" fill="#1d4ed8" font-size="11" font-weight="800" letter-spacing=".8">用例集门禁</text>
          <text x="48" y="779" fill="#334155" font-size="12.5" font-weight="650">冻结 suite</text>
          <path d="M131 775H175" stroke="#3b82f6" stroke-width="1.7" marker-end="url(#arrow)"/>
          <text x="190" y="779" fill="#334155" font-size="12.5" font-weight="650">原子 Rubric</text>
          <path d="M278 775H322" stroke="#3b82f6" stroke-width="1.7" marker-end="url(#arrow)"/>
          <text x="337" y="779" fill="#334155" font-size="12.5" font-weight="650">双人匿名盲测</text>
          <path d="M447 775H491" stroke="#3b82f6" stroke-width="1.7" marker-end="url(#arrow)"/>
          <text x="506" y="779" fill="#334155" font-size="12.5" font-weight="650">跨模型家族 Judge</text>
          <rect x="698" y="747" width="1" height="36" fill="#dbeafe"/>
          <text x="720" y="756" fill="#b45309" font-size="11" font-weight="800">放行条件</text>
          <text x="720" y="779" fill="#64748b" font-size="12.5">P0 全通过 · 三类结果分别达标 · 严重安全失败为 0</text>
          <rect x="1213" y="749" width="137" height="30" rx="15" fill="#dbeafe"/>
          <text x="1281.5" y="769" fill="#1d4ed8" font-size="11.5" font-weight="750" text-anchor="middle">失败不可互相补分</text>
        </g>
        <g fill="#64748b" font-size="10.5">
          <text x="28" y="815">回放只读；复核失败或证据不足时阻断“已验证完成”。模型与所有工具执行继续受现有权限、审批和日志边界约束。</text>
        </g>
      </g>
    </svg>
  </div>
  <div class="suite"><b>图示范围：</b>表示在线对话的输入、执行、证据和复核流；冻结用例的 rubric、盲测与 Judge 是离线批次门禁，不进入单次对话 Agent 循环。</div>
  <footer>遵循 Morde 冰淇淋蓝规范；图中只表达主数据流，字段、状态与验收阈值见设计文档。</footer>
</main>
</body>
</html>
