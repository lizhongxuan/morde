<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:,">
<title>Morde · iPhone 客户端（冰淇淋蓝）</title>
<style>
:root{
  --brand:#60a5fa;
  --brand-hover:#3b82f6;
  --brand-ink:#2563eb;
  --brand-deep:#1d4ed8;
  --brand-soft:#dbeafe;
  --brand-tint:#bfdbfe;
  --bg:#f8faff;
  --side:#eff6ff;
  --surface:#ffffff;
  --ink:#334155;
  --muted:#94a3b8;
  --muted-strong:#64748b;
  --line:#dbeafe;
  --success:#34b27a;
  --success-bg:#d1fae5;
  --success-ink:#047857;
  --warning:#b45309;
  --warning-bg:#fef3c7;
  --warning-dot:#f59e0b;
  --danger:#f0655a;
  --danger-bg:#fee2e2;
  --danger-ink:#b91c1c;
  --radius-card:24px;
  --radius-bubble:22px;
  --radius-pill:999px;
  --shadow-jelly:0 14px 30px rgba(96,165,250,.18);
  --shadow-soft:0 8px 20px rgba(96,165,250,.12);
  --shadow-btn:0 6px 16px rgba(96,165,250,.28);
  --font:"Yuanti SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --d-dur:1.5s;
  --spin-dur:1.5s;
  --p-dur:1.8s;
  --sh-dur:1.7s;
  --bob-dur:2s;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.7}

/* ---------- 舞台：桌面居中手机框，手机端全屏 ---------- */
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 16px}
.phone{width:390px;max-width:100%;height:min(844px,calc(100vh - 56px));min-height:640px;background:var(--bg);border:1px solid var(--line);border-radius:48px;box-shadow:var(--shadow-jelly),0 0 0 10px #ffffff,0 0 0 11px var(--brand-tint);overflow:hidden;display:flex;flex-direction:column;position:relative}
@media (max-width:480px){
  .stage{padding:0}
  .phone{width:100%;height:100vh;min-height:0;border:none;border-radius:0;box-shadow:none}
}

/* ---------- 状态栏 + 灵动岛 ---------- */
.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:112px;height:30px;border-radius:var(--radius-pill);background:#334155;z-index:5}
.statusbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:16px 30px 6px;font-size:14px;font-weight:700}
.statusbar .sic{display:flex;align-items:center;gap:6px}
.statusbar svg{display:block}

/* ---------- 顶栏 ---------- */
.topbar{flex:0 0 auto;display:flex;align-items:center;gap:11px;padding:8px 18px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.ava{width:40px;height:40px;border-radius:50%;background:var(--brand-soft);color:var(--brand-deep);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;border:1.5px solid var(--brand-tint);position:relative;flex:0 0 auto}
.ava .status{position:absolute;right:0;bottom:1px;width:11px;height:11px;border-radius:50%;background:var(--success);border:2px solid #fff}
.topbar .t{flex:1;min-width:0}
.topbar .t b{display:block;font-size:16px;line-height:1.3}
.topbar .t span{font-size:12.5px;color:var(--muted-strong)}
.model-picker{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:5px 8px 5px 12px;border:1.5px solid var(--brand-tint);border-radius:var(--radius-pill);background:#fff;font-size:12.5px;font-weight:700;color:var(--brand-deep);white-space:nowrap}
.model-picker .mp-ava{width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
.model-picker .chev{width:22px;height:22px;border-radius:50%;background:var(--brand-soft);color:var(--brand-deep);display:flex;align-items:center;justify-content:center;font-size:11px}

/* ---------- 对话区 ---------- */
.chat{flex:1;overflow-y:auto;padding:16px 16px 12px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin;scrollbar-color:var(--brand-tint) transparent}
.day{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12.5px;white-space:nowrap}
.day::before,.day::after{content:"";flex:1;border-top:1.5px solid var(--line)}
.row-u{display:flex;justify-content:flex-end}
.bubble-u{background:var(--brand);color:#fff;padding:10px 16px;border-radius:var(--radius-bubble);border-bottom-right-radius:8px;max-width:82%;font-size:14.5px;box-shadow:var(--shadow-btn)}
.ai-row{display:flex;gap:10px;align-items:flex-start}
.ai-ava{width:32px;height:32px;border-radius:50%;background:var(--brand-soft);color:var(--brand-deep);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:0 0 auto;border:1px solid var(--brand-tint)}
.bubble-ai{background:#fff;border:1px solid var(--line);padding:10px 16px;border-radius:var(--radius-bubble);border-bottom-left-radius:8px;max-width:88%;font-size:14.5px}
.bubble-ai code{font-family:var(--font-mono);font-size:.86em;background:var(--side);padding:1px 6px;border-radius:6px;color:var(--brand-deep)}
.think-bubble{display:inline-flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:var(--radius-bubble);padding:10px 16px}
.think-txt{color:var(--muted-strong);font-size:13px}
.dots{display:inline-flex;gap:5px;align-items:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--brand);animation:dotbounce var(--d-dur) ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.18s}
.dots i:nth-child(3){animation-delay:.36s}
.mascot{position:relative;width:34px;height:34px;border-radius:50%;background:#93c5fd;flex:0 0 auto;animation:bob var(--bob-dur) ease-in-out infinite}
.mascot::before{content:"";position:absolute;left:9px;top:13px;width:5px;height:6px;border-radius:50%;background:#fff;box-shadow:11px 0 0 #fff;animation:blink 3.4s ease-in-out infinite}
.mascot i{position:absolute;left:50%;bottom:7px;width:12px;height:6px;margin-left:-6px;border:2px solid transparent;border-bottom-color:#fff;border-radius:0 0 12px 12px}
.time{font-size:11.5px;color:var(--muted);text-align:center;font-family:var(--font-mono)}

/* ---------- 任务卡 / 审批卡 ---------- */
.taskcard,.approvalcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius-card);padding:16px 18px;box-shadow:var(--shadow-jelly);width:100%}
.card-top{display:flex;align-items:center;gap:8px;font-weight:700;flex-wrap:wrap;font-size:14.5px}
.card-top .tid{color:var(--muted);font-weight:600;font-size:12.5px;font-family:var(--font-mono)}
.card-sub{color:var(--muted-strong);font-size:12.5px;margin-top:6px}
.card-sub b{color:var(--brand-deep);font-family:var(--font-mono);font-weight:700}
.card-desc{color:var(--muted-strong);font-size:13.5px;margin:6px 0 0}
.card-desc code{font-family:var(--font-mono);font-size:.86em;background:var(--side);padding:1px 6px;border-radius:6px;color:var(--brand-deep)}
.card-actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.spin{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--brand);animation:spin var(--spin-dur) linear infinite;flex:0 0 auto;margin-left:auto}
.progress{height:10px;border-radius:99px;background:var(--brand-soft);overflow:hidden;margin:12px 0 4px}
.progress i{display:block;height:100%;border-radius:99px;background:var(--brand);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 7px,transparent 7px 14px);animation:progmove 3.2s ease-in-out infinite alternate,stripes 1.6s linear infinite}
.badge{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:3px 12px;border-radius:var(--radius-pill);font-size:12.5px;font-weight:700;white-space:nowrap}
.badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.badge-run{background:var(--brand-soft);color:var(--brand-ink)}
.badge-wait{background:var(--warning-bg);color:var(--warning)}
.badge-wait.pulsing{animation:pulse var(--p-dur) ease-in-out infinite}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:var(--radius-pill);font-family:var(--font);font-weight:700;border:1px solid transparent;white-space:nowrap;min-height:40px;padding:8px 20px;font-size:14px;line-height:1.4;flex:1}
.btn-primary{background:var(--brand);color:#fff;box-shadow:var(--shadow-btn)}
.btn-secondary{background:#fff;color:var(--brand-deep);border-color:var(--brand-tint)}
.skel i{display:block;height:11px;border-radius:99px;margin:7px 0;background:linear-gradient(90deg,var(--line) 25%,#fff 50%,var(--line) 75%);background-size:200% 100%;animation:shimmer var(--sh-dur) linear infinite}
.skel-note{color:var(--muted-strong);font-size:12.5px;margin-top:2px}

/* ---------- 输入区 ---------- */
.composer-wrap{flex:0 0 auto;padding:10px 14px 8px;background:var(--bg)}
.composer{display:flex;gap:10px;align-items:center;background:#fff;border:1.5px solid var(--brand-tint);border-radius:var(--radius-card);padding:8px 8px 8px 18px;box-shadow:var(--shadow-jelly)}
.composer .ph{flex:1;color:var(--muted);font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.composer .plus{width:36px;height:36px;border-radius:50%;background:var(--brand-soft);color:var(--brand-deep);display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}
.sendbtn{width:40px;height:40px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:var(--shadow-btn);flex:0 0 auto}

/* ---------- 底部胶囊 Tab 栏 ---------- */
.tabbar{flex:0 0 auto;padding:4px 16px calc(10px + env(safe-area-inset-bottom));background:var(--bg)}
.tab-capsule{display:flex;gap:2px;background:#fff;border:1px solid var(--line);border-radius:var(--radius-pill);padding:5px;box-shadow:var(--shadow-jelly)}
.tab{flex:1;min-height:52px;border-radius:var(--radius-pill);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:650;color:var(--muted-strong);position:relative}
.tab svg{display:block}
.tab.on{background:var(--brand-soft);color:var(--brand-deep)}
.tab .n-badge{position:absolute;top:6px;right:calc(50% - 20px);min-width:17px;height:17px;border-radius:99px;background:var(--danger);color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff}
.home-indicator{width:120px;height:5px;border-radius:99px;background:#cbd5e1;margin:8px auto 0}

/* ---------- 动画（仅加载状态） ---------- */
@keyframes dotbounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes progmove{from{width:38%}to{width:78%}}
@keyframes stripes{to{background-position:28px 0}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.72}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){
  .dots i,.mascot,.mascot::before,.spin,.progress i,.badge-wait.pulsing,.skel i{animation-duration:0.01s;animation-iteration-count:1}
}
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="island" aria-hidden="true"></div>

    <!-- 状态栏 -->
    <div class="statusbar">
      <span>9:41</span>
      <span class="sic" aria-hidden="true">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="#334155"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="16" height="11" viewBox="0 0 16 12" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round"><path d="M1.5 4.5a10 10 0 0 1 13 0"/><path d="M4 7.2a6.4 6.4 0 0 1 8 0"/><circle cx="8" cy="10" r="1.2" fill="#334155" stroke="none"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="#334155" opacity=".4"/><rect x="2" y="2" width="16" height="8" rx="2" fill="#34b27a"/><path d="M23.5 4v4a2.2 2.2 0 0 0 0-4z" fill="#334155" opacity=".4"/></svg>
      </span>
    </div>

    <!-- 对话区 -->
    <main class="chat">
      <div class="day">今天 9:39</div>

      <div class="row-u"><div class="bubble-u">帮我把登录超时的 bug 修了，改完跑一遍测试。</div></div>

      <div class="ai-row">

      <div class="ai-row">

      <div>

  </div>
</div>
</body>
</html>
