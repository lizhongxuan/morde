        schema: { $ref: '#/components/schemas/ConversationId' }
    get:
      tags: [Tasks]
      operationId: listConversationActiveTasks
      summary: List visible active tasks in this conversation
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/PageLimit' }
        - { $ref: '#/components/parameters/PageCursor' }
      responses:
        '200':
          description: Active task page and task event cursors
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationActiveTaskPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/conversations/{id}/messages:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ConversationId' }
    get:
      tags: [Tasks]
      operationId: listConversationMessages
      summary: List persistent conversation messages
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/PageLimit' }
        - { $ref: '#/components/parameters/PageCursor' }
        - { $ref: '#/components/parameters/OptionalServiceInstanceID' }
        - { $ref: '#/components/parameters/OptionalMessageActor' }
        - name: client_message_id
          in: query
          description: Reconcile a message submitted by the authenticated account in this conversation.
          schema: { type: string, pattern: '^[A-Za-z0-9._~-]{8,128}$' }
      responses:
        '200':
          description: Message page in chronological order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationMessagePage' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Tasks]
      operationId: acceptConversationMessage
      summary: Accept a message in a personal conversation
      description: Persists the user's message and routing receipt. Task selection and execution happen asynchronously after acceptance; this response does not require a Task to exist. The Idempotency-Key must equal client_message_id.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/ServiceInstanceID' }
        - { $ref: '#/components/parameters/MessageActor' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptConversationMessageRequest' }
      responses:
        '202':
          description: The message and routing receipt were durably accepted. A Task may be created later.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptedConversationMessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/conversations/{id}/messages/{message_id}/retry-processing:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ConversationId' }
      - name: message_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/MessageId' }
      - { $ref: '#/components/parameters/ServiceInstanceID' }
      - { $ref: '#/components/parameters/MessageActor' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [Tasks]
      operationId: retryConversationMessageProcessing
      summary: Retry processing of an accepted failed message
      description: Only the original actor may retry a failed message without a Task. Exact retries use the same key; unknown dispatched model calls are not blindly repeated.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      responses:
        '202': { description: Retry accepted or exact replay }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/conversations/{id}/messages/{message_id}/attachments/{client_attachment_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ConversationId' }
      - name: message_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/MessageId' }
      - name: client_attachment_id
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9._~-]{8,128}$' }
      - { $ref: '#/components/parameters/ServiceInstanceID' }
      - { $ref: '#/components/parameters/MessageActor' }
    put:
      tags: [Tasks]
      operationId: associateConversationMessageAttachment
      summary: Associate a committed personal attachment with its stable message slot
      description: Exact retries succeed; changing the attachment for a slot conflicts. The authenticated owner, message, declared slot, and committed attachment must belong to the same service instance.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [attachment_id]
              properties:
                attachment_id: { $ref: '#/components/schemas/PersonalAttachmentId' }
      responses:
        '204': { description: Attachment associated or exact retry accepted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/conversations/{id}/message-uploads/{client_message_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ConversationId' }
      - name: client_message_id
