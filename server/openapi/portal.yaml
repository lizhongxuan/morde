        workspace_id: { $ref: '#/components/schemas/WorkspaceId' }
        revision: { type: integer, format: int64, minimum: 0 }
        files:
          type: array
          maxItems: 100000
          items: { $ref: '#/components/schemas/WorkspaceFile' }
        empty_directories:
          type: array
          maxItems: 100000
          items: { type: string, minLength: 1, maxLength: 4096, description: Empty leaf directory path; combined with files, at most 100000 manifest entries. }
        directories:
          type: array
          maxItems: 100000
          items: { $ref: '#/components/schemas/WorkspaceDirectory' }
        next_cursor: { type: [string, 'null'], maxLength: 512 }
      additionalProperties: false
    WorkspaceChangePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 500
          items:
            type: object
            required: [revision, path, action, file, directory]
            properties:
              revision: { type: integer, format: int64, minimum: 1 }
              path: { type: string, minLength: 1, maxLength: 4096 }
              action: { type: string, enum: [upsert, delete, directory_upsert, directory_delete], description: Directory actions have file=null; directory_upsert carries the captured directory metadata when known. }
              file: { oneOf: [{ $ref: '#/components/schemas/WorkspaceFile' }, { type: 'null' }] }
              directory: { oneOf: [{ $ref: '#/components/schemas/WorkspaceDirectory' }, { type: 'null' }] }
        next_cursor: { type: string, minLength: 1, maxLength: 512 }
      additionalProperties: false
    WorkspaceDiff:
      type: object
      additionalProperties: false
      required: [workspace_id, from_revision, to_revision, changes]
      properties:
        workspace_id: { $ref: '#/components/schemas/WorkspaceId' }
        from_revision: { type: integer, format: int64, minimum: 0 }
        to_revision: { type: integer, format: int64, minimum: 0 }
        changes:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/WorkspaceDiffChange' }
    WorkspaceDiffChange:
      type: object
      additionalProperties: false
      required: [path, action, before, after, display_status, before_text, after_text]
      properties:
        path: { type: string, minLength: 1, maxLength: 4096 }
        action: { type: string, enum: [added, removed, changed, renamed] }
        before: { oneOf: [{ $ref: '#/components/schemas/WorkspaceDiffVersion' }, { type: 'null' }] }
        after: { oneOf: [{ $ref: '#/components/schemas/WorkspaceDiffVersion' }, { type: 'null' }] }
        display_status: { type: string, enum: [text, binary, too_large, metadata_only, not_applicable] }
        before_text: { type: [string, 'null'], maxLength: 65536 }
        after_text: { type: [string, 'null'], maxLength: 65536 }
    WorkspaceDiffVersion:
      type: object
      additionalProperties: false
      required: [kind, path]
      properties:
        kind: { type: string, enum: [file, symlink, directory] }
        path: { type: string, minLength: 1, maxLength: 4096 }
        symlink_target: { type: string, minLength: 1, maxLength: 4096 }
        size_bytes: { type: integer, format: int64, minimum: 0 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        mode: { type: integer, minimum: 0, maximum: 511 }
        mod_time_ns: { type: [integer, 'null'], format: int64, description: Directory modification time as Unix nanoseconds; omitted when unknown. }
    WorkspaceRestoreRequest:
      type: object
