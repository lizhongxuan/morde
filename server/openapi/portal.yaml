        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/UserId' }
    patch:
      tags: [Admin]
      operationId: updateUser
      summary: Review a user's status, change their role, or update quota
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/capacity:
    get:
      tags: [Admin]
      operationId: getCapacity
      summary: Get configured and allocated cluster capacity
      security:
        - portalSession: []
      responses:
        '200':
          description: Capacity and host counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Capacity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/model-usage/unknown:
    get:
      tags: [Admin]
      operationId: listUnknownModelUsage
      summary: List model calls with unknown provider usage
      description: Requires an approved administrator's unbound Portal session. Entries are oldest first, at most 100 at a time. Dispatched calls that may still be running are excluded.
      security: [{ portalSession: [] }]
      parameters:
        - { name: owner_id, in: query, schema: { $ref: '#/components/schemas/UserId' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
      responses:
        '200':
          description: Unknown calls; no prompt, response, or credential is returned.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [owner_id, source, call_id, model_id, provider_model, reserved_tokens, created_at, unknown_at]
                      properties:
                        owner_id: { $ref: '#/components/schemas/UserId' }
                        source: { type: string, enum: [client, chat, task, probe] }
                        call_id: { type: string }
                        model_id: { type: string }
                        provider_model: { type: string }
                        task_id: { type: string }
                        reserved_tokens: { type: integer, format: int64, minimum: 1 }
                        created_at: { type: string, format: date-time }
                        unknown_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/model-usage/reconcile:
    post:
      tags: [Admin]
      operationId: reconcileUnknownModelUsage
      summary: Record provider-verified usage for an unknown model call
      description: An approved administrator verifies the provider's counts before submitting them. The ledger, associated server Task usage and audit record commit atomically. Only unknown calls can be reconciled. A repeat by the same administrator with identical counts and evidence is idempotent; different submissions conflict. This does not restore an unpersisted model response or restart the call.
      security: [{ portalSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [owner_id, source, call_id, input_tokens, output_tokens, evidence]
              properties:
                owner_id: { $ref: '#/components/schemas/UserId' }
                source: { type: string, enum: [client, chat, task, probe] }
                call_id: { type: string, minLength: 8, maxLength: 128 }
                input_tokens: { type: integer, format: int64, minimum: 0 }
                output_tokens: { type: integer, format: int64, minimum: 0 }
                evidence:
                  type: string
                  minLength: 8
                  maxLength: 512
                  description: Provider reference and verification explanation, at least 8 characters and at most 512 UTF-8 bytes after trimming; omit secrets and request/response content. Saved in the administrator audit record.
      responses:
        '200':
          description: Usage reconciled or an identical prior submission replayed.
          content:
            application/json:
              schema:
                type: object
                required: [replayed]
                properties:
                  replayed: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/users/{id}/model-usage-budget:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/UserId' } }
    get:
      tags: [Admin]
      operationId: getModelAccountBudget
      summary: Get a user's platform model budget and current use
      security: [{ portalSession: [] }]
      responses:
        '200':
          description: Configured budget and usage; an unconfigured account has zero limits and cannot call platform models.
          content:
            application/json:
              schema:
                type: object
                required: [owner_id, configured, token_limit, max_concurrent, used_tokens, in_flight, has_unknown]
                properties:
                  owner_id: { $ref: '#/components/schemas/UserId' }
                  configured: { type: boolean }
                  token_limit: { type: integer, format: int64, minimum: 0 }
                  max_concurrent: { type: integer, minimum: 0, maximum: 100 }
                  used_tokens: { type: integer, format: int64, minimum: 0, description: Settled usage plus current reservations and unknown calls. }
                  in_flight: { type: integer, minimum: 0 }
                  has_unknown: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [Admin]
      operationId: setModelAccountBudget
      summary: Set a user's platform model budget
      description: Requires an approved administrator's unbound Portal session. Lowering a limit below current usage does not cancel dispatched calls; it blocks new reservations until usage is below the limit. Every update is audited.
      security: [{ portalSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token_limit, max_concurrent]
              properties:
                token_limit: { type: integer, format: int64, minimum: 1 }
                max_concurrent: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Updated budget and current usage.
          content:
            application/json:
              schema:
                type: object
                required: [owner_id, configured, token_limit, max_concurrent, used_tokens, in_flight, has_unknown]
                properties:
                  owner_id: { $ref: '#/components/schemas/UserId' }
                  configured: { type: boolean }
                  token_limit: { type: integer, format: int64, minimum: 0 }
                  max_concurrent: { type: integer, minimum: 0, maximum: 100 }
                  used_tokens: { type: integer, format: int64, minimum: 0 }
                  in_flight: { type: integer, minimum: 0 }
                  has_unknown: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/audit:
    get:
      tags: [Admin]
      operationId: listAuditLogs
      summary: Search audit records
      security:
        - portalSession: []
      parameters:
        - { name: actor, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: target, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: Audit records ordered newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditLog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /mcp:
    post:
      tags: [MCP]
      operationId: mcpPost
      summary: MCP Streamable HTTP request
      description: Authenticates with a platform API key (`chk_`) using Bearer authorization.
      security:
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: MCP JSON-RPC response or event stream
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
            text/event-stream:
              schema: { type: string }
        '202': { description: Notification accepted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
    get:
      tags: [MCP]
      operationId: mcpGet
      summary: MCP Streamable HTTP event stream
      security:
        - bearerToken: []
      responses:
        '200':
          description: MCP event stream
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [MCP]
      operationId: mcpDelete
      summary: Close an MCP Streamable HTTP session
      security:
        - bearerToken: []
      responses:
        '200': { description: Session closed }
        '204': { description: Session closed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /healthz:
    get:
      tags: [Health]
      operationId: healthz
      summary: Process liveness check
      description: Does not check external dependencies.
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            text/plain:
              schema: { type: string, const: ok }
  /readyz:
    get:
      tags: [Health]
      operationId: readyz
      summary: Dependency readiness check
      security: []
      responses:
        '200': { description: Database and configured orchestrators are ready }
        '503': { description: A required dependency is unavailable }
components:
  securitySchemes:
    portalSession:
      type: apiKey
      in: cookie
      name: ch_portal
    hostCookie:
      type: apiKey
      in: cookie
      name: ch_host
      description: Host-scoped session cookie issued when entering the current Host.
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: chk_, chd_, or chc_
      description: Bearer platform API key (`chk_`), scoped sync credential (`chd_`), or restricted client credential (`chc_`).
    clientCredential:
      type: http
      scheme: bearer
      bearerFormat: chc_
      description: Native desktop/mobile client credential. It cannot access administrator or API-key management routes.
    hostReplicaBootstrap:
      type: http
      scheme: bearer
      bearerFormat: morde-replica-v1
      description: Host-generation-scoped bootstrap credential used only to read binding snapshots and report applied revisions.
  parameters:
    HostId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/HostId' }
    TokenId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/TokenId' }
    WorkspaceId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/WorkspaceId' }
    SiteId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/SiteId' }
    SiteReleaseId:
      name: release_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/SiteReleaseId' }
    ModelConnectionId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ModelConnectionId' }
    MCPConnectorId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/MCPConnectorId' }
    NotificationId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/NotificationId' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Reuse only for an exact retry of the same operation and normalized request.
      schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._~-]+$' }
    PageLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    PageCursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous page.
      schema: { type: string, minLength: 1, maxLength: 1024 }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Authentication required or credential invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Insufficient role or failed request origin check
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found or not accessible
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: State, quota, capacity, idempotency, event cursor, or workspace conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RequestTooLarge:
      description: Request body exceeds configured size limit
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BadGateway:
      description: The configured model service returned an upstream error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    GatewayTimeout:
      description: The configured model service did not respond before the timeout
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServiceUnavailable:
      description: The model connection service is unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Request rate limit exceeded
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Error:
      description: Error response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ExecutionControlMutationRequest:
      type: object
      additionalProperties: false
      required: [expected_epoch]
      properties:
        expected_epoch: { type: integer, minimum: 1 }
    ExecutionControl:
      type: object
      additionalProperties: false
      required: [owner_id, state, epoch, pending_task_count, runtime, updated_at]
      properties:
        owner_id: { $ref: '#/components/schemas/UserId' }
        state: { type: string, enum: [enabled, stopping, disabled] }
        epoch: { type: integer, minimum: 1 }
        pending_task_count: { type: integer, minimum: 0 }
        runtime: { $ref: '#/components/schemas/ExecutionRuntime' }
        updated_at: { type: string, format: date-time }
    ExecutionRuntime:
      type: object
      additionalProperties: false
      required: [state, runtime_generation, max_concurrent_tasks, active_task_count]
      properties:
        state: { type: string, enum: [not_started, starting, running, stopping, stopped, failed] }
        runtime_id: { type: string }
        runtime_generation: { type: integer, minimum: 0 }
        max_concurrent_tasks: { type: integer, minimum: 0, maximum: 16 }
        active_task_count: { type: integer, minimum: 0 }
    ModelGatewayToolCall:
      type: object
      additionalProperties: false
      required: [id, type, function]
      properties:
        id: { type: string }
        type: { const: function }
        function:
          type: object
          additionalProperties: false
          required: [name, arguments]
          properties:
            name: { type: string }
            arguments: { type: string }
    ModelGatewayTool:
      type: object
      additionalProperties: false
      required: [type, function]
      properties:
        type: { const: function }
        function:
          type: object
          additionalProperties: false
          required: [name, parameters]
          properties:
            name: { type: string }
            description: { type: string }
            parameters: { type: object }
            strict: { type: boolean }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              enum: [invalid_argument, unauthenticated, forbidden, account_pending, account_rejected, account_disabled, not_found, conflict, quota_exceeded, capacity_exceeded, workspace_busy, workspace_conflict, transfer_expired, invalid_state, idempotency_conflict, event_cursor_expired, unsupported, request_too_large, result_too_large, rate_limited, internal, upstream_error, host_not_ready, upstream_timeout]
            message: { type: string }
            details: { type: object, additionalProperties: true }
    HostId: { type: string, pattern: '^h[a-z0-9]{7}$' }
    WorkspaceId: { type: string, pattern: '^w[a-z0-9]{7}$' }
    SiteId: { type: string, pattern: '^site_[a-f0-9]{16}$' }
    SiteReleaseId: { type: string, pattern: '^rel_[a-f0-9]{16}$' }
    UserId: { type: string, pattern: '^u[a-z0-9]{7}$' }
    HostMemberPermission:
      type: string
      enum: ['desktop:view', 'desktop:control', 'terminal:control', 'mcp:control']
    HostMemberInviteRequest:
      type: object
      additionalProperties: false
      required: [user_id, permissions]
      properties:
        user_id: { $ref: '#/components/schemas/UserId' }
        permissions:
          type: array
          minItems: 1
          description: Duplicate entries are removed; desktop:control is stored together with desktop:view.
          items: { $ref: '#/components/schemas/HostMemberPermission' }
    HostMember:
      type: object
      required: [user_id, permissions, created_at]
      properties:
        user_id: { $ref: '#/components/schemas/UserId' }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/HostMemberPermission' }
        created_at: { type: string, format: date-time }
    SharedHost:
      type: object
      required: [id, name, state, url, permissions]
      properties:
        id: { $ref: '#/components/schemas/HostId' }
        name: { type: string }
        state: { type: string }
        url: { type: string, format: uri }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/HostMemberPermission' }
    TokenId: { type: string, pattern: '^t[a-z0-9]{7}$' }
    ClientInstallationId: { type: string, pattern: '^i[a-z0-9]{7}$' }
    ConversationId: { type: string, pattern: '^c[a-z0-9]{7}$' }
    TaskId: { type: string, pattern: '^q[a-z0-9]{7}$' }
    ModelConnectionId: { type: string, pattern: '^p[a-z0-9]{7}$' }
    MCPConnectorId: { type: string, pattern: '^k[a-z0-9]{7}$' }
    MessageId: { type: string, pattern: '^m[a-z0-9]{7}$' }
    StepId: { type: string, pattern: '^s[a-z0-9]{7}$' }
    OperationId: { type: string, pattern: '^o[a-z0-9]{7}$' }
    BatchItemId: { type: string, pattern: '^b[a-z0-9]{7}$' }
    ClarificationId: { type: string, pattern: '^r[a-z0-9]{7}$' }
    ArtifactId: { type: string, pattern: '^a[a-z0-9]{7}$' }
    ScheduleRunId: { type: string, pattern: '^y[a-z0-9]{7}$' }
    NotificationId: { type: string, pattern: '^n[a-z0-9]{7}$' }
    CreateModelConnectionRequest:
      type: object
      required: [name, base_url, model_name, api_key]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        base_url:
          type: string
          format: uri
          pattern: '^https://'
          description: HTTPS URL whose DNS host must be on the server's outbound allowlist.
        model_name: { type: string, minLength: 1, maxLength: 256 }
        api_key: { type: string, minLength: 1, maxLength: 4096, writeOnly: true }
        shared:
          type: boolean
          default: false
          description: Shared connections require an administrator; authorization is checked by the server.
      additionalProperties: false
    UpdateModelConnectionRequest:
      type: object
      required: [name, base_url, model_name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        base_url:
          type: string
          format: uri
          pattern: '^https://'
          description: HTTPS URL whose DNS host must be on the server's outbound allowlist.
        model_name: { type: string, minLength: 1, maxLength: 256 }
        api_key:
          type: string
          maxLength: 4096
          writeOnly: true
          description: Omit or send an empty string to keep the current key; a non-empty value replaces it.
      additionalProperties: false
    ModelConnectionCapabilities:
      type: object
      required: [text, tools, vision]
      properties:
        text: { type: boolean }
        tools: { type: boolean }
        vision: { type: boolean }
      additionalProperties: false
    ModelConnection:
      type: object
      required: [id, name, base_url, model_name, shared, has_api_key, capabilities, checked_at, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/ModelConnectionId' }
        name: { type: string }
        base_url: { type: string, format: uri }
        model_name: { type: string }
        shared: { type: boolean }
        has_api_key: { type: boolean }
        capabilities: { $ref: '#/components/schemas/ModelConnectionCapabilities' }
        checked_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      description: API keys and other secret material are never present in this response.
      additionalProperties: false
    ModelConnectionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ModelConnection' }
      additionalProperties: false
    CreateMCPConnectorRequest:
      type: object
      required: [name, endpoint_url]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        endpoint_url:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https://'
          description: HTTPS endpoint using DNS and port 443, without URL credentials, query or fragment. Actual DNS/IP authorization is performed by the server at connection time.
        credential:
          type: object
          maxProperties: 128
          writeOnly: true
          description: Optional provider credential bundle. The serialized object is limited to 32 KiB, encrypted at rest and never returned.
          additionalProperties: true
      additionalProperties: false
    BeginMCPConnectorOAuthRequest:
      type: object
      required: [expected_revision]
      properties:
        expected_revision: { type: integer, minimum: 1 }
        client_id: { type: string, maxLength: 2048, writeOnly: true }
        client_secret: { type: string, maxLength: 4096, writeOnly: true }
      additionalProperties: false
    BeginMCPConnectorOAuthResponse:
      oneOf:
        - type: object
          required: [kind, authorization_url, redirect_uri]
          properties:
            kind: { const: authorize }
            authorization_url: { type: string, format: uri }
            redirect_uri: { type: string, format: uri }
          additionalProperties: false
        - type: object
          required: [kind, developer_url, redirect_uri]
          properties:
            kind: { const: client_required }
            developer_url: { type: string, format: uri }
            redirect_uri: { type: string, format: uri }
          additionalProperties: false
    UpdateMCPConnectorRequest:
      type: object
      required: [name, endpoint_url, expected_revision]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        endpoint_url:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https://'
        expected_revision: { type: integer, minimum: 1 }
      additionalProperties: false
    RotateMCPConnectorCredentialRequest:
      type: object
      required: [credential, expected_revision]
      properties:
        credential:
          type: object
          maxProperties: 128
          writeOnly: true
          description: Serialized JSON object is limited to 32 KiB and encrypted with owner, connector and credential-version AAD.
          additionalProperties: true
        expected_revision: { type: integer, minimum: 1 }
      additionalProperties: false
    MCPConnector:
      type: object
      required: [id, name, endpoint_url, enabled, has_credential, credential_version, revision, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/MCPConnectorId' }
        name: { type: string }
        endpoint_url: { type: string, format: uri }
        enabled: { type: boolean }
        has_credential: { type: boolean }
        credential_version: { type: integer, minimum: 0 }
        revision: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      description: Private connector metadata. Credential values and ciphertext are never present.
      additionalProperties: false
    MCPConnectorList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MCPConnector' }
      additionalProperties: false
    Quota:
      type: object
      required: [hosts, cpu_milli, mem_mib]
      properties:
        hosts: { type: integer, minimum: 0 }
        cpu_milli: { type: integer, minimum: 0 }
        mem_mib: { type: integer, minimum: 0 }
    Usage:
      type: object
      required: [hosts, cpu_milli, mem_mib]
      properties:
        hosts: { type: integer, minimum: 0 }
        cpu_milli: { type: integer, minimum: 0 }
        mem_mib: { type: integer, minimum: 0 }
    User:
      type: object
      required: [id, name, role, status, must_change_password, quota, usage]
      properties:
        id: { $ref: '#/components/schemas/UserId' }
        name: { type: string }
        role: { $ref: '#/components/schemas/UserRole' }
        status: { $ref: '#/components/schemas/AccountStatus' }
        must_change_password: { type: boolean }
        quota: { $ref: '#/components/schemas/Quota' }
        usage: { $ref: '#/components/schemas/Usage' }
    RegisterRequest:
      type: object
      required: [name, password]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 3, maxLength: 64 }
        password: { type: string, minLength: 8, maxLength: 72, writeOnly: true }
    AccountStatus:
      type: string
      enum: [pending, rejected, approved, disabled]
    UserRole:
      type: string
      enum: [user, admin, super_admin]
    Me:
      type: object
      required: [id, name, role, status, must_change_password, quota, usage]
      properties:
        id: { $ref: '#/components/schemas/UserId' }
        name: { type: string }
        role: { $ref: '#/components/schemas/UserRole' }
        status: { $ref: '#/components/schemas/AccountStatus' }
        must_change_password: { type: boolean }
        quota: { $ref: '#/components/schemas/Quota' }
        usage: { $ref: '#/components/schemas/Usage' }
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password: { type: string, minLength: 1, maxLength: 72, writeOnly: true }
        new_password: { type: string, minLength: 8, maxLength: 72, writeOnly: true }
    UserPreferences:
      type: object
      required: [assistant_name, selected_model_id, default_host_id, updated_at]
      properties:
        assistant_name: { type: string, maxLength: 80 }
        selected_model_id: { oneOf: [{ $ref: '#/components/schemas/ModelConnectionId' }, { type: 'null' }] }
        default_host_id: { oneOf: [{ $ref: '#/components/schemas/HostId' }, { type: 'null' }] }
        updated_at: { type: [string, 'null'], format: date-time }
    SaveUserPreferencesRequest:
      type: object
      required: [assistant_name, selected_model_id]
      properties:
        assistant_name: { type: string, maxLength: 80 }
        selected_model_id: { oneOf: [{ $ref: '#/components/schemas/ModelConnectionId' }, { type: string, maxLength: 0 }] }
      additionalProperties: false
    OnboardingModelCapability:
      type: object
      required: [text, tools, vision]
      properties:
        text: { type: boolean }
        tools: { type: boolean }
        vision: { type: boolean }
    OnboardingModel:
      description: A checked text model available for instant chat. Tool and vision capabilities remain informational.
      type: object
      required: [id, name, capabilities]
      properties:
        id: { $ref: '#/components/schemas/ModelConnectionId' }
        name: { type: string }
        capabilities: { $ref: '#/components/schemas/OnboardingModelCapability' }
    OnboardingComputer:
      type: object
      required: [id, name, state]
      properties:
        id: { $ref: '#/components/schemas/HostId' }
        name: { type: string }
        state: { type: string, enum: [creating, running, stopping, stopped, failed, deleting] }
    OnboardingStatus:
      description: A checked text model allows instant chat even when the default computer is stopped.
      type: object
      required: [model_status, models, selected_model_id, computer_status, computers, default_host_id, can_submit, next_action]
      properties:
        model_status: { type: string, enum: [ready, not_configured, selection_required, selected_unavailable] }
        models:
          type: array
          items: { $ref: '#/components/schemas/OnboardingModel' }
        selected_model_id: { oneOf: [{ $ref: '#/components/schemas/ModelConnectionId' }, { type: 'null' }] }
        computer_status:
          type: string
          enum: [not_created, selection_required, available, creating, restoring, stopping, ready, stopped, create_failed, restore_failed, capacity_unavailable, quota_exceeded, unavailable]
        computers:
          type: array
          items: { $ref: '#/components/schemas/OnboardingComputer' }
        default_host_id: { oneOf: [{ $ref: '#/components/schemas/HostId' }, { type: 'null' }] }
        can_submit: { type: boolean }
        next_action:
          type: string
          enum: [configure_model, start_chat]
    EnsureDefaultHostRequest:
      type: object
      properties:
        host_id: { $ref: '#/components/schemas/HostId' }
      additionalProperties: false
    DefaultHostResult:
      type: object
      required: [created, host, status]
      properties:
        created: { type: boolean }
        host: { oneOf: [{ $ref: '#/components/schemas/OnboardingComputer' }, { type: 'null' }] }
        status: { $ref: '#/components/schemas/OnboardingStatus' }
    Resources:
      type: object
      required: [cpu_milli, mem_mib, cpu_limit_milli, mem_limit_mib]
      properties:
        cpu_milli: { type: integer }
        mem_mib: { type: integer }
        cpu_limit_milli: { type: integer }
        mem_limit_mib: { type: integer }
    WorkspaceRef:
      type: object
      required: [id, name, revision, used_bytes, state]
      properties:
        id: { $ref: '#/components/schemas/WorkspaceId' }
        name: { type: string }
        revision: { type: integer, format: int64, minimum: 0 }
        used_bytes: { type: integer, format: int64, minimum: 0 }
        state: { type: string, enum: [ready, deleting, deleted] }
    WorkspaceBinding:
      type: object
      required: [workspace, directory, state, binding_version, desired_revision, applied_revision, sync_state, sync_conflicts]
      properties:
        workspace: { $ref: '#/components/schemas/WorkspaceRef' }
        directory: { type: string, pattern: '^w[a-z0-9]{7}$' }
        state: { type: string, enum: [preparing, active, unbinding, detached, failed] }
        binding_version: { type: integer, format: int64, minimum: 1 }
        desired_revision: { type: integer, format: int64, minimum: 0 }
        applied_revision: { type: integer, format: int64, minimum: 0 }
        sync_state: { type: string, enum: [healthy, conflict] }
        sync_conflicts:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 4096 }
