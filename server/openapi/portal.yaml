                expected_binding_version: { type: integer, format: int64, minimum: 1 }
              additionalProperties: false
      responses:
        '200':
          description: Current binding after the retry signal was recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceBinding' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: List the current user's in-app notifications
      description: Portal sessions and native client credentials may read owner-wide notifications; API keys cannot. Related task content is redacted when current authorization no longer allows access. Marking read does not approve or execute an action.
      security:
        - portalSession: []
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - name: unread_only
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: In-app notification page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /api/notifications/{id}/read:
    parameters:
      - $ref: '#/components/parameters/NotificationId'
    post:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Mark a notification as read
      description: Portal sessions and native client credentials may mark a historical notification read. Idempotent; this does not execute any task action.
      security:
        - portalSession: []
        - bearerToken: []
      responses:
        '204': { description: Notification marked read or already read }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/apikeys:
    get:
      tags: [Tokens]
      operationId: listAPIKeys
      summary: List the current user's API keys
      security:
        - portalSession: []
      responses:
        '200':
          description: API keys without secret values
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/APIKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Tokens]
      operationId: createAPIKey
      summary: Create an API key
      description: Portal sessions only. The key is returned once. Each request uses the account's current permissions; disabled accounts and revoked sharing take effect immediately. Existing scoped keys are revoked during migration.
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAPIKeyRequest' }
      responses:
        '201':
          description: API key secret returned once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedAPIKey' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /api/instant-chat/conversations:
    get:
      tags: [Instant Chat compatibility]
      operationId: listInstantChatConversations
      summary: List conversations through the legacy instant chat route
      description: Returns the same durable Task-backed conversations as the canonical conversation API.
      security: [{ portalSession: [] }]
      responses:
        '200':
          description: Conversations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/InstantChatConversation' } }
        default: { $ref: '#/components/responses/Error' }
  /api/instant-chat/conversations/{id}/messages:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ConversationId' }
    get:
      tags: [Instant Chat compatibility]
      operationId: listInstantChatMessages
      summary: List conversation messages through the legacy instant chat route
      description: Returns the same persisted messages as the canonical conversation API.
      security: [{ portalSession: [] }]
      responses:
        '200':
          description: Messages
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/InstantChatMessage' } }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/instant-chat/messages:
    post:
      tags: [Instant Chat compatibility]
      operationId: sendInstantChatMessage
      summary: Submit a durable Task through the legacy reply shape
      description: Submits to the canonical Task and Conversation services, then waits for the Task's terminal result to preserve the legacy response shape. Disconnecting while waiting does not cancel the durable Task. Reuse the Idempotency-Key only with the same conversation_id (including an omitted value for a new conversation), model_id, and content after trimming surrounding whitespace. A different request with the same key returns a conflict.
      security: [{ portalSession: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstantChatSendRequest' }
      responses:
        '200':
          description: Saved exchange
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstantChatSendResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/execution:
    get:
      tags: [Tasks]
      operationId: getExecutionControl
      summary: Get the current user's cloud task execution control
      description: Requires a Portal Session. Returns the owner-scoped execution gate, account Runtime generation and quota, and active Task summary. Client credentials and API keys cannot change or inspect this state.
      security: [{ portalSession: [] }]
      responses:
        '200':
          description: Current execution gate, account Runtime, quota, and Task summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionControl' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/execution/stop-all:
    post:
      tags: [Tasks]
      operationId: stopAllExecution
      summary: Stop all cloud task execution for the current user
      description: The expected epoch prevents stale control requests. The same Idempotency-Key may only retry this exact action and epoch. HTTP 202 means Task processes or the account Runtime lack stop confirmation; poll GET /api/execution until the state is disabled.
      security: [{ portalSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecutionControlMutationRequest' }
      responses:
        '200':
          description: Execution is already disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionControl' }
        '202':
          description: Task or account Runtime stop proof is still pending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionControl' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/execution/enable:
    post:
      tags: [Tasks]
      operationId: enableExecution
      summary: Enable cloud task execution for the current user
      description: Requires a Portal Session and the current execution epoch. Reuse the Idempotency-Key only for an exact retry of this action and epoch. The request conflicts while an account Runtime stop is unconfirmed.
      security: [{ portalSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecutionControlMutationRequest' }
      responses:
        '200':
          description: Execution gate is enabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionControl' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/conversations:
    get:
      tags: [Tasks]
      operationId: listConversations
      summary: List the current user's cloud task conversations
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/PageLimit' }
        - { $ref: '#/components/parameters/PageCursor' }
      responses:
        '200':
          description: Conversation page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationPage' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Tasks]
      operationId: createConversation
      summary: Create a persistent cloud task conversation
      description: A conversation is independent of any Host. A Host may be selected separately for each task.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateConversationRequest' }
      responses:
        '201':
          description: Created conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '200':
          description: Exact idempotent replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        default: { $ref: '#/components/responses/Error' }
  /api/conversations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ConversationId' }
    get:
      tags: [Tasks]
      operationId: getConversation
      summary: Get an owned conversation
      security: [{ portalSession: [] }, { clientCredential: [] }]
      responses:
        '200':
          description: Conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/conversations/{id}/messages:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ConversationId' }
    get:
      tags: [Tasks]
      operationId: listConversationMessages
      summary: List persistent conversation messages
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/PageLimit' }
        - { $ref: '#/components/parameters/PageCursor' }
      responses:
        '200':
          description: Message page in chronological order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationMessagePage' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Tasks]
      operationId: appendConversationMessage
      summary: Append a message and queue a cloud task
      description: The selected model and optional Host apply to this task only. The server-side dsh Agent can continue after the client disconnects.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppendConversationMessageRequest' }
      responses:
        '202':
          description: Message and queued task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppendConversationMessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: List the current user's cloud tasks
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/PageLimit' }
        - { $ref: '#/components/parameters/PageCursor' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TaskStatus' }
      responses:
        '200':
          description: Task page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskPage' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Tasks]
      operationId: submitTask
      summary: Submit a durable cloud task
      description: The server owns the dsh Agent lifecycle. An optional Host is only a target for approved computer operations and is not where the Agent process runs.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitTaskRequest' }
      responses:
        '202':
          description: Persisted task awaiting execution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/TaskId' }
    get:
      tags: [Tasks]
      operationId: getTask
      summary: Get an owned task and its durable progress
      security: [{ portalSession: [] }, { clientCredential: [] }]
      responses:
        '200':
          description: Task snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/tasks/{id}/mcp-connectors/{connector_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/TaskId' }
      - name: connector_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/MCPConnectorId' }
    delete:
      tags: [Tasks]
      operationId: revokeTaskMCPConnectorGrant
      summary: Revoke one connector grant for a task
      description: Revocation uses a grant-version compare-and-set. It blocks new connector dispatch; already dispatched operations are settled by the task operation lifecycle.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - name: expected_grant_version
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '204': { description: Connector grant revoked }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/tasks/{id}/actions:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/TaskId' }
    post:
      tags: [Tasks]
      operationId: actOnTask
      summary: Pause, resume, cancel, or retry one batch item
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskActionRequest' }
      responses:
        '202':
          description: Action accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskActionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/tasks/{id}/inputs:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/TaskId' }
    post:
      tags: [Tasks]
      operationId: answerTaskInput
      summary: Answer a versioned clarification and resume a task
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskInputRequest' }
      responses:
        '202':
          description: Input accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskActionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/tasks/{id}/approvals/{approval_id}/responses:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/TaskId' }
      - name: approval_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ClarificationId' }
    post:
      tags: [Tasks]
      operationId: respondToTaskApproval
      summary: Approve or reject a specific versioned task approval
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskApprovalResponseRequest' }
      responses:
        '202':
          description: Decision accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskActionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/tasks/{id}/events:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/TaskId' }
    get:
      tags: [Tasks]
      operationId: streamTaskEvents
      summary: Stream durable task events
      description: Disconnecting the event stream does not cancel the task. If the cursor expires, the stream emits task.snapshot_required and the client must fetch the task snapshot.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - name: after
          in: query
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: Last-Event-ID
          in: header
          schema: { type: string, pattern: '^[0-9]+$' }
      responses:
        '200':
          description: Server-sent task events
          content:
            text/event-stream:
              schema: { type: string }
        '204': { description: No newer events for an already terminal task }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/clients:
    get:
      tags: [Clients]
      operationId: listClients
      summary: List current user's client installations
      description: Requires a portal session or native Client credential; only installations of the current account are returned.
      security: [{ portalSession: [] }, { bearerToken: [] }]
      responses:
        '200':
          description: Installations without credentials
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ClientInstallation' } }
        default: { $ref: '#/components/responses/Error' }
  /api/clients/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ClientInstallationId' }
    delete:
      tags: [Clients]
      operationId: revokeClient
      summary: Revoke a client installation, its credentials, tickets and Gateway sessions
      description: Requires a portal session or native Client credential. Only an installation belonging to the current account can be revoked; its credentials are revoked together.
      security: [{ portalSession: [] }, { bearerToken: [] }]
      responses:
        '204': { description: Installation revoked }
        default: { $ref: '#/components/responses/Error' }
  /api/device/workspaces:
    get:
      tags: [Devices]
      operationId: listDeviceWorkspaces
      summary: List ready workspaces owned by the current desktop client
      description: Requires an active installation-bound Sync credential. Authorization is checked against current owner and ready state on each request; no static workspace grants are stored.
      security:
        - bearerToken: []
      responses:
        '200':
          description: Ready owned workspace metadata
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DeviceWorkspace' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/apikeys/{id}:
    parameters:
      - $ref: '#/components/parameters/TokenId'
    delete:
      tags: [Tokens]
      operationId: deleteAPIKey
      summary: Delete an API key
      security:
        - portalSession: []
      responses:
        '204': { description: API key deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/available-models:
    get:
      tags: [Models]
      operationId: listAvailableModels
      summary: List configured models without connection settings or secrets
      description: Portal sessions and restricted client credentials may read this minimal catalog.
      security: [{ portalSession: [] }, { bearerToken: [] }]
      responses:
        '200':
          description: Configured models
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, name, model_name, capabilities]
                      properties:
                        id: { $ref: '#/components/schemas/ModelConnectionId' }
                        name: { type: string }
                        model_name: { type: string }
                        capabilities:
                          type: object
                          required: [text, tools, vision]
                          properties:
                            text: { type: boolean }
                            tools: { type: boolean }
                            vision: { type: boolean }
        default: { $ref: '#/components/responses/Error' }
  /api/model-connections:
    get:
      tags: [Models]
      operationId: listModelConnections
      summary: List model connections available to the current user
      description: Portal sessions only. Lists shared connections and the current user's personal connections. API keys are not accepted.
      security:
        - portalSession: []
      responses:
        '200':
          description: Model connections without secret values
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelConnectionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Models]
      operationId: createModelConnection
      summary: Create a personal or shared model connection
      description: Portal sessions only. A personal connection is owned by the caller. Setting shared=true creates a shared connection and requires an administrator; ownership and authorization are enforced by the server. The API key is encrypted at rest and never returned.
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateModelConnectionRequest' }
      responses:
        '201':
          description: Created connection without the API key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelConnection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
  /api/model-connections/{id}:
    parameters:
      - $ref: '#/components/parameters/ModelConnectionId'
    get:
      tags: [Models]
      operationId: getModelConnection
      summary: Get a model connection
      description: Portal sessions only. The response includes has_api_key but never the secret. Shared and personal access is checked by the server; inaccessible connections return not found.
      security:
        - portalSession: []
      responses:
        '200':
          description: Model connection without its API key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelConnection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [Models]
      operationId: updateModelConnection
      summary: Update a model connection
      description: Portal sessions only. Only the owner may update a personal connection; only an administrator may update a shared connection. shared is immutable here. Omit api_key or send an empty string to retain the existing secret; any supplied secret replaces it. The server never returns the secret.
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateModelConnectionRequest' }
      responses:
        '200':
          description: Updated connection without its API key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelConnection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Models]
      operationId: deleteModelConnection
      summary: Delete a model connection
      description: Portal sessions only. Only the owner may delete a personal connection; only an administrator may delete a shared connection. Authorization is enforced by the server.
      security:
        - portalSession: []
      responses:
        '204': { description: Model connection deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
  /api/model-connections/{id}/check:
    parameters:
      - $ref: '#/components/parameters/ModelConnectionId'
    post:
      tags: [Models]
      operationId: checkModelConnection
      summary: Check a model connection and discover capabilities
      description: Portal sessions only. Requires a configured account model budget and an Idempotency-Key. The selected probe is reserved and settled in the same ledger as model requests. An omitted capability means all; text, tools and vision can also be checked independently, using a new key for each. False means not yet verified or unsupported. Verified capabilities are combined only while the connection version is unchanged. Unknown usage remains pending for reconciliation and cannot be silently retried; the API key is never returned.
      security:
        - portalSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                capability: { type: string, enum: [all, text, tools, vision], default: all }
      responses:
        '200':
          description: Verified model capabilities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelConnectionCapabilities' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
        default: { $ref: '#/components/responses/Error' }
  /api/mcp/connectors:
    get:
      tags: [MCP]
      operationId: listMCPConnectors
      summary: List the current user's MCP connectors
      description: Portal sessions only. Connectors are private to the account. Responses never contain credential values.
      security:
        - portalSession: []
      responses:
        '200':
          description: Connectors without credential values
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPConnectorList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [MCP]
      operationId: createMCPConnector
      summary: Create a private MCP connector
      description: Portal sessions only. New connectors are disabled until explicitly enabled. Optional credential JSON is encrypted at rest and never returned; URL credentials, query strings, fragments, non-HTTPS schemes, literal IPs and ports other than 443 are rejected.
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMCPConnectorRequest' }
      responses:
        '201':
          description: Created connector without credential values
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPConnector' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
  /api/mcp/connectors/{id}:
    parameters:
      - $ref: '#/components/parameters/MCPConnectorId'
    get:
      tags: [MCP]
      operationId: getMCPConnector
      summary: Get a private MCP connector
      description: Portal sessions only. Another user's connector is reported as not found.
      security:
        - portalSession: []
      responses:
        '200':
          description: Connector metadata and credential presence, without credential values
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPConnector' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [MCP]
      operationId: updateMCPConnector
      summary: Update connector metadata
      description: Portal sessions only. Requires the current revision. Credential rotation uses its separate endpoint.
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMCPConnectorRequest' }
      responses:
        '200':
          description: Updated connector metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPConnector' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [MCP]
      operationId: deleteMCPConnector
      summary: Delete a private MCP connector
      description: Portal sessions only. Requires the current revision; the deletion and audit event commit together.
      security:
        - portalSession: []
      parameters:
        - name: expected_revision
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '204': { description: Connector deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
  /api/mcp/connectors/{id}/credential:
    parameters:
      - $ref: '#/components/parameters/MCPConnectorId'
    put:
      tags: [MCP]
      operationId: rotateMCPConnectorCredential
      summary: Replace a connector credential
      description: Portal sessions only. Credentials are write-only, encrypted with owner, connector and credential-version AAD, and never returned. The request and audit event commit with the new version.
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RotateMCPConnectorCredentialRequest' }
      responses:
        '200':
          description: Updated connector metadata without credential values
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPConnector' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
  /api/mcp/connectors/{id}/enabled:
    parameters:
      - $ref: '#/components/parameters/MCPConnectorId'
    put:
      tags: [MCP]
      operationId: setMCPConnectorEnabled
      summary: Enable or disable a connector
      description: Portal sessions only. Requires the current revision. The change and audit event commit together.
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, expected_revision]
              properties:
                enabled: { type: boolean }
                expected_revision: { type: integer, minimum: 1 }
              additionalProperties: false
      responses:
        '200':
          description: Updated connector state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPConnector' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
  /api/mcp/connectors/{id}/oauth/authorize:
    parameters:
      - $ref: '#/components/parameters/MCPConnectorId'
    post:
      tags: [MCP]
      operationId: beginMCPConnectorOAuth
      summary: Begin server-side OAuth authorization for a connector
      description: Portal sessions only. Discovers the MCP protected resource and authorization server, reuses or dynamically registers an OAuth client, and returns a PKCE authorization URL. If dynamic registration is unavailable, returns the issuer and callback URI so the user can provide an OAuth client ID and optional secret. Client secrets are accepted only in this request and are never returned.
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BeginMCPConnectorOAuthRequest' }
      responses:
        '200':
          description: Authorization URL or a request for user-provided OAuth client details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BeginMCPConnectorOAuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
  /api/mcp/oauth/callback:
    get:
      tags: [MCP]
      operationId: completeMCPConnectorOAuth
      summary: Complete the one-time OAuth authorization callback
      description: Public provider callback protected by a one-time, expiring state hash. The authorization code is exchanged server-side with PKCE and encrypted credentials are stored for the account that initiated the flow. OAuth callback errors are not reflected to the browser.
      security: []
      parameters:
        - { name: state, in: query, required: true, schema: { type: string, minLength: 43, maxLength: 128 } }
        - { name: code, in: query, required: false, schema: { type: string, maxLength: 8192 } }
        - { name: error, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: iss, in: query, required: false, schema: { type: string, format: uri, maxLength: 4096 } }
      responses:
        '200': { description: Authorization completed. Returns a simple no-store page for the user. }
        '400': { description: Authorization was not completed or the one-time state was invalid. }
        '503': { description: OAuth service unavailable. }
  /api/admin/hosts:
    get:
      tags: [Admin]
      operationId: listAllHosts
      summary: List all hosts
      security:
        - portalSession: []
      responses:
        '200':
          description: Hosts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Host' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/hosts/{id}/resources:
    parameters:
      - $ref: '#/components/parameters/HostId'
    get:
      tags: [Admin]
      operationId: getAdminHostResources
      summary: Read the effective host resources, version and update status
      security: [{ portalSession: [] }]
      responses:
        '200':
          description: Host resource target
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminHostResources' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Admin]
      operationId: updateAdminHostResources
      summary: Change a host's CPU and memory resources
      description: Stopped host changes apply on next start. Running Docker hosts are adjusted and read back before success, without restarting the container. An unknown runtime outcome keeps the old effective value and reserves capacity until reconciled.
      security: [{ portalSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAdminHostResourcesRequest' }
      responses:
        '200':
          description: Updated saved target
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminHostResources' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/workspaces:
    get:
      tags: [Admin]
      operationId: listAdminWorkspaces
      summary: List workspace metadata for administrators
      security:
        - portalSession: []
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
      responses:
        '200':
          description: Workspace metadata and Host associations, without paths or file content
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminWorkspacePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/workspaces/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/WorkspaceId' } }
    get:
      tags: [Admin]
      operationId: getAdminWorkspace
      summary: Get workspace metadata and Host associations for administrators
      security:
        - portalSession: []
      responses:
        '200':
          description: Workspace metadata without paths or file content
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminWorkspace' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/users:
    get:
      tags: [Admin]
      operationId: listUsers
      summary: List users without credential data
      security:
        - portalSession: []
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AccountStatus' }
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: object
