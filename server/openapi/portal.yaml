      tags: [Tasks]
      operationId: listTasks
      summary: List the current user's tasks
      description: API keys require task:read. Results are limited to tasks in the caller's current authorization scope.
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TaskStatus' }
      responses:
        '200':
          description: Tasks
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Tasks]
      operationId: submitTask
      summary: Submit a persistent task
      description: API keys require task:submit and access to the selected Host. If conversation_id is omitted, a new conversation bound to that Host is created in the same transaction. If supplied, its bound Host must match. A task is committed before it is accepted; Host and model are never silently substituted.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitTaskRequest' }
      responses:
        '202':
          description: Task accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        default: { $ref: '#/components/responses/Error' }
  /api/tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: getTask
      summary: Get a task
      description: API keys require task:read and current access to the task's host.
      responses:
        '200':
          description: Task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/tasks/{id}/events:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: streamTaskEvents
      summary: Stream task progress events
      description: Server-sent events use a per-task monotonically increasing sequence and persist before delivery. Reconnect with after or Last-Event-ID to replay missed events. Assistant task.message events carry only user-visible output_text deltas with stable message_id and turn_id; after a complete provider response is validated, the final assistant message is saved and a task.message event with content and done=true is emitted. Reasoning and function-argument deltas are never emitted. task.step events omit duplicate assistant text and tool arguments. Replaying a user request with the same Idempotency-Key returns its existing task without dispatching another one. Disconnecting does not keep a task alive or cancel it. After a terminal task's latest events are replayed, the stream closes; reconnecting at the current sequence returns 204 so EventSource stops reconnecting. When the requested cursor has expired, the stream emits a non-persisted task.snapshot_required control event with its SSE id and data.sequence set to the current event sequence; the client reloads authoritative task and conversation data, then EventSource reconnects after that sequence. A 409 is returned only when a safe recovery cursor cannot be established.
      parameters:
        - name: after
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
        - name: Last-Event-ID
          in: header
          schema: { type: string, pattern: '^[0-9]+$' }
      responses:
        '200':
          description: Ordered task events
          content:
            text/event-stream:
              schema: { type: string }
        '204': { description: Terminal task has no events after the supplied cursor; stop reconnecting }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/tasks/{id}/actions:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      operationId: taskAction
      summary: Perform an idempotent task action
      description: Requires task:control, current access to the task Host, and an Idempotency-Key. Pause, resume, and cancel use expected_status compare-and-set; pause accepts queued or running, resume accepts paused, and cancel accepts queued, running, waiting_user, or paused. Cancel may return unsettled operation IDs when stop is not yet confirmed; Task details expose the pending stop request and unsettled operation IDs. Retry applies only to one failed batch item. Respond applies only to the current persisted approval request and its exact version; stale or changed decisions conflict. Approval decisions are bound to the tool call, arguments, and Host fence and are never transferable to another action. answer_clarification applies only to the exact active clarification request ID and version; the answer is persisted before the task is queued for recovery.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskActionRequest' }
      responses:
        '202':
          description: Action accepted. Stop actions may include operations whose stop is not yet confirmed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskActionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/schedules:
    get:
      tags: [Schedules]
      operationId: listSchedules
      summary: List schedules in the caller's authorization scope
      description: API keys require schedule:read. Results are filtered by owner and the key's current host allow-list.
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ScheduleStatus' }
      responses:
        '200':
          description: Schedule page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchedulePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Schedules]
      operationId: createSchedule
      summary: Create and enable a task schedule
      description: API keys require schedule:manage and access to the selected Host. The owner execution gate must be enabled. The schedule and its next occurrence are committed atomically; no task runs before its scheduled time.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateScheduleRequest' }
      responses:
        '201':
          description: Enabled schedule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/schedules/{id}:
    parameters:
      - $ref: '#/components/parameters/ScheduleId'
    get:
      tags: [Schedules]
      operationId: getSchedule
      summary: Get a schedule and its latest run
      description: API keys require schedule:read and current access to the schedule's Host.
      responses:
        '200':
          description: Schedule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Schedules]
      operationId: updateSchedule
      summary: Update a schedule using optimistic concurrency
      description: API keys require schedule:manage and current access to both the existing and requested Host. expected_version must match; existing runs retain their immutable schedule snapshot.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateScheduleRequest' }
      responses:
        '200':
          description: Updated schedule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/schedules/{id}/actions:
    parameters:
      - $ref: '#/components/parameters/ScheduleId'
    post:
      tags: [Schedules]
      operationId: scheduleAction
      summary: Enable or disable a schedule
      description: API keys require schedule:manage. Enabling requires the owner execution gate to be enabled. Disabling leaves the current run alone by default; cancel must be explicit and remains stopping until confirmed. This action never reports cancellation before task-stop evidence arrives.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleActionRequest' }
      responses:
        '202':
          description: Schedule action accepted; any requested current-run cancellation may still be pending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleActionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/schedules/{id}/runs:
    parameters:
      - $ref: '#/components/parameters/ScheduleId'
    get:
      tags: [Schedules]
      operationId: listScheduleRuns
      summary: List a schedule's run history
      description: API keys require schedule:read and current access to the schedule's Host. Each scheduled occurrence appears at most once; coalesced missed occurrences are summarized by coalesced_count.
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: Schedule run page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleRunPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: List the current user's in-app notifications
      description: Portal sessions and native client credentials may read owner-wide notifications; API keys cannot. Related task content is redacted when current authorization no longer allows access. Marking read does not approve or execute an action.
      security:
        - portalSession: []
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - name: unread_only
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: In-app notification page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /api/notifications/{id}/read:
    parameters:
      - $ref: '#/components/parameters/NotificationId'
    post:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Mark a notification as read
      description: Portal sessions and native client credentials may mark a notification read. Idempotent. This does not accept or execute an associated pending request; use the task action API with its current request ID and version.
      security:
        - portalSession: []
        - bearerToken: []
      responses:
        '204': { description: Notification marked read or already read }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/apikeys:
    get:
      tags: [Tokens]
      operationId: listAPIKeys
      summary: List the current user's API keys
      security:
        - portalSession: []
      responses:
        '200':
          description: API keys without secret values
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/APIKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Tokens]
      operationId: createAPIKey
      summary: Create an API key
      description: Portal sessions only. The API key is returned once and never appears in list responses. Scopes and host_ids are immutable; revoke and create a replacement to change them. A shared Host may be included in host_ids only while the current user has mcp:control on that Host. Each MCP operation also requires the matching API Key computer scope; sharing does not grant host management or Workspace access.
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAPIKeyRequest' }
      responses:
        '201':
          description: API key secret returned once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedAPIKey' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /api/client-authorizations:
    post:
      tags: [Clients]
      operationId: startClientAuthorization
      summary: Start one-time native client pairing
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartClientAuthorizationRequest' }
      responses:
        '201':
          description: Pending client pairing code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartClientAuthorizationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/client-authorizations/token:
    post:
      tags: [Clients]
      operationId: pollClientAuthorization
      summary: Poll pending pairing and claim credentials once
      description: Approval returns client and optional sync credentials exactly once. A repeated claim is rejected; the server stores only secret hashes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PollClientAuthorizationRequest' }
      responses:
        '200':
          description: Pairing state or one-time credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PollClientAuthorizationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/client-authorizations/inspect:
    post:
      tags: [Clients]
      operationId: inspectClientAuthorization
      summary: Inspect a client pairing request
      security: [{ portalSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InspectClientAuthorizationRequest' }
      responses:
        '200':
          description: Pairing details without secrets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InspectClientAuthorizationResponse' }
        default: { $ref: '#/components/responses/Error' }
  /api/client-authorizations/approve:
    post:
      tags: [Clients]
      operationId: approveClientAuthorization
      summary: Approve a client and explicit workspace grants
      security: [{ portalSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApproveClientAuthorizationRequest' }
      responses:
        '200':
          description: Approved installation without secrets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientInstallation' }
        default: { $ref: '#/components/responses/Error' }
  /api/client-authorizations/deny:
    post:
      tags: [Clients]
      operationId: denyClientAuthorization
      summary: Deny a client pairing request
      security: [{ portalSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DenyClientAuthorizationRequest' }
      responses:
        '204': { description: Pairing denied }
        default: { $ref: '#/components/responses/Error' }
  /api/clients:
    get:
      tags: [Clients]
      operationId: listClients
      summary: List current user's client installations
      security: [{ portalSession: [] }]
      responses:
        '200':
          description: Installations without credentials
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ClientInstallation' } }
        default: { $ref: '#/components/responses/Error' }
  /api/clients/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ClientInstallationId' }
    delete:
      tags: [Clients]
      operationId: revokeClient
      summary: Revoke a client installation, its sync credential, and Gateway sessions
      security: [{ portalSession: [] }]
      responses:
        '204': { description: Installation revoked }
        default: { $ref: '#/components/responses/Error' }
  /api/device/workspaces:
    get:
      tags: [Devices]
      operationId: listDeviceWorkspaces
      summary: List workspaces granted to the current device
      description: Requires a live paired device credential. Returns only workspaces currently owned by the credential owner and included in its current workspace grants. The response contains workspace metadata only; it never returns file paths, manifests, or file contents.
      security:
        - bearerToken: []
      responses:
        '200':
          description: Current device grants and minimal workspace metadata
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DeviceWorkspace' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/apikeys/{id}:
    parameters:
      - $ref: '#/components/parameters/TokenId'
    delete:
      tags: [Tokens]
      operationId: deleteAPIKey
      summary: Delete an API key
      security:
        - portalSession: []
      responses:
        '204': { description: API key deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/available-models:
    get:
      tags: [Models]
      operationId: listAvailableModels
      summary: List configured models without connection settings or secrets
      description: Portal sessions and restricted client credentials may read this minimal catalog.
      security: [{ portalSession: [] }, { bearerToken: [] }]
      responses:
        '200':
          description: Models usable for a task
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, name, model_name, capabilities]
                      properties:
                        id: { $ref: '#/components/schemas/ModelConnectionId' }
                        name: { type: string }
                        model_name: { type: string }
                        capabilities:
                          type: object
                          required: [text, tools, vision]
                          properties:
                            text: { type: boolean }
                            tools: { type: boolean }
                            vision: { type: boolean }
        default: { $ref: '#/components/responses/Error' }
  /api/model-connections:
    get:
      tags: [Models]
      operationId: listModelConnections
      summary: List model connections available to the current user
      description: Portal sessions only. Lists shared connections and the current user's personal connections. API keys are not accepted.
      security:
        - portalSession: []
      responses:
        '200':
          description: Model connections without secret values
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelConnectionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Models]
      operationId: createModelConnection
      summary: Create a personal or shared model connection
      description: Portal sessions only. A personal connection is owned by the caller. Setting shared=true creates a shared connection and requires an administrator; ownership and authorization are enforced by the server. The API key is encrypted at rest and never returned.
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateModelConnectionRequest' }
      responses:
        '201':
          description: Created connection without the API key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelConnection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
  /api/model-connections/{id}:
    parameters:
      - $ref: '#/components/parameters/ModelConnectionId'
    get:
      tags: [Models]
      operationId: getModelConnection
      summary: Get a model connection
      description: Portal sessions only. The response includes has_api_key but never the secret. Shared and personal access is checked by the server; inaccessible connections return not found.
      security:
        - portalSession: []
      responses:
        '200':
          description: Model connection without its API key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelConnection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [Models]
      operationId: updateModelConnection
      summary: Update a model connection
      description: Portal sessions only. Only the owner may update a personal connection; only an administrator may update a shared connection. shared is immutable here. Omit api_key or send an empty string to retain the existing secret; any supplied secret replaces it. The server never returns the secret.
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateModelConnectionRequest' }
      responses:
        '200':
          description: Updated connection without its API key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelConnection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Models]
      operationId: deleteModelConnection
      summary: Delete a model connection
      description: Portal sessions only. Only the owner may delete a personal connection; only an administrator may delete a shared connection. Authorization is enforced by the server.
      security:
        - portalSession: []
      responses:
        '204': { description: Model connection deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
  /api/model-connections/{id}/check:
    parameters:
      - $ref: '#/components/parameters/ModelConnectionId'
    post:
      tags: [Models]
      operationId: checkModelConnection
      summary: Check a model connection and discover capabilities
      description: Portal sessions only. Checks access to the connection server-side, performs a model capability probe, and returns only the text, tools, and vision capability flags. The API key is never returned.
      security:
        - portalSession: []
      responses:
        '200':
          description: Verified model capabilities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelConnectionCapabilities' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/hosts:
    get:
      tags: [Admin]
      operationId: listAllHosts
      summary: List all hosts
      security:
        - portalSession: []
      responses:
        '200':
          description: Hosts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Host' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/workspaces:
    get:
      tags: [Admin]
      operationId: listAdminWorkspaces
      summary: List workspace metadata for administrators
      security:
        - portalSession: []
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
      responses:
        '200':
          description: Workspace metadata and Host associations, without paths or file content
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminWorkspacePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/workspaces/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/WorkspaceId' } }
    get:
      tags: [Admin]
      operationId: getAdminWorkspace
      summary: Get workspace metadata and Host associations for administrators
      security:
        - portalSession: []
      responses:
        '200':
          description: Workspace metadata without paths or file content
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminWorkspace' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/users:
    get:
      tags: [Admin]
      operationId: listUsers
      summary: List users without credential data
      security:
        - portalSession: []
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Admin]
      operationId: createUser
      summary: Create a user
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: Created user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/UserId' }
    patch:
      tags: [Admin]
      operationId: updateUser
      summary: Update a user's role, quota, disabled state, or password
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/capacity:
    get:
      tags: [Admin]
      operationId: getCapacity
      summary: Get configured and allocated cluster capacity
      security:
        - portalSession: []
      responses:
        '200':
          description: Capacity and host counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Capacity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/audit:
    get:
      tags: [Admin]
      operationId: listAuditLogs
      summary: Search audit records
      security:
        - portalSession: []
      parameters:
        - { name: actor, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: target, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: Audit records ordered newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditLog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /mcp:
    post:
      tags: [MCP]
      operationId: mcpPost
      summary: MCP Streamable HTTP request
      description: Authenticates with a platform API key (`chk_`) using Bearer authorization.
      security:
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: MCP JSON-RPC response or event stream
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
            text/event-stream:
              schema: { type: string }
        '202': { description: Notification accepted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
    get:
      tags: [MCP]
      operationId: mcpGet
      summary: MCP Streamable HTTP event stream
      security:
        - bearerToken: []
      responses:
        '200':
          description: MCP event stream
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [MCP]
      operationId: mcpDelete
      summary: Close an MCP Streamable HTTP session
      security:
        - bearerToken: []
      responses:
        '200': { description: Session closed }
        '204': { description: Session closed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /healthz:
    get:
      tags: [Health]
      operationId: healthz
      summary: Process liveness check
      description: Does not check external dependencies.
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            text/plain:
              schema: { type: string, const: ok }
  /readyz:
    get:
      tags: [Health]
      operationId: readyz
      summary: Dependency readiness check
      security: []
      responses:
        '200': { description: Database and configured orchestrators are ready }
        '503': { description: A required dependency is unavailable }
components:
  securitySchemes:
    portalSession:
      type: apiKey
      in: cookie
      name: ch_portal
    hostCookie:
      type: apiKey
      in: cookie
      name: ch_host
      description: Host-scoped session cookie issued when entering the current Host.
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: chk_, chd_, or chc_
      description: Bearer platform API key (`chk_`), scoped sync credential (`chd_`), or restricted client credential (`chc_`).
    hostReplicaBootstrap:
      type: http
      scheme: bearer
      bearerFormat: morde-replica-v1
      description: Host-generation-scoped bootstrap credential used only to read binding snapshots and report applied revisions.
  parameters:
    HostId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/HostId' }
    TokenId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/TokenId' }
    WorkspaceId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/WorkspaceId' }
    SiteId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/SiteId' }
    SiteReleaseId:
      name: release_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/SiteReleaseId' }
    ConversationId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ConversationId' }
    TaskId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/TaskId' }
    ModelConnectionId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ModelConnectionId' }
    ScheduleId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ScheduleId' }
    NotificationId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/NotificationId' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Reuse only for an exact retry of the same operation and normalized request.
      schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._~-]+$' }
    PageLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    PageCursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous page.
      schema: { type: string, minLength: 1, maxLength: 1024 }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Authentication required or credential invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Insufficient role or failed request origin check
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found or not accessible
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: State, quota, capacity, idempotency, event cursor, or workspace conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RequestTooLarge:
      description: Request body exceeds configured size limit
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BadGateway:
      description: The configured model service returned an upstream error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    GatewayTimeout:
      description: The configured model service did not respond before the timeout
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServiceUnavailable:
      description: The model connection service is unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Request rate limit exceeded
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Error:
      description: Error response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              enum: [invalid_argument, unauthenticated, forbidden, not_found, conflict, quota_exceeded, capacity_exceeded, workspace_busy, workspace_conflict, transfer_expired, invalid_state, idempotency_conflict, event_cursor_expired, unsupported, request_too_large, result_too_large, rate_limited, internal, upstream_error, host_not_ready, upstream_timeout]
            message: { type: string }
            details: { type: object, additionalProperties: true }
    HostId: { type: string, pattern: '^h[a-z0-9]{7}$' }
    WorkspaceId: { type: string, pattern: '^w[a-z0-9]{7}$' }
    SiteId: { type: string, pattern: '^site_[a-f0-9]{16}$' }
    SiteReleaseId: { type: string, pattern: '^rel_[a-f0-9]{16}$' }
    UserId: { type: string, pattern: '^u[a-z0-9]{7}$' }
    HostMemberPermission:
      type: string
      enum: ['desktop:view', 'desktop:control', 'terminal:control', 'mcp:control']
    HostMemberInviteRequest:
      type: object
      additionalProperties: false
      required: [user_id, permissions]
      properties:
        user_id: { $ref: '#/components/schemas/UserId' }
        permissions:
          type: array
          minItems: 1
          description: Duplicate entries are removed; desktop:control is stored together with desktop:view.
          items: { $ref: '#/components/schemas/HostMemberPermission' }
    HostMember:
      type: object
      required: [user_id, permissions, created_at]
      properties:
        user_id: { $ref: '#/components/schemas/UserId' }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/HostMemberPermission' }
        created_at: { type: string, format: date-time }
    SharedHost:
      type: object
      required: [id, name, state, url, permissions]
      properties:
        id: { $ref: '#/components/schemas/HostId' }
        name: { type: string }
        state: { type: string }
        url: { type: string, format: uri }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/HostMemberPermission' }
    TokenId: { type: string, pattern: '^t[a-z0-9]{7}$' }
    ClientInstallationId: { type: string, pattern: '^i[a-z0-9]{7}$' }
    ConversationId: { type: string, pattern: '^c[a-z0-9]{7}$' }
    TaskId: { type: string, pattern: '^q[a-z0-9]{7}$' }
    ModelConnectionId: { type: string, pattern: '^p[a-z0-9]{7}$' }
    MessageId: { type: string, pattern: '^m[a-z0-9]{7}$' }
    StepId: { type: string, pattern: '^s[a-z0-9]{7}$' }
    OperationId: { type: string, pattern: '^o[a-z0-9]{7}$' }
    BatchItemId: { type: string, pattern: '^b[a-z0-9]{7}$' }
    ClarificationId: { type: string, pattern: '^r[a-z0-9]{7}$' }
    ArtifactId: { type: string, pattern: '^a[a-z0-9]{7}$' }
    ScheduleId: { type: string, pattern: '^j[a-z0-9]{7}$' }
    ScheduleRunId: { type: string, pattern: '^y[a-z0-9]{7}$' }
    NotificationId: { type: string, pattern: '^n[a-z0-9]{7}$' }
    CreateModelConnectionRequest:
      type: object
      required: [name, base_url, model_name, api_key]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        base_url:
          type: string
          format: uri
          pattern: '^https://'
          description: HTTPS URL whose DNS host must be on the server's outbound allowlist.
        model_name: { type: string, minLength: 1, maxLength: 256 }
        api_key: { type: string, minLength: 1, maxLength: 4096, writeOnly: true }
        shared:
          type: boolean
          default: false
          description: Shared connections require an administrator; authorization is checked by the server.
      additionalProperties: false
    UpdateModelConnectionRequest:
      type: object
      required: [name, base_url, model_name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        base_url:
          type: string
          format: uri
          pattern: '^https://'
          description: HTTPS URL whose DNS host must be on the server's outbound allowlist.
        model_name: { type: string, minLength: 1, maxLength: 256 }
        api_key:
          type: string
          maxLength: 4096
          writeOnly: true
          description: Omit or send an empty string to keep the current key; a non-empty value replaces it.
      additionalProperties: false
    ModelConnectionCapabilities:
      type: object
      required: [text, tools, vision]
      properties:
        text: { type: boolean }
        tools: { type: boolean }
        vision: { type: boolean }
      additionalProperties: false
    ModelConnection:
      type: object
      required: [id, name, base_url, model_name, shared, has_api_key, capabilities, checked_at, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/ModelConnectionId' }
        name: { type: string }
        base_url: { type: string, format: uri }
        model_name: { type: string }
        shared: { type: boolean }
        has_api_key: { type: boolean }
        capabilities: { $ref: '#/components/schemas/ModelConnectionCapabilities' }
        checked_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      description: API keys and other secret material are never present in this response.
      additionalProperties: false
    ModelConnectionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ModelConnection' }
      additionalProperties: false
    Quota:
      type: object
      required: [hosts, cpu_milli, mem_mib]
      properties:
        hosts: { type: integer, minimum: 0 }
        cpu_milli: { type: integer, minimum: 0 }
        mem_mib: { type: integer, minimum: 0 }
    Usage:
      type: object
      required: [hosts, cpu_milli, mem_mib]
      properties:
        hosts: { type: integer, minimum: 0 }
        cpu_milli: { type: integer, minimum: 0 }
        mem_mib: { type: integer, minimum: 0 }
    User:
      type: object
      required: [id, name, role, quota, usage]
      properties:
        id: { $ref: '#/components/schemas/UserId' }
        name: { type: string }
        role: { type: string, enum: [user, admin] }
        quota: { $ref: '#/components/schemas/Quota' }
        usage: { $ref: '#/components/schemas/Usage' }
    Me:
      type: object
      required: [id, name, role, quota, usage]
      properties:
        id: { $ref: '#/components/schemas/UserId' }
        name: { type: string }
        role: { type: string, enum: [user, admin] }
        quota: { $ref: '#/components/schemas/Quota' }
        usage: { $ref: '#/components/schemas/Usage' }
    UserPreferences:
      type: object
      required: [assistant_name, selected_model_id, default_host_id, updated_at]
      properties:
        assistant_name: { type: string, maxLength: 80 }
        selected_model_id: { oneOf: [{ $ref: '#/components/schemas/ModelConnectionId' }, { type: 'null' }] }
        default_host_id: { oneOf: [{ $ref: '#/components/schemas/HostId' }, { type: 'null' }] }
        updated_at: { type: [string, 'null'], format: date-time }
    SaveUserPreferencesRequest:
      type: object
      required: [assistant_name, selected_model_id]
      properties:
        assistant_name: { type: string, maxLength: 80 }
        selected_model_id: { oneOf: [{ $ref: '#/components/schemas/ModelConnectionId' }, { type: string, maxLength: 0 }] }
      additionalProperties: false
    OnboardingModelCapability:
      type: object
      required: [text, tools, vision]
      properties:
        text: { type: boolean }
        tools: { type: boolean }
        vision: { type: boolean }
    OnboardingModel:
      description: A checked model with text and tool support. Vision is an independent capability; when false, the model remains usable for non-visual tasks while the Portal hides desktop capability.
      type: object
      required: [id, name, capabilities]
      properties:
        id: { $ref: '#/components/schemas/ModelConnectionId' }
        name: { type: string }
        capabilities: { $ref: '#/components/schemas/OnboardingModelCapability' }
    OnboardingComputer:
      type: object
      required: [id, name, state]
      properties:
        id: { $ref: '#/components/schemas/HostId' }
        name: { type: string }
        state: { type: string, enum: [creating, running, stopping, stopped, failed, deleting] }
    OnboardingStatus:
      description: A model is ready for task submission when checked text and tool capabilities are available. Vision is surfaced per model and does not gate non-visual task submission; the Portal uses it to show or hide desktop capability.
      type: object
      required: [model_status, models, selected_model_id, computer_status, computers, default_host_id, can_submit, next_action]
      properties:
        model_status: { type: string, enum: [ready, not_configured, selection_required, selected_unavailable] }
        models:
          type: array
          items: { $ref: '#/components/schemas/OnboardingModel' }
        selected_model_id: { oneOf: [{ $ref: '#/components/schemas/ModelConnectionId' }, { type: 'null' }] }
        computer_status:
          type: string
          enum: [not_created, selection_required, available, creating, restoring, stopping, ready, stopped, create_failed, restore_failed, capacity_unavailable, quota_exceeded, unavailable]
        computers:
          type: array
          items: { $ref: '#/components/schemas/OnboardingComputer' }
        default_host_id: { oneOf: [{ $ref: '#/components/schemas/HostId' }, { type: 'null' }] }
        can_submit: { type: boolean }
        next_action:
          type: string
          enum: [configure_model, create_or_retry_computer, choose_computer, wait_for_computer, resume_computer, choose_another_computer, contact_admin, submit_task, review_setup]
    EnsureDefaultHostRequest:
      type: object
      properties:
        host_id: { $ref: '#/components/schemas/HostId' }
      additionalProperties: false
    DefaultHostResult:
      type: object
      required: [created, host, status]
      properties:
        created: { type: boolean }
        host: { oneOf: [{ $ref: '#/components/schemas/OnboardingComputer' }, { type: 'null' }] }
        status: { $ref: '#/components/schemas/OnboardingStatus' }
    Resources:
      type: object
      required: [cpu_milli, mem_mib, cpu_limit_milli, mem_limit_mib]
      properties:
        cpu_milli: { type: integer }
        mem_mib: { type: integer }
        cpu_limit_milli: { type: integer }
        mem_limit_mib: { type: integer }
    WorkspaceRef:
      type: object
      required: [id, name, revision, used_bytes, state]
      properties:
        id: { $ref: '#/components/schemas/WorkspaceId' }
        name: { type: string }
        revision: { type: integer, format: int64, minimum: 0 }
        used_bytes: { type: integer, format: int64, minimum: 0 }
        state: { type: string, enum: [ready, deleting, deleted] }
    WorkspaceBinding:
      type: object
      required: [workspace, directory, state, binding_version, desired_revision, applied_revision, sync_state, sync_conflicts]
      properties:
        workspace: { $ref: '#/components/schemas/WorkspaceRef' }
        directory: { type: string, pattern: '^w[a-z0-9]{7}$' }
        state: { type: string, enum: [preparing, active, unbinding, detached, failed] }
        binding_version: { type: integer, format: int64, minimum: 1 }
        desired_revision: { type: integer, format: int64, minimum: 0 }
        applied_revision: { type: integer, format: int64, minimum: 0 }
        sync_state: { type: string, enum: [healthy, conflict] }
        sync_conflicts:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 4096 }
    HostReplicaBinding:
      type: object
      required: [workspace_id, directory, state, binding_version, desired_revision, applied_revision, sync_state, sync_conflicts]
      properties:
        workspace_id: { $ref: '#/components/schemas/WorkspaceId' }
        sync_credential: { type: string, minLength: 1, description: 'Per-binding credential for the existing Workspace Sync API. Returned for preparing, active, or unbinding bindings.' }
        directory: { type: string, pattern: '^w[a-z0-9]{7}$' }
        state: { type: string, enum: [preparing, active, unbinding, detached, failed] }
        binding_version: { type: integer, format: int64, minimum: 1 }
        desired_revision: { type: integer, format: int64, minimum: 0 }
        applied_revision: { type: integer, format: int64, minimum: 0 }
        sync_state: { type: string, enum: [healthy, conflict] }
        sync_conflicts:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 4096 }
      additionalProperties: false
    HostReplicaBindings:
      type: object
      required: [runtime_generation, items]
      properties:
        runtime_generation: { type: integer, format: int64, minimum: 1 }
        items: { type: array, maxItems: 64, items: { $ref: '#/components/schemas/HostReplicaBinding' } }
      additionalProperties: false
    HostReplicaAppliedRequest:
      type: object
      required: [session_id, applied_revision]
      properties:
        session_id: { type: string, pattern: '^p[a-z0-9]{7}$' }
        applied_revision: { type: integer, format: int64, minimum: 0 }
      additionalProperties: false
    HostReplicaSyncStatusRequest:
      type: object
      required: [state, conflicts]
      properties:
        state: { type: string, enum: [healthy, conflict] }
        conflicts:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 4096 }
      additionalProperties: false
    Host:
      type: object
      required: [id, name, owner_id, template_id, isolation, state, state_reason, runtime_generation, control_version, control_state, url, workspaces, resources, expires_at, last_active_at, created_at]
      properties:
        id: { $ref: '#/components/schemas/HostId' }
        name: { type: string }
        owner_id: { $ref: '#/components/schemas/UserId' }
        template_id: { type: string }
        isolation: { type: string }
        state: { type: string, enum: [creating, running, stopping, stopped, failed, deleting, deleted] }
        state_reason: { type: string }
        runtime_generation: { type: integer, minimum: 0 }
        control_version: { type: integer, minimum: 0 }
        control_state: { type: string, enum: [ai, taking_over, user, returning] }
        url: { type: string, format: uri }
        workspaces:
          type: array
          items: { $ref: '#/components/schemas/WorkspaceBinding' }
        resources: { $ref: '#/components/schemas/Resources' }
        expires_at: { type: [string, 'null'], format: date-time }
        last_active_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    ControlActionRequest:
      type: object
      additionalProperties: false
      required: [action, request_id, expected_control_version]
      properties:
        action: { type: string, enum: [take_over, release] }
        request_id: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$' }
        expected_control_version: { type: integer, format: int64, minimum: 0, maximum: 9223372036854775805 }
    ControlStatus:
      type: object
      required: [host_id, control_state, control_version, active_transition]
      properties:
        host_id: { $ref: '#/components/schemas/HostId' }
        control_state: { type: string, enum: [ai, taking_over, user, returning] }
        control_version: { type: integer, format: int64, minimum: 0 }
        active_transition:
          oneOf:
            - { $ref: '#/components/schemas/ControlTransition' }
            - { type: 'null' }
    ControlActionResponse:
      type: object
      required: [host_id, control_state, control_version, active_transition, pending_operation_ids]
      properties:
        host_id: { $ref: '#/components/schemas/HostId' }
        control_state: { type: string, enum: [ai, taking_over, user, returning] }
        control_version: { type: integer, format: int64, minimum: 0 }
        active_transition:
          oneOf:
            - { $ref: '#/components/schemas/ControlTransition' }
            - { type: 'null' }
        pending_operation_ids:
          type: array
          items: { $ref: '#/components/schemas/OperationId' }
    HostApplicationsResponse:
      type: object
      required: [host_id, runtime_generation, runtime_instance_id, control_version, checked_at, items]
      properties:
        host_id: { $ref: '#/components/schemas/HostId' }
        runtime_generation: { type: integer, format: int64, minimum: 1 }
        runtime_instance_id: { type: string, minLength: 1, maxLength: 128 }
        control_version: { type: integer, format: int64, minimum: 0 }
        checked_at: { type: string, format: date-time }
        items:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: '#/components/schemas/HostApplicationStatusItem' }
      additionalProperties: false
    HostApplicationStatusItem:
      type: object
      required: [id, installed, installable, version, login_status, install_operation]
      properties:
        id: { type: string, enum: [codex, wechat] }
        installed: { type: boolean }
        installable: { type: boolean }
        version: { type: string, maxLength: 64 }
        login_status: { type: string, enum: [logged_in, not_logged_in, unknown, not_applicable] }
        install_operation:
          oneOf:
            - { $ref: '#/components/schemas/HostApplicationInstallOperation' }
            - { type: 'null' }
      additionalProperties: false
    HostApplicationInstallRequest:
      type: object
      required: [request_id]
      properties:
        request_id: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$' }
      additionalProperties: false
    HostApplicationInstallResponse:
      type: object
      required: [host_id, runtime_generation, runtime_instance_id, control_version, operation]
      properties:
        host_id: { $ref: '#/components/schemas/HostId' }
        runtime_generation: { type: integer, format: int64, minimum: 1 }
        runtime_instance_id: { type: string, minLength: 1, maxLength: 128 }
        control_version: { type: integer, format: int64, minimum: 0 }
        operation: { $ref: '#/components/schemas/HostApplicationInstallOperation' }
      additionalProperties: false
    HostApplicationInstallOperation:
      type: object
      required: [id, application_id, status, progress_percent, error_code, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/OperationId' }
        application_id: { type: string, const: wechat }
        status: { type: string, enum: [accepted, running, succeeded, failed] }
        progress_percent: { type: integer, minimum: 0, maximum: 100 }
        error_code: { type: string, enum: ['', download_failed, digest_mismatch, invalid_package, install_failed, storage_error, operation_interrupted, architecture_unsupported], description: Empty unless the operation failed. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      additionalProperties: false
    HostApplicationLaunchRequest:
      type: object
      required: [launch_id]
      properties:
        launch_id: { type: string, minLength: 8, maxLength: 128, pattern: '^launch_[A-Za-z0-9][A-Za-z0-9._:-]{0,120}$' }
      additionalProperties: false
    HostApplicationLaunchResponse:
      type: object
      required: [host_id, runtime_generation, runtime_instance_id, control_version, operation]
      properties:
        host_id: { $ref: '#/components/schemas/HostId' }
        runtime_generation: { type: integer, format: int64, minimum: 1 }
        runtime_instance_id: { type: string, maxLength: 128 }
        control_version: { type: integer, format: int64, minimum: 0 }
        operation: { $ref: '#/components/schemas/HostApplicationLaunchOperation' }
      additionalProperties: false
    HostCurrentApplicationLaunchResponse:
      type: object
      required: [host_id, runtime_generation, runtime_instance_id, control_version, operation]
      properties:
        host_id: { $ref: '#/components/schemas/HostId' }
        runtime_generation: { type: integer, format: int64, minimum: 1 }
        runtime_instance_id: { type: string, maxLength: 128 }
        control_version: { type: integer, format: int64, minimum: 0 }
        operation:
          oneOf:
            - { $ref: '#/components/schemas/HostApplicationLaunchOperation' }
            - { type: 'null' }
      additionalProperties: false
    HostApplicationLaunchOperation:
      type: object
      required: [id, application_id, status, error_code, created_at, updated_at]
      properties:
        id: { type: string, minLength: 8, maxLength: 128, pattern: '^launch_[A-Za-z0-9][A-Za-z0-9._:-]{0,120}$' }
        application_id: { type: string, const: wechat }
        status: { type: string, enum: [starting, running, stopping, stopped, exited, failed, unknown] }
        error_code:
          type: string
          enum: ['', not_installed, architecture_unsupported, cgroup_unavailable, launch_failed, stop_unconfirmed, storage_error]
          description: Stable, non-secret Runtime failure code; empty when Runtime has no definitive failure code.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      additionalProperties: false
    ControlTransition:
      type: object
      required: [request_id, action, phase, failure_reason, expected_control_version, blocked_control_version, target_control_version, created_at, updated_at]
      properties:
        request_id: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$' }
        action: { type: string, enum: [take_over, release] }
        phase: { type: string, enum: [blocking, draining, drained, completed] }
        failure_reason:
          type: string
          enum: ['', audit_unavailable, task_snapshot_failed, runtime_unavailable, transition_persistence_failed, operations_pending, runtime_fence_mismatch, runtime_quiesce_failed, receipt_invalid, runtime_control_failed, invalid_action]
        expected_control_version: { type: integer, format: int64, minimum: 0 }
        blocked_control_version: { type: integer, format: int64, minimum: 0 }
        target_control_version: { type: integer, format: int64, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Workspace:
      type: object
      required: [id, name, revision, used_bytes, quota_bytes, state, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/WorkspaceId' }
        name: { type: string }
        revision: { type: integer, format: int64, minimum: 0 }
        used_bytes: { type: integer, format: int64, minimum: 0 }
        quota_bytes: { type: integer, format: int64, minimum: 1 }
        state: { type: string, enum: [ready, deleting, deleted] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateSiteRequest:
      type: object
      required: [host_id, workspace_id]
      properties:
