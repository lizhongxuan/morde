            schema: { $ref: '#/components/schemas/TaskActionRequest' }
      responses:
        '202':
          description: Action accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskActionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/tasks/{id}/inputs:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/TaskId' }
    post:
      tags: [Tasks]
      operationId: answerTaskInput
      summary: Answer a versioned clarification and resume a task
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskInputRequest' }
      responses:
        '202':
          description: Input accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskActionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/tasks/{id}/approvals/{approval_id}/responses:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/TaskId' }
      - name: approval_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ClarificationId' }
    post:
      tags: [Tasks]
      operationId: respondToTaskApproval
      summary: Approve or reject a specific versioned task approval
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskApprovalResponseRequest' }
      responses:
        '202':
          description: Decision accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskActionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/tasks/{id}/events:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/TaskId' }
    get:
      tags: [Tasks]
      operationId: streamTaskEvents
      summary: Stream durable task events
      description: Disconnecting the event stream does not cancel the task. If the cursor expires, the stream emits task.snapshot_required and the client must fetch the task snapshot.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - name: after
          in: query
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: Last-Event-ID
          in: header
          schema: { type: string, pattern: '^[0-9]+$' }
      responses:
        '200':
          description: Server-sent task events
          content:
            text/event-stream:
              schema: { type: string }
        '204': { description: No newer events for an already terminal task }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/clients:
    get:
      tags: [Clients]
      operationId: listClients
      summary: List current user's client installations
      description: Requires a portal session or native Client credential; only installations of the current account are returned.
      security: [{ portalSession: [] }, { bearerToken: [] }]
      responses:
        '200':
          description: Installations without credentials
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ClientInstallation' } }
        default: { $ref: '#/components/responses/Error' }
  /api/clients/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ClientInstallationId' }
    delete:
      tags: [Clients]
      operationId: revokeClient
      summary: Revoke a client installation, its credentials, tickets and Gateway sessions
      description: Requires a portal session or native Client credential. Only an installation belonging to the current account can be revoked; its credentials are revoked together.
      security: [{ portalSession: [] }, { bearerToken: [] }]
      responses:
        '204': { description: Installation revoked }
        default: { $ref: '#/components/responses/Error' }
  /api/devices:
    get:
      tags: [Devices]
      operationId: listDevices
      summary: List the current account's client installations and Hub presence
      description: Requires a portal session or native Client credential. Device IDs are Client Installation IDs. Online status is advisory Hub presence.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      responses:
        '200':
          description: Client installations without credentials
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/DeviceInstallation' } }
        default: { $ref: '#/components/responses/Error' }
  /api/devices/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ClientInstallationId' }
    patch:
      tags: [Devices]
      operationId: renameDevice
      summary: Rename a client installation
      description: Requires a portal session or native Client credential. The display name is shared by the Client Installation and Hub presence.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [display_name]
              properties:
                display_name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '204': { description: Installation renamed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Devices]
      operationId: revokeDeviceInstallation
      summary: Revoke a device's complete Client Installation
      description: Requires a portal session or native Client credential. This revokes the selected installation and its credentials, ending its Hub and synchronization access; deleting a Device does not preserve other Morde permissions for that installation.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      responses:
        '204': { description: Installation and its credentials revoked }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/personal-data/{type}/{id}:
    parameters:
      - name: type
        in: path
        required: true
        schema: { type: string, enum: [profile] }
      - name: id
        in: path
        required: true
        schema: { type: string, enum: [default] }
    get:
      tags: [Personal Data]
      operationId: getPersonalObject
      summary: Read the current account's profile object
      description: Requires an approved portal session or active Client credential. The first enabled personal object is only profile/default; a missing or deleted object returns not_found. Object revision and body are read together.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      responses:
        '200':
          description: Current profile and revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalObject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [Personal Data]
      operationId: replacePersonalObject
      summary: Replace the current account's profile object
      description: Requires an approved portal session or active Client credential. The write is an optimistic compare-and-set using base_revision. On a revision conflict, details contain only base_revision, current_revision and deleted; the server never returns the profile body in the conflict.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonalObjectPutRequest' }
      responses:
        '200':
          description: Body-free mutation receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalMutationReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Personal Data]
      operationId: deletePersonalObject
      summary: Delete the current account's profile object
      description: Requires an approved portal session or active Client credential. Deletion records a versioned tombstone; the same profile ID cannot be recreated. The body-free receipt is idempotent through Idempotency-Key.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonalObjectDeleteRequest' }
      responses:
        '200':
          description: Body-free mutation receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalMutationReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/personal-data/uploads:
    post:
      tags: [Personal Data]
      operationId: createPersonalAttachmentUpload
      summary: Start an owner-scoped personal attachment upload
      description: Requires an approved portal session or active Client credential. The request is limited to 16 KiB and requires an Idempotency-Key. It reserves personal-data quota before accepting chunks; retries with the same key and request return the original upload.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonalAttachmentUploadRequest' }
      responses:
        '200':
          description: Existing or newly created upload reservation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalAttachmentUploadReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        default: { $ref: '#/components/responses/Error' }
  /api/personal-data/uploads/{upload_id}/chunks/{sequence}:
    parameters:
      - name: upload_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/PersonalAttachmentUploadId' }
      - name: sequence
        in: path
        required: true
        schema: { type: integer, format: int32, minimum: 0 }
    put:
      tags: [Personal Data]
      operationId: putPersonalAttachmentChunk
      summary: Upload or replay one bounded attachment chunk
      description: Requires an approved portal session or active Client credential. Send one raw chunk no larger than 4 MiB, an exact Content-Length, and exactly one X-Chunk-SHA256 header. Repeating the same sequence and bytes is idempotent; different bytes conflict.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - name: Content-Length
          in: header
          required: true
          schema: { type: integer, minimum: 1, maximum: 4194304 }
        - name: X-Chunk-SHA256
          in: header
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{64}$' }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary, maxLength: 4194304 }
      responses:
        '200':
          description: Chunk stored or exact retry acknowledged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalAttachmentChunkReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        default: { $ref: '#/components/responses/Error' }
  /api/personal-data/uploads/{upload_id}/commit:
    parameters:
      - name: upload_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/PersonalAttachmentUploadId' }
    post:
      tags: [Personal Data]
      operationId: commitPersonalAttachment
      summary: Commit a complete personal attachment upload
      description: Requires an approved portal session or active Client credential, an empty request body, and an Idempotency-Key. Commit verifies the target object's current revision, all chunk hashes and the final SHA-256, then publishes an owner-scoped attachment. An exact retry returns the original receipt without publishing twice.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Attachment commit receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalAttachmentCommitReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/personal-data/uploads/{upload_id}:
    parameters:
      - name: upload_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/PersonalAttachmentUploadId' }
    delete:
      tags: [Personal Data]
      operationId: cancelPersonalAttachmentUpload
      summary: Cancel a pending personal attachment upload
      description: Requires an approved portal session or active Client credential and an empty request body. Repeated cancellation is safe; reserved quota is released through an idempotent bounded cleanup path.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      responses:
        '204': { description: Upload cancelled or already inactive }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/personal-data/attachments/{attachment_id}:
    get:
      tags: [Personal Data]
      operationId: getPersonalAttachment
      summary: Read a committed attachment owned by the current account
      description: Requires an approved portal session or active Client credential. The server checks owner scope and an existing readable personal reference. Responses are private and non-cacheable.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - name: attachment_id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/PersonalAttachmentId' }
      responses:
        '200':
          description: Attachment bytes
          headers:
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
            Content-Disposition: { schema: { type: string, const: attachment } }
            ETag: { schema: { type: string } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            image/*:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/personal-data/history/import:
    post:
      tags: [Personal Data]
      operationId: importPersonalHistory
      summary: Import user-confirmed text history without creating tasks
      description: Requires an approved portal session or active Client credential. This dedicated endpoint accepts only user-confirmed user/assistant text, stable source identifiers and optional committed personal attachment IDs. It is limited to 8 MiB at the API boundary and at most 200 messages / 1 MiB of text per batch. Retries with the same source and message identifiers plus content are idempotent; changed content conflicts. Imported messages are taskless and never invoke task submission or execution.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonalHistoryImportRequest' }
      responses:
        '200':
          description: Canonical conversation and imported message mappings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalHistoryImportReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        default: { $ref: '#/components/responses/Error' }
  /api/sync/snapshot:
    get:
      tags: [Personal Data]
      operationId: getPersonalDataSnapshot
      summary: Read a stable first slice of the current account's personal data
      description: |-
        Requires an approved portal session or active Client credential. The first sync slice contains only profile/default. The first page fixes a committed account change watermark; later pages use the signed cursor, which is bound to this account, service instance, type range, and keyset position. Tombstoned profiles are omitted from the current snapshot view. Changes committed after the watermark are read from the change feed; the client must preserve its local outbox while replacing its remote view.

        The cursor remains valid for the lifetime of the account change log. Change-log rows are currently retained for the account lifetime; pruning requires a cursor floor and a response that directs the client to fetch a new snapshot.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string, maxLength: 2048 }
          description: Omit on the first page; pass next_cursor unchanged for subsequent pages.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        '200':
          description: One snapshot page and its fixed account watermark
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalSnapshotPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /api/sync/changes:
    get:
      tags: [Personal Data]
      operationId: getPersonalDataChanges
      summary: Read profile changes after an account sequence
      description: |-
        Requires an approved portal session or active Client credential. Start after the snapshot watermark. The first request fixes through_sequence to the current committed account watermark; pass that same value on each subsequent request while has_more is true. Change items contain only profile events; other account object types are not enabled in this slice and are skipped while the terminal next_after_sequence advances through the fixed watermark. No object body or profile secrets are returned in this feed.

        Account sequence values are owner-scoped. Change-log rows are currently retained for the account lifetime, so old cursors do not expire. Pruning must not be added without a minimum retained sequence and snapshot-recovery response.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - name: after_sequence
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
          description: Last account sequence already committed by the client.
        - name: through_sequence
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
          description: Fixed upper watermark returned by the first page; omit on the first request.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        '200':
          description: Profile change metadata through a fixed account watermark
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalChangePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /api/device/workspaces:
    get:
      tags: [Devices]
      operationId: listDeviceWorkspaces
      summary: List ready workspaces owned by the current desktop client
      description: Requires an active installation-bound Sync credential. Authorization is checked against current owner and ready state on each request; no static workspace grants are stored.
      security:
        - bearerToken: []
      responses:
        '200':
          description: Ready owned workspace metadata
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DeviceWorkspace' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/apikeys/{id}:
    parameters:
      - $ref: '#/components/parameters/TokenId'
    delete:
      tags: [Tokens]
      operationId: deleteAPIKey
      summary: Delete an API key
      security:
        - portalSession: []
      responses:
        '204': { description: API key deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/available-models:
    get:
      tags: [Models]
      operationId: listAvailableModels
      summary: List configured models without connection settings or secrets
      description: Portal sessions and restricted client credentials may read this minimal catalog.
      security: [{ portalSession: [] }, { bearerToken: [] }]
      responses:
        '200':
          description: Configured models
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, name, model_name, capabilities]
                      properties:
                        id: { $ref: '#/components/schemas/ModelConnectionId' }
                        name: { type: string }
                        model_name: { type: string }
                        capabilities:
                          type: object
                          required: [text, tools, vision]
                          properties:
                            text: { type: boolean }
                            tools: { type: boolean }
                            vision: { type: boolean }
        default: { $ref: '#/components/responses/Error' }
  /api/model-connections:
    get:
      tags: [Models]
      operationId: listModelConnections
      summary: List model connections available to the current user
      description: Portal sessions only. Lists shared connections and the current user's personal connections. API keys are not accepted.
      security:
        - portalSession: []
      responses:
        '200':
          description: Model connections without secret values
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelConnectionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Models]
      operationId: createModelConnection
      summary: Create a personal or shared model connection
      description: Portal sessions only. A personal connection is owned by the caller. Setting shared=true creates a shared connection and requires an administrator; ownership and authorization are enforced by the server. The API key is encrypted at rest and never returned.
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateModelConnectionRequest' }
      responses:
        '201':
          description: Created connection without the API key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelConnection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
  /api/model-connections/{id}:
    parameters:
      - $ref: '#/components/parameters/ModelConnectionId'
    get:
      tags: [Models]
      operationId: getModelConnection
      summary: Get a model connection
      description: Portal sessions only. The response includes has_api_key but never the secret. Shared and personal access is checked by the server; inaccessible connections return not found.
      security:
        - portalSession: []
      responses:
        '200':
          description: Model connection without its API key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelConnection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [Models]
      operationId: updateModelConnection
      summary: Update a model connection
      description: Portal sessions only. Only the owner may update a personal connection; only an administrator may update a shared connection. shared is immutable here. Omit api_key or send an empty string to retain the existing secret; any supplied secret replaces it. The server never returns the secret.
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateModelConnectionRequest' }
      responses:
        '200':
          description: Updated connection without its API key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelConnection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Models]
      operationId: deleteModelConnection
      summary: Delete a model connection
      description: Portal sessions only. Only the owner may delete a personal connection; only an administrator may delete a shared connection. Authorization is enforced by the server.
      security:
        - portalSession: []
      responses:
        '204': { description: Model connection deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
  /api/model-connections/{id}/check:
    parameters:
      - $ref: '#/components/parameters/ModelConnectionId'
    post:
      tags: [Models]
      operationId: checkModelConnection
      summary: Check a model connection and discover capabilities
      description: Portal sessions only. Requires a configured account model budget and an Idempotency-Key. The selected probe is reserved and settled in the same ledger as model requests. An omitted capability means all; text, tools and vision can also be checked independently, using a new key for each. False means not yet verified or unsupported. Verified capabilities are combined only while the connection version is unchanged. Unknown usage remains pending for reconciliation and cannot be silently retried; the API key is never returned.
      security:
        - portalSession: []
      parameters:
