        direction: { type: string, enum: [upload, download, bidirectional] }
        state: { type: string, enum: [planned, transferring, verifying, applying] }
        stage: { type: string, enum: [scan, compare, transfer, verify, apply, complete] }
        planned_bytes: { type: integer, format: int64, minimum: 0 }
        confirmed_bytes: { type: integer, format: int64, minimum: 0 }
        download_actions_total: { type: integer, format: int64, minimum: 0 }
        download_actions_done: { type: integer, format: int64, minimum: 0 }
        updated_at: { type: string, format: date-time }
      additionalProperties: false
    SyncSession:
      type: object
      required: [id, workspace_id, direction, policy, state, base_revision, target_revision, stage, planned_bytes, confirmed_bytes, transfer_blocks, download_actions, conflicts, created_at, updated_at]
      properties:
        id: { type: string, pattern: '^p[a-z0-9]{7}$' }
        workspace_id: { $ref: '#/components/schemas/WorkspaceId' }
        direction: { type: string, enum: [upload, download, bidirectional] }
        policy: { type: string, enum: [fill_missing, compare_merge, live] }
        state: { type: string, enum: [planned, transferring, verifying, applying, completed, conflict, cancelled, failed, expired] }
        base_revision: { type: integer, format: int64, minimum: 0 }
        target_revision: { type: integer, format: int64, minimum: 0 }
        stage: { type: string, enum: [scan, compare, transfer, verify, apply, complete] }
