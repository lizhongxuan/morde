      properties:
        id: { $ref: '#/components/schemas/WorkspaceId' }
        name: { type: string }
        revision: { type: integer, format: int64, minimum: 0 }
        used_bytes: { type: integer, format: int64, minimum: 0 }
        quota_bytes: { type: integer, format: int64, minimum: 1 }
        is_read_only: { type: boolean, description: True for a copy accepted with view permission. Server-side file mutations and Host attachment are denied. }
        state: { type: string, enum: [ready, deleting, deleted] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateWorkspaceShareRequest:
