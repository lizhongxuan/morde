  /api/projects/{id}/conversations/{conversation_id}/messages/{message_id}/attachments/{client_attachment_id}/chunks/{sequence}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/ProjectConversationId' }
      - { name: message_id, in: path, required: true, schema: { $ref: '#/components/schemas/MessageId' } }
      - { name: client_attachment_id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9._~-]{8,128}$' } }
      - { name: sequence, in: path, required: true, schema: { type: integer, minimum: 0, maximum: 74 } }
      - { $ref: '#/components/parameters/ServiceInstanceID' }
      - { $ref: '#/components/parameters/MessageActor' }
      - { name: Content-Length, in: header, required: true, schema: { type: integer, minimum: 1, maximum: 4194304 } }
      - { name: X-Chunk-SHA256, in: header, required: true, schema: { type: string, pattern: '^[a-f0-9]{64}$' } }
    put:
      tags: [Projects]
      operationId: putProjectConversationAttachmentChunk
      summary: Upload or replay one project attachment chunk
      description: Send raw 4 MiB chunks in any order; the last chunk has the exact remaining length. Identical retries succeed and changed bytes conflict.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Durable chunk receipt
          content:
            application/json:
              schema:
                type: object
                required: [sequence, replay]
                properties:
                  sequence: { type: integer, minimum: 0, maximum: 74 }
                  replay: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/projects/{id}/conversations/{conversation_id}/messages/{message_id}/attachments/{client_attachment_id}/commit:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/ProjectConversationId' }
      - { name: message_id, in: path, required: true, schema: { $ref: '#/components/schemas/MessageId' } }
      - { name: client_attachment_id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9._~-]{8,128}$' } }
      - { $ref: '#/components/parameters/ServiceInstanceID' }
      - { $ref: '#/components/parameters/MessageActor' }
    post:
      tags: [Projects]
      operationId: commitProjectConversationAttachment
      summary: Verify all chunks and associate the project attachment
      description: Empty request body. Size and full SHA-256 are verified before this slot becomes available to the Task; an exact retry is safe.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      responses:
        '200':
          description: Committed attachment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectConversationAttachmentStatus' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/projects/{id}/conversations/{conversation_id}/messages/{message_id}/attachments/{client_attachment_id}/derivatives:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/ProjectConversationId' }
