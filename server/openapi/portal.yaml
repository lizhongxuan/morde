        status: { type: string, enum: [queued, running, succeeded, failed, unknown] }
        attempt: { type: integer, minimum: 1 }
        result: { type: [string, 'null'] }
        error: { type: [string, 'null'] }
    TaskArtifact:
      type: object
      required: [id, step_id, label, path, media_type, batch_item_id, batch_attempt, created_at]
      properties:
        id: { $ref: '#/components/schemas/ArtifactId' }
        step_id: { $ref: '#/components/schemas/StepId' }
        label: { type: string }
        path: { type: string, description: Workspace-relative path }
        media_type: { type: string }
        batch_item_id: { oneOf: [{ $ref: '#/components/schemas/BatchItemId' }, { type: 'null' }] }
        batch_attempt: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
