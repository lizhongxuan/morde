        target_path: { type: string, maxLength: 4096, description: Required for rename and move; omitted for delete. }
        expected_current_revision: { type: integer, format: int64, minimum: 0 }
        write_enabled: { type: boolean, description: Must be explicitly true to enable this operation. }
    WorkspaceFileOperationResult:
      type: object
      additionalProperties: false
      required: [workspace_id, action, source_path, target_path, expected_current_revision, revision, replayed]
      properties:
        workspace_id: { $ref: '#/components/schemas/WorkspaceId' }
        action: { type: string, enum: [rename, move, delete] }
        source_path: { type: string, minLength: 1, maxLength: 4096 }
        target_path: { type: string, maxLength: 4096 }
        expected_current_revision: { type: integer, format: int64, minimum: 0 }
        revision: { type: integer, format: int64, minimum: 0 }
        replayed: { type: boolean }
    RequestWorkspaceOwnershipTransfer:
      type: object
      additionalProperties: false
      required: [target_user_id, expected_revision]
      properties:
        target_user_id: { $ref: '#/components/schemas/UserId' }
        expected_revision: { type: integer, format: int64, minimum: 0 }
    WorkspaceOwnershipTransfer:
      type: object
      additionalProperties: false
      required: [id, workspace_id, from_owner_id, to_owner_id, state, expected_revision, version, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/WorkspaceOwnershipTransferId' }
        workspace_id: { $ref: '#/components/schemas/WorkspaceId' }
        from_owner_id: { $ref: '#/components/schemas/UserId' }
        to_owner_id: { $ref: '#/components/schemas/UserId' }
        state: { type: string, enum: [pending, accepting, unknown, accepted, cancelled] }
        expected_revision: { type: integer, format: int64, minimum: 0 }
        operation_id: { type: string, pattern: '^o[a-z0-9]{7}$' }
        version: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        accepted_at: { type: string, format: date-time }
    CreateSyncSessionRequest:
      type: object
      required: [direction, policy, base_revision, files]
      properties:
        direction: { type: string, enum: [upload, download, bidirectional] }
        policy: { type: string, enum: [fill_missing, compare_merge, live] }
        base_revision: { type: integer, format: int64, minimum: 0, description: For Host replica downloads and bidirectional sync, this must not exceed the Host binding's applied_revision. }
        task_id: { type: string, pattern: '^q[a-z0-9]{7}$', description: Optional Task write fence. Must be paired with task_hub_operation_key and is accepted only for a device upload scoped to one file. }
        task_hub_operation_key: { type: string, minLength: 1, maxLength: 512, description: The durable Hub operation key associated with this Task write; must be paired with task_id. }
        scope:
          type: array
          maxItems: 10000
          items: { type: string, minLength: 1, maxLength: 4096 }
        files:
          type: array
          maxItems: 100000
          items: { $ref: '#/components/schemas/WorkspaceFile' }
        empty_directories:
          type: array
          maxItems: 100000
          items: { type: string, minLength: 1, maxLength: 4096, description: Empty leaf directories in the submitted snapshot; combined with files, at most 100000 entries. }
        directories:
          type: array
          maxItems: 100000
          items: { $ref: '#/components/schemas/WorkspaceDirectory' }
        deleted_paths:
          type: array
          maxItems: 100000
          items: { type: string, minLength: 1, maxLength: 4096 }
        deleted_directories:
          type: array
          maxItems: 100000
          items: { type: string, minLength: 1, maxLength: 4096, description: Explicit empty-directory deletions; omitted directories never imply deletion. }
        ack_cursor: { type: [string, 'null'], maxLength: 512, description: Advance this replica's durable cursor only after this session is applied and committed. }
      additionalProperties: false
    SyncConflict:
      type: object
      required: [path, reason, local_sha256, remote_sha256]
      properties:
        path: { type: string }
        reason: { type: string, enum: [content_changed, type_changed, delete_changed, case_collision, destination_exists] }
        local_sha256: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
        remote_sha256: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
    SyncTransferBlock:
      type: object
      required: [chunk, role, received]
      properties:
        chunk: { $ref: '#/components/schemas/WorkspaceChunk' }
