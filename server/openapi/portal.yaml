        paths:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 4096, description: A normalized relative file or directory path. Selecting a directory includes its descendants. }
    WorkspaceRestoreResult:
      type: object
      additionalProperties: false
      required: [workspace_id, target_revision, expected_current_revision, revision, replayed]
      properties:
        workspace_id: { $ref: '#/components/schemas/WorkspaceId' }
        target_revision: { type: integer, format: int64, minimum: 0 }
        expected_current_revision: { type: integer, format: int64, minimum: 0 }
        revision: { type: integer, format: int64, minimum: 0 }
        replayed: { type: boolean }
    WorkspaceCopyRequest:
      type: object
      additionalProperties: false
