      operationId: submitTask
      summary: Submit a durable cloud task
      description: The server owns the dsh Agent lifecycle. An optional Host is only a target for approved computer operations and is not where the Agent process runs.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitTaskRequest' }
      responses:
        '202':
          description: Persisted task awaiting execution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/TaskId' }
    get:
      tags: [Tasks]
      operationId: getTask
      summary: Get an owned task and its durable progress
      security: [{ portalSession: [] }, { clientCredential: [] }]
      responses:
        '200':
          description: Task snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/tasks/{id}/file-fetches/{fetch_id}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/TaskId' } }
      - { name: fetch_id, in: path, required: true, schema: { $ref: '#/components/schemas/OperationId' } }
    get:
      tags: [Tasks]
      operationId: getTaskFileFetch
      summary: Get a Task-bound PC file fetch status
      description: Portal Session only. The response is a safe status projection and never includes the PC transfer ticket or its hash. Missing and unauthorized Task fetches are hidden as not_found.
      security: [{ portalSession: [] }]
      responses:
        '200':
          description: Current fetch status and confirmed transfer progress
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskFileFetch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/tasks/{id}/file-fetches:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/TaskId' } }
    get:
      tags: [Tasks]
      operationId: listTaskFileFetches
      summary: List file fetches for an owned Task
      description: Portal Session only. Returns the newest 16 safe fetch projections, including retained-copy state and deletion time. No transfer ticket or ticket hash is returned.
      security: [{ portalSession: [] }]
      responses:
        '200':
          description: Task file fetch records
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskFileFetchList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/tasks/{id}/file-fetches/{fetch_id}/manifest:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/TaskId' } }
      - { name: fetch_id, in: path, required: true, schema: { $ref: '#/components/schemas/OperationId' } }
    post:
      tags: [Tasks]
      operationId: submitTaskFileFetchManifest
      summary: Pin a PC file manifest and reserve staging quota
      security: [{ fileFetchTicket: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskFileFetchManifestRequest' }
      responses:
        '200':
          description: Pinned manifest with confirmed chunk sequences for safe resume
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskFileFetchManifestReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/tasks/{id}/file-fetches/{fetch_id}/chunks/{sequence}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/TaskId' } }
      - { name: fetch_id, in: path, required: true, schema: { $ref: '#/components/schemas/OperationId' } }
      - name: sequence
        in: path
        required: true
        schema: { type: integer, minimum: 0, maximum: 31 }
      - name: X-Chunk-SHA256
        in: header
        required: true
        schema: { type: string, pattern: '^[a-f0-9]{64}$' }
    put:
      tags: [Tasks]
      operationId: putTaskFileFetchChunk
      summary: Store one idempotent PC file chunk
      security: [{ fileFetchTicket: [] }]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary, maxLength: 524288 }
      responses:
        '200':
          description: Durable confirmation of this chunk and aggregate progress
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskFileFetchChunkReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/tasks/{id}/file-fetches/{fetch_id}/commit:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/TaskId' } }
      - { name: fetch_id, in: path, required: true, schema: { $ref: '#/components/schemas/OperationId' } }
    post:
      tags: [Tasks]
      operationId: commitTaskFileFetch
      summary: Verify all chunks and atomically publish the retained copy
      security: [{ fileFetchTicket: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskFileFetchCommitRequest' }
      responses:
        '200':
          description: Safe receipt for the durable committed copy
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskFileFetchCommitReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/tasks/{id}/file-fetches/{fetch_id}/cancel:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/TaskId' } }
      - { name: fetch_id, in: path, required: true, schema: { $ref: '#/components/schemas/OperationId' } }
    post:
      tags: [Tasks]
      operationId: cancelTaskFileFetch
      summary: Cancel an in-progress or waiting file fetch
      description: Task-owner Portal Session only. Revokes the ticket and removes all staging chunks in the same serialized transition. Completed fetches cannot be cancelled.
      security: [{ portalSession: [] }]
      responses:
        '200':
          description: Cancelled fetch projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskFileFetch' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/tasks/{id}/file-fetches/{fetch_id}/content:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/TaskId' } }
      - { name: fetch_id, in: path, required: true, schema: { $ref: '#/components/schemas/OperationId' } }
    get:
      tags: [Tasks]
      operationId: getTaskFileFetchContent
      summary: Download an active retained Task file copy
      description: Task-owner Portal Session only. Returns original bytes after size and SHA-256 integrity verification; deleted or expired copies are unavailable.
      security: [{ portalSession: [] }]
      responses:
        '200':
          description: Verified retained file bytes; response is private and non-cacheable.
          headers:
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
            Content-Disposition: { schema: { type: string } }
          content:
            text/plain: { schema: { type: string, format: binary } }
            text/markdown: { schema: { type: string, format: binary } }
            text/csv: { schema: { type: string, format: binary } }
            application/json: { schema: { type: string, format: binary } }
            application/vnd.openxmlformats-officedocument.wordprocessingml.document: { schema: { type: string, format: binary } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
            application/vnd.openxmlformats-officedocument.presentationml.presentation: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Tasks]
      operationId: deleteTaskFileFetchContent
      summary: Delete a retained Task file copy
      description: Task-owner Portal Session only. Idempotently deletes cloud-retained bytes and preserves a deleted_at tombstone; the PC source file and Task history are unaffected.
      security: [{ portalSession: [] }]
      responses:
        '204': { description: Copy deleted or was already deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/tasks/{id}/media/{operation_id}/preview:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/TaskId' }
      - name: operation_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/OperationId' }
    get:
      tags: [Tasks]
      operationId: getTaskMediaPreview
      summary: Read a pending generated-media preview
      description: Requires the Task owner's session or client credential. Returns only server-staged generated media tied to the exact Task operation while its save confirmation is pending. Provider URLs and credentials are never returned. The response is private and non-cacheable; the staged bytes are deleted after approval, rejection, cancellation, or expiry. The service advertises task_media_generation only when this route and the complete generation, metering, recovery, and Workspace publication flow are assembled.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      responses:
        '200':
          description: Generated preview bytes; this response does not create a Workspace artifact.
          headers:
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            video/mp4: { schema: { type: string, format: binary } }
            audio/mpeg: { schema: { type: string, format: binary } }
            audio/ogg: { schema: { type: string, format: binary } }
            audio/opus: { schema: { type: string, format: binary } }
            audio/wav: { schema: { type: string, format: binary } }
            audio/aac: { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/tasks/{id}/workbench-observation-ticket:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/TaskId' }
    post:
      tags: [Tasks]
      operationId: issueTaskWorkbenchObservationTicket
      summary: Issue a short-lived one-time ticket to observe a Host-bound Task in Workbench
      description: Portal session only. The caller must currently be able to read this Task and own its running Host. The raw ticket is returned once, expires within 60 seconds, and is persisted server-side only as a hash. It grants read-only Task status/events and verified artifact metadata; it grants no Host control or Workspace file access.
      security: [{ portalSession: [] }]
      responses:
        '201':
          description: One-time Workbench observation ticket
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Referrer-Policy: { schema: { type: string, const: no-referrer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskWorkbenchObservationTicket' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/tasks/{id}/workspace-view-deletions:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/TaskId' }
    get:
      tags: [Tasks]
      operationId: getTaskWorkspaceViewDeletion
      summary: Get the confirmation and Host cleanup state for a Task Workspace view
      security: [{ portalSession: [] }, { clientCredential: [] }]
      responses:
        '200':
          description: Current persisted deletion state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskWorkspaceViewDeletion' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Tasks]
      operationId: requestTaskWorkspaceViewDeletion
      summary: Explicitly request deletion of a stopped Task's private Workspace view
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskWorkspaceViewDeletionRequest' }
      responses:
        '202':
          description: Deletion is queued until the Host confirms cleanup
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskWorkspaceViewDeletion' }
        '200':
          description: Previously requested deletion is already confirmed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskWorkspaceViewDeletion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/tasks/{id}/mcp-connectors/{connector_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/TaskId' }
      - name: connector_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/MCPConnectorId' }
    delete:
      tags: [Tasks]
      operationId: revokeTaskMCPConnectorGrant
      summary: Revoke one connector grant for a task
      description: Revocation uses a grant-version compare-and-set. It blocks new connector dispatch; already dispatched operations are settled by the task operation lifecycle.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - name: expected_grant_version
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '204': { description: Connector grant revoked }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/tasks/{id}/actions:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/TaskId' }
    post:
      tags: [Tasks]
      operationId: actOnTask
      summary: Pause, resume, cancel, or retry one batch item
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskActionRequest' }
      responses:
        '202':
          description: Action accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskActionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/tasks/{id}/inputs:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/TaskId' }
    post:
      tags: [Tasks]
      operationId: answerTaskInput
      summary: Answer a versioned clarification and resume a task
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskInputRequest' }
      responses:
        '202':
          description: Input accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskActionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/tasks/{id}/approvals/{approval_id}/responses:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/TaskId' }
      - name: approval_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ClarificationId' }
    post:
      tags: [Tasks]
      operationId: respondToTaskApproval
      summary: Approve or reject a specific versioned task approval
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskApprovalResponseRequest' }
      responses:
        '202':
          description: Decision accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskActionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/tasks/{id}/events:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/TaskId' }
    get:
      tags: [Tasks]
      operationId: streamTaskEvents
      summary: Stream durable task events
      description: Disconnecting the event stream does not cancel the task. If the cursor expires, the stream emits task.snapshot_required and the client must fetch the task snapshot.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - name: after
          in: query
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: Last-Event-ID
          in: header
          schema: { type: string, pattern: '^[0-9]+$' }
      responses:
        '200':
          description: Server-sent task events
          content:
            text/event-stream:
              schema: { type: string }
        '204': { description: No newer events for an already terminal task }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/clients:
    get:
      tags: [Clients]
      operationId: listClients
      summary: List current user's client installations
      description: Requires a portal session or native Client credential; only installations of the current account are returned.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      responses:
        '200':
          description: Installations without credentials
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ClientInstallation' } }
        default: { $ref: '#/components/responses/Error' }
  /api/clients/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ClientInstallationId' }
    delete:
      tags: [Clients]
      operationId: revokeClient
      summary: Revoke a client installation, its credentials, tickets and Gateway sessions
      description: Requires a portal session or native Client credential. Only an installation belonging to the current account can be revoked; its credentials are revoked together.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      responses:
        '204': { description: Installation revoked }
        default: { $ref: '#/components/responses/Error' }
  /api/devices:
    get:
      tags: [Devices]
      operationId: listDevices
      summary: List the current account's client installations and Hub presence
      description: Requires a portal session or native Client credential. Device IDs are Client Installation IDs. Online status is advisory Hub presence.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      responses:
        '200':
          description: Client installations without credentials
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/DeviceInstallation' } }
        default: { $ref: '#/components/responses/Error' }
  /api/devices/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ClientInstallationId' }
    patch:
      tags: [Devices]
      operationId: renameDevice
      summary: Rename a client installation
      description: Requires a portal session or native Client credential. The display name is shared by the Client Installation and Hub presence.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [display_name]
              properties:
                display_name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '204': { description: Installation renamed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Devices]
      operationId: revokeDeviceInstallation
      summary: Revoke a device's complete Client Installation
      description: Requires a portal session or native Client credential. This revokes the selected installation and its credentials, ending its Hub and synchronization access; deleting a Device does not preserve other Morde permissions for that installation.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      responses:
        '204': { description: Installation and its credentials revoked }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/goals:
    get:
      tags: [Personal Data]
      operationId: listGoals
      summary: List the current account's goals
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Owner-scoped goals
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoalPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Personal Data]
      operationId: createGoal
      summary: Create a goal in the personal-object ledger
      description: The client supplies a stable ID so an Idempotency-Key retry addresses the same object. The goal body, material references, quota, revision, and account change entry commit atomically.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoalCreateRequest' }
      responses:
        '201':
          description: Goal created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalMutationReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/goals/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/GoalId' }
    get:
      tags: [Personal Data]
      operationId: getGoal
      summary: Read one current-account goal
      security: [{ portalSession: [] }, { clientCredential: [] }]
      responses:
        '200':
          description: Goal body and revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalObject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Personal Data]
      operationId: updateGoal
      summary: Replace a goal body with an optimistic revision check
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoalMutationRequest' }
      responses:
        '200':
          description: Body-free mutation receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalMutationReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Personal Data]
      operationId: deleteGoal
      summary: Delete a goal using its current revision
      description: Deletion creates a tombstone; old offline retries cannot recreate the goal.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoalDeleteRequest' }
      responses:
        '200':
          description: Body-free mutation receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalMutationReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/schedules:
    get:
      tags: [Schedules]
      operationId: listSchedules
      summary: List schedules owned by the current account
      description: Schedule-scoped Client grants can access this API; execution authorization remains server-side. Hostless schedules have host_id null. Schedules with browser observation are always Host-bound.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ScheduleStatus' } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Schedule page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchedulePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Schedules]
      operationId: createSchedule
      summary: Create and enable a schedule
      description: Requires an enabled Owner execution gate and an Idempotency-Key. Omit host_id or set it to null to create a hostless schedule. Browser observation requires a Host. Authorization is derived from the current session or a separate schedule grant; credentials are never included in responses or sync snapshots.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleCreateRequest' }
      responses:
        '201':
          description: Created schedule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/schedules/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ScheduleId' }
    get:
      tags: [Schedules]
      operationId: getSchedule
      summary: Read one current-account schedule
      description: Returns host_id as null for a hostless schedule. A schedule with browser observation always has a Host.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      responses:
        '200':
          description: Schedule definition and current run summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [Schedules]
      operationId: updateSchedule
      summary: Update a schedule definition at the expected version
      description: Omit host_id to keep the current Host, or set it to null to remove the Host association. When removing a Host from a schedule with browser observation, also set observation to null. Browser observation requires a Host.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleUpdateRequest' }
      responses:
        '200':
          description: Updated schedule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/schedules/{id}/actions:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ScheduleId' }
    post:
      tags: [Schedules]
      operationId: updateScheduleStatus
      summary: Enable or disable a schedule
      description: Requires an Idempotency-Key and expected_version. Hostless schedules can be enabled when they do not configure browser observation. Disabling does not cancel the current run unless current_run_action is cancel.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleActionRequest' }
      responses:
        '200':
          description: Updated schedule and current run state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleActionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/schedules/{id}/runs:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ScheduleId' }
    get:
      tags: [Schedules]
      operationId: listScheduleRuns
      summary: List run history for a schedule
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Schedule run history page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleRunPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/personal-data/quota:
    get:
      tags: [Personal Data]
      operationId: getPersonalDataQuota
      summary: Read the authenticated account's personal-data quota
      description: Returns the authenticated owner's aggregate personal-data usage, reservations, and limits. Usage includes supported personal-object JSON, schedule definitions, and personal attachments. It excludes chat, Workspace files, and separately consented recording data. Requires an approved unbound session or eligible Client credential with task submission scope; Host-scoped credentials cannot read it.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      responses:
        '200':
          description: Authenticated owner's current personal-data usage and available space
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalDataQuota' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/personal-data/{type}/{id}:
    parameters:
      - name: type
        in: path
        required: true
        schema: { $ref: '#/components/schemas/PersonalMutationObjectType' }
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/PersonalObjectId' }
        description: >
          Identifier rules depend on type. profile and feed_preferences use default;
          memory uses global, user, or m_<8 lowercase hex characters; skill_setting
          uses builtin_<non-empty id>; connector_setting uses catalogue_<non-empty id>.
          Other enabled types use a path-free opaque identifier. The server also rejects
          . and ..; schedule uses its dedicated API rather than this mutation route.
    get:
      tags: [Personal Data]
      operationId: getPersonalObject
      summary: Read a current-account personal object
      description: Requires an approved portal session or active Client credential. Schedule definitions use the dedicated Schedule API; a missing or deleted object returns not_found. Object revision and body are read together.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      responses:
        '200':
          description: Current object and revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalObject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [Personal Data]
      operationId: replacePersonalObject
      summary: Replace a current-account personal object
      description: Requires an approved portal session or active Client credential. The write is an optimistic compare-and-set using base_revision. On a revision conflict, details contain only base_revision, current_revision and deleted; the server never returns the object body in the conflict.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/OptionalServiceInstanceID' }
        - { $ref: '#/components/parameters/OptionalMessageActor' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonalObjectPutRequest' }
      responses:
        '200':
          description: Body-free mutation receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalMutationReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Personal Data]
      operationId: deletePersonalObject
      summary: Delete a current-account personal object
      description: Requires an approved portal session or active Client credential. Deletion records a versioned tombstone; the same profile ID cannot be recreated. The body-free receipt is idempotent through Idempotency-Key.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/OptionalServiceInstanceID' }
        - { $ref: '#/components/parameters/OptionalMessageActor' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonalObjectDeleteRequest' }
      responses:
        '200':
          description: Body-free mutation receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalMutationReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/personal-data/uploads:
    post:
      tags: [Personal Data]
      operationId: createPersonalAttachmentUpload
      summary: Start an owner-scoped personal attachment upload
      description: Requires an approved portal session or active Client credential. The request is limited to 16 KiB and requires an Idempotency-Key. It reserves personal-data quota before accepting chunks; retries with the same key and request return the original upload.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/OptionalServiceInstanceID' }
        - { $ref: '#/components/parameters/OptionalMessageActor' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonalAttachmentUploadRequest' }
      responses:
        '200':
          description: Existing or newly created upload reservation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalAttachmentUploadReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        default: { $ref: '#/components/responses/Error' }
  /api/personal-data/uploads/{upload_id}/chunks/{sequence}:
    parameters:
      - name: upload_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/PersonalAttachmentUploadId' }
      - name: sequence
        in: path
        required: true
        schema: { type: integer, format: int32, minimum: 0 }
    put:
      tags: [Personal Data]
      operationId: putPersonalAttachmentChunk
      summary: Upload or replay one bounded attachment chunk
      description: Requires an approved portal session or active Client credential. Send one raw chunk no larger than 4 MiB, an exact Content-Length, and exactly one X-Chunk-SHA256 header. Repeating the same sequence and bytes is idempotent; different bytes conflict.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/OptionalServiceInstanceID' }
        - { $ref: '#/components/parameters/OptionalMessageActor' }
        - name: Content-Length
          in: header
          required: true
          schema: { type: integer, minimum: 1, maximum: 4194304 }
        - name: X-Chunk-SHA256
          in: header
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{64}$' }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary, maxLength: 4194304 }
      responses:
        '200':
          description: Chunk stored or exact retry acknowledged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalAttachmentChunkReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        default: { $ref: '#/components/responses/Error' }
  /api/personal-data/uploads/{upload_id}/commit:
    parameters:
      - name: upload_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/PersonalAttachmentUploadId' }
    post:
      tags: [Personal Data]
      operationId: commitPersonalAttachment
      summary: Commit a complete personal attachment upload
      description: Requires an approved portal session or active Client credential, an empty request body, and an Idempotency-Key. Commit verifies the target object's current revision, all chunk hashes and the final SHA-256, then publishes an owner-scoped attachment. An exact retry returns the original receipt without publishing twice.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/OptionalServiceInstanceID' }
        - { $ref: '#/components/parameters/OptionalMessageActor' }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Attachment commit receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalAttachmentCommitReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/personal-data/uploads/{upload_id}:
    parameters:
      - name: upload_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/PersonalAttachmentUploadId' }
    delete:
      tags: [Personal Data]
      operationId: cancelPersonalAttachmentUpload
      summary: Cancel a pending personal attachment upload
      description: Requires an approved portal session or active Client credential and an empty request body. Repeated cancellation is safe; reserved quota is released through an idempotent bounded cleanup path.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/OptionalServiceInstanceID' }
        - { $ref: '#/components/parameters/OptionalMessageActor' }
      responses:
        '204': { description: Upload cancelled or already inactive }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/personal-data/attachments/{attachment_id}:
    get:
      tags: [Personal Data]
      operationId: getPersonalAttachment
      summary: Read a committed attachment owned by the current account
      description: Requires an approved portal session or active Client credential. The server checks owner scope and an existing readable personal reference. Responses are private and non-cacheable.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - name: attachment_id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/PersonalAttachmentId' }
      responses:
        '200':
          description: Attachment bytes
          headers:
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
            Content-Disposition: { schema: { type: string, const: attachment } }
            ETag: { schema: { type: string } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            image/*:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/personal-data/office-preview:
    post:
      tags: [Personal Data]
      operationId: previewPersonalOfficeText
      summary: Preview plain text from a user-selected Office document
      description: Requires an approved portal session or active Client credential. This manual operation accepts only DOCX, XLSX, or PPTX bytes up to 16 MiB, extracts bounded plain text in memory, and neither stores the document nor creates a task or model call. Responses are private and non-cacheable.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      requestBody:
        required: true
        content:
          application/vnd.openxmlformats-officedocument.wordprocessingml.document:
            schema: { type: string, format: binary, maxLength: 16777216 }
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema: { type: string, format: binary, maxLength: 16777216 }
          application/vnd.openxmlformats-officedocument.presentationml.presentation:
            schema: { type: string, format: binary, maxLength: 16777216 }
      responses:
        '200':
          description: Bounded plain text extracted from the document
          headers:
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalOfficePreviewResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        default: { $ref: '#/components/responses/Error' }
  /api/personal-data/history/import:
    post:
      tags: [Personal Data]
      operationId: importPersonalHistory
      summary: Import user-confirmed text history without creating tasks
      description: Requires an approved portal session or active Client credential. This dedicated endpoint accepts only user-confirmed user/assistant text, stable source identifiers and optional committed personal attachment IDs. It is limited to 8 MiB at the API boundary and at most 200 messages / 1 MiB of text per batch. Retries with the same source and message identifiers plus content are idempotent; changed content conflicts. Imported messages are taskless and never invoke task submission or execution.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonalHistoryImportRequest' }
      responses:
        '200':
          description: Canonical conversation and imported message mappings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalHistoryImportReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        default: { $ref: '#/components/responses/Error' }
  /api/sync/snapshot:
    get:
      tags: [Personal Data]
      operationId: getPersonalDataSnapshot
      summary: Read a keyset page of the current account's personal data
      description: |-
        Requires an approved Portal session or eligible active Client credential. The supported personal-object set includes profile, memory, soul, diary, goals, schedules, feed posts and preferences, idea marks, library metadata, and built-in skill and connector settings. The first page fixes the account change-feed watermark; later pages use a signed cursor bound to this account, service instance, and keyset position.

        Pages are reads of the current object view, not a point-in-time snapshot: each page is read in its own database view. Writes after the watermark may appear in later pages and are also present in the change feed. Deleted objects are omitted. Clients must merge by object revision and account change sequence so an older feed event cannot replace a newer page value; preserve the local outbox until reconciliation is complete. Fetch changes only after all snapshot pages have completed, starting after this watermark.

        The cursor remains valid for the lifetime of the account change log. Change-log rows are currently retained for the account lifetime; pruning requires a cursor floor and a response that directs the client to fetch a new snapshot.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string, maxLength: 2048 }
          description: Omit on the first page; pass next_cursor unchanged for subsequent pages.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        '200':
          description: One current-view page and the fixed account change-feed watermark
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalSnapshotPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /api/sync/changes:
    get:
      tags: [Personal Data]
      operationId: getPersonalDataChanges
      summary: Read personal-data changes after an account sequence
      description: |-
        Requires an approved Portal session or eligible active Client credential. Fetch changes after all snapshot pages have completed, starting with after_sequence set to the snapshot watermark. Omit through_sequence on the first request; it fixes the upper watermark for this read. While has_more is true, pass the returned through_sequence unchanged and resume from next_after_sequence.

        The feed returns change metadata for supported personal objects and schedules, never object bodies or secret values. Conversation and message sequence entries are filtered out, so gaps in change_sequence are expected. On the final page, next_after_sequence advances to through_sequence even when the last returned event is earlier.

        Account sequence values are owner-scoped. Change-log rows are currently retained for the account lifetime, so old cursors do not expire. Pruning must not be added without a minimum retained sequence and snapshot-recovery response.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - name: after_sequence
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
          description: Last account sequence already committed by the client.
        - name: through_sequence
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
          description: Fixed upper watermark returned by the first page; omit on the first request.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        '200':
          description: Personal-data change metadata through a fixed account watermark
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalChangePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /api/device/workspaces:
    get:
      tags: [Devices]
      operationId: listDeviceWorkspaces
      summary: List ready workspaces owned by the current desktop client
      description: Requires an active installation-bound Sync credential. Authorization is checked against current owner and ready state on each request; no static workspace grants are stored.
      security:
        - bearerToken: []
      responses:
        '200':
          description: Ready owned workspace metadata
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DeviceWorkspace' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/apikeys/{id}:
    parameters:
      - $ref: '#/components/parameters/TokenId'
    delete:
      tags: [Tokens]
      operationId: deleteAPIKey
      summary: Delete an API key
      security:
        - portalSession: []
      responses:
        '204': { description: API key deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/available-models:
    get:
      tags: [Models]
      operationId: listAvailableModels
      summary: List configured models without connection settings or secrets
      description: Portal sessions and restricted client credentials may read this minimal catalog.
      security: [{ portalSession: [] }, { bearerToken: [] }]
      responses:
        '200':
          description: Configured models
          content:
            application/json:
              schema:
                type: object
                required: [items, configuration_status, default_model_configured, default_model_id]
                properties:
                  configuration_status:
                    $ref: '#/components/schemas/ModelConfigurationStatus'
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, name, model_name, capabilities]
                      properties:
                        id: { $ref: '#/components/schemas/ModelConnectionId' }
                        name: { type: string }
                        model_name: { type: string }
                        capabilities:
                          type: object
                          required: [text, tools, vision]
                          properties:
                            text: { type: boolean }
                            tools: { type: boolean }
                            vision: { type: boolean }
                  default_model_configured:
                    type: boolean
                    description: True while the configured global shared model is checked and supports text. Tool use still requires verified tool capability; shared platform models require an account budget.
                  default_model_id:
                    oneOf:
                      - { $ref: '#/components/schemas/ModelConnectionId' }
                      - { type: 'null' }
                    description: Configured global model ID only when it is currently usable; null otherwise.
        default: { $ref: '#/components/responses/Error' }
  /api/model-connections:
    get:
      tags: [Models]
      operationId: listModelConnections
      summary: List model connections available to the current user
      description: Approved Portal sessions or an installation-bound Morde Client credential may list shared and caller-owned personal connections. Ordinary API-key credentials are not accepted; client credentials can only access the caller's personal connections and shared models.
      security: [{ portalSession: [] }, { bearerToken: [] }]
      responses:
        '200':
          description: Model connections without secret values
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelConnectionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Models]
      operationId: createModelConnection
      summary: Create a personal or shared model connection
      description: Approved Portal sessions or an installation-bound Morde Client credential may create a personal connection owned by the caller. Only an administrator Portal session may set shared=true. Ordinary API-key credentials are not accepted. Ownership and authorization are enforced by the server. The API key is encrypted at rest and never returned.
      security: [{ portalSession: [] }, { bearerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateModelConnectionRequest' }
      responses:
        '201':
          description: Created connection without the API key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelConnection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
  /api/model-connections/{id}:
    parameters:
      - $ref: '#/components/parameters/ModelConnectionId'
    get:
      tags: [Models]
      operationId: getModelConnection
      summary: Get a model connection
      description: Approved Portal sessions or an installation-bound Morde Client credential may read shared and caller-owned personal connection metadata. Ordinary API-key credentials are not accepted. The response includes has_api_key but never the secret; inaccessible connections return not found.
      security: [{ portalSession: [] }, { bearerToken: [] }]
      responses:
        '200':
          description: Model connection without its API key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelConnection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [Models]
      operationId: updateModelConnection
      summary: Update a model connection
      description: Approved Portal sessions or an installation-bound Morde Client credential may update caller-owned personal connections; only an administrator Portal session may update shared connections. shared is immutable here. Ordinary API-key credentials are not accepted. Omit api_key or send an empty string to retain the existing secret; any supplied secret replaces it. The server never returns the secret.
      security: [{ portalSession: [] }, { bearerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateModelConnectionRequest' }
      responses:
        '200':
          description: Updated connection without its API key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelConnection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Models]
      operationId: deleteModelConnection
      summary: Delete a model connection
      description: Approved Portal sessions or an installation-bound Morde Client credential may delete caller-owned personal connections; only an administrator Portal session may delete shared connections. Ordinary API-key credentials are not accepted. Authorization is enforced by the server.
      security: [{ portalSession: [] }, { bearerToken: [] }]
      responses:
        '204': { description: Model connection deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
  /api/model-connections/{id}/check:
    parameters:
      - $ref: '#/components/parameters/ModelConnectionId'
    post:
      tags: [Models]
      operationId: checkModelConnection
      summary: Check a model connection and discover capabilities
      description: Approved Portal sessions or an installation-bound Morde Client credential may check shared or caller-owned personal connections; shared connection checks require an administrator Portal session. Ordinary API-key credentials are not accepted. Requires an Idempotency-Key. Shared platform model checks require a configured account model budget; caller-owned personal checks do not consume it. The selected probe is recorded and settled in the same ledger as model requests. An omitted capability or all checks text, tools and vision; media generation probes are explicit because they may incur provider charges and require a new key. False means not yet verified or unsupported. Verified capabilities are combined only while the connection version is unchanged. Media generation is verified only when the provider reports actual input/output Token usage that can be reserved and settled exactly; seconds, images, characters or cost are never converted to Tokens. Unknown usage remains pending for reconciliation and cannot be silently retried; the API key is never returned.
      security: [{ portalSession: [] }, { bearerToken: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                capability: { type: string, enum: [all, text, text_stream, tools, vision, image_generation, video_generation, speech_generation], default: all, description: text_stream is an explicit metered inference that verifies SSE and can incur usage; all does not trigger it. }
      responses:
        '200':
          description: Verified model capabilities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelConnectionCapabilities' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
        default: { $ref: '#/components/responses/Error' }
  /api/mcp/connectors:
    get:
      tags: [MCP]
      operationId: listMCPConnectors
      summary: List the current user's MCP connectors
      description: Portal sessions only. Connectors are private to the account. Responses never contain credential values.
      security:
        - portalSession: []
      responses:
        '200':
          description: Connectors without credential values
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPConnectorList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [MCP]
      operationId: createMCPConnector
      summary: Create a private MCP connector
      description: Portal sessions only. New connectors are disabled until explicitly enabled. Optional credential JSON is encrypted at rest and never returned; URL credentials, query strings, fragments, non-HTTPS schemes, literal IPs and ports other than 443 are rejected.
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMCPConnectorRequest' }
      responses:
        '201':
          description: Created connector without credential values
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPConnector' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
  /api/mcp/connectors/{id}:
    parameters:
      - $ref: '#/components/parameters/MCPConnectorId'
    get:
      tags: [MCP]
      operationId: getMCPConnector
      summary: Get a private MCP connector
      description: Portal sessions only. Another user's connector is reported as not found.
      security:
        - portalSession: []
      responses:
        '200':
          description: Connector metadata and credential presence, without credential values
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPConnector' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [MCP]
      operationId: updateMCPConnector
      summary: Update connector metadata
      description: Portal sessions only. Requires the current revision. Credential rotation uses its separate endpoint.
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMCPConnectorRequest' }
      responses:
        '200':
          description: Updated connector metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPConnector' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [MCP]
      operationId: deleteMCPConnector
      summary: Delete a private MCP connector
      description: Portal sessions only. Requires the current revision; the deletion and audit event commit together.
      security:
        - portalSession: []
      parameters:
        - name: expected_revision
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '204': { description: Connector deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
  /api/mcp/connectors/{id}/credential:
    parameters:
      - $ref: '#/components/parameters/MCPConnectorId'
    put:
      tags: [MCP]
      operationId: rotateMCPConnectorCredential
      summary: Replace a connector credential
      description: Portal sessions only. Credentials are write-only, encrypted with owner, connector and credential-version AAD, and never returned. The request and audit event commit with the new version.
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RotateMCPConnectorCredentialRequest' }
      responses:
        '200':
          description: Updated connector metadata without credential values
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPConnector' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
  /api/mcp/connectors/{id}/enabled:
    parameters:
      - $ref: '#/components/parameters/MCPConnectorId'
    put:
      tags: [MCP]
      operationId: setMCPConnectorEnabled
      summary: Enable or disable a connector
      description: Portal sessions only. Requires the current revision. The change and audit event commit together.
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, expected_revision]
              properties:
                enabled: { type: boolean }
                expected_revision: { type: integer, minimum: 1 }
              additionalProperties: false
      responses:
        '200':
          description: Updated connector state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPConnector' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
  /api/mcp/connectors/{id}/oauth/authorize:
    parameters:
      - $ref: '#/components/parameters/MCPConnectorId'
    post:
      tags: [MCP]
      operationId: beginMCPConnectorOAuth
      summary: Begin server-side OAuth authorization for a connector
      description: Portal sessions only. OAuth authorization is unavailable when the Portal uses HTTP. Discovers the MCP protected resource and authorization server, reuses or dynamically registers an OAuth client, and returns a PKCE authorization URL. If dynamic registration is unavailable, returns the issuer and callback URI so the user can provide an OAuth client ID and optional secret. Client secrets are accepted only in this request and are never returned.
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BeginMCPConnectorOAuthRequest' }
      responses:
        '200':
          description: Authorization URL or a request for user-provided OAuth client details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BeginMCPConnectorOAuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/Error' }
  /api/mcp/oauth/callback:
    get:
      tags: [MCP]
      operationId: completeMCPConnectorOAuth
      summary: Complete the one-time OAuth authorization callback
      description: Public provider callback protected by a one-time, expiring state hash. The authorization code is exchanged server-side with PKCE and encrypted credentials are stored for the account that initiated the flow. OAuth callback errors are not reflected to the browser.
      security: []
      parameters:
        - { name: state, in: query, required: true, schema: { type: string, minLength: 43, maxLength: 128 } }
        - { name: code, in: query, required: false, schema: { type: string, maxLength: 8192 } }
        - { name: error, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: iss, in: query, required: false, schema: { type: string, format: uri, maxLength: 4096 } }
      responses:
        '200': { description: Authorization completed. Returns a simple no-store page for the user. }
        '400': { description: Authorization was not completed or the one-time state was invalid. }
        '503': { description: OAuth service unavailable. }
  /api/admin/settings:
    get:
      tags: [Admin]
      operationId: getAdminSettings
      summary: Read account, model budget, model selection, reward, and quota policy
      description: Requires an approved administrator's unbound Portal session. A configured default platform-model budget is granted only on first approval; approval is also allowed when no default is configured, and personal models do not require one. Cloud Agent execution requires a checked text-and-tools model available to the user. Invitation and contribution rewards remain disabled.
      security: [{ portalSession: [] }]
      responses:
        '200':
          description: Current policy, default model budget and model selection, and personal-data quota defaults
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/settings/model-budget-default:
    put:
      tags: [Admin]
      operationId: updateAdminModelBudgetDefault
      summary: Version-update the default model budget for newly approved accounts
      description: Requires an approved administrator's unbound Portal session. The default must be positive and is applied to a new account only on its first approval. Existing account budgets are never overwritten. expected_version is 0 when no default has been configured and increments after each successful update. The setting and audit record are committed atomically.
      security: [{ portalSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAdminModelBudgetDefaultRequest' }
      responses:
        '200':
          description: Saved default model budget and version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminModelBudgetDefault' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/settings/model-default:
    put:
      tags: [Admin]
      operationId: updateAdminModelDefault
      summary: Select or clear the global Cloud Agent model
      description: Requires an approved administrator's unbound Portal session. The selected connection must be shared, checked, and support text plus tools; setting an empty model_id clears the default. Updates use expected_version compare-and-set. Users may select another checked model they are authorized to use. The model ID may remain visible in admin settings when its connection is temporarily unchecked, while configured is false.
      security: [{ portalSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAdminModelDefaultRequest' }
      responses:
        '200':
          description: Saved default model selection and version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminModelDefault' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: Connection is not checked or does not support text and tools
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/invites:
    get:
      tags: [Admin]
      operationId: listAdminInvites
      summary: Search Morde invitation attribution and signup history
      description: Requires an approved administrator's unbound Portal session. Read-only; no reward, account disable, or account deletion action is exposed. No registration IP is retained.
      security: [{ portalSession: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 128 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 } }
      responses:
        '200':
          description: Invitation history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminInvitePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/sites:
    get:
      tags: [Admin]
      operationId: listAdminSites
      summary: Read local Site and Release statistics
      description: Requires an approved administrator's unbound Portal session. Site counts come only from local Morde data; GitHub analytics and external traffic are not configured or collected. This is read-only and does not publish content.
      security: [{ portalSession: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 } }
      responses:
        '200':
          description: Local Site and Release summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSitePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/nudges:
    get:
      tags: [Admin]
      operationId: getAdminNudgePolicy
      summary: Read the saved operational nudge policy
      security: [{ portalSession: [] }]
      responses:
        '200':
          description: Saved policy and version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminNudgePolicy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [Admin]
      operationId: updateAdminNudgePolicy
      summary: Version-update the operational nudge policy
      description: Requires an approved administrator's unbound Portal session. External links must point to GitHub. The policy is disabled by default; updates are audited in the same transaction.
      security: [{ portalSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAdminNudgePolicyRequest' }
      responses:
        '200':
          description: Updated policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminNudgePolicy' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/hosts:
    get:
      tags: [Admin]
      operationId: listAllHosts
      summary: List all hosts
      security:
        - portalSession: []
      responses:
        '200':
          description: Hosts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Host' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/hosts/{id}/resources:
    parameters:
      - $ref: '#/components/parameters/HostId'
    get:
      tags: [Admin]
      operationId: getAdminHostResources
      summary: Read the effective host resources, version and update status
      security: [{ portalSession: [] }]
      responses:
        '200':
          description: Host resource target
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminHostResources' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Admin]
      operationId: updateAdminHostResources
      summary: Change a host's CPU and memory resources
      description: Stopped host changes apply on next start. Running Docker hosts are adjusted and read back before success, without restarting the container. An unknown runtime outcome keeps the old effective value and reserves capacity until reconciled.
      security: [{ portalSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAdminHostResourcesRequest' }
      responses:
        '200':
          description: Updated saved target
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminHostResources' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/hosts/{id}/recovery:
    parameters:
      - $ref: '#/components/parameters/HostId'
    post:
      tags: [Admin]
      operationId: recoverAdminHost
      summary: Safely recover an uncertain Host restore
      description: Rechecks remote sandbox state. Existing sandboxes are adopted; a new create is queued only after an administrator confirms the external issue is fixed and no matching sandbox exists.
      security: [{ portalSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminHostRecoveryRequest' }
      responses:
        '202':
          description: Host recovery queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminHostRecoveryResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/workspaces:
    get:
      tags: [Admin]
      operationId: listAdminWorkspaces
      summary: List workspace metadata for administrators
      security:
        - portalSession: []
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
      responses:
        '200':
          description: Workspace metadata and Host associations, without paths or file content
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminWorkspacePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/workspaces/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/WorkspaceId' } }
    get:
      tags: [Admin]
      operationId: getAdminWorkspace
      summary: Get workspace metadata and Host associations for administrators
      security:
        - portalSession: []
      responses:
        '200':
          description: Workspace metadata without paths or file content
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminWorkspace' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/users:
    get:
      tags: [Admin]
      operationId: listUsers
      summary: List users without credential data
      security:
        - portalSession: []
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AccountStatus' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 } }
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, offset]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminUser' }
                  total: { type: integer, format: int64, minimum: 0 }
                  limit: { type: integer, minimum: 1, maximum: 100 }
                  offset: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/UserId' }
    get:
      tags: [Admin]
      operationId: getAdminUser
      summary: Get one user without credential data
      security: [{ portalSession: [] }]
      responses:
        '200':
          description: User and resource usage summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Admin]
      operationId: updateUser
      summary: Review a user's status, change their role, or update quota
      description: Requires an approved administrator's unbound Portal session. On the first transition from pending or rejected to approved, a configured default platform model budget is created in the same transaction as the status change and audit. If no default is configured, approval succeeds without granting a platform model budget. Disabling and restoring an account does not grant or reset a budget.
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/users/{id}/personal-data-quota:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/UserId' } }
    get:
      tags: [Admin]
      operationId: getAdminPersonalDataQuota
      summary: Read a user's personal-data usage and limits
      description: Requires an approved administrator's unbound Portal session. This quota aggregates supported personal-object JSON, schedules, and personal attachments. It excludes chat, Workspace, and separately consented record data.
      security: [{ portalSession: [] }]
      responses:
        '200':
          description: Personal-data usage and configured/default limits
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPersonalDataQuota' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Admin]
      operationId: setAdminPersonalDataQuota
      summary: Version-update a user's personal-data quota
      description: Requires an approved administrator's unbound Portal session. expected_version makes the update compare-and-set; every successful change is audited. Defaults are 5 GiB total and 300 MiB per attachment. The adjustable per-file cap is bounded by the chunk-index implementation maximum. This does not change chat, Workspace, or record quotas.
      security: [{ portalSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetAdminPersonalDataQuotaRequest' }
      responses:
        '200':
          description: Updated personal-data quota and usage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPersonalDataQuota' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/users/{id}/record-settings:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/UserId' } }
    get:
      tags: [Admin]
      operationId: getAdminRecordSettings
      summary: Read a user's record consent, quota, and all administrator grants
      description: Requires a super administrator session. This does not return record content or attachments.
      security: [{ portalSession: [] }]
      responses:
        '200':
          description: Record capture settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminRecordSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/users/{id}/record-access:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/UserId' } }
    get:
      tags: [Admin]
      operationId: getAdminRecordAccess
      summary: Read this administrator's own record capabilities and the user's consent state
      description: Returns only the caller's own grants, never other administrators' grants or quota values.
      security: [{ portalSession: [] }]
      responses:
        '200':
          description: Current caller record access
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminRecordAccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/users/{id}/record-quota:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/UserId' } }
    put:
      tags: [Admin]
      operationId: setAdminRecordQuota
      summary: Compare-and-set record retention and storage quota
      description: Requires a super administrator session. Current usage is preserved; updates below used plus reserved bytes are rejected. The update is audited in the same database transaction.
      security: [{ portalSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetAdminRecordQuotaRequest' }
      responses:
        '200':
          description: Updated record quota
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordQuota' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/users/{id}/record-grants:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/UserId' } }
    put:
      tags: [Admin]
      operationId: setAdminRecordGrant
      summary: Grant or revoke one record capability for an active administrator
      description: Requires a super administrator session. Grants do not enable user consent. Changes are audited in the same database transaction.
      security: [{ portalSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetAdminRecordGrantRequest' }
      responses:
        '200':
          description: Updated capability grant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordAdminGrant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/users/{id}/records:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/UserId' } }
    get:
      tags: [Admin]
      operationId: listAdminUserRecords
      summary: List consented record and sample metadata
      description: Requires the caller's view grant and current enabled consent for each returned purpose. Payloads and attachments are never included.
      security: [{ portalSession: [] }]
      parameters:
        - { name: purpose, in: query, schema: { $ref: '#/components/schemas/RecordPurpose' } }
        - { name: before_id, in: query, schema: { $ref: '#/components/schemas/RecordId' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Page of record metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/users/{id}/records/{record_id}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/UserId' } }
      - { name: record_id, in: path, required: true, schema: { $ref: '#/components/schemas/RecordId' } }
    get:
      tags: [Admin]
      operationId: getAdminUserRecord
      summary: Read one record body with the view capability
      description: Requires the caller's view grant and the current enabled consent. Returns only valid JSON that passes the secret-format check; denied payloads are not returned.
      security: [{ portalSession: [] }]
      responses:
        '200':
          description: Record metadata and JSON payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Admin]
      operationId: requestAdminUserRecordDelete
      summary: Request deletion of a record using the delete capability
      description: Creates an idempotent deletion tombstone. The record and dedicated attachments are removed asynchronously; the request and completion are audited without content.
      security: [{ portalSession: [] }]
      responses:
        '202':
          description: Deletion tombstone
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordDeleteTombstone' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/users/{id}/records/{record_id}/attachments:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/UserId' } }
      - { name: record_id, in: path, required: true, schema: { $ref: '#/components/schemas/RecordId' } }
    get:
      tags: [Admin]
      operationId: listAdminUserRecordAttachments
      summary: List attachment metadata with attachment capability
      security: [{ portalSession: [] }]
      responses:
        '200':
          description: Attachment metadata only
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordAttachmentPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/users/{id}/records/{record_id}/attachments/{attachment_id}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/UserId' } }
      - { name: record_id, in: path, required: true, schema: { $ref: '#/components/schemas/RecordId' } }
      - { name: attachment_id, in: path, required: true, schema: { $ref: '#/components/schemas/RecordAttachmentId' } }
    get:
      tags: [Admin]
      operationId: downloadAdminUserRecordAttachment
      summary: Download one attachment with attachment capability
      description: Requires both view and attachment grants plus current consent. Content is an attachment with nosniff and private no-store headers.
      security: [{ portalSession: [] }]
      responses:
        '200':
          description: Dedicated record attachment bytes
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/users/{id}/records/{record_id}/export:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/UserId' } }
      - { name: record_id, in: path, required: true, schema: { $ref: '#/components/schemas/RecordId' } }
    get:
      tags: [Admin]
      operationId: exportAdminUserRecord
      summary: Export one record after a strict JSON and secret-format check
      description: Requires the caller's export grant and current enabled consent. The export must be valid JSON, may not contain known credential fields, common credential formats, or Vault markers, and is returned with a safe generated filename. Use local synthetic records for acceptance.
      security: [{ portalSession: [] }]
      responses:
        '200':
          description: Safe JSON attachment
          content:
            application/json:
              schema: {}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/capacity:
    get:
      tags: [Admin]
      operationId: getCapacity
      summary: Get configured and allocated cluster capacity
      security:
        - portalSession: []
      responses:
        '200':
          description: Capacity and host counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Capacity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/overview:
    get:
      tags: [Admin]
      operationId: getAdminOverview
      summary: Get capacity, local Hub presence, Agent runtime state, and readiness
      description: Online installations are counted in this Portal process only. Host and Agent states are separate sources. Readiness failure details are intentionally summarized to avoid exposing infrastructure addresses.
      security: [{ portalSession: [] }]
      responses:
        '200':
          description: Current management overview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOverview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/model-connections:
    get:
      tags: [Admin]
      operationId: listAdminModelConnections
      summary: List shared platform model connections without secrets
      security: [{ portalSession: [] }]
      responses:
        '200':
          description: Shared platform model connections
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelConnectionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/usage:
    get:
      tags: [Admin]
      operationId: getAdminUsage
      summary: Aggregate model calls and tokens from the existing ledger
      description: Counts ledger rows by created_at. Input and output tokens include settled rows only. Active accounts are distinct owners with any ledger row in range. This is a read-only aggregate and does not create or charge a second ledger.
      security: [{ portalSession: [] }]
      parameters:
        - { name: days, in: query, schema: { type: integer, enum: [7, 30, 90], default: 7 } }
      responses:
        '200':
          description: Ledger usage for the requested trailing period
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUsage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/quality:
    get:
      tags: [Admin]
      operationId: getAdminQuality
      summary: Report whether a consented quality sample source is available
      description: Does not inspect conversation content. Returns unavailable until a separately consented quality sample source is configured.
      security: [{ portalSession: [] }]
      parameters:
        - { name: days, in: query, schema: { type: integer, enum: [7, 30, 90], default: 7 } }
      responses:
        '200':
          description: Quality source availability for the requested period
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminQuality' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/activity:
    get:
      tags: [Admin]
      operationId: getAdminActivity
      summary: Aggregate Hub operations, task events, and audit action counts
      description: Returns counts by day and whitelisted category only. It excludes content, IP, user and installation identifiers, request hashes, and audit details.
      security: [{ portalSession: [] }]
      parameters:
        - { name: days, in: query, schema: { type: integer, enum: [7, 30, 90], default: 7 } }
      responses:
        '200':
          description: Aggregated activity for the requested period
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminActivity' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/places:
    get:
      tags: [Admin]
      operationId: getAdminPlaces
      summary: Report whether an approved aggregated location source is available
      description: Does not infer location from IP or collect new device location data.
      security: [{ portalSession: [] }]
      parameters:
        - { name: days, in: query, schema: { type: integer, enum: [7, 30, 90], default: 7 } }
      responses:
        '200':
          description: Place aggregation source availability for the requested period
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPlaces' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/controls:
    get:
      tags: [Admin]
      operationId: getAdminControls
      summary: List notify-only threshold rules and local notifications
      description: Rules can only create notifications in the local database receiver. Global signup, sync, allowance, and device controls are not exposed.
      security: [{ portalSession: [] }]
      responses:
        '200':
          description: Rule configuration and aggregate account count
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminControls' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/controls/rules:
    post:
      tags: [Admin]
      operationId: createAdminControlRule
      summary: Create a local notification threshold rule
      security: [{ portalSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAdminControlRuleRequest' }
      responses:
        '201':
          description: Created threshold rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminControlRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/controls/rules/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    put:
      tags: [Admin]
      operationId: updateAdminControlRule
      summary: Compare-and-set a local notification threshold rule
      security: [{ portalSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAdminControlRuleRequest' }
      responses:
        '200':
          description: Updated threshold rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminControlRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Admin]
      operationId: deleteAdminControlRule
      summary: Delete a threshold rule using its current version
      security: [{ portalSession: [] }]
      parameters:
        - { name: expected_version, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '204': { description: Rule deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/controls/evaluate:
    post:
      tags: [Admin]
      operationId: evaluateAdminControls
      summary: Manually evaluate enabled account-count rules
      description: Evaluation records local notifications only and is idempotent for already-fired rules.
      security: [{ portalSession: [] }]
      responses:
        '200':
          description: Evaluation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminControlEvaluation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/controls/notify-test:
    post:
      tags: [Admin]
      operationId: adminControlNotifyTest
      summary: Write a test event to the local notification receiver
      description: This does not send email, network traffic, or external notifications.
      security: [{ portalSession: [] }]
      responses:
        '200':
          description: Local notification test result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminControlNotifyTest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/stats:
    get:
      tags: [Admin]
      operationId: getAdminStats
      summary: Aggregate account, client platform, and signup cohort counts
      description: Platform activity uses an unrevoked, unexpired installation with last_used_at in the trailing 30 days. Signup cohort activation means an account ever had an installation, not retention. Client versions are not stored in the current schema.
      security: [{ portalSession: [] }]
      responses:
        '200':
          description: Current platform statistics and the latest 12 signup weeks
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/users/{id}/installations:
    get:
      tags: [Admin]
      operationId: listAdminUserInstallations
      summary: List paginated installations associated with a user
      description: Returns installation metadata only; credentials are never included. Online presence is local to this Portal process.
      security: [{ portalSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/UserId' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 } }
      responses:
        '200':
          description: User installations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminInstallationPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/users/{id}/authorizations:
    get:
      tags: [Admin]
      operationId: listAdminUserAuthorizations
      summary: List paginated client authorizations attributed to a user
      description: Only authorizations with an owner association are returned. User codes, credential hashes, and token material are never returned.
      security: [{ portalSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/UserId' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 } }
      responses:
        '200':
          description: User-associated client authorizations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAuthorizationPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/users/{id}/model-usage/ledger:
    get:
      tags: [Admin]
      operationId: listAdminUserModelCalls
      summary: List paginated model ledger rows for a user
      description: Returns model identifiers, state, token counts and timestamps only. Request digests and request or response content are never returned.
      security: [{ portalSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/UserId' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 } }
      responses:
        '200':
          description: Existing model call ledger rows
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminModelCallPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/model-usage/unknown:
    get:
      tags: [Admin]
      operationId: listUnknownModelUsage
      summary: List model calls with unknown provider usage
      description: Requires an approved administrator's unbound Portal session. Entries are oldest first, at most 100 at a time. Dispatched calls that may still be running are excluded.
      security: [{ portalSession: [] }]
      parameters:
        - { name: owner_id, in: query, schema: { $ref: '#/components/schemas/UserId' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
      responses:
        '200':
          description: Unknown calls; no prompt, response, or credential is returned.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [owner_id, source, call_id, model_id, provider_model, reserved_tokens, created_at, unknown_at]
                      properties:
                        owner_id: { $ref: '#/components/schemas/UserId' }
                        source: { type: string, enum: [client, chat, task, route, probe, compaction] }
                        call_id: { type: string }
                        model_id: { type: string }
                        provider_model: { type: string }
                        task_id: { type: string }
                        reserved_tokens: { type: integer, format: int64, minimum: 1 }
                        created_at: { type: string, format: date-time }
                        unknown_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/model-usage/reconcile:
    post:
      tags: [Admin]
      operationId: reconcileUnknownModelUsage
      summary: Record provider-verified usage for an unknown model call
      description: An approved administrator verifies the provider's counts before submitting them. The ledger, associated server Task usage and audit record commit atomically. Only unknown calls can be reconciled. A repeat by the same administrator with identical counts and evidence is idempotent; different submissions conflict. This does not restore an unpersisted model response or restart the call.
      security: [{ portalSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [owner_id, source, call_id, input_tokens, output_tokens, evidence]
              properties:
                owner_id: { $ref: '#/components/schemas/UserId' }
                source: { type: string, enum: [client, chat, task, route, probe, compaction] }
                call_id: { type: string, minLength: 8, maxLength: 128 }
                input_tokens: { type: integer, format: int64, minimum: 0 }
                output_tokens: { type: integer, format: int64, minimum: 0 }
                evidence:
                  type: string
                  minLength: 8
                  maxLength: 512
                  description: Provider reference and verification explanation, at least 8 characters and at most 512 UTF-8 bytes after trimming; omit secrets and request/response content. Saved in the administrator audit record.
      responses:
        '200':
          description: Usage reconciled or an identical prior submission replayed.
          content:
            application/json:
              schema:
                type: object
                required: [replayed]
                properties:
                  replayed: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/users/{id}/model-usage-budget:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/UserId' } }
    get:
      tags: [Admin]
      operationId: getModelAccountBudget
      summary: Get a user's platform model budget and current use
      security: [{ portalSession: [] }]
      responses:
        '200':
          description: Configured budget and usage; an unconfigured account has zero limits and cannot call platform models.
          content:
            application/json:
              schema:
                type: object
                required: [owner_id, configured, token_limit, max_concurrent, used_tokens, in_flight, has_unknown]
                properties:
                  owner_id: { $ref: '#/components/schemas/UserId' }
                  configured: { type: boolean }
                  token_limit: { type: integer, format: int64, minimum: 0 }
                  max_concurrent: { type: integer, minimum: 0, maximum: 100 }
                  used_tokens: { type: integer, format: int64, minimum: 0, description: Settled usage plus current reservations and unknown calls. }
                  in_flight: { type: integer, minimum: 0 }
                  has_unknown: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [Admin]
      operationId: setModelAccountBudget
      summary: Set a user's platform model budget
      description: Requires an approved administrator's unbound Portal session. Lowering a limit below current usage does not cancel dispatched calls; it blocks new reservations until usage is below the limit. Every update is audited.
      security: [{ portalSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token_limit, max_concurrent]
              properties:
                token_limit: { type: integer, format: int64, minimum: 1 }
                max_concurrent: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Updated budget and current usage.
          content:
            application/json:
              schema:
                type: object
                required: [owner_id, configured, token_limit, max_concurrent, used_tokens, in_flight, has_unknown]
                properties:
                  owner_id: { $ref: '#/components/schemas/UserId' }
                  configured: { type: boolean }
                  token_limit: { type: integer, format: int64, minimum: 0 }
                  max_concurrent: { type: integer, minimum: 0, maximum: 100 }
                  used_tokens: { type: integer, format: int64, minimum: 0 }
                  in_flight: { type: integer, minimum: 0 }
                  has_unknown: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/admin/audit:
    get:
      tags: [Admin]
      operationId: listAuditLogs
      summary: Search audit records
      security:
        - portalSession: []
      parameters:
        - { name: actor, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: target, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: Audit records ordered newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditLog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /mcp:
    post:
      tags: [MCP]
      operationId: mcpPost
      summary: MCP Streamable HTTP request
      description: Authenticates with a platform API key (`chk_`) using Bearer authorization.
      security:
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: MCP JSON-RPC response or event stream
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
            text/event-stream:
              schema: { type: string }
        '202': { description: Notification accepted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
    get:
      tags: [MCP]
      operationId: mcpGet
      summary: MCP Streamable HTTP event stream
      security:
        - bearerToken: []
      responses:
        '200':
          description: MCP event stream
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [MCP]
      operationId: mcpDelete
      summary: Close an MCP Streamable HTTP session
      security:
        - bearerToken: []
      responses:
        '200': { description: Session closed }
        '204': { description: Session closed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /healthz:
    get:
      tags: [Health]
      operationId: healthz
      summary: Process liveness check
      description: Does not check external dependencies.
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            text/plain:
              schema: { type: string, const: ok }
  /readyz:
    get:
      tags: [Health]
      operationId: readyz
      summary: Dependency readiness check
      security: []
      responses:
        '200': { description: Database and configured orchestrators are ready }
        '503': { description: A required dependency is unavailable }
components:
  securitySchemes:
    fileFetchTicket:
      type: http
      scheme: bearer
      bearerFormat: 32-byte canonical unpadded base64url ticket
      description: Short-lived server-generated ticket accepted only on Task file.fetch manifest, chunk, and commit routes; it is not a Portal session or client credential.
    portalSession:
      type: apiKey
      in: cookie
      name: ch_portal
    hostCookie:
      type: apiKey
      in: cookie
      name: ch_host
      description: Host-scoped session cookie issued when entering the current Host.
    taskReadCookie:
      type: apiKey
      in: cookie
      name: ch_task_read
      description: Separate short-lived, single-task read-only Workbench cookie. It is accepted only for Workbench static assets and the explicit Task observation snapshot/events GET routes.
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: chk_, chd_, or chc_
      description: Bearer platform API key (`chk_`), scoped sync credential (`chd_`), or restricted client credential (`chc_`).
    clientCredential:
      type: http
      scheme: bearer
      bearerFormat: chc_
      description: Native desktop/mobile client credential. It cannot access administrator or API-key management routes.
    hostReplicaBootstrap:
      type: http
      scheme: bearer
      bearerFormat: morde-replica-v1
      description: Host-generation-scoped bootstrap credential used only to read binding snapshots and report applied revisions.
  parameters:
    HostId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/HostId' }
    TokenId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/TokenId' }
    WorkspaceId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/WorkspaceId' }
    SiteId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/SiteId' }
    SiteReleaseId:
      name: release_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/SiteReleaseId' }
    ModelConnectionId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ModelConnectionId' }
    MCPConnectorId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/MCPConnectorId' }
    ProjectMCPConnectorId:
      name: connector_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/MCPConnectorId' }
    NotificationId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/NotificationId' }
    ProjectId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ProjectId' }
    ProjectConversationId:
      name: conversation_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ConversationId' }
    ProjectInvitationId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ProjectInvitationId' }
    ProjectMemberUserId:
      name: user_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/UserId' }
    ProjectWorkItemId:
      name: work_item_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ProjectWorkItemId' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Reuse only for an exact retry of the same operation and normalized request.
      schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._~-]+$' }
    ServiceInstanceID:
      name: X-Morde-Service-Instance-ID
      in: header
      required: true
      description: Current service instance UUID; a mismatch fails without writing.
      schema: { type: string, format: uuid }
    OptionalServiceInstanceID:
      name: X-Morde-Service-Instance-ID
      in: header
      required: false
      description: Required for outbox reconciliation, scoped conversation creation, and outbox personal-data writes; must be paired with X-Morde-Actor-ID.
      schema: { type: string, format: uuid }
    MessageActor:
      name: X-Morde-Actor-ID
      in: header
      required: true
      description: Original outbox account ID, which must match the authenticated account.
      schema: { $ref: '#/components/schemas/UserId' }
    OptionalMessageActor:
      name: X-Morde-Actor-ID
      in: header
      required: false
      description: Required for outbox reconciliation, scoped creation, and outbox personal-data writes; must match the authenticated account and be paired with the service instance header.
      schema: { $ref: '#/components/schemas/UserId' }
    PageLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    PageCursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous page.
      schema: { type: string, minLength: 1, maxLength: 1024 }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Authentication required or credential invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Insufficient role or failed request origin check
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found or not accessible
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: State, quota, capacity, idempotency, event cursor, or workspace conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RequestTooLarge:
      description: Request body exceeds configured size limit
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BadGateway:
      description: The configured model service returned an upstream error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    GatewayTimeout:
      description: The configured model service did not respond before the timeout
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServiceUnavailable:
      description: The model connection service is unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Request rate limit exceeded
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Error:
      description: Error response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ExecutionControlMutationRequest:
      type: object
      additionalProperties: false
      required: [expected_epoch]
      properties:
        expected_epoch: { type: integer, minimum: 1 }
    ExecutionControl:
      type: object
      additionalProperties: false
      required: [owner_id, state, epoch, pending_task_count, runtime, updated_at]
      properties:
        owner_id: { $ref: '#/components/schemas/UserId' }
        state: { type: string, enum: [enabled, stopping, disabled] }
        epoch: { type: integer, minimum: 1 }
        pending_task_count: { type: integer, minimum: 0 }
        runtime: { $ref: '#/components/schemas/ExecutionRuntime' }
        updated_at: { type: string, format: date-time }
    ExecutionRuntime:
      type: object
      additionalProperties: false
      required: [state, runtime_generation, max_concurrent_tasks, active_task_count]
      properties:
