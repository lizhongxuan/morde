    CreateModelConnectionRequest:
      type: object
      required: [name, base_url, model_name, api_key]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        base_url:
          type: string
          format: uri
          pattern: '^https://'
          description: HTTPS URL whose DNS host must be on the server's outbound allowlist.
        model_name: { type: string, minLength: 1, maxLength: 256 }
        context_window_tokens: { type: integer, minimum: 4096, maximum: 1000000, description: Verified model context capacity from the provider's model documentation; omitted means unknown and disables compaction. }
        api_key: { type: string, minLength: 1, maxLength: 4096, writeOnly: true }
        shared:
          type: boolean
          default: false
          description: Shared connections require an administrator; authorization is checked by the server.
      additionalProperties: false
    UpdateModelConnectionRequest:
      type: object
      required: [name, base_url, model_name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        base_url:
          type: string
          format: uri
          pattern: '^https://'
          description: HTTPS URL whose DNS host must be on the server's outbound allowlist.
        model_name: { type: string, minLength: 1, maxLength: 256 }
        context_window_tokens: { type: integer, minimum: 4096, maximum: 1000000, description: Verified model context capacity from the provider's model documentation; omitted preserves it only when the endpoint is unchanged. }
        api_key:
          type: string
          maxLength: 4096
          writeOnly: true
          description: Omit or send an empty string to keep the current key; a non-empty value replaces it.
      additionalProperties: false
    ModelConnectionCapabilities:
      type: object
      required: [text, text_stream, tools, vision]
      properties:
        text: { type: boolean }
        text_stream: { type: boolean, description: True only after an explicit successful SSE probe for the current connection version. False includes unknown or unsupported. }
        tools: { type: boolean }
        vision: { type: boolean }
        media_generation:
          type: object
          description: Optional verified server-managed output capabilities. A provider may advertise a modality only when it supplies a precise Token reservation upper bound, settleable actual Token usage, durable idempotent operation recovery, and confirmed cancellation; providers missing any of these remain disabled. Omitted or false means unavailable or unverified. Voice here means speech synthesis only; it does not enable audio input or cloud ASR.
          required: [image_generation, video_generation, speech_generation]
          properties:
            image_generation: { type: boolean }
            video_generation: { type: boolean }
            speech_generation: { type: boolean }
          additionalProperties: false
      additionalProperties: false
    ModelConnection:
      type: object
      required: [id, name, base_url, model_name, shared, has_api_key, capabilities, checked_at, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/ModelConnectionId' }
        name: { type: string }
        base_url: { type: string, format: uri }
        model_name: { type: string }
