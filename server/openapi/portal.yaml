      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProjectMemberRequest' }
      responses:
        '200':
          description: Updated member role and version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectMember' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Projects]
      operationId: removeProjectMember
      summary: Remove an accepted project member
      description: Owner only. Pending invitations use the separate invitation-revocation operation. The expected member version and idempotency key are checked atomically; active work must be reauthorized after removal.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RemoveProjectMemberRequest' }
      responses:
        '204': { description: Accepted project member removed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/projects/{id}/invitations/{invitation_id}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: invitation_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ProjectInvitationId' }
    delete:
      tags: [Projects]
      operationId: revokeProjectInvitation
      summary: Revoke a pending project invitation
      description: Owner only. The invitation must still be pending; expected_version and the idempotency key are checked atomically.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevokeProjectInvitationRequest' }
      responses:
        '204': { description: Pending invitation revoked }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/me/project-invitations:
    get:
      tags: [Projects]
      operationId: listMyProjectInvitations
      summary: List invitations addressed to the current user
      description: Only invitations for the authenticated account are returned.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/PageLimit' }
        - { $ref: '#/components/parameters/PageCursor' }
      responses:
        '200':
          description: Invitations addressed to the current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectInvitationPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /api/project-invitations/{id}/accept:
    parameters:
      - { $ref: '#/components/parameters/ProjectInvitationId' }
    post:
      tags: [Projects]
      operationId: acceptProjectInvitation
      summary: Accept an invitation addressed to the current user
      description: Acceptance is atomic and idempotent. A non-invitee cannot read or accept the invitation. Repeated acceptance does not create a second membership.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '201':
          description: Membership created from the accepted invitation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectMember' }
        '200':
          description: Exact idempotent replay of the accepted membership
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectMember' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/projects/{id}/owner-transfer:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    post:
      tags: [Projects]
      operationId: transferProjectOwner
      summary: Transfer ownership to an accepted member
      description: Current owner only. The target must already be an accepted member. The transfer atomically makes the target owner and the former owner a member, preserving exactly one owner.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferProjectOwnerRequest' }
      responses:
        '200':
          description: Project with the new owner and incremented version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/projects/{id}/resources:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      tags: [Projects]
      operationId: listProjectResources
      summary: List project resource associations visible to the current user
      description: Association does not grant Host or Workspace access. The server returns an associated resource ID only when the reader independently has current access to it.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/PageLimit' }
        - { $ref: '#/components/parameters/PageCursor' }
      responses:
        '200':
          description: Independently authorized project resource associations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectResourcePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Projects]
      operationId: addProjectResource
      summary: Associate an already accessible Host or Workspace with a project
      description: Owner only. The caller must already have independent access to the resource; linking it never grants resource permissions to project members.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectResourceMutationRequest' }
      responses:
        '201':
          description: Resource association created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectResource' }
        '200':
          description: Exact idempotent replay of the association
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectResource' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Projects]
      operationId: removeProjectResource
      summary: Remove a Host or Workspace association from a project
      description: Owner only. The request is version checked and idempotent; removing an association does not modify the resource or its permissions.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectResourceMutationRequest' }
      responses:
        '204': { description: Resource association removed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/projects/{id}/workspaces/{workspace_id}/manifest:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/WorkspaceId' }
    get:
      tags: [Projects]
      operationId: getProjectWorkspaceManifest
      summary: Read a project workspace directory snapshot
      description: Requires current project viewer membership, an active Workspace association, and independent current Workspace read permission. Returns only confirmed revision metadata and omits credential paths, file hashes, and block references.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - name: revision
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0, default: 0, description: Zero selects the current confirmed revision. }
        - name: prefix
          in: query
          required: false
          schema: { type: string, maxLength: 1024 }
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 512 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
      responses:
        '200':
          description: Sanitized Workspace directory metadata at a confirmed revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectWorkspaceManifest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/projects/{id}/conversations:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      tags: [Projects]
      operationId: listProjectConversations
      summary: List shared conversations available to project members
      description: Every request rechecks current project membership. Project conversation owner_id records who created the shared conversation; later message and Task actors are reported separately.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/PageLimit' }
        - { $ref: '#/components/parameters/PageCursor' }
      responses:
        '200':
          description: Shared project conversations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectConversationPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Projects]
      operationId: createProjectConversation
      summary: Create a shared conversation in a project
      description: Accepted project members may create a shared conversation. The creator remains conversation owner; this does not make them the project owner or a later Task initiator.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/OptionalServiceInstanceID' }
        - { $ref: '#/components/parameters/OptionalMessageActor' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectConversationRequest' }
      responses:
        '201':
          description: Project conversation created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectConversation' }
        '200':
          description: Exact idempotent replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectConversation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/projects/{id}/conversations/{conversation_id}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/ProjectConversationId' }
    get:
      tags: [Projects]
      operationId: getProjectConversation
      summary: Read a shared project conversation
      description: The current accepted project membership is checked on every read.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      responses:
        '200':
          description: Shared project conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectConversation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/projects/{id}/hosts/{host_id}/usage:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: host_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/HostId' }
    get:
      tags: [Projects]
      operationId: getProjectHostUsageReceipt
      summary: Get Host resource usage attributed to a project
      description: The caller's current accepted project membership is checked on every read and again in the usage query transaction. Only aggregate usage attributed to this project and Host is returned; raw samples, container identities, and Workspace attribution are omitted. Usage is unpriced.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      responses:
        '200':
          description: Aggregate project-attributed Host resource usage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectHostUsageReceipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/projects/{id}/conversations/{conversation_id}/tasks:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/ProjectConversationId' }
    get:
      tags: [Projects]
      operationId: listProjectConversationActiveTasks
      summary: List visible active tasks in a shared conversation
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/PageLimit' }
        - { $ref: '#/components/parameters/PageCursor' }
      responses:
        '200':
          description: Active task page and task event cursors
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationActiveTaskPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/projects/{id}/conversations/{conversation_id}/messages:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/ProjectConversationId' }
    get:
      tags: [Projects]
      operationId: listProjectConversationMessages
      summary: Read shared project conversation history
      description: Returns the single shared history for accepted project members. owner_id is the conversation creator; actor_id is the account that authored each message.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/PageLimit' }
        - { $ref: '#/components/parameters/PageCursor' }
        - { $ref: '#/components/parameters/OptionalServiceInstanceID' }
        - { $ref: '#/components/parameters/OptionalMessageActor' }
        - name: client_message_id
          in: query
          description: Reconcile a message submitted by the authenticated member in this conversation.
          schema: { type: string, pattern: '^[A-Za-z0-9._~-]{8,128}$' }
      responses:
        '200':
          description: Messages in chronological order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectConversationMessagePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Projects]
      operationId: acceptProjectConversationMessage
      summary: Accept a message in a shared project conversation
      description: Persists the member's message and routing receipt. Task selection and execution happen asynchronously after acceptance; this response does not require a Task to exist. The conversation owner remains the creator, while the caller is the message actor. The Idempotency-Key must equal client_message_id.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/ServiceInstanceID' }
        - { $ref: '#/components/parameters/MessageActor' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptConversationMessageRequest' }
      responses:
        '202':
          description: The shared message and routing receipt were durably accepted. A Task may be created later.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptedProjectConversationMessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/projects/{id}/conversations/{conversation_id}/message-uploads/{client_message_id}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/ProjectConversationId' }
      - name: client_message_id
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9._~-]{8,128}$' }
      - { $ref: '#/components/parameters/ServiceInstanceID' }
      - { $ref: '#/components/parameters/MessageActor' }
    put:
      tags: [Projects]
      operationId: initializeProjectConversationMessageUpload
      summary: Initialize or resume a long message
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationMessageUploadInit' }
      responses:
        '200':
          description: Upload state and received chunks; committed state contains the receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationMessageUpload' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
    get:
      tags: [Projects]
      operationId: getProjectConversationMessageUpload
      summary: Read upload progress
      security: [{ portalSession: [] }, { clientCredential: [] }]
      responses:
        '200':
          description: Upload state and received chunks; committed state contains the receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationMessageUpload' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/projects/{id}/conversations/{conversation_id}/message-uploads/{client_message_id}/chunks/{sequence}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/ProjectConversationId' }
      - name: client_message_id
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9._~-]{8,128}$' }
      - { $ref: '#/components/parameters/ServiceInstanceID' }
      - { $ref: '#/components/parameters/MessageActor' }
      - name: sequence
        in: path
        required: true
        schema: { type: integer, minimum: 0, maximum: 511 }
    put:
      tags: [Projects]
      operationId: putChunkProjectConversationMessageUpload
      summary: Idempotently store one 16 KiB byte chunk
      security: [{ portalSession: [] }, { clientCredential: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationMessageChunk' }
      responses:
        '204': { description: Chunk stored or exact retry accepted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/projects/{id}/conversations/{conversation_id}/message-uploads/{client_message_id}/commit:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/ProjectConversationId' }
      - name: client_message_id
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9._~-]{8,128}$' }
      - { $ref: '#/components/parameters/ServiceInstanceID' }
      - { $ref: '#/components/parameters/MessageActor' }
    post:
      tags: [Projects]
      operationId: commitProjectConversationMessageUpload
      summary: Atomically accept the verified message
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '202':
          description: Message durably accepted for routing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectConversationMessageEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/projects/{id}/conversations/{conversation_id}/messages/{message_id}/retry-processing:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/ProjectConversationId' }
      - name: message_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/MessageId' }
      - { $ref: '#/components/parameters/ServiceInstanceID' }
      - { $ref: '#/components/parameters/MessageActor' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [Projects]
      operationId: retryProjectConversationMessageProcessing
      summary: Retry processing of an accepted failed message
      description: Only the original actor may retry a failed message without a Task. Exact retries use the same key; unknown dispatched model calls are not blindly repeated.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      responses:
        '202': { description: Retry accepted or exact replay }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/projects/{id}/conversations/{conversation_id}/messages/{message_id}/attachments/{client_attachment_id}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/ProjectConversationId' }
      - { name: message_id, in: path, required: true, schema: { $ref: '#/components/schemas/MessageId' } }
      - { name: client_attachment_id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9._~-]{8,128}$' } }
      - { $ref: '#/components/parameters/ServiceInstanceID' }
      - { $ref: '#/components/parameters/MessageActor' }
    put:
      tags: [Projects]
      operationId: initializeProjectConversationAttachment
      summary: Initialize or resume an attachment declared by a project message
      description: The original sender and current project member can initialize the declared slot. Exact retries reuse its ID; changed metadata conflicts. Expired incomplete uploads can restart with the same metadata. This slot is its idempotency identity.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      requestBody:
        required: true
        content:
          application/json:
