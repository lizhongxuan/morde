      security: [{ portalSession: [] }, { clientCredential: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationMessageChunk' }
      responses:
        '204': { description: Chunk stored or exact retry accepted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/conversations/{id}/message-uploads/{client_message_id}/commit:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ConversationId' }
      - name: client_message_id
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9._~-]{8,128}$' }
      - { $ref: '#/components/parameters/ServiceInstanceID' }
      - { $ref: '#/components/parameters/MessageActor' }
    post:
      tags: [Tasks]
      operationId: commitConversationMessageUpload
      summary: Atomically accept the verified message
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '202':
          description: Message durably accepted for routing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationMessageEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: List the current user's cloud tasks
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/PageLimit' }
        - { $ref: '#/components/parameters/PageCursor' }
