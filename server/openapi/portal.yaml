          type: array
          maxItems: 16
          uniqueItems: true
          items: { $ref: '#/components/schemas/MCPConnectorId' }
        budget:
          oneOf:
            - { $ref: '#/components/schemas/TaskBudgetRequest' }
            - { type: 'null' }
    AppendConversationMessageResponse:
      type: object
