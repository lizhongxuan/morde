      required: [request_id, action, phase, failure_reason, expected_control_version, blocked_control_version, target_control_version, created_at, updated_at]
      properties:
        request_id: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$' }
        action: { type: string, enum: [take_over, release] }
        phase: { type: string, enum: [blocking, draining, drained, completed] }
        failure_reason:
          type: string
          enum: ['', audit_unavailable, task_snapshot_failed, runtime_unavailable, transition_persistence_failed, operations_pending, runtime_fence_mismatch, runtime_quiesce_failed, receipt_invalid, runtime_control_failed, invalid_action]
        expected_control_version: { type: integer, format: int64, minimum: 0 }
        blocked_control_version: { type: integer, format: int64, minimum: 0 }
        target_control_version: { type: integer, format: int64, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Workspace:
