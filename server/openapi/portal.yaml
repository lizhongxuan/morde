    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/ProjectMCPConnectorId' }
    put:
      tags: [Projects]
      operationId: grantProjectMCPConnector
      summary: Explicitly authorize a personal connector for a project
      description: The authenticated user must own the personal connector and be a current project member. expected_version 0 creates a grant; a current revoked version reauthorizes it. Only a non-secret connector reference and owner authorization are stored.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectMCPConnectorGrantRequest' }
      responses:
