      - { name: content_revision, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      - { name: row_id, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
    put:
      tags: [Projects]
      operationId: updateProjectContentRowComment
      summary: Update a comment with a compare-and-swap base version
      description: Accepted project members only. A stale base_version returns conflict; the comment remains pinned to its original content revision and row.
