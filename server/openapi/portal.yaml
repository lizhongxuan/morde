openapi: 3.1.0
info:
  title: Morde Portal and Host Gateway API
  version: 1.0.0
  description: Portal API, Host Gateway API, and platform MCP endpoint. Portal API keys are sent as bearer credentials; Host Gateway operations use the host-scoped ch_host cookie, while the Task observation routes use a separate narrowly scoped ch_task_read cookie.
servers:
  - url: https://{portal}
    variables:
      portal:
        default: portal.morde.test
        description: Replace with the configured portal host.
tags:
  - name: Auth
    description: Portal login and session management.
  - name: Portal
    description: Current user and read-only portal resources.
  - name: Hosts
    description: Host lifecycle.
  - name: Host sharing
    description: Owner-managed member grants and member-only desktop observation.
  - name: Host Gateway
    description: Owner-only host-scoped applications and runtime controls.
  - name: Workspaces
    description: Independent workspace metadata, immutable file revisions, and resumable synchronization.
  - name: Runtime
    description: Host-scoped durable Runtime operation ledger.
  - name: Sites
    description: Owner-managed immutable Site candidates; runtime publication remains gated.
  - name: Tokens
    description: Platform API keys.
  - name: Devices
    description: Client installations with Hub presence and workspace synchronization device bindings.
  - name: Clients
    description: Desktop and mobile client installations authorized by account login.
  - name: Hub
    description: Installation-bound realtime presence and request routing for a user's own devices.
  - name: Personal Data
    description: Owner-scoped personal-data objects, attachments, quotas, snapshots, and incremental change metadata.
  - name: Projects
    description: Shared project membership, approved resources, project content, work items, and budget metadata.
  - name: Models
    description: Session-managed model connections and capability checks.
  - name: Instant Chat compatibility
    description: Temporary legacy routes backed by the canonical durable Task and Conversation services.
  - name: Notifications
    description: In-app notifications for Portal sessions and native client credentials.
  - name: Admin
    description: Administrative operations.
  - name: MCP
    description: Platform MCP endpoint and account-owned third-party connector management.
  - name: Health
    description: Process and dependency health checks.
security:
  - portalSession: []
  - bearerToken: []
paths:
  /api/capabilities:
    get:
      tags: [Portal]
      operationId: getCapabilities
      summary: Discover this Morde service before login
      description: The persisted service identifier partitions client data across installations. A null protocol or minimum version means it is not declared, not that an unfinished capability is available. Only assembled capabilities are listed. The default request size has route-specific exceptions. task_media_generation is present only when server-managed image/video/speech generation, token reservation and settlement, durable idempotent provider-operation recovery, owner-authorized preview, save confirmation, and verified Workspace artifact publication are all assembled. Task media inputs and cloud speech recognition are not included.
      security: []
      responses:
        '200':
          description: Public service identity and supported capabilities
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [service_instance_id, api_version, hub_version, event_version, minimum_client_version, supported_features, default_max_request_bytes]
                properties:
                  service_instance_id: { type: string, format: uuid }
                  api_version: { type: string }
                  hub_version: { type: [string, 'null'] }
                  event_version: { type: [string, 'null'] }
                  minimum_client_version: { type: [string, 'null'] }
                  supported_features:
                    type: array
                    description: An absent feature is unavailable or not yet declared. conversation_auto_routing_v1 means personal and project conversation messages can be durably accepted before asynchronous relationship classification and task execution; task_api means conversation and Task endpoints are assembled and may accept durable queued work; cloud_tasks means those client endpoints and cloud execution control are assembled; task_media_generation means server-managed image, video and speech generation plus token reservation/settlement, durable idempotent provider-operation recovery, owner-authorized preview, explicit save confirmation and verified Workspace artifact publication are assembled; project_budget_execution means project conversation, cloud Task, configured project model rates, platform-model project/account budget reservation and settlement, and work-item delivery evidence validation are assembled; hub means the installation-bound realtime endpoint is assembled; personal_sync means the snapshot and change-feed services for supported personal objects and schedules are assembled. Native login clients must require ordered_client_login before sending account credentials; the older client_login feature is no longer advertised.
                    items: { type: string }
                  default_max_request_bytes: { type: integer, format: int64, minimum: 1 }
        '503': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /api/hub:
    get:
      tags: [Hub]
      operationId: connectHub
      summary: Open an installation-bound Hub WebSocket
      description: |-
        Upgrade this request to a WebSocket using an active restricted client credential (`chc_`) in the Authorization header. Query parameters are rejected. If an Origin header is present, its scheme must be HTTP or HTTPS and its host must exactly match the configured Portal host. The first client text frame must be `{"type":"hello"}`; the server replies with `welcome` containing the authenticated installation ID, the user's bounded device presence list, a 65536-byte frame limit, and server time. Presence is advisory.

        Client frames are strict JSON objects: `ping` and `devices` contain only `type`; `call` contains `type`, a 4–80 character `id` using only ASCII letters, digits, `.`, `_`, `:`, or `-`, a same-account installation ID in `to`, `action`, and object `args`; `result` contains `type`, `id`, `ok`, and, on success, an action-shaped object `body`, or on failure a bounded `error`; `cancel` contains only `type` and `id`. The supported actions are `info` (no arguments; result contains bounded `name`, `platform`, `os`, `version`, and `actions` metadata), `open` (`{"url":"https://…"}` only; success result is `{"opened":true}`), and `notify` (`{"title":"…","text":"…"}`; success result is `{"notified":true}`). The server relays calls only between active installations owned by the same authenticated user. Calls time out after 30 seconds; an unknown result is not reported as success. The server sends `welcome`, `devices` (up to 256 entries), `pong`, `call`, `result`, `cancel`, `cancel_pending`, and bounded `error` frames.
      security:
        - clientCredential: []
      responses:
        '101': { description: WebSocket connection established; subsequent traffic follows the Hub frame contract in this operation's description. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /api/model/v1/chat/completions:
    post:
      tags: [Models]
      operationId: createPlatformChatCompletion
      summary: Run one model inference
      description: Requires a user Session or installation-bound Client and an Idempotency-Key. Shared platform models require a configured account model budget; caller-owned personal models do not consume it. This endpoint returns tool calls without executing them. It supports text, inline base64 images, function tools, temperature and text streaming; unsupported options such as stop sequences, remote image URLs and forced tool choice are rejected. A repeated call is not dispatched again; if its result was not saved by the caller, reconcile instead of retrying with a new key. No complete request or response is retained by the model ledger.
      security: [{ portalSession: [] }, { bearerToken: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [model, messages]
              properties:
                model: { $ref: '#/components/schemas/ModelConnectionId' }
                messages:
                  type: array
                  minItems: 1
                  maxItems: 128
                  items:
                    type: object
                    additionalProperties: false
                    required: [role]
                    properties:
                      role: { type: string, enum: [system, developer, user, assistant, tool] }
                      content:
                        oneOf:
                          - { type: string }
                          - { type: 'null' }
                          - type: array
                            items:
                              type: object
                              additionalProperties: false
                              required: [type]
                              properties:
                                type: { type: string, enum: [text, image_url] }
                                text: { type: string }
                                image_url:
                                  type: object
                                  additionalProperties: false
                                  required: [url]
                                  properties:
                                    url: { type: string, description: 'Inline data:image/...;base64 URL only.' }
                                    detail: { type: string, enum: [auto] }
                      tool_call_id: { type: string }
                      tool_calls:
                        type: array
                        items: { $ref: '#/components/schemas/ModelGatewayToolCall' }
                tools:
                  type: array
                  items: { $ref: '#/components/schemas/ModelGatewayTool' }
                tool_choice: { type: string, enum: [auto] }
                stream: { type: boolean }
                stream_options:
                  type: object
                  additionalProperties: false
                  properties:
                    include_usage: { type: boolean }
                max_tokens: { type: integer, minimum: 1, maximum: 32768 }
                max_completion_tokens: { type: integer, minimum: 1, maximum: 32768 }
                temperature: { type: number, minimum: 0, maximum: 2 }
      responses:
        '200':
          description: OpenAI-compatible completion or SSE chunks ending with DONE. Missing provider usage or over-budget usage is recorded and returned as an error; a partially emitted stream has an error event and no DONE marker.
          content:
            application/json:
              schema:
                type: object
                required: [id, object, created, model, choices, usage]
                properties:
                  id: { type: string }
                  object: { const: chat.completion }
                  created: { type: integer, format: int64 }
                  model: { $ref: '#/components/schemas/ModelConnectionId' }
                  choices:
                    type: array
                    items:
                      type: object
                      required: [index, message, finish_reason]
                      properties:
                        index: { const: 0 }
                        finish_reason: { type: string, enum: [stop, tool_calls, length, content_filter] }
                        message:
                          type: object
                          required: [role, content]
                          properties:
                            role: { const: assistant }
                            content: { type: string }
                            tool_calls: { type: array, items: { $ref: '#/components/schemas/ModelGatewayToolCall' } }
                  usage:
                    oneOf:
                      - { type: 'null' }
                      - type: object
                        required: [prompt_tokens, completion_tokens, total_tokens]
                        properties:
                          prompt_tokens: { type: integer, format: int64, minimum: 0 }
                          completion_tokens: { type: integer, format: int64, minimum: 0 }
                          total_tokens: { type: integer, format: int64, minimum: 0 }
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in to the portal
      description: Sets the ch_portal session cookie only for approved accounts. Login attempts are rate limited. Correct credentials for pending, rejected, or disabled accounts return the matching account status without a session. The default admin/admin credential is accepted only from a loopback client and receives a restricted password-change session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated user
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register a standard user account
      description: Requires only a username and password; an optional invite_code is attribution-only and no SMS step is used. Creates a pending user account with role=user, is rate limited, and does not create a login session. The name admin is reserved case-insensitively.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Registered user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current portal session or installed client
      description: A browser session revokes itself. An installation-bound Web session revokes its entire installation, including Client, Sync, Web, ticket and Gateway access.
      security:
        - portalSession: []
      responses:
        '204': { description: Session revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /api/auth/client-login:
    post:
      tags: [Clients]
      operationId: clientLogin
      summary: Log in on a native client
      description: Approved accounts sign in with name and password. Desktop and iOS clients must first require ordered_client_login from /api/capabilities. Each ordered network attempt has a new Idempotency-Key and a strictly increasing attempt_generation persisted by the client before sending. The service binds client_instance_id to one installation and rejects stale generations. A retry after an unknown result increments the generation; the prior response may then contain a revoked credential and must be discarded. Revoked installations cannot be restored by a late login. For source compatibility only, Android requests that omit both ordered fields continue using the legacy server-ordered path; it is not advertised as a capability and does not fence delayed client intents. Legacy same-key Android retries rotate credentials on the same installation. A desktop login atomically issues installation-bound Client, Sync and user Web credentials; mobile login issues only Client. No portal cookie is set.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientLoginRequest' }
      responses:
        '200':
          description: Installation and credentials returned once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientLoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/auth/client-web-session:
    post:
      tags: [Clients]
      operationId: renewClientWebSession
      summary: Renew an installed desktop or iOS user Web session
      description: Requires an active desktop or iOS Client bearer credential. The returned Session is installation-bound, has at most one hour of life, and cannot access Admin routes. Android support is unchanged.
      security: [{ bearerToken: [] }]
      responses:
        '200':
          description: New installation-bound Web session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientWebSessionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /api/auth/client-logout:
    post:
      tags: [Clients]
      operationId: clientLogout
      summary: Revoke the current native client installation
      security: [{ bearerToken: [] }]
      responses:
        '204': { description: Installation and all bound credentials revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /api/auth/client-schedule-grant:
    post:
      tags: [Clients]
      operationId: issueClientScheduleGrant
      summary: Issue an installation-bound cloud schedule credential
      description: Requires the regular native Client credential for the active installation. Returns a separate 12-hour credential restricted to schedule read and management routes; it never grants direct task scopes and is stored by the native client in its credential store.
      security: [{ clientCredential: [] }]
      responses:
        '200':
          description: Credential returned once for the current installation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientScheduleGrantResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Clients]
      operationId: revokeClientScheduleGrant
      summary: Revoke cloud schedule credentials for the current installation
      description: Requires the regular native Client credential; revokes all schedule grants belonging to this installation without revoking the installation itself or cancelling tasks already accepted by the scheduler.
      security: [{ clientCredential: [] }]
      responses:
        '204': { description: Schedule grants revoked for the current installation }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/me:
    get:
      tags: [Portal]
      operationId: getMe
      summary: Get the current user and quota usage
      security:
        - portalSession: []
        - bearerToken: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /api/me/invite-code:
    get:
      tags: [Portal]
      operationId: getMyInviteCode
      summary: Get or create the current user's invitation code
      description: Requires an approved Portal session. The code records signup attribution only; it grants no quota or reward and does not bypass administrator review.
      security: [{ portalSession: [] }]
      responses:
        '200':
          description: Invitation code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteCode' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/nudges:
    get:
      tags: [Admin]
      operationId: getPublicNudgePolicy
      summary: Read the explicitly enabled operational nudge
      description: Public read-only settings; disabled policies return no message or external link. No external integration is called by this endpoint.
      security: []
      responses:
        '200':
          description: Public nudge policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminNudgePolicy' }
        default: { $ref: '#/components/responses/Error' }
  /api/me/record-consents:
    get:
      tags: [Portal]
      operationId: listMyRecordConsents
      summary: Read independent full-record and training-sample consents
      security:
        - portalSession: []
        - bearerToken: []
      responses:
        '200':
          description: Current consent state; both purposes default to disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordConsents' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [Portal]
      operationId: setMyRecordConsent
      summary: Set one independent record-capture consent
      description: Consent is always account-owner controlled. Withdrawing a purpose rejects and clears its queued payloads; it does not delete already stored records.
      security:
        - portalSession: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetRecordConsentRequest' }
      responses:
        '200':
          description: Updated consent state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordConsent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /api/me/records:
    get:
      tags: [Portal]
      operationId: listMyRecords
      summary: List the current user's own record metadata
      description: Requires an approved Portal session. The owner may see metadata and request deletion even after withdrawing consent; payloads and attachments are never returned by this endpoint.
      security: [{ portalSession: [] }]
      parameters:
        - { name: purpose, in: query, schema: { $ref: '#/components/schemas/RecordPurpose' } }
        - { name: before_id, in: query, schema: { $ref: '#/components/schemas/RecordId' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Page of this account's record metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /api/me/record-captures:
    get:
      tags: [Portal]
      operationId: listMyRecordCaptureStatuses
      summary: List this account's Task record-capture statuses
      description: Requires the current account's Session or Client principal. Results are owner-scoped and contain queue metadata only; payloads, attachments, lease fields, and quota reservations are never returned. `queued` and `leased` mean pending; only `stored` means a durable record exists; `rejected` and `failed` are terminal capture failures with a bounded failure code. An empty page may mean capture consent is disabled or no Task capture was enqueued; read record consents for the opt-in state.
      security:
        - portalSession: []
        - bearerToken: []
      parameters:
        - { name: before_id, in: query, schema: { $ref: '#/components/schemas/RecordCaptureQueueId' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Page of this account's Task-linked capture statuses
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordCaptureStatusPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/me/records/{record_id}:
    parameters:
      - { name: record_id, in: path, required: true, schema: { $ref: '#/components/schemas/RecordId' } }
    delete:
      tags: [Portal]
      operationId: requestMyRecordDelete
      summary: Request deletion of one of the current user's records
      description: The Portal session owner may delete their own record without current capture consent. Creates an idempotent tombstone; the record and dedicated attachments are removed asynchronously. This endpoint cannot delete personal-data objects or business attachments.
      security: [{ portalSession: [] }]
      responses:
        '202':
          description: Deletion tombstone
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordDeleteTombstone' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/me/password:
    post:
      tags: [Auth]
      operationId: changeMyPassword
      summary: Change the current user's password
      description: Requires the current password. For the initial super administrator, this is the only mutation allowed until the password is changed. A successful change revokes every current session and requires logging in again.
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: Password changed and existing sessions revoked }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/me/preferences:
    get:
      tags: [Portal]
      operationId: getUserPreferences
      summary: Get the current user's assistant preferences
      security:
        - portalSession: []
      responses:
        '200':
          description: User preferences. Null identifiers mean no model or default host has been selected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPreferences' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [Portal]
      operationId: saveUserPreferences
      summary: Save the current user's assistant preferences
      description: Select only a model already checked and usable by this user. Empty strings clear optional values. API keys cannot manage portal preferences.
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveUserPreferencesRequest' }
      responses:
        '200':
          description: Saved preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPreferences' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/onboarding/status:
    get:
      tags: [Portal]
      operationId: getOnboardingStatus
      summary: Get model, computer, and next-step readiness for the current user
      description: Status comes from the existing model catalogue and HostService state. It does not expose Host state reasons, AIO credentials, or model API keys.
      security:
        - portalSession: []
      responses:
        '200':
          description: Onboarding readiness status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/me/default-host:
    post:
      tags: [Portal]
      operationId: ensureDefaultHost
      summary: Select, create, or restore the current user's default host
      description: Provide host_id to select one owned host. Without host_id, a single existing host is selected, a stopped default host is restored, or a host is created if none exists. Multiple unselected hosts return selection_required without choosing one. Concurrent first requests are serialized per user. Expected capacity and host lifecycle outcomes are returned as status values; internal host errors and credentials are never returned.
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnsureDefaultHostRequest' }
      responses:
        '200':
          description: Current default host action result and updated onboarding status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DefaultHostResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/templates:
    get:
      tags: [Portal]
      operationId: listTemplates
      summary: List available host templates
      responses:
        '200':
          description: Templates
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Template' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /api/hosts:
    get:
      tags: [Hosts]
      operationId: listHosts
      summary: List the current user's hosts
      description: Deleted hosts are omitted. Portal sessions and API keys see hosts currently accessible to the account; ownership and sharing are checked on each request.
      responses:
        '200':
          description: Hosts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Host' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Hosts]
      operationId: createHost
      summary: Create a host
      description: Returns immediately in the creating state; poll GET /api/hosts/{id} for completion. Every Host must bind exactly one owned, ready Workspace using workspace_ids; the same ownership and availability checks apply to Portal Sessions, API keys, and internal creation paths. Reuse the Idempotency-Key only to retry the exact normalized request.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateHostRequest' }
      responses:
        '201':
          description: Host accepted for asynchronous creation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Host' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        default: { $ref: '#/components/responses/Error' }
  /api/hosts/{id}:
    parameters:
      - $ref: '#/components/parameters/HostId'
    get:
      tags: [Hosts]
      operationId: getHost
      summary: Get a host
      description: Portal sessions follow account role and ownership; API keys require current account access to this host.
      responses:
        '200':
          description: Host
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Host' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Hosts]
      operationId: deleteHost
      summary: Delete a host
      description: API keys require current account ownership of this host. Host deletion unbinds every workspace and removes Host-only runtime data; independent workspace content is never deleted by this operation. A restore with an uncertain sandbox create is fenced from deletion until an operator reconciles the remote state.
      responses:
        '202':
          description: Host is being deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Host' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/hosts/{id}/usage:
    parameters:
      - $ref: '#/components/parameters/HostId'
    get:
      tags: [Hosts]
      operationId: getHostUsageReceipt
      summary: Get the current generation's Host resource usage receipt
      description: Host owners, administrators, and API keys with current host:read access can read aggregate CPU and estimated memory usage. This is an unpriced usage record, not an invoice; raw samples and container identities are not returned.
      responses:
        '200':
          description: Aggregate resource usage for the current Host runtime generation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostUsageReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/hosts/{id}/control:
    parameters:
      - $ref: '#/components/parameters/HostId'
    get:
      tags: [Hosts]
      operationId: getHostControl
      summary: Get the AI and user control state for a host
      description: Portal sessions with owner or Host-sharing observation access may inspect this Host. API keys require current account access to observe it. control_actor_user_id is empty when no active user lease exists; the active transition omits internal task snapshots and runtime receipts.
      responses:
        '200':
          description: Current control fence and active handoff, if any
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/hosts/{id}/release:
    parameters:
      - $ref: '#/components/parameters/HostId'
    post:
      tags: [Hosts]
      operationId: releaseHost
      summary: Release host compute while retaining data
      description: API keys require current account ownership of this host. The Host ID, owner, Workspace attachment, and runtime data volume are retained. Release is rejected while tasks or tool operations are active, a Host Workspace upload is uncommitted, a Host Workspace sync conflict remains, or user control is enabled. For these release conflicts, 409 details contain reason=host_release_uncommitted_sync, host_release_sync_conflict, or host_release_unsettled_operation and the validated workspace_id or task_id. A current-generation terminal session in creating, ready, or unknown state requires explicit confirmation that running shell processes may be terminated. Morde does not verify or explicitly kill GUI or PTY processes.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm_process_termination:
                  type: boolean
                  default: false
                  description: Accept that releasing the Host may terminate processes in an active terminal session. Omitted means false.
      responses:
        '202':
          description: Compute release is in progress
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Host' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/hosts/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/HostId'
    post:
      tags: [Hosts]
      operationId: restoreHost
      summary: Restore compute for a stopped host
      description: API keys require current account ownership of this host. Restore retains the Host ID, owner, Workspace, and runtime data volume, rotates the runtime credential, and advances one runtime generation. An uncertain sandbox create remains fenced for manual reconciliation.
      responses:
        '202':
          description: Restore is in progress or already underway
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Host' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/hosts/{id}/control/actions:
    parameters:
      - $ref: '#/components/parameters/HostId'
    post:
      tags: [Hosts]
      operationId: actOnHostControl
      summary: Hand control of a host between AI and the user
      description: The Host owner or a member with a control permission may take over when no active user lease exists. Release is limited to the current active holder or the Host owner. API keys require current account permission to operate this Host. Reuse the same request_id only to retry the exact same action with the same expected_control_version. A different active holder or stale version returns 409; pending runtime operations leave the Host fenced and return 202.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ControlActionRequest' }
      responses:
        '200':
          description: Handoff completed or accepted with no pending operations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlActionResponse' }
        '202':
          description: Handoff is waiting for active runtime operations to stop
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlActionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/hosts/{id}/control/lease/renew:
    parameters:
      - $ref: '#/components/parameters/HostId'
    post:
      tags: [Hosts]
      operationId: renewHostControlLease
      summary: Renew the active Host control lease
      description: The current Host owner or authorized control member may renew only their own active lease. The caller must provide the current control version; an expired or revoked lease cannot be revived. The response includes current actor, expiry and active state.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ControlLeaseRenewRequest' }
      responses:
        '200':
          description: Current control status after lease renewal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /__ch/api/applications:
    servers:
      - url: https://{host}
        variables:
          host:
            default: h1234567.hosts.morde.test
            description: Host-specific Gateway origin using the configured Host suffix.
    get:
      tags: [Host Gateway]
      operationId: getHostApplications
      summary: Get installed and installable applications on the current Host
      description: Host-owner session only. This Host Gateway route uses the host-scoped ch_host cookie and returns only fixed, validated application status and safe installation progress.
      security:
        - hostCookie: []
      responses:
        '200':
          description: Current Host runtime fence and fixed application catalog
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Pragma:
              schema: { type: string, const: no-cache }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostApplicationsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /__ch/task-auth:
    servers:
      - url: https://{host}
        variables:
          host:
            default: h1234567.hosts.morde.test
            description: Host-specific Gateway origin using the configured Host suffix.
    get:
      tags: [Host Gateway]
      operationId: exchangeTaskWorkbenchObservationTicket
      summary: Exchange a one-time Portal ticket for a short-lived Task-read cookie
      description: The opaque ticket is single-use and expires within 60 seconds. The Host Gateway redirects to a clean Workbench URL after setting a distinct HttpOnly, Secure, SameSite=Strict cookie scoped to /__ch/. The ticket value is never placed in a referrer or cacheable response.
      security: []
      parameters:
        - name: ticket
          in: query
          required: true
          schema: { type: string, minLength: 40, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
      responses:
        '303':
          description: Ticket exchanged; browser should follow the clean Workbench location.
          headers:
            Location:
              schema: { type: string }
              description: 'Clean `/__ch/wb/?task_id={task_id}` URL with no ticket query parameter.'
            Set-Cookie:
              schema: { type: string }
              description: Separate ch_task_read cookie; never a ch_host cookie.
            Cache-Control: { schema: { type: string, const: no-store } }
            Referrer-Policy: { schema: { type: string, const: no-referrer } }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /__ch/api/tasks/{task_id}:
    servers:
      - url: https://{host}
        variables:
          host:
            default: h1234567.hosts.morde.test
            description: Host-specific Gateway origin using the configured Host suffix.
    parameters:
      - name: task_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/TaskId' }
    get:
      tags: [Host Gateway]
      operationId: getWorkbenchTaskObservationSnapshot
      summary: Read a narrow, read-only Task observation snapshot
      description: Requires the distinct short-lived Task-read cookie. Returns only Task state, event sequence, timestamps, and verified artifact metadata. It excludes objective, result text, event payloads, file paths, and all mutation or Host-control capabilities. Authorization and Host runtime generation are rechecked per request.
      security: [{ taskReadCookie: [] }]
      responses:
        '200':
          description: Current safe Task observation projection
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Referrer-Policy: { schema: { type: string, const: no-referrer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskWorkbenchObservationSnapshot' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /__ch/api/tasks/{task_id}/events:
    servers:
      - url: https://{host}
        variables:
          host:
            default: h1234567.hosts.morde.test
            description: Host-specific Gateway origin using the configured Host suffix.
    parameters:
      - name: task_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/TaskId' }
    get:
      tags: [Host Gateway]
      operationId: streamWorkbenchTaskObservationEvents
      summary: Stream safe Task observation events
      description: Requires the distinct short-lived Task-read cookie. Each SSE event contains only sequence, fixed event type, and timestamp; event payloads are never returned. Task read authorization and Host generation are rechecked on each poll, so revoked access ends the stream.
      security: [{ taskReadCookie: [] }]
      parameters:
        - name: after
          in: query
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: Last-Event-ID
          in: header
          schema: { type: string, pattern: '^[0-9]+$' }
      responses:
        '200':
          description: Server-sent safe Task observation events; cursor expiry emits task.snapshot_required and closes the stream.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Referrer-Policy: { schema: { type: string, const: no-referrer } }
          content:
            text/event-stream:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /__ch/api/workspaces/{workspace_id}/diff:
    servers:
      - url: https://{host}
        variables:
          host:
            default: h1234567.hosts.morde.test
            description: Host-specific Gateway origin using the configured Host suffix.
    parameters:
      - name: workspace_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/WorkspaceId' }
    get:
      tags: [Host Gateway]
      operationId: getHostWorkspaceDiff
      summary: Compare two applied Workspace revisions from the Host owner Workbench
      description: Host owner ch_host cookie only; Host members with workspace:file:read cannot use this route. Requires an active, healthy, conflict-free binding whose desired and applied revision match the current confirmed revision. The bounded diff projection is the same as the Portal Workspace diff.
      security: [{ hostCookie: [] }]
      parameters:
        - name: from_revision
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
        - name: to_revision
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        '200':
          description: Bounded Workspace revision comparison
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceDiff' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        default: { $ref: '#/components/responses/Error' }
  /__ch/api/applications/{app_id}/install:
    servers:
      - url: https://{host}
        variables:
          host:
            default: h1234567.hosts.morde.test
            description: Host-specific Gateway origin using the configured Host suffix.
    parameters:
      - name: app_id
        in: path
        required: true
        schema: { type: string, const: wechat }
    post:
      tags: [Host Gateway]
      operationId: installHostApplication
      summary: Install the fixed WeChat application on the current Host
      description: Host-owner session only. The same request_id is safe to retry for the same install; callers cannot choose a package URL, version, command, or install path.
      security:
        - hostCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HostApplicationInstallRequest' }
      responses:
        '202':
          description: Installation accepted, running, complete, or failed with safe progress state
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Pragma:
              schema: { type: string, const: no-cache }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostApplicationInstallResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /__ch/api/applications/{app_id}/launch:
    servers:
      - url: https://{host}
        variables:
          host:
            default: h1234567.hosts.morde.test
            description: Host-specific Gateway origin using the configured Host suffix.
    parameters:
      - name: app_id
        in: path
        required: true
        schema: { type: string, const: wechat }
    post:
      tags: [Host Gateway]
      operationId: launchHostApplication
      summary: Launch an installed allowlisted application
      description: Owner-only fixed-catalog application operation; the current allowlist contains WeChat. launch_id is the idempotency key; after a request with that ID reaches the Server, retries reconcile its exact Runtime operation and never send another launch request.
      security:
        - hostCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HostApplicationLaunchRequest' }
      responses:
        '202':
          description: Launch accepted or its persisted status is unknown and can be reconciled by launch_id
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Pragma:
              schema: { type: string, const: no-cache }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostApplicationLaunchResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /__ch/api/applications/{app_id}/launches/current:
    servers:
      - url: https://{host}
        variables:
          host:
            default: h1234567.hosts.morde.test
            description: Host-specific Gateway origin using the configured Host suffix.
