        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/host-replicas/{host_id}/generations/{generation}/workspaces/{workspace_id}/bindings/{binding_version}/activate:
    parameters:
      - name: host_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/HostId' }
      - name: generation
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
      - name: workspace_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/WorkspaceId' }
      - name: binding_version
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    post:
      tags: [Workspaces]
      operationId: activateHostReplicaBinding
      summary: Activate a Host binding after its current revision is applied
      security:
        - hostReplicaBootstrap: []
      responses:
        '200':
          description: Active Host binding
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostReplicaBinding' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/host-replicas/{host_id}/generations/{generation}/workspaces/{workspace_id}/bindings/{binding_version}/detached:
    parameters:
      - name: host_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/HostId' }
      - name: generation
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
      - name: workspace_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/WorkspaceId' }
      - name: binding_version
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    post:
      tags: [Workspaces]
      operationId: completeHostReplicaUnbinding
      summary: Detach a Host replica after a stable live checkpoint
      security:
        - hostReplicaBootstrap: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [checkpoint_revision]
              properties:
                checkpoint_revision: { type: integer, format: int64, minimum: 0 }
              additionalProperties: false
      responses:
        '200':
          description: Detached binding after revision checks
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostReplicaBinding' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/hosts/{id}/workspace-bindings/{workspace_id}:
    parameters:
      - $ref: '#/components/parameters/HostId'
      - name: workspace_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/WorkspaceId' }
    delete:
      tags: [Hosts]
      operationId: unbindWorkspaceFromHost
      summary: Unbind a workspace while retaining its server content
      description: The caller must stop AI tools, IDEs, and other external writers and explicitly confirm that they have stopped. The runtime then blocks new Morde operations, waits for in-flight operations, syncs and verifies a stable checkpoint, and detaches the binding. The independent server workspace is retained; the detached Host copy remains on its volume.
      security:
        - portalSession: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_binding_version, writers_stopped]
              properties:
                expected_binding_version: { type: integer, format: int64, minimum: 1, description: Binding version observed by the caller; prevents a retry from affecting a later rebind. }
                writers_stopped: { type: boolean, enum: [true], description: 'Confirms the user has stopped external AI, IDE, and application processes that may write this workspace.' }
              additionalProperties: false
      responses:
        '202':
          description: Unbind accepted; status remains queryable from the Host binding list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceBinding' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/hosts/{id}/workspace-bindings/{workspace_id}/retry-sync:
    parameters:
      - $ref: '#/components/parameters/HostId'
      - name: workspace_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/WorkspaceId' }
    post:
      tags: [Hosts]
      operationId: retryHostWorkspaceSync
      summary: Resume a Host workspace live sync paused by conflict
      description: Requires the owning Portal session and a running Host. The expected binding version prevents a stale retry from affecting a later rebind. Repeating the request after a lost response is safe.
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_binding_version]
              properties:
                expected_binding_version: { type: integer, format: int64, minimum: 1 }
              additionalProperties: false
      responses:
        '200':
          description: Current binding after the retry signal was recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceBinding' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: List the current user's in-app notifications
      description: Portal sessions and native client credentials may read owner-wide notifications; API keys cannot. Related task content is redacted when current authorization no longer allows access. Marking read does not approve or execute an action.
      security:
        - portalSession: []
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - name: unread_only
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: In-app notification page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /api/notifications/{id}/read:
    parameters:
      - $ref: '#/components/parameters/NotificationId'
    post:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Mark a notification as read
      description: Portal sessions and native client credentials may mark a historical notification read. Idempotent; this does not execute any task action.
      security:
        - portalSession: []
        - bearerToken: []
      responses:
        '204': { description: Notification marked read or already read }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/apikeys:
    get:
      tags: [Tokens]
      operationId: listAPIKeys
      summary: List the current user's API keys
      security:
        - portalSession: []
      responses:
        '200':
          description: API keys without secret values
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/APIKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Tokens]
      operationId: createAPIKey
      summary: Create an API key
      description: Portal sessions only. The key is returned once. Each request uses the account's current permissions; disabled accounts and revoked sharing take effect immediately. Existing scoped keys are revoked during migration.
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAPIKeyRequest' }
      responses:
        '201':
          description: API key secret returned once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedAPIKey' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /api/instant-chat/conversations:
    get:
      tags: [Instant Chat compatibility]
      operationId: listInstantChatConversations
      summary: List conversations through the legacy instant chat route
      description: Returns the same durable Task-backed conversations as the canonical conversation API.
      security: [{ portalSession: [] }]
      responses:
        '200':
          description: Conversations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/InstantChatConversation' } }
        default: { $ref: '#/components/responses/Error' }
  /api/instant-chat/conversations/{id}/messages:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ConversationId' }
    get:
      tags: [Instant Chat compatibility]
      operationId: listInstantChatMessages
      summary: List conversation messages through the legacy instant chat route
      description: Returns the same persisted messages as the canonical conversation API.
      security: [{ portalSession: [] }]
      responses:
        '200':
          description: Messages
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/InstantChatMessage' } }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/instant-chat/messages:
    post:
      tags: [Instant Chat compatibility]
      operationId: sendInstantChatMessage
      summary: Submit a durable Task through the legacy reply shape
      description: Submits to the canonical Task and Conversation services, then waits for the Task's terminal result to preserve the legacy response shape. Disconnecting while waiting does not cancel the durable Task. Reuse the Idempotency-Key only with the same conversation_id (including an omitted value for a new conversation), model_id, and content after trimming surrounding whitespace. A different request with the same key returns a conflict.
      security: [{ portalSession: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstantChatSendRequest' }
      responses:
        '200':
          description: Saved exchange
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstantChatSendResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/execution:
    get:
      tags: [Tasks]
      operationId: getExecutionControl
      summary: Get the current user's cloud task execution control
      description: Requires a Portal Session. Returns the owner-scoped execution gate, account Runtime generation and quota, and active Task summary. Client credentials and API keys cannot change or inspect this state.
      security: [{ portalSession: [] }]
      responses:
        '200':
          description: Current execution gate, account Runtime, quota, and Task summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionControl' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/execution/stop-all:
    post:
      tags: [Tasks]
      operationId: stopAllExecution
      summary: Stop all cloud task execution for the current user
      description: The expected epoch prevents stale control requests. The same Idempotency-Key may only retry this exact action and epoch. HTTP 202 means Task processes or the account Runtime lack stop confirmation; poll GET /api/execution until the state is disabled.
      security: [{ portalSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecutionControlMutationRequest' }
      responses:
        '200':
          description: Execution is already disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionControl' }
        '202':
          description: Task or account Runtime stop proof is still pending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionControl' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/execution/enable:
    post:
      tags: [Tasks]
      operationId: enableExecution
      summary: Enable cloud task execution for the current user
      description: Requires a Portal Session and the current execution epoch. Reuse the Idempotency-Key only for an exact retry of this action and epoch. The request conflicts while an account Runtime stop is unconfirmed.
      security: [{ portalSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecutionControlMutationRequest' }
      responses:
        '200':
          description: Execution gate is enabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionControl' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/conversations:
    get:
      tags: [Tasks]
      operationId: listConversations
      summary: List the current user's cloud task conversations
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/PageLimit' }
        - { $ref: '#/components/parameters/PageCursor' }
      responses:
