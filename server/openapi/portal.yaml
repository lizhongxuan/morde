        active_seconds: { type: integer, minimum: 1, maximum: 1800 }
        tool_calls: { type: integer, minimum: 1, maximum: 100 }
        model_tokens: { type: integer, minimum: 1, maximum: 50000 }
    TaskBudget:
      type: object
      required: [active_seconds, tool_calls, model_tokens]
      properties:
        active_seconds: { type: integer, minimum: 1 }
        tool_calls: { type: integer, minimum: 1 }
        model_tokens: { type: integer, minimum: 1 }
    TaskUsage:
      type: object
      required: [active_seconds, tool_calls, model_tokens]
      properties:
        active_seconds: { type: integer, minimum: 0 }
        tool_calls: { type: integer, minimum: 0 }
        model_tokens: { type: [integer, 'null'], minimum: 0 }
    TaskSummary:
      type: object
      required: [id, owner_id, execution_location, conversation_id, model_id, objective, status, current_step, budget, usage, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/TaskId' }
        owner_id: { $ref: '#/components/schemas/UserId' }
        host_id: { $ref: '#/components/schemas/HostId', description: Optional target Host for computer operations; the dsh Agent runs independently on the server. }
        execution_location: { type: string, enum: [server, legacy] }
        workspace_id: { $ref: '#/components/schemas/WorkspaceId' }
        input_revision: { type: integer, minimum: 0, description: Immutable committed Workspace revision this task started from. }
        workspace_checkpoint_revision: { type: integer, minimum: 0, description: Current confirmed Workspace revision available to this task; advances only after a durable task-owned publish. }
        application_id: { type: string }
        conversation_id: { $ref: '#/components/schemas/ConversationId' }
        model_id: { type: string }
        objective: { type: string }
        status: { $ref: '#/components/schemas/TaskStatus' }
        current_step: { type: [string, 'null'] }
        budget: { $ref: '#/components/schemas/TaskBudget' }
        usage: { $ref: '#/components/schemas/TaskUsage' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TaskStep:
      type: object
      required: [id, sequence, kind, status, title, summary, created_at]
      properties:
        id: { $ref: '#/components/schemas/StepId' }
