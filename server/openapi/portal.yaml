      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Message' } }
        next_cursor: { type: [string, 'null'] }
    TaskStatus:
      type: string
      enum: [queued, running, waiting_user, pausing, paused, cancelling, completed, failed, cancelled]
    OperationStatus:
      type: string
      enum: [prepared, dispatched, succeeded, failed, cancelled, unknown]
      description: A dispatched operation with an ambiguous outcome is unknown and must be reconciled before any retry.
    TaskStep:
      type: object
      required: [id, sequence, kind, status, title, summary, created_at]
      properties:
        id: { $ref: '#/components/schemas/StepId' }
        sequence: { type: integer, minimum: 1 }
        kind: { type: string, enum: [plan, tool, wait, result] }
        status: { type: string, enum: [queued, running, waiting_user, succeeded, failed, unknown] }
        title: { type: string }
        summary: { type: string, maxLength: 2000 }
        created_at: { type: string, format: date-time }
    TaskEvent:
      type: object
      required: [task_id, sequence, type, created_at, payload]
      properties:
        task_id: { $ref: '#/components/schemas/TaskId' }
        sequence: { type: integer, minimum: 1 }
        type: { type: string, enum: [task.status, task.step, task.operation, task.message, task.batch_item, task.artifact, task.waiting_user, task.response, task.result] }
        created_at: { type: string, format: date-time }
        payload:
          type: object
          additionalProperties: true
          description: For assistant task.message deltas the fields are role=assistant, message_id, turn_id, and delta. The terminal message has the same IDs plus content and done=true; partial or failed responses do not get a terminal message or a conversation Message row.
    TaskBudget:
      type: object
      required: [active_seconds, tool_calls, model_tokens]
      properties:
        active_seconds: { type: integer, minimum: 1, maximum: 1800, default: 1800 }
        tool_calls: { type: integer, minimum: 1, maximum: 100, default: 100 }
        model_tokens: { type: integer, minimum: 1, maximum: 50000, default: 50000 }
      additionalProperties: false
    ScheduleTiming:
      oneOf:
        - $ref: '#/components/schemas/OnceScheduleTiming'
        - $ref: '#/components/schemas/DailyScheduleTiming'
        - $ref: '#/components/schemas/WeeklyScheduleTiming'
      description: IANA timezone is required. Repeated DST wall times use the earlier instant; nonexistent wall times are skipped.
    OnceScheduleTiming:
      type: object
      required: [kind, run_at, time_zone]
      properties:
        kind: { type: string, const: once }
        run_at: { type: string, format: date-time, description: RFC3339 instant with an explicit UTC offset. }
        time_zone: { type: string, minLength: 1, maxLength: 64, description: IANA tz database name used for display. }
      additionalProperties: false
    DailyScheduleTiming:
      type: object
      required: [kind, starts_on, local_time, time_zone]
      properties:
        kind: { type: string, const: daily }
        starts_on: { type: string, format: date, description: First eligible local calendar date. }
        local_time: { type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$' }
        time_zone: { type: string, minLength: 1, maxLength: 64, description: IANA tz database name. }
      additionalProperties: false
    WeeklyScheduleTiming:
      type: object
      required: [kind, starts_on, local_time, time_zone, weekdays]
      properties:
        kind: { type: string, const: weekly }
        starts_on: { type: string, format: date, description: First eligible local calendar date. }
        local_time: { type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$' }
        time_zone: { type: string, minLength: 1, maxLength: 64, description: IANA tz database name. }
        weekdays:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items: { type: integer, minimum: 1, maximum: 7, description: 'ISO weekday, Monday=1 through Sunday=7.' }
      additionalProperties: false
    ScheduleStatus:
      type: string
      enum: [enabled, disabled, completed]
      description: completed means a one-time schedule's occurrence has been consumed, not necessarily that its Task has finished.
    MisfirePolicy:
      type: string
      enum: [skip, run_once]
      description: Occurrences up to one minute late still run normally. After that grace, skip records missed occurrences without running them; run_once coalesces them into at most one run for the latest due occurrence.
    ScheduleRunStatus:
      type: string
      enum: [queued, running, waiting_user, pausing, paused, stopping, completed, failed, cancelled, skipped, missed]
    ObservationField:
      type: string
      enum: [text, value]
    ObservationSpec:
      type: object
      required: [url, selector, field]
      properties:
        url: { type: string, format: uri, minLength: 1, maxLength: 2048, pattern: '^https?://', description: Absolute HTTP or HTTPS page URL without credentials or a fragment. }
        selector: { type: string, minLength: 1, maxLength: 1024, description: CSS selector resolved by the browser; this is never evaluated as JavaScript. }
        field: { $ref: '#/components/schemas/ObservationField' }
      additionalProperties: false
    ObservationOutcome:
      type: string
      enum: [unknown, baseline, changed, no_change]
    ScheduleRun:
      type: object
      required: [id, schedule_id, schedule_version, occurrence_key, scheduled_at, coalesced_count, status, skip_reason, task_id, observation_outcome, created_at, updated_at, finished_at]
      properties:
        id: { $ref: '#/components/schemas/ScheduleRunId' }
        schedule_id: { $ref: '#/components/schemas/ScheduleId' }
        schedule_version: { type: integer, minimum: 1 }
        occurrence_key: { type: string, minLength: 1, maxLength: 128, description: Stable key for this local schedule occurrence. }
        scheduled_at: { type: [string, 'null'], format: date-time, description: UTC instant; null when the local wall time does not exist due to a DST gap. }
        coalesced_count: { type: integer, minimum: 0, description: Earlier missed occurrences folded into this run. }
        status: { $ref: '#/components/schemas/ScheduleRunStatus' }
        skip_reason: { type: [string, 'null'], enum: [dst_gap, overlap, authorization_ended, null] }
        task_id: { oneOf: [{ $ref: '#/components/schemas/TaskId' }, { type: 'null' }] }
        observation_outcome: { $ref: '#/components/schemas/ObservationOutcome' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
    Schedule:
      type: object
      required: [id, version, status, host_id, model_id, objective, timing, budget, misfire_policy, notification_events, observation, next_run_at, last_run, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/ScheduleId' }
        version: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/ScheduleStatus' }
        host_id: { $ref: '#/components/schemas/HostId' }
        model_id: { type: string, minLength: 1 }
        objective: { type: string, minLength: 1, maxLength: 32768 }
        timing: { $ref: '#/components/schemas/ScheduleTiming' }
        budget: { $ref: '#/components/schemas/TaskBudget' }
        misfire_policy: { $ref: '#/components/schemas/MisfirePolicy' }
        notification_events:
          type: array
          uniqueItems: true
          items: { type: string, enum: [completed, failed, waiting_user] }
          description: Successful no-change runs never create completion notifications.
        observation:
          oneOf:
            - $ref: '#/components/schemas/ObservationSpec'
            - type: 'null'
        next_run_at: { type: [string, 'null'], format: date-time }
        last_run:
          oneOf:
            - $ref: '#/components/schemas/ScheduleRun'
            - type: 'null'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SchedulePage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Schedule' } }
        next_cursor: { type: [string, 'null'] }
    ScheduleRunPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ScheduleRun' } }
        next_cursor: { type: [string, 'null'] }
    CreateScheduleRequest:
      type: object
      required: [host_id, model_id, objective, timing]
      properties:
        host_id: { $ref: '#/components/schemas/HostId' }
        model_id: { type: string, minLength: 1, description: Must identify a model explicitly configured by the caller; no fallback is performed. }
        objective: { type: string, minLength: 1, maxLength: 32768 }
        timing: { $ref: '#/components/schemas/ScheduleTiming' }
        budget: { $ref: '#/components/schemas/TaskBudget' }
        misfire_policy: { $ref: '#/components/schemas/MisfirePolicy', default: skip }
        notification_events:
          type: array
          uniqueItems: true
          items: { type: string, enum: [completed, failed, waiting_user] }
          default: [completed, failed, waiting_user]
        observation: { $ref: '#/components/schemas/ObservationSpec' }
      additionalProperties: false
    UpdateScheduleRequest:
      type: object
      required: [expected_version]
      minProperties: 2
      properties:
        expected_version: { type: integer, minimum: 1 }
        host_id: { $ref: '#/components/schemas/HostId' }
        model_id: { type: string, minLength: 1 }
        objective: { type: string, minLength: 1, maxLength: 32768 }
        timing: { $ref: '#/components/schemas/ScheduleTiming' }
        budget: { $ref: '#/components/schemas/TaskBudget' }
        misfire_policy: { $ref: '#/components/schemas/MisfirePolicy' }
        notification_events:
          type: array
          uniqueItems: true
          items: { type: string, enum: [completed, failed, waiting_user] }
        observation:
          oneOf:
            - $ref: '#/components/schemas/ObservationSpec'
            - type: 'null'
      additionalProperties: false
    ScheduleEnableRequest:
      type: object
      required: [action, expected_version]
      properties:
        action: { type: string, const: enable }
        expected_version: { type: integer, minimum: 1 }
      additionalProperties: false
    ScheduleDisableRequest:
      type: object
      required: [action, expected_version]
      properties:
        action: { type: string, const: disable }
        expected_version: { type: integer, minimum: 1 }
        current_run_action: { type: string, enum: [continue, cancel], default: continue }
      additionalProperties: false
    ScheduleActionRequest:
      oneOf:
        - $ref: '#/components/schemas/ScheduleEnableRequest'
        - $ref: '#/components/schemas/ScheduleDisableRequest'
    ScheduleActionResponse:
      type: object
      required: [schedule, current_run]
      properties:
        schedule: { $ref: '#/components/schemas/Schedule' }
        current_run:
          oneOf:
            - $ref: '#/components/schemas/ScheduleRun'
            - type: 'null'
    Notification:
      type: object
      required: [id, kind, task_id, event_sequence, summary, redacted, actionable, created_at, read_at]
      properties:
        id: { $ref: '#/components/schemas/NotificationId' }
        kind: { type: string, enum: [completed, failed, waiting_user] }
        task_id: { oneOf: [{ $ref: '#/components/schemas/TaskId' }, { type: 'null' }] }
        event_sequence: { type: integer, minimum: 1 }
        summary: { type: [string, 'null'], maxLength: 2000, description: Null when current authorization no longer permits disclosure. }
        redacted: { type: boolean }
        actionable: { type: boolean, description: 'False when the associated pending request is stale, already processed, or inaccessible.' }
        created_at: { type: string, format: date-time }
        read_at: { type: [string, 'null'], format: date-time }
    NotificationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        next_cursor: { type: [string, 'null'] }
    TaskUsage:
      type: object
      required: [active_seconds, tool_calls, model_tokens]
      properties:
        active_seconds: { type: integer, minimum: 0 }
        tool_calls: { type: integer, minimum: 0 }
        model_tokens: { type: [integer, 'null'], minimum: 0, description: Null when provider usage is unavailable; unknown usage must not be presented as zero. }
    TaskBatchItemInput:
      type: object
      required: [key, input]
      properties:
        key: { type: string, minLength: 1, maxLength: 128 }
        input: { type: string, minLength: 1, maxLength: 16384 }
      additionalProperties: false
    RetryBatchItemRequest:
      type: object
      required: [action, batch_item_id]
      properties:
        action: { type: string, const: retry_batch_item }
        batch_item_id: { $ref: '#/components/schemas/BatchItemId' }
      additionalProperties: false
    TaskActionRequest:
      oneOf:
        - $ref: '#/components/schemas/RetryBatchItemRequest'
        - $ref: '#/components/schemas/RespondToPendingRequest'
        - $ref: '#/components/schemas/AnswerClarificationRequest'
        - $ref: '#/components/schemas/PauseTaskRequest'
        - $ref: '#/components/schemas/ResumeTaskRequest'
        - $ref: '#/components/schemas/CancelTaskRequest'
    ExecutionControlActionRequest:
      type: object
      required: [expected_epoch]
      properties:
        expected_epoch: { type: integer, format: int64, minimum: 1 }
      additionalProperties: false
    ExecutionControl:
      type: object
      required: [state, epoch, pending_task_count]
      properties:
        state: { type: string, enum: [enabled, stopping, disabled] }
        epoch: { type: integer, format: int64, minimum: 1 }
        pending_task_count: { type: integer, format: int64, minimum: 0, description: Number of tasks awaiting durable stop confirmation. }
      additionalProperties: false
    PauseTaskRequest:
      type: object
      required: [action, expected_status]
      properties:
        action: { type: string, const: pause }
        expected_status: { type: string, enum: [queued, running] }
      additionalProperties: false
    ResumeTaskRequest:
      type: object
      required: [action, expected_status]
      properties:
        action: { type: string, const: resume }
        expected_status: { type: string, const: paused }
      additionalProperties: false
    CancelTaskRequest:
      type: object
      required: [action, expected_status]
      properties:
        action: { type: string, const: cancel }
        expected_status: { type: string, enum: [queued, running, waiting_user, paused] }
      additionalProperties: false
    TaskActionResponse:
      type: object
      required: [task_id, action, status, unsettled_operation_ids]
      properties:
        task_id: { $ref: '#/components/schemas/TaskId' }
        action: { type: string, enum: [retry_batch_item, respond, answer_clarification, pause, resume, cancel] }
        status: { $ref: '#/components/schemas/TaskStatus' }
        unsettled_operation_ids:
          type: array
          items: { $ref: '#/components/schemas/OperationId' }
      additionalProperties: false
    RespondToPendingRequest:
      type: object
      required: [action, pending_id, pending_version, decision]
      properties:
        action: { type: string, const: respond }
        pending_id: { type: string, pattern: '^r[a-z0-9]{7}$' }
        pending_version: { type: integer, minimum: 1 }
        decision: { type: string, enum: [approve, reject] }
      additionalProperties: false
    AnswerClarificationRequest:
      type: object
      required: [action, clarification_id, clarification_version, answer]
      properties:
        action: { type: string, const: answer_clarification }
        clarification_id: { $ref: '#/components/schemas/ClarificationId' }
        clarification_version: { type: integer, format: int64, minimum: 1 }
        answer: { type: string, minLength: 1, maxLength: 16384, description: Non-empty UTF-8 answer; whitespace-only values and NUL characters are rejected. }
      additionalProperties: false
    TaskPendingRequest:
      type: object
      required: [id, version, kind, title, object, content, impact]
      properties:
        id: { type: string, pattern: '^r[a-z0-9]{7}$' }
        version: { type: integer, minimum: 1 }
        kind: { type: string, const: approval }
        title: { type: string, maxLength: 512 }
        object: { type: string, maxLength: 512 }
        content: { type: string, maxLength: 512 }
        impact: { type: string, maxLength: 512 }
    TaskClarificationRequest:
      type: object
      required: [id, version, question]
      properties:
        id: { $ref: '#/components/schemas/ClarificationId' }
        version: { type: integer, format: int64, minimum: 1 }
        question: { type: string, minLength: 1, maxLength: 4096, description: UTF-8 question without NUL characters. }
      additionalProperties: false
    TaskStopRequest:
      type: object
      required: [id, action, status, safe_after, unsettled_operation_ids]
      properties:
        id: { type: string, pattern: '^x[a-z0-9]{7}$' }
        action: { type: string, enum: [pause, cancel] }
        status: { type: string, enum: [pending, completed] }
        safe_after: { type: string, format: date-time }
        unsettled_operation_ids:
          type: array
          items: { $ref: '#/components/schemas/OperationId' }
      additionalProperties: false
    TaskBatchItem:
      type: object
      required: [id, key, status, attempt, result, error]
      properties:
        id: { $ref: '#/components/schemas/BatchItemId' }
        key: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed, unknown] }
        attempt: { type: integer, format: int32, minimum: 1 }
        result: { type: [string, 'null'] }
        error: { type: [string, 'null'] }
    TaskArtifact:
      type: object
      required: [id, step_id, label, path, media_type, batch_item_id, batch_attempt, created_at]
      properties:
        id: { $ref: '#/components/schemas/ArtifactId' }
        step_id: { $ref: '#/components/schemas/StepId' }
        label: { type: string }
        path: { type: string, description: Relative to the task Workspace }
        media_type: { type: string }
        batch_item_id:
          anyOf:
            - $ref: '#/components/schemas/BatchItemId'
            - type: 'null'
        batch_attempt: { type: integer, format: int32, minimum: 0, description: Zero for task-level artifacts; otherwise the associated item attempt. }
        created_at: { type: string, format: date-time }
    Task:
      type: object
      required: [id, owner_id, host_id, conversation_id, model_id, objective, status, budget, usage, steps, batch_items, artifacts, pending_request, clarification_request, stop_request, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/TaskId' }
        owner_id: { $ref: '#/components/schemas/UserId' }
        host_id: { $ref: '#/components/schemas/HostId' }
        application_id: { type: string, enum: [wechat], description: Optional fixed target application on this Host. }
        conversation_id: { $ref: '#/components/schemas/ConversationId' }
        model_id: { type: string, minLength: 1, description: "The explicitly selected, user-configured model identifier." }
        objective: { type: string }
        status: { $ref: '#/components/schemas/TaskStatus' }
        current_step: { type: [string, 'null'] }
        result: { type: [string, 'null'] }
        waiting_reason: { type: [string, 'null'] }
        budget: { $ref: '#/components/schemas/TaskBudget' }
        usage: { $ref: '#/components/schemas/TaskUsage' }
        steps: { type: array, items: { $ref: '#/components/schemas/TaskStep' } }
        batch_items: { type: array, items: { $ref: '#/components/schemas/TaskBatchItem' } }
        artifacts: { type: array, items: { $ref: '#/components/schemas/TaskArtifact' } }
        pending_request:
          oneOf:
            - $ref: '#/components/schemas/TaskPendingRequest'
            - type: 'null'
        clarification_request:
          oneOf:
            - $ref: '#/components/schemas/TaskClarificationRequest'
            - type: 'null'
          description: Present only while waiting for an answer to the task's active clarification request.
        stop_request:
          oneOf:
            - $ref: '#/components/schemas/TaskStopRequest'
            - type: 'null'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
    TaskSummary:
      type: object
      required: [id, owner_id, host_id, conversation_id, model_id, objective, status, budget, usage, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/TaskId' }
        owner_id: { $ref: '#/components/schemas/UserId' }
        host_id: { $ref: '#/components/schemas/HostId' }
        application_id: { type: string, enum: [wechat], description: Optional fixed target application on this Host. }
        conversation_id: { $ref: '#/components/schemas/ConversationId' }
        model_id: { type: string, minLength: 1 }
        objective: { type: string }
        status: { $ref: '#/components/schemas/TaskStatus' }
        current_step: { type: [string, 'null'] }
        budget: { $ref: '#/components/schemas/TaskBudget' }
        usage: { $ref: '#/components/schemas/TaskUsage' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TaskPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/TaskSummary' } }
        next_cursor: { type: [string, 'null'] }
    SubmitTaskRequest:
      type: object
      required: [host_id, model_id, objective]
      properties:
        host_id: { $ref: '#/components/schemas/HostId' }
        application_id: { type: string, enum: [wechat], description: Optional target application on this Host; requires a running Morde-managed application launch and does not add operation permissions. }
        model_id: { type: string, minLength: 1, description: Must identify a model explicitly configured by the caller; no fallback is performed. }
        conversation_id: { $ref: '#/components/schemas/ConversationId' }
        objective: { type: string, minLength: 1, maxLength: 32768 }
        budget: { $ref: '#/components/schemas/TaskBudget' }
        batch_items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/TaskBatchItemInput' }
      additionalProperties: false
    AppendMessageRequest:
      type: object
      required: [host_id, model_id, content]
      properties:
        host_id: { $ref: '#/components/schemas/HostId' }
        application_id: { type: string, enum: [wechat], description: Must match the active task target when a conversation has an active task. }
        model_id: { type: string, minLength: 1, description: Must identify a model explicitly configured for the caller; no fallback is performed. }
        content: { type: string, minLength: 1, maxLength: 32768 }
        budget: { $ref: '#/components/schemas/TaskBudget' }
      additionalProperties: false
    AppendMessageResponse:
      type: object
      required: [message, task]
      properties:
        message: { $ref: '#/components/schemas/Message' }
        task: { $ref: '#/components/schemas/Task' }
    CreateUserRequest:
      type: object
      required: [name, password, role]
      properties:
        name: { type: string, minLength: 1 }
        password: { type: string, minLength: 1, writeOnly: true }
        role: { type: string, enum: [user, admin] }
        quota: { $ref: '#/components/schemas/Quota' }
    AdminUser:
      type: object
      required: [id, name, role, disabled, quota, usage, created_at]
      properties:
        id: { $ref: '#/components/schemas/UserId' }
        name: { type: string }
        role: { type: string, enum: [user, admin] }
        disabled: { type: boolean }
        quota: { $ref: '#/components/schemas/Quota' }
        usage: { $ref: '#/components/schemas/Usage' }
        created_at: { type: string, format: date-time }
    AdminWorkspaceBinding:
      type: object
      required: [host_id, host_name, state, sync_state, desired_revision, applied_revision]
      properties:
        host_id: { $ref: '#/components/schemas/HostId' }
        host_name: { type: string }
        state: { type: string, enum: [preparing, active, unbinding, detached, failed] }
        sync_state: { type: string, enum: [healthy, conflict] }
        desired_revision: { type: integer, format: int64, minimum: 0 }
        applied_revision: { type: integer, format: int64, minimum: 0 }
      additionalProperties: false
    AdminWorkspace:
      type: object
      required: [id, owner_id, owner_name, name, state, revision, used_bytes, quota_bytes, created_at, updated_at, bindings]
      properties:
        id: { $ref: '#/components/schemas/WorkspaceId' }
        owner_id: { $ref: '#/components/schemas/UserId' }
        owner_name: { type: string }
        name: { type: string }
        state: { type: string, enum: [ready, deleting] }
        revision: { type: integer, format: int64, minimum: 0 }
        used_bytes: { type: integer, format: int64, minimum: 0 }
        quota_bytes: { type: integer, format: int64, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        bindings:
          type: array
          items: { $ref: '#/components/schemas/AdminWorkspaceBinding' }
      additionalProperties: false
    AdminWorkspacePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminWorkspace' }
        next_cursor: { type: [string, 'null'], minLength: 1, description: Opaque cursor for the next page; null when exhausted. }
      additionalProperties: false
    UpdateUserRequest:
      type: object
      minProperties: 1
      properties:
