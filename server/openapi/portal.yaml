      properties:
        kind: { type: string, enum: [once] }
        run_at: { type: string, format: date-time, description: RFC3339 instant with an explicit UTC offset. }
        time_zone: { type: string, minLength: 1, description: IANA time-zone identifier used for display. }
    ScheduleDailyTiming:
      type: object
      additionalProperties: false
      required: [kind, starts_on, local_time, time_zone]
      properties:
        kind: { type: string, enum: [daily] }
        starts_on: { type: string, format: date }
        local_time: { type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$' }
        time_zone: { type: string, minLength: 1, description: IANA time-zone identifier. }
    ScheduleWeeklyTiming:
      type: object
      additionalProperties: false
      required: [kind, starts_on, local_time, time_zone, weekdays]
      properties:
        kind: { type: string, enum: [weekly] }
        starts_on: { type: string, format: date }
        local_time: { type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$' }
        time_zone: { type: string, minLength: 1, description: IANA time-zone identifier. }
        weekdays:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items: { type: integer, minimum: 1, maximum: 7, description: ISO weekday where Monday is 1 and Sunday is 7. }
    ScheduleEveryNHoursTiming:
      type: object
      additionalProperties: false
      required: [kind, interval_hours, time_zone]
      properties:
        kind: { type: string, enum: [every_n_hours] }
        interval_hours: { type: integer, minimum: 1, maximum: 168, description: Elapsed hours between occurrences. }
        anchor_at:
          type: string
          format: date-time
          description: >-
            Optional RFC3339 instant with an explicit UTC offset and at most six fractional-second
            digits (the existing PostgreSQL timestamp precision), used as the cadence phase.
            For every_n_hours, each slot is anchor_at + k * interval_hours for integer k >= 0.
            Creation or re-enabling selects the earliest slot strictly after now; anchor_at is
            used when still in the future and elapsed slots are skipped. Omission preserves
            creation/re-enabling-relative cadence.
        time_zone: { type: string, minLength: 1, description: Must be a valid IANA time-zone identifier; the server rejects unknown identifiers. }
