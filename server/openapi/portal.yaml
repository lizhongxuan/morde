        fetch_id: { $ref: '#/components/schemas/OperationId' }
        task_revision: { type: integer, format: int64, minimum: 1 }
        target_grant_version: { type: integer, format: int64, minimum: 1 }
        status: { type: string, const: completed }
        source_version: { type: string, pattern: '^[a-f0-9]{64}$' }
        source_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        size_bytes: { type: integer, format: int64, minimum: 1, maximum: 16777216 }
        content_id: { $ref: '#/components/schemas/OperationId' }
        expires_at: { type: string, format: date-time }
    TaskAssistantMessage:
      type: object
      description: The latest assistant model turn for this Task. Its stable message ID is shared by streamed and final text.
      required: [id, conversation_id, task_id, role, content, status, created_at]
      properties:
        id: { $ref: '#/components/schemas/MessageId' }
        conversation_id: { $ref: '#/components/schemas/ConversationId' }
        sequence: { type: integer, format: int64, minimum: 1, description: Monotonic sequence within the conversation, matching the durable conversation message; omitted until the message is durable. }
        task_id: { $ref: '#/components/schemas/TaskId' }
        task_revision: { type: integer, format: int64, minimum: 0 }
        result_event_sequence: { type: integer, format: int64, minimum: 1, description: Exact event identifying this completed result. }
        role: { type: string, const: assistant }
        content: { type: string, maxLength: 32768 }
        status: { type: string, enum: [streaming, completed, interrupted] }
        created_at: { type: string, format: date-time }
    TaskWorkbenchObservationTicket:
      type: object
      additionalProperties: false
      required: [ticket, task_id, host_id, expires_at]
      properties:
        ticket: { type: string, minLength: 40, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
        task_id: { $ref: '#/components/schemas/TaskId' }
        host_id: { $ref: '#/components/schemas/HostId' }
        expires_at: { type: string, format: date-time }
    TaskWorkbenchObservationSnapshot:
      type: object
      additionalProperties: false
      required: [task_id, host_id, status, event_sequence, updated_at, artifacts]
      description: Read-only Task projection. It contains no objective, Task result, event payload, file path, mutation field, or Host control capability.
      properties:
        task_id: { $ref: '#/components/schemas/TaskId' }
        host_id: { $ref: '#/components/schemas/HostId' }
        status: { $ref: '#/components/schemas/TaskStatus' }
        event_sequence: { type: integer, format: int64, minimum: 0 }
        updated_at: { type: string, format: date-time }
        artifacts:
          type: array
          items: { $ref: '#/components/schemas/TaskWorkbenchObservationArtifact' }
    TaskWorkbenchObservationArtifact:
      type: object
      additionalProperties: false
      required: [id, label, media_type, workspace_id, revision, size_bytes, sha256, created_at]
      description: Metadata for a Task artifact with a complete verified Workspace proof. File paths and contents are never exposed.
      properties:
        id: { $ref: '#/components/schemas/ArtifactId' }
        label: { type: string, maxLength: 256 }
        media_type: { type: string, maxLength: 256 }
        workspace_id: { $ref: '#/components/schemas/WorkspaceId' }
        revision: { type: integer, format: int64, minimum: 0 }
        size_bytes: { type: integer, format: int64, minimum: 0 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        created_at: { type: string, format: date-time }
    Task:
      allOf:
        - { $ref: '#/components/schemas/TaskSummary' }
        - type: object
          required: [event_sequence, result, waiting_reason, steps, batch_items, artifacts, pending_request, clarification_request, stop_request, assistant_message, finished_at]
          properties:
            event_sequence: { type: integer, format: int64, minimum: 0, description: Event cursor from the same database snapshot as this Task; resume task events after this sequence. }
            result: { type: [string, 'null'] }
            current_revision_started: { type: boolean, description: True only after the current Task revision's root Agent has durably begun a turn; also compare current_revision and desired_revision before showing it for a pending change. }
            result_message_pending: { type: boolean, description: A completed result is being held for a conversation reply; do not display it as a separate final message until published. }
            result_message_published: { type: boolean, description: The final result is published as a conversation message with sources; use that message rather than displaying a separate Task result. }
            waiting_reason: { type: [string, 'null'], description: 'Reason for waiting; model_context_limit means the full model request exceeded its input limit and the original message remains available.' }
            steps: { type: array, items: { $ref: '#/components/schemas/TaskStep' } }
            batch_items: { type: array, items: { $ref: '#/components/schemas/TaskBatchItem' } }
            artifacts: { type: array, items: { $ref: '#/components/schemas/TaskArtifact' } }
            pending_request: { oneOf: [{ $ref: '#/components/schemas/TaskPendingRequest' }, { type: 'null' }] }
            clarification_request: { oneOf: [{ $ref: '#/components/schemas/TaskClarificationRequest' }, { type: 'null' }] }
            stop_request: { oneOf: [{ $ref: '#/components/schemas/TaskStopRequest' }, { type: 'null' }] }
            assistant_message: { oneOf: [{ $ref: '#/components/schemas/TaskAssistantMessage' }, { type: 'null' }] }
            finished_at: { type: [string, 'null'], format: date-time }
    TaskPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/TaskSummary' } }
        next_cursor: { type: [string, 'null'] }
    ConversationActiveTask:
      allOf:
        - { $ref: '#/components/schemas/TaskSummary' }
        - type: object
          required: [event_sequence]
          properties:
            event_sequence: { type: integer, format: int64, minimum: 0 }
    ConversationActiveTaskPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ConversationActiveTask' } }
        next_cursor: { type: [string, 'null'] }
    SubmitTaskRequest:
      type: object
      description: Text-only Task input. No image, video or audio attachment field is accepted. If task_media_generation is advertised, the server may generate image, video or speech outputs through verified media-capable connections; uploaded media and cloud speech recognition remain unavailable.
      additionalProperties: false
      required: [model_id, objective]
      properties:
        host_id: { $ref: '#/components/schemas/HostId' }
        workspace_id: { $ref: '#/components/schemas/WorkspaceId' }
        input_revision: { type: integer, minimum: 0, description: Immutable committed Workspace revision to pin for this task. Required with workspace_id. }
        application_id: { type: string, maxLength: 64 }
        model_id: { type: string, minLength: 1, maxLength: 256 }
        objective: { type: string, minLength: 1, maxLength: 32768 }
        mcp_connector_ids:
          type: array
          maxItems: 16
          uniqueItems: true
          items: { $ref: '#/components/schemas/MCPConnectorId' }
        budget:
          oneOf:
            - { $ref: '#/components/schemas/TaskBudgetRequest' }
            - { type: 'null' }
        batch_items: { type: array, items: { $ref: '#/components/schemas/TaskBatchItemInput' } }
    TaskBatchItemInput:
      type: object
      additionalProperties: false
      required: [key, input]
      properties:
        key: { type: string, minLength: 1, maxLength: 100 }
        input: { type: string, minLength: 1, maxLength: 32768 }
    TaskActionRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [retry_batch_item, pause, resume, cancel] }
        expected_status: { $ref: '#/components/schemas/TaskStatus' }
        expected_current_revision: { type: integer, format: int64, minimum: 0 }
        expected_desired_revision: { type: integer, format: int64, minimum: 0 }
        batch_item_id: { $ref: '#/components/schemas/BatchItemId' }
      description: >-
        retry_batch_item requires batch_item_id only. Pause, resume and cancel
        require expected_status. expected_current_revision and
        expected_desired_revision are optional together; when both are present,
        both task revisions are compared atomically before applying the action.
        Legacy clients may omit both revision fields. Supplying only one is invalid.
    TaskWorkspaceViewDeletionRequest:
      type: object
      additionalProperties: false
      required: [confirm_delete]
      properties:
        confirm_delete: { type: boolean, const: true }
    TaskWorkspaceViewDeletion:
      type: object
      required: [request_id, task_id, status]
      properties:
        request_id: { $ref: '#/components/schemas/TaskWorkspaceViewDeletionId' }
        task_id: { $ref: '#/components/schemas/TaskId' }
        status: { type: string, enum: [pending, applied] }
      additionalProperties: false
    TaskInputRequest:
      type: object
      additionalProperties: false
      required: [clarification_id, clarification_version, answer]
      properties:
        clarification_id: { $ref: '#/components/schemas/ClarificationId' }
        clarification_version: { type: integer, minimum: 1 }
        answer: { type: string, minLength: 1, maxLength: 16384 }
    TaskApprovalResponseRequest:
      type: object
      additionalProperties: false
      required: [version, decision]
      properties:
        version: { type: integer, minimum: 1 }
        decision: { type: string, enum: [approve, reject] }
    TaskActionResponse:
      type: object
      required: [task_id, action, status, unsettled_operation_ids]
      properties:
        task_id: { $ref: '#/components/schemas/TaskId' }
        action: { type: string }
        status: { $ref: '#/components/schemas/TaskStatus' }
        unsettled_operation_ids: { type: array, items: { $ref: '#/components/schemas/OperationId' } }
    TaskEvent:
      type: object
      description: Media-generation progress uses the existing task.operation and task.waiting_user events. Raw media bytes, provider URLs, credentials and unverified file paths are never sent in SSE. task.artifact appears only after explicit save approval and verified Workspace publication.
      required: [task_id, sequence, type, created_at, payload]
      properties:
        task_id: { $ref: '#/components/schemas/TaskId' }
        sequence: { type: integer, minimum: 1 }
        type: { type: string, enum: [task.status, task.step, task.operation, task.message, task.batch_item, task.artifact, task.waiting_user, task.response, task.result] }
        created_at: { type: string, format: date-time }
        payload: {}
    Notification:
      type: object
      description: Task-backed notices have a task_id and positive event_sequence. Goal and project work-item source notices have task_id null, event_sequence 0, and source identity fields; project_id is present only for project work-item notices. source_event_id is an internal deduplication key and is not returned.
      required: [id, kind, task_id, event_sequence, summary, redacted, actionable, created_at, read_at]
      properties:
        id: { $ref: '#/components/schemas/NotificationId' }
        kind: { type: string, enum: [completed, failed, waiting_user, goal_step_blocked, goal_completed, project_work_item_blocked, project_work_item_delivered] }
        task_id: { oneOf: [{ $ref: '#/components/schemas/TaskId' }, { type: 'null' }] }
        event_sequence: { type: integer, minimum: 0, description: Positive for Task-backed notices and 0 for source notices. }
        source_kind: { type: string, enum: [goal, project_work_item], description: Omitted for Task-backed notices. }
        source_id: { type: string, minLength: 1, maxLength: 128, description: Omitted for Task-backed notices. }
        source_version: { type: integer, format: int64, minimum: 1, description: Omitted for Task-backed notices. }
        project_id: { $ref: '#/components/schemas/ProjectId', description: Present only for project work-item notices. }
        summary: { type: [string, 'null'], maxLength: 256, description: Null when current authorization no longer permits disclosure. }
        redacted: { type: boolean }
        actionable: { type: boolean, description: 'False when the associated pending request is stale, already processed, or inaccessible.' }
        created_at: { type: string, format: date-time }
        read_at: { type: [string, 'null'], format: date-time }
    NotificationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        next_cursor: { type: [string, 'null'] }
