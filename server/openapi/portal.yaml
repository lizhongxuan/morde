        resources: { $ref: '#/components/schemas/HostResourcesTarget' }
        version: { type: integer, format: int64, minimum: 1 }
        update_state: { type: string, enum: [idle, applying, unknown], description: Unknown requires runtime reconciliation before another adjustment. }
    UpdateAdminHostResourcesRequest:
      type: object
