      type: object
      required: [id, version, kind, title, object, content, impact]
      properties:
        id: { $ref: '#/components/schemas/ClarificationId' }
        version: { type: integer, minimum: 1 }
        kind: { const: approval }
        title: { type: string }
        object: { type: string }
        content: { type: string }
        impact: { type: string }
    TaskClarificationRequest:
      type: object
      required: [id, version, question]
      properties:
        id: { $ref: '#/components/schemas/ClarificationId' }
        version: { type: integer, minimum: 1 }
        question: { type: string }
