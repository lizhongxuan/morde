    get:
      tags: [Projects]
      operationId: listProjectBudgetLedger
      summary: List project model usage attribution
      description: Available to accepted project members. Platform-model Task calls reserve both this budget and the initiating account budget before dispatch using configured models.project_rates. Caller-owned personal model calls do not consume either platform budget. Unknown usage remains held for reconciliation. The ledger returns attribution, model/rate metadata, usage and integer micro amounts only; prompts, model responses, credentials and provider payloads are never included.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/PageLimit' }
        - { $ref: '#/components/parameters/PageCursor' }
      responses:
        '200':
          description: Stable page of project usage entries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectBudgetLedgerPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/projects/{id}/work-items:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      tags: [Projects]
      operationId: listProjectWorkItems
      summary: List work items visible to project members
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/PageLimit' }
        - { $ref: '#/components/parameters/PageCursor' }
        - name: include_unassigned
          in: query
          required: false
          description: Defaults to false for compatibility with older clients. true includes items whose assignee_id is null; the cursor is bound to this filter.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Stable project-scoped page ordered by creation time and ID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectWorkItemPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Projects]
      operationId: createProjectWorkItem
      summary: Create a project work item
      description: Owner/member only. Omitted category defaults to unclassified. By default, the caller is the assignee unless assignee_id is supplied. Set unassigned=true with assignee_id omitted to create an unassigned item. Task and Workspace fields are added only through separately authorized operations.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectWorkItemRequest' }
      responses:
        '201':
          description: Work item created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectWorkItem' }
        '200':
          description: Exact idempotent replay of the created work item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectWorkItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/projects/{id}/work-items/{work_item_id}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/ProjectWorkItemId' }
    get:
      tags: [Projects]
      operationId: getProjectWorkItem
      summary: Read one project work item
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - name: include_unassigned
          in: query
          required: false
          description: Defaults to false for compatibility with older clients. Set true to read an unassigned item; otherwise it is returned as not found.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Project work item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectWorkItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Projects]
      operationId: assignProjectWorkItem
      summary: Assign a work item to an accepted project member
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignProjectWorkItemRequest' }
      responses:
        '200':
          description: Updated work item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectWorkItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/projects/{id}/work-items/{work_item_id}/claim:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/ProjectWorkItemId' }
    post:
      tags: [Projects]
      operationId: claimProjectWorkItem
      summary: Claim an unassigned work item for the current member
      description: Owner/member only. Claims only an unassigned item for the authenticated member. It cannot replace an existing assignee; expected_version and Idempotency-Key make concurrent claims compare-and-set and exact retries idempotent.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimProjectWorkItemRequest' }
      responses:
        '200':
          description: Work item claimed by the current member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectWorkItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/projects/{id}/work-items/{work_item_id}/block:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/ProjectWorkItemId' }
    post:
      tags: [Projects]
      operationId: blockProjectWorkItem
      summary: Mark an open work item blocked
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BlockProjectWorkItemRequest' }
      responses:
        '200':
          description: Blocked work item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectWorkItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/projects/{id}/work-items/{work_item_id}/resume:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/ProjectWorkItemId' }
    post:
      tags: [Projects]
      operationId: resumeProjectWorkItem
      summary: Resume a blocked work item
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectWorkItemVersionRequest' }
      responses:
        '200':
          description: Resumed work item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectWorkItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/projects/{id}/work-items/{work_item_id}/tasks:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/ProjectWorkItemId' }
    post:
      tags: [Projects]
      operationId: linkProjectWorkItemTask
      summary: Link an independently authorized Task to a work item
      description: The transaction authorizer must verify that the caller can access the Task and that the Task actually belongs to this project; a task_id alone never grants access or changes personal Task ownership.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkProjectWorkItemTaskRequest' }
      responses:
        '200':
          description: Work item with the Task linked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectWorkItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '501': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /api/projects/{id}/work-items/{work_item_id}/delivery:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/ProjectWorkItemId' }
    post:
      tags: [Projects]
      operationId: deliverProjectWorkItem
      summary: Attach a saved Workspace revision as work item delivery evidence
      description: The evidence Task must already be linked to the work item. The W16 authorizer must verify caller access, project/resource scope, and that the Workspace revision is confirmed and durably saved; this request does not grant Workspace access or accept file content.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeliverProjectWorkItemRequest' }
      responses:
        '200':
          description: Delivered work item with saved revision evidence
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectWorkItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '501': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /api/conversations:
    get:
      tags: [Tasks]
      operationId: listConversations
      summary: List the current user's cloud task conversations
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/PageLimit' }
        - { $ref: '#/components/parameters/PageCursor' }
      responses:
        '200':
          description: Conversation page
