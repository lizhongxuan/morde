        workspace_id: { $ref: '#/components/schemas/WorkspaceId' }
      additionalProperties: false
    Site:
      type: object
      required: [id, host_id, workspace_id, state, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/SiteId' }
        host_id: { $ref: '#/components/schemas/HostId' }
        workspace_id: { $ref: '#/components/schemas/WorkspaceId' }
        state: { type: string, enum: [active, draining, stopped] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      additionalProperties: false
    SitePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Site' }
        next_cursor: { type: [string, 'null'], minLength: 1, description: Opaque cursor for the next page; null when exhausted. }
      additionalProperties: false
    CreateSiteCandidateRequest:
      type: object
      required: [workspace_revision, service_port]
      properties:
        workspace_revision: { type: integer, format: int64, minimum: 1 }
        service_port:
          type: integer
          minimum: 1024
          maximum: 65535
          description: Must also satisfy the configured preview-port minimum and deny list.
      additionalProperties: false
    SiteRelease:
      type: object
      required: [id, site_id, workspace_id, workspace_revision, manifest_sha256, service_port, state, artifact_file_count, artifact_bytes, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/SiteReleaseId' }
        site_id: { $ref: '#/components/schemas/SiteId' }
        workspace_id: { $ref: '#/components/schemas/WorkspaceId' }
        workspace_revision: { type: integer, format: int64, minimum: 1 }
        manifest_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        service_port: { type: integer, minimum: 1024, maximum: 65535 }
        state: { type: string, enum: [candidate, healthy, failed, cancelled], description: Materialization endpoints in this contract leave the Release in candidate state. }
        artifact_file_count: { type: integer, format: int64, minimum: 0 }
        artifact_bytes: { type: integer, format: int64, minimum: 0 }
        materialized_at: { type: string, format: date-time, description: Omitted until the immutable artifact is fully materialized. }
        failure_code:
          type: string
          enum: [source_changed, source_unavailable, capacity_exceeded, storage_unavailable]
          description: Optional bounded failure classification. Raw errors, filesystem paths, credentials, and user data are never stored or returned; a successful materialization clears this field.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      additionalProperties: false
    SiteReleasePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SiteRelease' }
        next_cursor: { type: [string, 'null'], minLength: 1, description: Opaque cursor for the next page; null when exhausted. }
      additionalProperties: false
    CreateWorkspaceRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
      additionalProperties: false
    BindWorkspaceRequest:
      type: object
      required: [workspace_id, expected_binding_version]
      properties:
        workspace_id: { $ref: '#/components/schemas/WorkspaceId' }
        expected_revision: { type: integer, format: int64, minimum: 0 }
        expected_binding_version: { type: integer, format: int64, minimum: 0, description: 'Current binding version, or zero when no binding row exists. Prevents stale retries from reactivating an older binding.' }
      additionalProperties: false
    WorkspaceFile:
      type: object
      required: [path, size_bytes, sha256, mode, chunks]
      properties:
        path: { type: string, minLength: 1, maxLength: 4096, description: 'Clean relative POSIX path; absolute paths, traversal, symlinks and duplicate case-folded paths are rejected.' }
        size_bytes: { type: integer, format: int64, minimum: 0 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        mode: { type: integer, minimum: 0, maximum: 511, description: Permission bits only; executable bits are preserved. }
        chunks:
          type: array
          items: { $ref: '#/components/schemas/WorkspaceChunk' }
      additionalProperties: false
    WorkspaceChunk:
      type: object
      required: [sha256, size_bytes]
      properties:
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        size_bytes: { type: integer, minimum: 1, maximum: 4194304 }
      additionalProperties: false
    WorkspaceManifest:
      type: object
      required: [workspace_id, revision, files, next_cursor]
      properties:
        workspace_id: { $ref: '#/components/schemas/WorkspaceId' }
        revision: { type: integer, format: int64, minimum: 0 }
        files:
          type: array
          maxItems: 100000
          items: { $ref: '#/components/schemas/WorkspaceFile' }
        next_cursor: { type: [string, 'null'], maxLength: 512 }
      additionalProperties: false
    WorkspaceChangePage:
      type: object
      required: [items, next_cursor]
