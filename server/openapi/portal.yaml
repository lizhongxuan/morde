        schema: { $ref: '#/components/schemas/WorkspaceId' }
    post:
      tags: [Hosts]
      operationId: retryHostWorkspaceSync
      summary: Resume a Host workspace live sync paused by conflict
      description: Requires the owning Portal session and a running Host. The expected binding version prevents a stale retry from affecting a later rebind. Repeating the request after a lost response is safe.
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
