        received: { type: boolean }
      additionalProperties: false
    WorkspaceSyncDownloadActionAck:
      type: object
      required: [path, action, size_bytes]
      properties:
        path: { type: string, minLength: 1, maxLength: 4096 }
        action: { type: string, enum: [upsert, delete, directory_upsert, directory_delete] }
        sha256: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$', description: Required for upsert; null for deletes and directory actions. }
        size_bytes: { type: integer, format: int64, minimum: 0 }
      additionalProperties: false
    WorkspaceSyncDownloadAction:
      type: object
      required: [path, action, sha256, size_bytes, applied]
      properties:
        path: { type: string, minLength: 1, maxLength: 4096 }
        action: { type: string, enum: [upsert, delete, directory_upsert, directory_delete] }
        sha256: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
        size_bytes: { type: integer, format: int64, minimum: 0 }
        applied: { type: boolean }
      additionalProperties: false
    DeviceWorkspaceSyncProgress:
      type: object
      required: [workspace_id, device_id, session_id, direction, state, stage, planned_bytes, confirmed_bytes, download_actions_total, download_actions_done, updated_at]
      properties:
        workspace_id: { $ref: '#/components/schemas/WorkspaceId' }
        device_id: { $ref: '#/components/schemas/TokenId' }
        session_id: { type: string, pattern: '^p[a-z0-9]{7}$' }
        direction: { type: string, enum: [upload, download, bidirectional] }
        state: { type: string, enum: [planned, transferring, verifying, applying] }
        stage: { type: string, enum: [scan, compare, transfer, verify, apply, complete] }
        planned_bytes: { type: integer, format: int64, minimum: 0 }
        confirmed_bytes: { type: integer, format: int64, minimum: 0 }
        download_actions_total: { type: integer, format: int64, minimum: 0 }
        download_actions_done: { type: integer, format: int64, minimum: 0 }
        updated_at: { type: string, format: date-time }
      additionalProperties: false
    DeviceWorkspaceSyncProgressSummary:
      type: object
      required: [revision, used_bytes, quota_bytes, remaining_bytes, quota_status, items, quota_pauses]
      properties:
        revision: { type: integer, format: int64, minimum: 0 }
        used_bytes: { type: integer, format: int64, minimum: 0 }
        quota_bytes: { type: integer, format: int64, minimum: 0 }
        remaining_bytes: { type: integer, format: int64, minimum: 0, description: Remaining committed logical capacity; zero when full or over quota }
        quota_status: { type: string, enum: [available, full, over_quota], description: Current committed-usage admission state; shrinking and deletion remain allowed when full or over quota }
        items:
          type: array
          items: { $ref: '#/components/schemas/DeviceWorkspaceSyncProgress' }
        quota_pauses:
          type: array
          description: Current direct Syncthing receive operations paused by a durable quota rejection. A later admitted operation on the same path clears the active pause; rejected operation IDs remain terminal.
          items: { $ref: '#/components/schemas/WorkspaceSyncQuotaPause' }
        node_status:
          allOf: [{ $ref: '#/components/schemas/WorkspaceSyncNodeObservation' }]
          description: Read-only owner-node observation filtered to the current Workspace; omitted when observation is not configured.
      additionalProperties: false
    WorkspaceSyncQuotaPause:
      type: object
      required: [state, path, operation, requested_bytes, reason_code, updated_at]
      properties:
        state: { type: string, enum: [paused] }
        path: { type: string, minLength: 1, maxLength: 4096, description: Workspace-relative path of the blocked file operation. }
        operation: { type: string, enum: [upsert] }
        requested_bytes: { type: integer, format: int64, minimum: 0 }
        reason_code: { type: string, enum: [workspace_quota_exceeded, owner_storage_quota_exceeded] }
        updated_at: { type: string, format: date-time }
      additionalProperties: false
    WorkspaceSyncNodeObservation:
      type: object
      required: [present, running, connected_device_ids, folders]
