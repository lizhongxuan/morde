        sync_state: { type: string, enum: [healthy, conflict] }
        desired_revision: { type: integer, format: int64, minimum: 0 }
        applied_revision: { type: integer, format: int64, minimum: 0 }
      additionalProperties: false
    AdminWorkspace:
      type: object
      required: [id, owner_id, owner_name, name, state, revision, used_bytes, quota_bytes, created_at, updated_at, bindings]
      properties:
        id: { $ref: '#/components/schemas/WorkspaceId' }
        owner_id: { $ref: '#/components/schemas/UserId' }
        owner_name: { type: string }
        name: { type: string }
        state: { type: string, enum: [ready, deleting] }
        revision: { type: integer, format: int64, minimum: 0 }
        used_bytes: { type: integer, format: int64, minimum: 0 }
        quota_bytes: { type: integer, format: int64, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        bindings:
          type: array
          items: { $ref: '#/components/schemas/AdminWorkspaceBinding' }
      additionalProperties: false
    AdminWorkspacePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminWorkspace' }
