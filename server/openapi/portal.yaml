      additionalProperties: false
    UpdateUserRequest:
      type: object
      required: [expected_status]
      minProperties: 2
      additionalProperties: false
      properties:
        expected_status: { $ref: '#/components/schemas/AccountStatus' }
        status: { $ref: '#/components/schemas/AccountStatus' }
        role: { $ref: '#/components/schemas/UserRole' }
        quota: { $ref: '#/components/schemas/Quota' }
        default_host_resources: { $ref: '#/components/schemas/HostResourcesTarget' }
