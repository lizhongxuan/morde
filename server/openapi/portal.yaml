        items:
          type: array
          maxItems: 500
          items:
            type: object
            required: [revision, path, action, file]
            properties:
              revision: { type: integer, format: int64, minimum: 1 }
              path: { type: string, minLength: 1, maxLength: 4096 }
              action: { type: string, enum: [upsert, delete] }
              file: { oneOf: [{ $ref: '#/components/schemas/WorkspaceFile' }, { type: 'null' }] }
        next_cursor: { type: string, minLength: 1, maxLength: 512 }
      additionalProperties: false
    CreateSyncSessionRequest:
      type: object
      required: [direction, policy, base_revision, files]
      properties:
        direction: { type: string, enum: [upload, download, bidirectional] }
        policy: { type: string, enum: [fill_missing, compare_merge, live] }
        base_revision: { type: integer, format: int64, minimum: 0 }
        scope:
          type: array
          maxItems: 10000
          items: { type: string, minLength: 1, maxLength: 4096 }
