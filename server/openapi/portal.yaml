          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectContentCommentRequest' }
      responses:
        '201':
          description: Created comment at version 1
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectContentComment' }
        '200':
          description: Exact idempotent replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectContentComment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/projects/{id}/content/{kind}/comments/{comment_id}:
