        workspace_id: { $ref: '#/components/schemas/WorkspaceId' }
      additionalProperties: false
    Site:
      type: object
      required: [id, host_id, workspace_id, state, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/SiteId' }
        host_id: { $ref: '#/components/schemas/HostId' }
        workspace_id: { $ref: '#/components/schemas/WorkspaceId' }
        state: { type: string, enum: [active, draining, stopped] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      additionalProperties: false
    SitePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Site' }
        next_cursor: { type: [string, 'null'], minLength: 1, description: Opaque cursor for the next page; null when exhausted. }
      additionalProperties: false
    CreateSiteCandidateRequest:
      type: object
      required: [workspace_revision, service_port]
      properties:
        workspace_revision: { type: integer, format: int64, minimum: 1 }
        service_port:
          type: integer
          minimum: 1024
          maximum: 65535
          description: Must also satisfy the configured preview-port minimum and deny list.
      additionalProperties: false
    SiteRelease:
      type: object
      required: [id, site_id, workspace_id, workspace_revision, manifest_sha256, service_port, state, artifact_file_count, artifact_bytes, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/SiteReleaseId' }
        site_id: { $ref: '#/components/schemas/SiteId' }
        workspace_id: { $ref: '#/components/schemas/WorkspaceId' }
        workspace_revision: { type: integer, format: int64, minimum: 1 }
        manifest_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        service_port: { type: integer, minimum: 1024, maximum: 65535 }
        state: { type: string, enum: [candidate, healthy, failed, cancelled], description: Materialization endpoints in this contract leave the Release in candidate state. }
        artifact_file_count: { type: integer, format: int64, minimum: 0 }
        artifact_bytes: { type: integer, format: int64, minimum: 0 }
        materialized_at: { type: string, format: date-time, description: Omitted until the immutable artifact is fully materialized. }
        failure_code:
          type: string
          enum: [source_changed, source_unavailable, capacity_exceeded, storage_unavailable]
          description: Optional bounded failure classification. Raw errors, filesystem paths, credentials, and user data are never stored or returned; a successful materialization clears this field.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      additionalProperties: false
    SiteReleasePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SiteRelease' }
        next_cursor: { type: [string, 'null'], minLength: 1, description: Opaque cursor for the next page; null when exhausted. }
      additionalProperties: false
    CreateWorkspaceRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
      additionalProperties: false
    BindWorkspaceRequest:
      type: object
      required: [workspace_id, expected_binding_version]
      properties:
        workspace_id: { $ref: '#/components/schemas/WorkspaceId' }
        expected_revision: { type: integer, format: int64, minimum: 0 }
        expected_binding_version: { type: integer, format: int64, minimum: 0, description: 'Current binding version, or zero when no binding row exists. Prevents stale retries from reactivating an older binding.' }
      additionalProperties: false
    WorkspaceFile:
      type: object
      required: [path, size_bytes, sha256, mode, chunks]
      allOf:
        - if:
            properties:
              kind: { const: symlink }
          then:
            not:
              required: [hardlink_to]
        - if:
            required: [hardlink_to]
          then:
            properties:
              kind: { const: file }
      properties:
        path: { type: string, minLength: 1, maxLength: 4096, description: 'Clean relative POSIX path; absolute paths, traversal and duplicate case-folded paths are rejected. A symlink is represented at its own path and is never followed.' }
        kind: { type: string, enum: [file, symlink], description: Empty or omitted kind is a regular file for compatibility with older clients. }
        symlink_target: { type: string, minLength: 1, maxLength: 4096, description: 'Required for symlinks. UTF-8 relative POSIX target up to 4096 bytes; NUL, backslash, colon, absolute and root-escaping targets are rejected. Never resolved or followed by file APIs.' }
        hardlink_to: { type: string, minLength: 1, maxLength: 4096, description: 'For regular files, identifies the earlier canonical path for another name of the same inode. The anchor must be a regular file with identical content, chunks, mode and modification time.' }
        size_bytes: { type: integer, format: int64, minimum: 0, description: 'For symlinks, UTF-8 target byte length.' }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$', description: 'For symlinks, SHA-256 of the target bytes.' }
        mode: { type: integer, minimum: 0, maximum: 511, description: Permission bits only for regular files; symlink mode is 0. }
        mod_time_ns: { type: [integer, 'null'], format: int64, description: Modification time as Unix nanoseconds; omitted for legacy revisions whose timestamp is unknown. }
        metadata_known: { type: boolean, description: True when this revision explicitly captured an empty or non-empty xattr/ACL set; false means legacy/unknown. }
        xattrs:
          type: array
          maxItems: 64
          items: { $ref: '#/components/schemas/WorkspaceExtendedAttribute' }
        acl: { $ref: '#/components/schemas/WorkspaceNativeACL' }
        chunks:
          type: array
          items: { $ref: '#/components/schemas/WorkspaceChunk' }
      additionalProperties: false
    WorkspaceExtendedAttribute:
      type: object
      required: [name, value]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        value: { type: string, format: byte, maxLength: 21848, description: Raw extended-attribute value encoded as base64. }
      additionalProperties: false
    WorkspaceNativeACL:
      type: object
      required: [platform, format, data]
      properties:
        platform: { type: string, enum: [linux, darwin] }
        format: { type: string, enum: [linux-posix-acl-v1, darwin-filesec-v1] }
        data: { type: string, format: byte, maxLength: 43692, description: Opaque platform-native ACL payload encoded as base64; restored only by a compatible platform/filesystem. }
      additionalProperties: false
    WorkspaceChunk:
      type: object
      required: [sha256, size_bytes]
      properties:
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        size_bytes: { type: integer, minimum: 1, maximum: 4194304 }
      additionalProperties: false
    WorkspaceDirectory:
      type: object
      required: [path]
      properties:
        path: { type: string, minLength: 1, maxLength: 4096, description: Clean relative directory path; `.` denotes the Workspace root. }
        mode: { type: [integer, 'null'], minimum: 0, maximum: 511, description: Directory permission bits; omitted when the historical revision did not capture them. }
        mod_time_ns: { type: [integer, 'null'], format: int64, description: Modification time as Unix nanoseconds; omitted when unknown. }
