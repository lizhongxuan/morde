      security:
        - hostCookie: []
      responses:
        '200':
          description: Persisted operation and the original Runtime fence
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Pragma:
              schema: { type: string, const: no-cache }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostApplicationLaunchResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
        default: { $ref: '#/components/responses/Error' }
  /__ch/api/applications/{app_id}/launches/{launch_id}/stop:
    servers:
      - url: https://{host}
        variables:
          host:
            default: h1234567.hosts.morde.test
            description: Host-specific Gateway origin using the configured Host suffix.
    parameters:
      - name: app_id
        in: path
        required: true
        schema: { type: string, const: wechat }
      - name: launch_id
        in: path
        required: true
        schema: { type: string, minLength: 8, maxLength: 128, pattern: '^launch_[A-Za-z0-9][A-Za-z0-9._:-]{0,120}$' }
    post:
      tags: [Host Gateway]
      operationId: stopHostApplicationLaunch
      summary: Stop a specific application launch
      description: Owner-only stop for the exact app_id and persisted launch ID. Repeated requests can only stop that same launch and are safe to reconcile.
      security:
        - hostCookie: []
      responses:
        '202':
          description: Stop accepted or the persisted result is unknown
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Pragma:
              schema: { type: string, const: no-cache }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostApplicationLaunchResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/hosts/{id}/renew:
    parameters:
      - $ref: '#/components/parameters/HostId'
    post:
      tags: [Hosts]
      operationId: renewHost
      summary: Renew a host's lifetime
      description: API keys require current account ownership of this host.
      responses:
        '200':
          description: Host with updated expiry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Host' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/hosts/{id}/enter:
    parameters:
      - $ref: '#/components/parameters/HostId'
    post:
      tags: [Hosts]
      operationId: enterHost
      summary: Issue a one-time ticket to enter a host
      description: Portal sessions and native client credentials may enter a host they own. Administrators may view and manage other hosts but cannot enter them. A native client ticket binds the resulting Gateway cookie to its revocable installation.
      security:
        - portalSession: []
        - bearerToken: []
      responses:
        '200':
          description: One-time host entry URL
          content:
            application/json:
              schema:
                type: object
                required: [url, expires_at]
                properties:
                  url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/hosts/{id}/members:
    parameters:
      - $ref: '#/components/parameters/HostId'
    post:
      tags: [Host sharing]
      operationId: inviteHostMember
      summary: Grant an existing user scoped access to a host
      description: Owner-only. Accepts desktop:view, desktop:control, terminal:control, mcp:control, and workspace:file:read in any de-duplicated combination. desktop:control also grants desktop:view. workspace:file:read is independent and grants only read-only access to files in an active, applied Workspace binding; it does not grant desktop, terminal, or MCP access. MCP use also requires a valid caller-owned API Key and current permission to observe or operate this Host; revoked sharing access is checked again for each operation. No Host management or re-sharing is granted.
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HostMemberInviteRequest' }
      responses:
        '201':
          description: Member grant created or restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostMember' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    get:
      tags: [Host sharing]
      operationId: listHostMembers
      summary: List members granted access to a host
      description: Owner-only.
      security:
        - portalSession: []
      responses:
        '200':
          description: Active member grants
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/HostMember' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/hosts/{id}/members/{user_id}:
    parameters:
      - $ref: '#/components/parameters/HostId'
      - name: user_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/UserId' }
    delete:
      tags: [Host sharing]
      operationId: revokeHostMember
      summary: Revoke a member's access to a host
      description: Owner-only. New Gateway requests are denied after revocation. Existing desktop and terminal streams recheck the exact permission every five seconds and close when it is revoked.
      security:
        - portalSession: []
      responses:
        '204': { description: Member grant revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/shared-hosts:
    get:
      tags: [Host sharing]
      operationId: listSharedHosts
      summary: List hosts shared with the current user
      description: Returns only the host identity, state, URL, and granted permissions; it does not expose workspace contents or management controls.
      security:
        - portalSession: []
        - bearerToken: []
      responses:
        '200':
          description: Hosts shared with the current user
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SharedHost' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /api/hosts/{id}/observation-ticket:
    parameters:
      - $ref: '#/components/parameters/HostId'
    post:
      tags: [Host sharing]
      operationId: issueHostObservationTicket
      summary: Issue a one-time ticket for an authorized desktop, terminal, or Workspace user
      description: The current Portal user or native client must own the host or have the permission selected by target. Native clients may request desktop observation only. The default target is desktop and requires desktop:view (also implied by desktop:control); Portal sessions may request terminal when granted terminal:control or the Workspace tab only when granted workspace:file:read. A Workspace ticket always enters `/__ch/wb/?tab=workspace`; the Gateway then permits only that member's explicitly granted read-only Workspace access and rechecks it dynamically. workspace:file:read does not imply desktop, terminal, or MCP access. The resulting Host cookie keeps member identity separate from Host ownership; every Gateway request rechecks the exact permission and client installation state.
      security:
        - portalSession: []
        - bearerToken: []
      parameters:
        - name: target
          in: query
          required: false
          description: Entry surface. Unknown or repeated query parameters are rejected.
          schema:
            type: string
            enum: [desktop, terminal, workspace]
            default: desktop
      responses:
        '200':
          description: One-time Host entry URL scoped to the requested surface
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                required: [url, expires_at]
                properties:
                  url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/hosts/{id}/preview-auth:
    parameters:
      - $ref: '#/components/parameters/HostId'
      - name: port
        in: query
        required: true
        schema: { type: integer, minimum: 1, maximum: 65535 }
      - name: next
        in: query
        required: false
        schema: { type: string, maxLength: 8192 }
    get:
      tags: [Hosts]
      operationId: authorizeHostPreview
      summary: Redirect through a one-time, port-scoped preview ticket
      description: Requires the host owner's Portal session. The ticket only authorizes the requested preview port and cannot enter the Workbench or another preview port.
      security:
        - portalSession: []
      responses:
        '302':
          description: Redirect to the selected private preview after issuing a one-time ticket
          headers:
            Location: { schema: { type: string, format: uri } }
            Cache-Control: { schema: { type: string, const: no-store } }
            Referrer-Policy: { schema: { type: string, const: no-referrer } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/sites:
    get:
      tags: [Sites]
      operationId: listSites
      summary: List Sites owned by the current user
      description: Requires the owner's Portal Session. Results are ordered by creation time and Site ID descending and use bounded cursor pagination.
      security:
        - portalSession: []
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: Owner's Site page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SitePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Sites]
      operationId: createSite
      summary: Create a Site bound to an owned Host and Workspace
      description: Requires the owner’s Portal Session, a running owned Host, and an active binding to the owned Workspace. The request is idempotent; reuse the Idempotency-Key only for the same Host and Workspace.
      security:
        - portalSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSiteRequest' }
      responses:
        '201':
          description: Site created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Site' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        default: { $ref: '#/components/responses/Error' }
  /api/sites/{id}/releases:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    get:
      tags: [Sites]
      operationId: listSiteReleases
      summary: List releases for an owned Site
      description: Requires the Site owner's Portal Session. Site ownership is checked before querying releases; inaccessible Sites return the same 404 as missing Sites. Results are ordered by creation time and release ID descending with bounded cursor pagination.
      security:
        - portalSession: []
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: Site release page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteReleasePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Sites]
      operationId: createSiteCandidateRelease
      summary: Create a candidate from a fixed Workspace revision
      description: Requires the Site owner’s Portal Session. The Workspace is inherited from the Site; the server computes and pins the digest for the supplied immutable revision. The service port must meet the configured preview-port policy. Reuse the Idempotency-Key only for the exact same revision and port.
      security:
        - portalSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSiteCandidateRequest' }
      responses:
        '201':
          description: Candidate created; it has not been materialized or run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteRelease' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        default: { $ref: '#/components/responses/Error' }
  /api/sites/{id}/releases/{release_id}/materialize:
    parameters:
      - $ref: '#/components/parameters/SiteId'
      - $ref: '#/components/parameters/SiteReleaseId'
    post:
      tags: [Sites]
      operationId: materializeSiteRelease
      summary: Materialize an immutable candidate artifact
      description: Requires the Site owner’s Portal Session. Runs synchronously within the request context and is idempotent for the same Site and Release. It copies and verifies only the pinned Workspace revision into private artifact storage. The response remains in candidate state; this operation does not execute project code, probe health, promote a Release, or expose a URL. Failures return sanitized API errors; GET release status may expose only the bounded failure_code enum, never raw errors or paths.
      security:
        - portalSession: []
      responses:
        '200':
          description: Candidate materialization status; state remains candidate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteRelease' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/sites/{id}/releases/{release_id}:
    parameters:
      - $ref: '#/components/parameters/SiteId'
      - $ref: '#/components/parameters/SiteReleaseId'
    get:
      tags: [Sites]
      operationId: getSiteRelease
      summary: Read candidate materialization status
      description: Requires the Site owner’s Portal Session. A stored failure is represented only by failure_code from the bounded enum; raw error text, filesystem paths, and credentials are never returned.
      security:
        - portalSession: []
      responses:
        '200':
          description: Release status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteRelease' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/workspaces:
    get:
      tags: [Workspaces]
      operationId: listWorkspaces
      summary: List independent workspaces
      security:
        - portalSession: []
        - bearerToken: []
      responses:
        '200':
          description: Workspaces
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Workspaces]
      operationId: createWorkspace
      summary: Create an independent workspace
      description: Creates metadata and an empty durable file root without creating or starting a Host. Requires an idempotency key.
      security:
        - portalSession: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkspaceRequest' }
      responses:
        '201':
          description: Workspace created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/workspaces/{id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      operationId: getWorkspace
      summary: Get workspace metadata and current revision
      security:
        - portalSession: []
        - bearerToken: []
      responses:
        '200':
          description: Workspace metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Workspaces]
      operationId: deleteWorkspace
      summary: Delete a workspace
      security:
        - portalSession: []
      responses:
        '202':
          description: Workspace is being deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/workspaces/{id}/ownership-transfers:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Workspaces]
      operationId: requestWorkspaceOwnershipTransfer
      summary: Request transfer of Workspace ownership
      description: Portal Session only. Only the current owner can request transfer to an approved account. The request freezes Workspace changes until it is accepted or cancelled. The current Workspace ID, revision history, current tree, and volume are retained; no file bytes are sent. Transfers are refused while a Host binding, Task write, synchronization operation, publish, project or Site reference, registered device, or unsupported legacy volume exists.
      security: [{ portalSession: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestWorkspaceOwnershipTransfer' }
      responses:
        '201':
          description: Transfer request created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceOwnershipTransfer' }
        '200':
          description: Idempotent replay of the transfer request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceOwnershipTransfer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: Workspace references or volume state cannot be transferred safely, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        default: { $ref: '#/components/responses/Error' }
  /api/workspaces/{id}/ownership-transfers/{transfer_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: transfer_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/WorkspaceOwnershipTransferId' }
    get:
      tags: [Workspaces]
      operationId: getWorkspaceOwnershipTransfer
      summary: Get an ownership transfer request
      description: Available to the current or former owner and the proposed owner. After acceptance, this endpoint exposes only the transfer receipt; Workspace and sync data access follows the new current owner.
      security: [{ portalSession: [] }]
      responses:
        '200':
          description: Ownership transfer status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceOwnershipTransfer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/workspaces/{id}/ownership-transfers/{transfer_id}/accept:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: transfer_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/WorkspaceOwnershipTransferId' }
    post:
      tags: [Workspaces]
      operationId: acceptWorkspaceOwnershipTransfer
      summary: Accept a Workspace ownership transfer
      description: Only the proposed owner's Portal Session may accept. Acceptance is an idempotent operation with a durable operation ID. A result-unknown state remains frozen for reconciliation; it cannot be cancelled or accepted as a new operation.
      security: [{ portalSession: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Accepted transfer receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceOwnershipTransfer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        default: { $ref: '#/components/responses/Error' }
  /api/workspaces/{id}/ownership-transfers/{transfer_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: transfer_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/WorkspaceOwnershipTransferId' }
    post:
      tags: [Workspaces]
      operationId: cancelWorkspaceOwnershipTransfer
      summary: Cancel a pending Workspace ownership transfer
      description: Only the former/current owner's Portal Session may cancel while the transfer remains pending. Acceptance or result-unknown operations cannot be cancelled.
      security: [{ portalSession: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Cancelled transfer receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceOwnershipTransfer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        default: { $ref: '#/components/responses/Error' }
  /api/workspaces/{id}/manifest:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      operationId: getWorkspaceManifest
      summary: Read a workspace file snapshot
      description: Returns the immutable manifest at a pinned revision. All paths are normalized, relative paths; entries outside the requested path scope are omitted.
      security:
        - portalSession: []
        - bearerToken: []
      parameters:
        - name: revision
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
        - name: prefix
          in: query
          required: false
          schema: { type: string, maxLength: 1024 }
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 512 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
      responses:
        '200':
          description: Immutable workspace manifest
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceManifest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/workspaces/{id}/diff:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      operationId: getWorkspaceDiff
      summary: Compare two committed Workspace revisions
      description: Portal owner sessions only. Returns changed file and directory metadata; UTF-8 text content is included only for small files. Large and binary files retain an explicit display status without content.
      security: [{ portalSession: [] }]
      parameters:
        - name: from_revision
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
        - name: to_revision
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        '200':
          description: Bounded Workspace revision comparison
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceDiff' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        default: { $ref: '#/components/responses/Error' }
  /api/workspaces/{id}/copies:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Workspaces]
      operationId: copyWorkspace
      summary: Copy a confirmed Workspace revision
      description: Portal owner sessions only. Requires a ready Workspace volume, a current tree matching the confirmed revision, no Host binding or in-flight writer, and sufficient owner capacity. Unsupported file metadata fails closed. The source remains unchanged; each idempotency key creates at most one independent Workspace copy.
      security: [{ portalSession: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceCopyRequest' }
      responses:
        '201':
          description: Newly completed independent Workspace copy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceCopyResult' }
        '200':
          description: Completed copy returned for an idempotent replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceCopyResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        default: { $ref: '#/components/responses/Error' }
  /api/workspaces/{id}/shares:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Workspaces]
      operationId: createWorkspaceShareLink
      summary: Create a single-recipient Workspace copy link
      description: Portal owner sessions only. The link expires after seven days if unclaimed. The response contains the random token once; only its SHA-256 hash is stored. A successful claim creates an independent Workspace owned by the recipient. View permission is enforced by the server and prevents Workspace writes and Host attachment.
      security: [{ portalSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkspaceShareRequest' }
      responses:
        '201':
          description: Link created; do not cache this response because it contains the one-time raw token.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceShareCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/workspace-shares/preview:
    post:
      tags: [Workspaces]
      operationId: previewWorkspaceShareLink
      summary: Preview a Workspace copy link
      description: Portal session only. The token is sent in the request body and responses are not cacheable. Preview does not claim or consume the link.
      security: [{ portalSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceShareTokenRequest' }
      responses:
        '200':
          description: Workspace name, permission, and link expiry.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceSharePreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/workspace-shares/accept:
    post:
      tags: [Workspaces]
      operationId: acceptWorkspaceShareLink
      summary: Claim a Workspace copy link
      description: Portal session only. A link can be claimed by one account. A failed in-progress claim can be retried only by that same account. The server creates the recipient-owned copy with the selected view/edit permission when it reserves the copy; neither successful nor recovery paths use ownership transfer or transfer the original Workspace or its Host bindings. Once successful, the token is invalid and the recipient owns an independent copy permanently. The original Workspace is not shared or changed.
      security: [{ portalSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceShareTokenRequest' }
      responses:
        '201':
          description: Independent Workspace copy claimed.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceShareAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/workspaces/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Workspaces]
      operationId: restoreWorkspacePaths
      summary: Restore selected paths from an immutable revision
      description: Portal owner sessions only. The current Workspace revision is checked atomically; active Host bindings, in-flight sync or Task writes, unresolved receive operations, and an unmaterialized current revision make restore fail closed. A successful change creates a new revision and never rewrites history.
      security: [{ portalSession: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceRestoreRequest' }
      responses:
        '200':
          description: Restore result and resulting immutable revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceRestoreResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        default: { $ref: '#/components/responses/Error' }
  /api/workspaces/{id}/file-operations:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Workspaces]
      operationId: applyWorkspaceFileOperation
      summary: Rename, move, or delete Workspace paths
      description: Portal Session only. Editing is read-only unless write_enabled is explicitly true. Credential paths (.ssh, .gnupg, .aws, .azure, .kube, .docker, .config/gcloud, .config/gh, .netrc, .git-credentials, and .env*) are rejected. The expected current revision, committed manifest, and absence of active Host bindings or in-flight writers are checked atomically; ownership-transfer freezes apply to this route.
      security: [{ portalSession: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceFileOperationRequest' }
      responses:
        '200':
          description: Operation receipt and resulting immutable revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceFileOperationResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        default: { $ref: '#/components/responses/Error' }
  /api/workspaces/{id}/changes:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      operationId: getWorkspaceChanges
      summary: Read changes after a durable workspace cursor
      description: Supports bounded long polling for paired PC and Host replicas. A stale cursor returns 409 and requires a fresh manifest comparison; a missing or offline replica never implies deletion.
      security:
        - portalSession: []
        - bearerToken: []
      parameters:
        - name: after
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 512 }
        - name: wait_seconds
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 25, default: 20 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        '200':
          description: Ordered workspace changes and next cursor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceChangePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/workspaces/{id}/sync-progress:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      operationId: listDeviceWorkspaceSyncProgress
      summary: Read active desktop synchronization progress
      description: Portal sessions only. Returns the current Workspace revision, committed logical bytes, configured quota, remaining committed capacity, quota admission state, and only the latest active session for each currently authorized device. Quota state is available below the limit, full at the limit, and over_quota above it; shrinking and deletion remain allowed when full or over quota. Confirmed bytes mean durably acknowledged blocks; download action counts mean files applied. File paths and conflicts are omitted. Usage is based on committed explicit sync revisions and is not yet a ledger for direct Syncthing writes.
      security:
        - portalSession: []
      responses:
        '200':
          description: Active progress summaries for authorized devices
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceWorkspaceSyncProgressSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/workspaces/{id}/sync-device-challenges:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Workspaces]
      operationId: createWorkspaceSyncDeviceChallenge
      summary: Start a Syncthing device registration proof
      description: Desktop client credential only. The certificate is public DER encoded as base64; the service derives and verifies its Syncthing Device ID, then returns a five-minute signing payload bound to this Workspace and installation. Sign the decoded signing_payload bytes with the certificate private key. At most eight challenges may be outstanding per installation. This endpoint does not enable synchronization; the folder remains pending until a server node is provisioned.
      security:
        - clientCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkspaceSyncDeviceChallengeRequest' }
      x-morde-max-body-bytes: 32768
      responses:
        '201':
          description: One-time device proof challenge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceSyncDeviceChallenge' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/workspaces/{id}/sync-devices:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      operationId: listWorkspaceSyncDevices
      summary: List Workspace Syncthing device bindings
      description: Portal sessions only. Includes pending, active, revoking, and revoked bindings for this Workspace so authorized users can inspect and revoke a specific device. Certificate private material is never returned.
      security:
        - portalSession: []
      responses:
        '200':
          description: Workspace device bindings
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/WorkspaceSyncDeviceBinding' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Workspaces]
      operationId: registerWorkspaceSyncDevice
      summary: Register a proven Syncthing device for a Workspace
      description: Desktop client credential only. The proof is single-use, bound to the current installation, and idempotent by key. Success returns the authorized server node ID and pinned private relay URI after the node config is applied.
      security:
        - clientCredential: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._~-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterWorkspaceSyncDeviceRequest' }
      x-morde-max-body-bytes: 32768
      responses:
        '200':
          description: Workspace device binding and server connection details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceSyncDeviceBinding' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Workspaces]
      operationId: revokeWorkspaceSyncDevice
      summary: Revoke a Workspace Syncthing device binding
      description: Revokes only the selected device binding. The owning portal session is required; the account and installation remain otherwise unchanged.
      security:
        - portalSession: []
      parameters:
        - name: binding_id
          in: path
          required: true
          schema: { type: string, pattern: '^d[a-z0-9]{7}$' }
      responses:
        '204': { description: Binding revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/workspaces/{id}/sync-sessions:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Workspaces]
      operationId: createWorkspaceSyncSession
      summary: Plan an upload, missing-only download, merge, or live synchronization batch
      description: The client submits its scoped manifest. The service pins the base revision and returns required chunks and conflicts. For Host replica downloads or bidirectional sessions, base_revision cannot exceed the Host binding's applied_revision. Newly planned uploads reject any file larger than 314572800 bytes with 413; unchanged existing files remain readable and are not re-uploaded by this rule. A session is resumable and idempotent; omitted files never imply deletion.
      security:
        - portalSession: []
        - bearerToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSyncSessionRequest' }
      x-morde-max-body-bytes: 16777216
      responses:
        '201':
          description: Transfer plan and resumable session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        default: { $ref: '#/components/responses/Error' }
  /api/workspaces/{id}/sync-sessions/{session_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: session_id
        in: path
        required: true
        schema: { type: string, pattern: '^p[a-z0-9]{7}$' }
    get:
      tags: [Workspaces]
      operationId: getWorkspaceSyncSession
      summary: Read transfer progress and conflicts
      security:
        - portalSession: []
        - bearerToken: []
      responses:
        '200':
          description: Current durable transfer state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/workspaces/{id}/sync-sessions/{session_id}/commit:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: session_id
        in: path
        required: true
        schema: { type: string, pattern: '^p[a-z0-9]{7}$' }
    post:
      tags: [Workspaces]
      operationId: commitWorkspaceSyncSession
      summary: Verify and commit the transfer plan
      description: Rechecks the pinned base revision and received chunks. Changed paths return conflicts; unrelated files may commit independently. Durable block acknowledgement is separate from destination application acknowledgement.
      security:
        - portalSession: []
        - bearerToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Verified result and current revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/workspaces/{id}/sync-sessions/{session_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: session_id
        in: path
        required: true
        schema: { type: string, pattern: '^p[a-z0-9]{7}$' }
    post:
      tags: [Workspaces]
      operationId: cancelWorkspaceSyncSession
      summary: Stop future transfer work
      description: Cancellation retains acknowledged chunks and already applied files. It never deletes source content or reverts destination writes.
      security:
        - portalSession: []
        - bearerToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Cancelled session state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/workspaces/{id}/sync-sessions/{session_id}/blocks/{digest}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: session_id
        in: path
        required: true
        schema: { type: string, pattern: '^p[a-z0-9]{7}$' }
      - name: digest
        in: path
        required: true
        schema: { type: string, pattern: '^[a-f0-9]{64}$' }
    put:
      tags: [Workspaces]
      operationId: putWorkspaceSyncBlock
      summary: Upload one verified chunk
      description: Raw chunk bytes, 4 MiB maximum. A success response is sent only after the block is durably written and SHA-256 verified. Chunks are never deduplicated across workspaces.
      security:
        - portalSession: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary, maxLength: 4194304 }
      responses:
        '204': { description: Chunk durably acknowledged }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        default: { $ref: '#/components/responses/Error' }
    get:
      tags: [Workspaces]
      operationId: getWorkspaceSyncBlock
      summary: Download one required chunk
      security:
        - portalSession: []
        - bearerToken: []
      responses:
        '200':
          description: Verified chunk bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary, maxLength: 4194304 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/workspaces/{id}/sync-sessions/{session_id}/blocks/{digest}/ack:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: session_id
        in: path
        required: true
        schema: { type: string, pattern: '^p[a-z0-9]{7}$' }
      - name: digest
        in: path
        required: true
        schema: { type: string, pattern: '^[a-f0-9]{64}$' }
    post:
      tags: [Workspaces]
      operationId: ackWorkspaceSyncBlock
      summary: Confirm a downloaded block is durably available locally
      description: Call only after the required block has been verified and saved to durable local transfer state. A separate download-action acknowledgment confirms the full file operation.
      security:
        - portalSession: []
        - bearerToken: []
      responses:
        '204': { description: Downloaded block durably acknowledged }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/workspaces/{id}/sync-sessions/{session_id}/download-actions/ack:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: session_id
        in: path
        required: true
        schema: { type: string, pattern: '^p[a-z0-9]{7}$' }
    post:
      tags: [Workspaces]
      operationId: ackWorkspaceSyncDownloadAction
      summary: Confirm one downloaded file operation was safely applied
      description: Acknowledge an upsert only after full-file verification and durable atomic application, or a delete only after safe removal and parent-directory sync.
      security:
        - portalSession: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceSyncDownloadActionAck' }
      responses:
        '204': { description: Download action durably acknowledged }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        default: { $ref: '#/components/responses/Error' }
  /api/hosts/{id}/workspace-bindings:
    parameters:
      - $ref: '#/components/parameters/HostId'
    get:
      tags: [Hosts]
      operationId: listHostWorkspaceBindings
      summary: List workspaces bound to a host
      description: Portal sessions follow account role and ownership; API keys require current account access to this host.
      security:
        - portalSession: []
        - bearerToken: []
      responses:
        '200':
          description: Host workspace bindings
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/WorkspaceBinding' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Hosts]
      operationId: bindWorkspaceToHost
      summary: Bind a ready workspace without restarting the host
      description: The server creates the workspace directory under the Host-level workspace root and requests the current revision. Directory paths are never accepted from the caller.
      security:
        - portalSession: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BindWorkspaceRequest' }
      responses:
        '201':
          description: Binding created or found idempotently
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceBinding' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/host-replicas/{host_id}/generations/{generation}/workspace-bindings:
    parameters:
      - name: host_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/HostId' }
      - name: generation
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    get:
      tags: [Workspaces]
      operationId: listHostReplicaBindings
      summary: Read the current workspace replica snapshot for a Host runtime
      security:
        - hostReplicaBootstrap: []
      responses:
        '200':
          description: Current bindings and per-binding sync credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostReplicaBindings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/host-replicas/{host_id}/generations/{generation}/operation-ledger/{namespace}:
    parameters:
      - name: host_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/HostId' }
      - name: generation
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
      - name: namespace
        in: path
        required: true
        schema: { type: string, enum: [runtime_core, browser] }
    get:
      tags: [Runtime]
      operationId: listHostRuntimeOperationLedgerEvents
      summary: Read a bounded page from this Host generation's durable operation ledger
      description: Host Replica credentials can read only their own Host, runtime generation, and namespace. Events are returned in sequence order for client-side hash-chain validation.
      security: [{ hostReplicaBootstrap: [] }]
      parameters:
        - name: after_sequence
          in: query
          schema: { type: integer, format: uint64, minimum: 0, maximum: 65536, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 128, default: 128 }
      responses:
        '200':
          description: Events following the requested sequence
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeOperationLedgerPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Runtime]
      operationId: appendHostRuntimeOperationLedgerEvent
      summary: Durably append one Host Runtime operation event
      description: The event sequence and predecessor hash must match the current ledger head. Replaying the identical event is idempotent; a different event at an existing sequence or a stale predecessor returns conflict. The response is sent only after PostgreSQL commits the event.
      security: [{ hostReplicaBootstrap: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuntimeOperationLedgerEvent' }
      responses:
        '200':
          description: Durably committed event acknowledgement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeOperationLedgerEvent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        default: { $ref: '#/components/responses/Error' }
