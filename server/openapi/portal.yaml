        source_revision: { type: integer, format: int64, minimum: 0 }
        state: { type: string, enum: [completed] }
        replayed: { type: boolean }
    WorkspaceFileOperationRequest:
      type: object
      additionalProperties: false
      required: [action, source_path, expected_current_revision, write_enabled]
      properties:
        action: { type: string, enum: [rename, move, delete] }
