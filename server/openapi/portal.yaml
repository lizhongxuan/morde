      properties:
        workspace_name: { type: string }
        permission: { type: string, enum: [view, edit] }
        token: { type: string, pattern: '^[A-Za-z0-9_-]{43}$', description: High-entropy token returned only once. Store only a hash on the server. }
        expires_at: { type: string, format: date-time }
    WorkspaceShareTokenRequest:
      type: object
      additionalProperties: false
