openapi: 3.1.0
info:
  title: Morde Portal and Host Gateway API
  version: 1.0.0
  description: Portal API, Host Gateway API, and platform MCP endpoint. Portal API keys are sent as bearer credentials; Host Gateway APIs use the host-scoped ch_host cookie.
servers:
  - url: https://{portal}
    variables:
      portal:
        default: portal.morde.test
        description: Replace with the configured portal host.
tags:
  - name: Auth
    description: Portal login and session management.
  - name: Portal
    description: Current user and read-only portal resources.
  - name: Hosts
    description: Host lifecycle.
  - name: Host sharing
    description: Owner-managed member grants and member-only desktop observation.
  - name: Host Gateway
    description: Owner-only host-scoped applications and runtime controls.
  - name: Workspaces
    description: Independent workspace metadata, immutable file revisions, and resumable synchronization.
  - name: Sites
    description: Owner-managed immutable Site candidates; runtime publication remains gated.
  - name: Tokens
    description: Platform API keys.
  - name: Devices
    description: Client installations with Hub presence and workspace synchronization device bindings.
  - name: Clients
    description: Desktop and mobile client installations authorized by account login.
  - name: Hub
    description: Installation-bound realtime presence and request routing for a user's own devices.
  - name: Personal Data
    description: Owner-scoped profile object reads, writes, snapshots, and incremental change metadata.
  - name: Models
    description: Session-managed model connections and capability checks.
  - name: Instant Chat compatibility
    description: Temporary legacy routes backed by the canonical durable Task and Conversation services.
  - name: Notifications
    description: In-app notifications for Portal sessions and native client credentials.
  - name: Admin
    description: Administrative operations.
  - name: MCP
    description: Platform MCP endpoint and account-owned third-party connector management.
  - name: Health
    description: Process and dependency health checks.
security:
  - portalSession: []
  - bearerToken: []
paths:
  /api/capabilities:
    get:
      tags: [Portal]
      operationId: getCapabilities
      summary: Discover this Morde service before login
      description: The persisted service identifier partitions client data across installations. A null protocol or minimum version means it is not declared, not that an unfinished capability is available. Only assembled capabilities are listed. The default request size has route-specific exceptions.
      security: []
      responses:
        '200':
          description: Public service identity and supported capabilities
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [service_instance_id, api_version, hub_version, event_version, minimum_client_version, supported_features, default_max_request_bytes]
                properties:
                  service_instance_id: { type: string, format: uuid }
                  api_version: { type: string }
                  hub_version: { type: [string, 'null'] }
                  event_version: { type: [string, 'null'] }
                  minimum_client_version: { type: [string, 'null'] }
                  supported_features:
                    type: array
                    description: An absent feature is unavailable or not yet declared. task_api means conversation and Task endpoints are assembled and may accept durable queued work; cloud_tasks means those client endpoints and cloud execution control are assembled; hub means the installation-bound realtime endpoint is assembled; personal_sync means the profile-only snapshot and change-feed services are assembled. Native login clients must require ordered_client_login before sending account credentials; the older client_login feature is no longer advertised.
                    items: { type: string }
                  default_max_request_bytes: { type: integer, format: int64, minimum: 1 }
        '503': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /api/hub:
    get:
      tags: [Hub]
      operationId: connectHub
      summary: Open an installation-bound Hub WebSocket
      description: |-
        Upgrade this request to a WebSocket using an active restricted client credential (`chc_`) in the Authorization header. Query parameters are rejected. If an Origin header is present, its scheme must be HTTP or HTTPS and its host must exactly match the configured Portal host. The first client text frame must be `{"type":"hello"}`; the server replies with `welcome` containing the authenticated installation ID, the user's bounded device presence list, a 65536-byte frame limit, and server time. Presence is advisory.

        Client frames are strict JSON objects: `ping` and `devices` contain only `type`; `call` contains `type`, a 4–80 character `id` using only ASCII letters, digits, `.`, `_`, `:`, or `-`, a same-account installation ID in `to`, `action`, and object `args`; `result` contains `type`, `id`, `ok`, and, on success, an action-shaped object `body`, or on failure a bounded `error`; `cancel` contains only `type` and `id`. The supported actions are `info` (no arguments; result contains bounded `name`, `platform`, `os`, `version`, and `actions` metadata), `open` (`{"url":"https://…"}` only; success result is `{"opened":true}`), and `notify` (`{"title":"…","text":"…"}`; success result is `{"notified":true}`). The server relays calls only between active installations owned by the same authenticated user. Calls time out after 30 seconds; an unknown result is not reported as success. The server sends `welcome`, `devices` (up to 256 entries), `pong`, `call`, `result`, `cancel`, `cancel_pending`, and bounded `error` frames.
      security:
        - clientCredential: []
      responses:
        '101': { description: WebSocket connection established; subsequent traffic follows the Hub frame contract in this operation's description. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /api/model/v1/chat/completions:
    post:
      tags: [Models]
      operationId: createPlatformChatCompletion
      summary: Run one metered platform-model inference
      description: Requires a user Session or installation-bound Client, an explicitly configured model budget, and an Idempotency-Key. This endpoint returns tool calls without executing them. It supports text, inline base64 images, function tools, temperature and text streaming; unsupported options such as stop sequences, remote image URLs and forced tool choice are rejected. A repeated call is not dispatched again; if its result was not saved by the caller, reconcile instead of retrying with a new key. No complete request or response is retained by the model ledger.
      security: [{ portalSession: [] }, { bearerToken: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [model, messages]
              properties:
                model: { $ref: '#/components/schemas/ModelConnectionId' }
                messages:
                  type: array
                  minItems: 1
                  maxItems: 128
                  items:
                    type: object
                    additionalProperties: false
                    required: [role]
                    properties:
                      role: { type: string, enum: [system, developer, user, assistant, tool] }
                      content:
                        oneOf:
                          - { type: string }
                          - { type: 'null' }
                          - type: array
                            items:
                              type: object
                              additionalProperties: false
                              required: [type]
                              properties:
                                type: { type: string, enum: [text, image_url] }
                                text: { type: string }
                                image_url:
                                  type: object
                                  additionalProperties: false
                                  required: [url]
                                  properties:
                                    url: { type: string, description: 'Inline data:image/...;base64 URL only.' }
                                    detail: { type: string, enum: [auto] }
                      tool_call_id: { type: string }
                      tool_calls:
                        type: array
                        items: { $ref: '#/components/schemas/ModelGatewayToolCall' }
                tools:
                  type: array
                  items: { $ref: '#/components/schemas/ModelGatewayTool' }
                tool_choice: { type: string, enum: [auto] }
                stream: { type: boolean }
                stream_options:
                  type: object
                  additionalProperties: false
                  properties:
                    include_usage: { type: boolean }
                max_tokens: { type: integer, minimum: 1, maximum: 32768 }
                max_completion_tokens: { type: integer, minimum: 1, maximum: 32768 }
                temperature: { type: number, minimum: 0, maximum: 2 }
      responses:
        '200':
          description: OpenAI-compatible completion or SSE chunks ending with DONE. Missing provider usage or over-budget usage is recorded and returned as an error; a partially emitted stream has an error event and no DONE marker.
          content:
            application/json:
              schema:
                type: object
                required: [id, object, created, model, choices, usage]
                properties:
                  id: { type: string }
                  object: { const: chat.completion }
                  created: { type: integer, format: int64 }
                  model: { $ref: '#/components/schemas/ModelConnectionId' }
                  choices:
                    type: array
                    items:
                      type: object
                      required: [index, message, finish_reason]
                      properties:
                        index: { const: 0 }
                        finish_reason: { type: string, enum: [stop, tool_calls, length, content_filter] }
                        message:
                          type: object
                          required: [role, content]
                          properties:
                            role: { const: assistant }
                            content: { type: string }
                            tool_calls: { type: array, items: { $ref: '#/components/schemas/ModelGatewayToolCall' } }
                  usage:
                    oneOf:
                      - { type: 'null' }
                      - type: object
                        required: [prompt_tokens, completion_tokens, total_tokens]
                        properties:
                          prompt_tokens: { type: integer, format: int64, minimum: 0 }
                          completion_tokens: { type: integer, format: int64, minimum: 0 }
                          total_tokens: { type: integer, format: int64, minimum: 0 }
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in to the portal
      description: Sets the ch_portal session cookie only for approved accounts. Login attempts are rate limited. Correct credentials for pending, rejected, or disabled accounts return the matching account status without a session. The default admin/admin credential is accepted only from a loopback client and receives a restricted password-change session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated user
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register a standard user account
      description: Creates a pending user account with role=user. Registration is rate limited and does not create a login session. The name admin is reserved case-insensitively.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Registered user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current portal session or installed client
      description: A browser session revokes itself. An installation-bound Web session revokes its entire installation, including Client, Sync, Web, ticket and Gateway access.
      security:
        - portalSession: []
      responses:
        '204': { description: Session revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /api/auth/client-login:
    post:
      tags: [Clients]
      operationId: clientLogin
      summary: Log in on a native client
      description: Approved accounts sign in with name and password. Desktop and iOS clients must first require ordered_client_login from /api/capabilities. Each ordered network attempt has a new Idempotency-Key and a strictly increasing attempt_generation persisted by the client before sending. The service binds client_instance_id to one installation and rejects stale generations. A retry after an unknown result increments the generation; the prior response may then contain a revoked credential and must be discarded. Revoked installations cannot be restored by a late login. For source compatibility only, Android requests that omit both ordered fields continue using the legacy server-ordered path; it is not advertised as a capability and does not fence delayed client intents. Legacy same-key Android retries rotate credentials on the same installation. A desktop login atomically issues installation-bound Client, Sync and user Web credentials; mobile login issues only Client. No portal cookie is set.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientLoginRequest' }
      responses:
        '200':
          description: Installation and credentials returned once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientLoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /api/auth/client-web-session:
    post:
      tags: [Clients]
      operationId: renewClientWebSession
      summary: Renew an installed desktop or iOS user Web session
      description: Requires an active desktop or iOS Client bearer credential. The returned Session is installation-bound, has at most one hour of life, and cannot access Admin routes. Android support is unchanged.
      security: [{ bearerToken: [] }]
      responses:
        '200':
          description: New installation-bound Web session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientWebSessionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /api/auth/client-logout:
    post:
      tags: [Clients]
      operationId: clientLogout
      summary: Revoke the current native client installation
      security: [{ bearerToken: [] }]
      responses:
        '204': { description: Installation and all bound credentials revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /api/me:
    get:
      tags: [Portal]
      operationId: getMe
      summary: Get the current user and quota usage
      security:
        - portalSession: []
        - bearerToken: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /api/me/password:
    post:
      tags: [Auth]
      operationId: changeMyPassword
      summary: Change the current user's password
      description: Requires the current password. For the initial super administrator, this is the only mutation allowed until the password is changed. A successful change revokes every current session and requires logging in again.
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: Password changed and existing sessions revoked }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/me/preferences:
    get:
      tags: [Portal]
      operationId: getUserPreferences
      summary: Get the current user's assistant preferences
      security:
        - portalSession: []
      responses:
        '200':
          description: User preferences. Null identifiers mean no model or default host has been selected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPreferences' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [Portal]
      operationId: saveUserPreferences
      summary: Save the current user's assistant preferences
      description: Select only a model already checked and usable by this user. Empty strings clear optional values. API keys cannot manage portal preferences.
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveUserPreferencesRequest' }
      responses:
        '200':
          description: Saved preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPreferences' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/onboarding/status:
    get:
      tags: [Portal]
      operationId: getOnboardingStatus
      summary: Get model, computer, and next-step readiness for the current user
      description: Status comes from the existing model catalogue and HostService state. It does not expose Host state reasons, AIO credentials, or model API keys.
      security:
        - portalSession: []
      responses:
        '200':
          description: Onboarding readiness status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
  /api/me/default-host:
    post:
      tags: [Portal]
      operationId: ensureDefaultHost
      summary: Select, create, or restore the current user's default host
      description: Provide host_id to select one owned host. Without host_id, a single existing host is selected, a stopped default host is restored, or a host is created if none exists. Multiple unselected hosts return selection_required without choosing one. Concurrent first requests are serialized per user. Expected capacity and host lifecycle outcomes are returned as status values; internal host errors and credentials are never returned.
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnsureDefaultHostRequest' }
      responses:
        '200':
          description: Current default host action result and updated onboarding status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DefaultHostResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/templates:
    get:
      tags: [Portal]
      operationId: listTemplates
      summary: List available host templates
      responses:
        '200':
          description: Templates
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Template' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /api/hosts:
    get:
      tags: [Hosts]
      operationId: listHosts
      summary: List the current user's hosts
      description: Deleted hosts are omitted. Portal sessions and API keys see hosts currently accessible to the account; ownership and sharing are checked on each request.
      responses:
        '200':
          description: Hosts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Host' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Hosts]
      operationId: createHost
      summary: Create a host
      description: Returns immediately in the creating state; poll GET /api/hosts/{id} for completion. Reuse the Idempotency-Key only to retry the exact normalized request. Portal Sessions may bind one or more owned workspaces using workspace_ids; an empty list creates a host with no project workspace. API keys may create only an unbound host within the account quota and default resource target.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateHostRequest' }
      responses:
        '201':
          description: Host accepted for asynchronous creation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Host' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        default: { $ref: '#/components/responses/Error' }
  /api/hosts/{id}:
    parameters:
      - $ref: '#/components/parameters/HostId'
    get:
      tags: [Hosts]
      operationId: getHost
      summary: Get a host
      description: Portal sessions follow account role and ownership; API keys require current account access to this host.
      responses:
        '200':
          description: Host
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Host' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Hosts]
      operationId: deleteHost
      summary: Delete a host
      description: API keys require current account ownership of this host. Host deletion unbinds every workspace and removes Host-only runtime data; independent workspace content is never deleted by this operation. A restore with an uncertain sandbox create is fenced from deletion until an operator reconciles the remote state.
      responses:
        '202':
          description: Host is being deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Host' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/hosts/{id}/control:
    parameters:
      - $ref: '#/components/parameters/HostId'
    get:
      tags: [Hosts]
      operationId: getHostControl
      summary: Get the AI and user control state for a host
      description: Portal sessions can inspect their owned hosts. API keys require current account access to observe this host. The active transition omits internal task snapshots and runtime receipts.
      responses:
        '200':
          description: Current control fence and active handoff, if any
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/hosts/{id}/release:
    parameters:
      - $ref: '#/components/parameters/HostId'
    post:
      tags: [Hosts]
      operationId: releaseHost
      summary: Release host compute while retaining data
      description: API keys require current account ownership of this host. The Host ID, owner, Workspace attachment, and runtime data volume are retained. Release is rejected while tasks or tool operations are active, a Host Workspace upload is uncommitted, a Host Workspace sync conflict remains, or user control is enabled. For these release conflicts, 409 details contain reason=host_release_uncommitted_sync, host_release_sync_conflict, or host_release_unsettled_operation and the validated workspace_id or task_id. A current-generation terminal session in creating, ready, or unknown state requires explicit confirmation that running shell processes may be terminated. Morde does not verify or explicitly kill GUI or PTY processes.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm_process_termination:
                  type: boolean
                  default: false
                  description: Accept that releasing the Host may terminate processes in an active terminal session. Omitted means false.
      responses:
        '202':
          description: Compute release is in progress
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Host' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/hosts/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/HostId'
    post:
      tags: [Hosts]
      operationId: restoreHost
      summary: Restore compute for a stopped host
      description: API keys require current account ownership of this host. Restore retains the Host ID, owner, Workspace, and runtime data volume, rotates the runtime credential, and advances one runtime generation. An uncertain sandbox create remains fenced for manual reconciliation.
      responses:
        '202':
          description: Restore is in progress or already underway
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Host' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/hosts/{id}/control/actions:
    parameters:
      - $ref: '#/components/parameters/HostId'
    post:
      tags: [Hosts]
      operationId: actOnHostControl
      summary: Hand control of a host between AI and the user
      description: Portal sessions can operate their owned hosts. API keys require current account permission to operate this host. Reuse the same request_id only to retry the exact same action with the same expected_control_version. Pending runtime operations leave the host fenced and return 202.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ControlActionRequest' }
      responses:
        '200':
          description: Handoff completed or accepted with no pending operations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlActionResponse' }
        '202':
          description: Handoff is waiting for active runtime operations to stop
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlActionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /__ch/api/applications:
    servers:
      - url: https://{host}
        variables:
          host:
            default: h1234567.hosts.morde.test
            description: Host-specific Gateway origin using the configured Host suffix.
    get:
      tags: [Host Gateway]
      operationId: getHostApplications
      summary: Get installed and installable applications on the current Host
      description: Host-owner session only. This Host Gateway route uses the host-scoped ch_host cookie and returns only fixed, validated application status and safe installation progress.
      security:
        - hostCookie: []
      responses:
        '200':
          description: Current Host runtime fence and fixed application catalog
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Pragma:
              schema: { type: string, const: no-cache }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostApplicationsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /__ch/api/applications/{app_id}/install:
    servers:
      - url: https://{host}
        variables:
          host:
            default: h1234567.hosts.morde.test
            description: Host-specific Gateway origin using the configured Host suffix.
    parameters:
      - name: app_id
        in: path
        required: true
        schema: { type: string, const: wechat }
    post:
      tags: [Host Gateway]
      operationId: installHostApplication
      summary: Install the fixed WeChat application on the current Host
      description: Host-owner session only. The same request_id is safe to retry for the same install; callers cannot choose a package URL, version, command, or install path.
      security:
        - hostCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HostApplicationInstallRequest' }
      responses:
        '202':
          description: Installation accepted, running, complete, or failed with safe progress state
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Pragma:
              schema: { type: string, const: no-cache }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostApplicationInstallResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /__ch/api/applications/{app_id}/launch:
    servers:
      - url: https://{host}
        variables:
          host:
            default: h1234567.hosts.morde.test
            description: Host-specific Gateway origin using the configured Host suffix.
    parameters:
      - name: app_id
        in: path
        required: true
        schema: { type: string, const: wechat }
    post:
      tags: [Host Gateway]
      operationId: launchHostApplication
      summary: Launch an installed allowlisted application
      description: Owner-only fixed-catalog application operation; the current allowlist contains WeChat. launch_id is the idempotency key; after a request with that ID reaches the Server, retries reconcile its exact Runtime operation and never send another launch request.
      security:
        - hostCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HostApplicationLaunchRequest' }
      responses:
        '202':
          description: Launch accepted or its persisted status is unknown and can be reconciled by launch_id
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Pragma:
              schema: { type: string, const: no-cache }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostApplicationLaunchResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /__ch/api/applications/{app_id}/launches/current:
    servers:
      - url: https://{host}
        variables:
          host:
            default: h1234567.hosts.morde.test
            description: Host-specific Gateway origin using the configured Host suffix.
    parameters:
      - name: app_id
        in: path
        required: true
        schema: { type: string, const: wechat }
    get:
      tags: [Host Gateway]
      operationId: getCurrentHostApplicationLaunch
      summary: Get the latest registered application launch
      description: Owner-only, non-cacheable status scoped to app_id. Returns 200 with operation null before any launch has been registered; otherwise it returns the persisted operation and may reconcile it with Runtime using its original Host fence.
      security:
        - hostCookie: []
      responses:
        '200':
          description: Current Host fence and the latest persisted operation, or null if none exists
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Pragma:
              schema: { type: string, const: no-cache }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostCurrentApplicationLaunchResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
        default: { $ref: '#/components/responses/Error' }
  /__ch/api/applications/{app_id}/launches/{launch_id}:
    servers:
      - url: https://{host}
        variables:
          host:
            default: h1234567.hosts.morde.test
            description: Host-specific Gateway origin using the configured Host suffix.
    parameters:
      - name: app_id
        in: path
        required: true
        schema: { type: string, const: wechat }
      - name: launch_id
        in: path
        required: true
        schema: { type: string, minLength: 8, maxLength: 128, pattern: '^launch_[A-Za-z0-9][A-Za-z0-9._:-]{0,120}$' }
    get:
      tags: [Host Gateway]
      operationId: getHostApplicationLaunch
      summary: Get a specific persisted application launch
      description: Owner-only, non-cacheable status for the exact app_id and launch_id. An unknown result remains unknown until Runtime provides a fenced outcome.
      security:
        - hostCookie: []
      responses:
        '200':
          description: Persisted operation and the original Runtime fence
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Pragma:
              schema: { type: string, const: no-cache }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostApplicationLaunchResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
        default: { $ref: '#/components/responses/Error' }
  /__ch/api/applications/{app_id}/launches/{launch_id}/stop:
    servers:
      - url: https://{host}
        variables:
          host:
            default: h1234567.hosts.morde.test
            description: Host-specific Gateway origin using the configured Host suffix.
    parameters:
      - name: app_id
        in: path
        required: true
        schema: { type: string, const: wechat }
      - name: launch_id
        in: path
        required: true
        schema: { type: string, minLength: 8, maxLength: 128, pattern: '^launch_[A-Za-z0-9][A-Za-z0-9._:-]{0,120}$' }
    post:
      tags: [Host Gateway]
      operationId: stopHostApplicationLaunch
      summary: Stop a specific application launch
      description: Owner-only stop for the exact app_id and persisted launch ID. Repeated requests can only stop that same launch and are safe to reconcile.
      security:
        - hostCookie: []
      responses:
        '202':
          description: Stop accepted or the persisted result is unknown
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Pragma:
              schema: { type: string, const: no-cache }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostApplicationLaunchResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/hosts/{id}/renew:
    parameters:
      - $ref: '#/components/parameters/HostId'
    post:
      tags: [Hosts]
      operationId: renewHost
      summary: Renew a host's lifetime
      description: API keys require current account ownership of this host.
      responses:
        '200':
          description: Host with updated expiry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Host' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/hosts/{id}/enter:
    parameters:
      - $ref: '#/components/parameters/HostId'
    post:
      tags: [Hosts]
      operationId: enterHost
      summary: Issue a one-time ticket to enter a host
      description: Portal sessions and native client credentials may enter a host they own. Administrators may view and manage other hosts but cannot enter them. A native client ticket binds the resulting Gateway cookie to its revocable installation.
      security:
        - portalSession: []
        - bearerToken: []
      responses:
        '200':
          description: One-time host entry URL
          content:
            application/json:
              schema:
                type: object
                required: [url, expires_at]
                properties:
                  url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/hosts/{id}/members:
    parameters:
      - $ref: '#/components/parameters/HostId'
    post:
      tags: [Host sharing]
      operationId: inviteHostMember
      summary: Grant an existing user scoped access to a host
      description: Owner-only. Accepts desktop:view, desktop:control, terminal:control, and mcp:control in any de-duplicated combination. desktop:control also grants desktop:view. MCP use also requires a valid caller-owned API Key and current permission to observe or operate this Host; revoked sharing access is checked again for each operation. No Workspace access, Host management, or re-sharing is granted.
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HostMemberInviteRequest' }
      responses:
        '201':
          description: Member grant created or restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostMember' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    get:
      tags: [Host sharing]
      operationId: listHostMembers
      summary: List members granted access to a host
      description: Owner-only.
      security:
        - portalSession: []
      responses:
        '200':
          description: Active member grants
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/HostMember' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/hosts/{id}/members/{user_id}:
    parameters:
      - $ref: '#/components/parameters/HostId'
      - name: user_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/UserId' }
    delete:
      tags: [Host sharing]
      operationId: revokeHostMember
      summary: Revoke a member's access to a host
      description: Owner-only. New Gateway requests are denied after revocation. Existing desktop and terminal streams recheck the exact permission every five seconds and close when it is revoked.
      security:
        - portalSession: []
      responses:
        '204': { description: Member grant revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/shared-hosts:
    get:
      tags: [Host sharing]
      operationId: listSharedHosts
      summary: List hosts shared with the current user
      description: Returns only the host identity, state, URL, and granted permissions; it does not expose workspace contents or management controls.
      security:
        - portalSession: []
        - bearerToken: []
      responses:
        '200':
          description: Hosts shared with the current user
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SharedHost' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /api/hosts/{id}/observation-ticket:
    parameters:
      - $ref: '#/components/parameters/HostId'
    post:
      tags: [Host sharing]
      operationId: issueHostObservationTicket
      summary: Issue a one-time ticket for an authorized desktop or terminal user
      description: The current Portal user or native client must own the host or have the permission selected by target. Native clients may request desktop observation only. The default target is desktop and requires desktop:view (also implied by desktop:control); Portal sessions may request terminal when granted terminal:control. The resulting Host cookie keeps member identity separate from Host ownership; every Gateway request rechecks the exact permission and client installation state.
      security:
        - portalSession: []
        - bearerToken: []
      parameters:
        - name: target
          in: query
          required: false
          description: Entry surface. Unknown or repeated query parameters are rejected.
          schema:
            type: string
            enum: [desktop, terminal]
            default: desktop
      responses:
        '200':
          description: One-time Host entry URL scoped to the requested surface
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                required: [url, expires_at]
                properties:
                  url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/hosts/{id}/preview-auth:
    parameters:
      - $ref: '#/components/parameters/HostId'
      - name: port
        in: query
        required: true
        schema: { type: integer, minimum: 1, maximum: 65535 }
      - name: next
        in: query
        required: false
        schema: { type: string, maxLength: 8192 }
    get:
      tags: [Hosts]
      operationId: authorizeHostPreview
      summary: Redirect through a one-time, port-scoped preview ticket
      description: Requires the host owner's Portal session. The ticket only authorizes the requested preview port and cannot enter the Workbench or another preview port.
      security:
        - portalSession: []
      responses:
        '302':
          description: Redirect to the selected private preview after issuing a one-time ticket
          headers:
            Location: { schema: { type: string, format: uri } }
            Cache-Control: { schema: { type: string, const: no-store } }
            Referrer-Policy: { schema: { type: string, const: no-referrer } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/sites:
    get:
      tags: [Sites]
      operationId: listSites
      summary: List Sites owned by the current user
      description: Requires the owner's Portal Session. Results are ordered by creation time and Site ID descending and use bounded cursor pagination.
      security:
        - portalSession: []
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: Owner's Site page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SitePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Sites]
      operationId: createSite
      summary: Create a Site bound to an owned Host and Workspace
      description: Requires the owner’s Portal Session, a running owned Host, and an active binding to the owned Workspace. The request is idempotent; reuse the Idempotency-Key only for the same Host and Workspace.
      security:
        - portalSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSiteRequest' }
      responses:
        '201':
          description: Site created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Site' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        default: { $ref: '#/components/responses/Error' }
  /api/sites/{id}/releases:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    get:
      tags: [Sites]
      operationId: listSiteReleases
      summary: List releases for an owned Site
      description: Requires the Site owner's Portal Session. Site ownership is checked before querying releases; inaccessible Sites return the same 404 as missing Sites. Results are ordered by creation time and release ID descending with bounded cursor pagination.
      security:
        - portalSession: []
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: Site release page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteReleasePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Sites]
      operationId: createSiteCandidateRelease
      summary: Create a candidate from a fixed Workspace revision
      description: Requires the Site owner’s Portal Session. The Workspace is inherited from the Site; the server computes and pins the digest for the supplied immutable revision. The service port must meet the configured preview-port policy. Reuse the Idempotency-Key only for the exact same revision and port.
      security:
        - portalSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSiteCandidateRequest' }
      responses:
        '201':
          description: Candidate created; it has not been materialized or run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteRelease' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        default: { $ref: '#/components/responses/Error' }
  /api/sites/{id}/releases/{release_id}/materialize:
    parameters:
      - $ref: '#/components/parameters/SiteId'
      - $ref: '#/components/parameters/SiteReleaseId'
    post:
      tags: [Sites]
      operationId: materializeSiteRelease
      summary: Materialize an immutable candidate artifact
      description: Requires the Site owner’s Portal Session. Runs synchronously within the request context and is idempotent for the same Site and Release. It copies and verifies only the pinned Workspace revision into private artifact storage. The response remains in candidate state; this operation does not execute project code, probe health, promote a Release, or expose a URL. Failures return sanitized API errors; GET release status may expose only the bounded failure_code enum, never raw errors or paths.
      security:
        - portalSession: []
      responses:
        '200':
          description: Candidate materialization status; state remains candidate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteRelease' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/sites/{id}/releases/{release_id}:
    parameters:
      - $ref: '#/components/parameters/SiteId'
      - $ref: '#/components/parameters/SiteReleaseId'
    get:
      tags: [Sites]
      operationId: getSiteRelease
      summary: Read candidate materialization status
      description: Requires the Site owner’s Portal Session. A stored failure is represented only by failure_code from the bounded enum; raw error text, filesystem paths, and credentials are never returned.
      security:
        - portalSession: []
      responses:
        '200':
          description: Release status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteRelease' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/workspaces:
    get:
      tags: [Workspaces]
      operationId: listWorkspaces
      summary: List independent workspaces
      security:
        - portalSession: []
        - bearerToken: []
      responses:
        '200':
          description: Workspaces
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Workspaces]
      operationId: createWorkspace
      summary: Create an independent workspace
      description: Creates metadata and an empty durable file root without creating or starting a Host. Requires an idempotency key.
      security:
        - portalSession: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkspaceRequest' }
      responses:
        '201':
          description: Workspace created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/workspaces/{id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      operationId: getWorkspace
      summary: Get workspace metadata and current revision
      security:
        - portalSession: []
        - bearerToken: []
      responses:
        '200':
          description: Workspace metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Workspaces]
      operationId: deleteWorkspace
      summary: Delete a workspace
      security:
        - portalSession: []
      responses:
        '202':
          description: Workspace is being deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/workspaces/{id}/manifest:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      operationId: getWorkspaceManifest
      summary: Read a workspace file snapshot
      description: Returns the immutable manifest at a pinned revision. All paths are normalized, relative paths; entries outside the requested path scope are omitted.
      security:
        - portalSession: []
        - bearerToken: []
      parameters:
        - name: revision
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 1 }
        - name: prefix
          in: query
          required: false
          schema: { type: string, maxLength: 1024 }
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 512 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
      responses:
        '200':
          description: Immutable workspace manifest
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceManifest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/workspaces/{id}/changes:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      operationId: getWorkspaceChanges
      summary: Read changes after a durable workspace cursor
      description: Supports bounded long polling for paired PC and Host replicas. A stale cursor returns 409 and requires a fresh manifest comparison; a missing or offline replica never implies deletion.
      security:
        - portalSession: []
        - bearerToken: []
      parameters:
        - name: after
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 512 }
        - name: wait_seconds
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 25, default: 20 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        '200':
          description: Ordered workspace changes and next cursor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceChangePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/workspaces/{id}/sync-progress:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      operationId: listDeviceWorkspaceSyncProgress
      summary: Read active desktop synchronization progress
      description: Portal sessions only. Returns the current Workspace revision, committed logical bytes, configured quota, remaining committed capacity, quota admission state, and only the latest active session for each currently authorized device. Quota state is available below the limit, full at the limit, and over_quota above it; shrinking and deletion remain allowed when full or over quota. Confirmed bytes mean durably acknowledged blocks; download action counts mean files applied. File paths and conflicts are omitted. Usage is based on committed explicit sync revisions and is not yet a ledger for direct Syncthing writes.
      security:
        - portalSession: []
      responses:
        '200':
          description: Active progress summaries for authorized devices
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceWorkspaceSyncProgressSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/workspaces/{id}/sync-device-challenges:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Workspaces]
      operationId: createWorkspaceSyncDeviceChallenge
      summary: Start a Syncthing device registration proof
      description: Desktop client credential only. The certificate is public DER encoded as base64; the service derives and verifies its Syncthing Device ID, then returns a five-minute signing payload bound to this Workspace and installation. Sign the decoded signing_payload bytes with the certificate private key. At most eight challenges may be outstanding per installation. This endpoint does not enable synchronization; the folder remains pending until a server node is provisioned.
      security:
        - clientCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkspaceSyncDeviceChallengeRequest' }
      x-morde-max-body-bytes: 32768
      responses:
        '201':
          description: One-time device proof challenge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceSyncDeviceChallenge' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/workspaces/{id}/sync-devices:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      operationId: listWorkspaceSyncDevices
      summary: List Workspace Syncthing device bindings
      description: Portal sessions only. Includes pending, active, revoking, and revoked bindings for this Workspace so authorized users can inspect and revoke a specific device. Certificate private material is never returned.
      security:
        - portalSession: []
      responses:
        '200':
          description: Workspace device bindings
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/WorkspaceSyncDeviceBinding' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Workspaces]
      operationId: registerWorkspaceSyncDevice
      summary: Register a proven Syncthing device for a Workspace
      description: Desktop client credential only. The proof is single-use, bound to the current installation, and idempotent by key. Success returns the authorized server node ID and pinned private relay URI after the node config is applied.
      security:
        - clientCredential: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._~-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterWorkspaceSyncDeviceRequest' }
      x-morde-max-body-bytes: 32768
      responses:
        '200':
          description: Workspace device binding and server connection details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceSyncDeviceBinding' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Workspaces]
      operationId: revokeWorkspaceSyncDevice
      summary: Revoke a Workspace Syncthing device binding
      description: Revokes only the selected device binding. The owning portal session is required; the account and installation remain otherwise unchanged.
      security:
        - portalSession: []
      parameters:
        - name: binding_id
          in: path
          required: true
          schema: { type: string, pattern: '^d[a-z0-9]{7}$' }
      responses:
        '204': { description: Binding revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/workspaces/{id}/sync-sessions:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Workspaces]
      operationId: createWorkspaceSyncSession
      summary: Plan an upload, missing-only download, merge, or live synchronization batch
      description: The client submits its scoped manifest. The service pins the base revision and returns required chunks and conflicts. For Host replica downloads or bidirectional sessions, base_revision cannot exceed the Host binding's applied_revision. Newly planned uploads reject any file larger than 314572800 bytes with 413; unchanged existing files remain readable and are not re-uploaded by this rule. A session is resumable and idempotent; omitted files never imply deletion.
      security:
        - portalSession: []
        - bearerToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSyncSessionRequest' }
      x-morde-max-body-bytes: 16777216
      responses:
        '201':
          description: Transfer plan and resumable session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        default: { $ref: '#/components/responses/Error' }
  /api/workspaces/{id}/sync-sessions/{session_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: session_id
        in: path
        required: true
        schema: { type: string, pattern: '^p[a-z0-9]{7}$' }
    get:
      tags: [Workspaces]
      operationId: getWorkspaceSyncSession
      summary: Read transfer progress and conflicts
      security:
        - portalSession: []
        - bearerToken: []
      responses:
        '200':
          description: Current durable transfer state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/workspaces/{id}/sync-sessions/{session_id}/commit:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: session_id
        in: path
        required: true
        schema: { type: string, pattern: '^p[a-z0-9]{7}$' }
    post:
      tags: [Workspaces]
      operationId: commitWorkspaceSyncSession
      summary: Verify and commit the transfer plan
      description: Rechecks the pinned base revision and received chunks. Changed paths return conflicts; unrelated files may commit independently. Durable block acknowledgement is separate from destination application acknowledgement.
      security:
        - portalSession: []
        - bearerToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Verified result and current revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/workspaces/{id}/sync-sessions/{session_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: session_id
        in: path
        required: true
        schema: { type: string, pattern: '^p[a-z0-9]{7}$' }
    post:
      tags: [Workspaces]
      operationId: cancelWorkspaceSyncSession
      summary: Stop future transfer work
      description: Cancellation retains acknowledged chunks and already applied files. It never deletes source content or reverts destination writes.
      security:
        - portalSession: []
        - bearerToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Cancelled session state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/workspaces/{id}/sync-sessions/{session_id}/blocks/{digest}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: session_id
        in: path
        required: true
        schema: { type: string, pattern: '^p[a-z0-9]{7}$' }
      - name: digest
        in: path
        required: true
        schema: { type: string, pattern: '^[a-f0-9]{64}$' }
    put:
      tags: [Workspaces]
      operationId: putWorkspaceSyncBlock
      summary: Upload one verified chunk
      description: Raw chunk bytes, 4 MiB maximum. A success response is sent only after the block is durably written and SHA-256 verified. Chunks are never deduplicated across workspaces.
      security:
        - portalSession: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary, maxLength: 4194304 }
      responses:
        '204': { description: Chunk durably acknowledged }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        default: { $ref: '#/components/responses/Error' }
    get:
      tags: [Workspaces]
      operationId: getWorkspaceSyncBlock
      summary: Download one required chunk
      security:
        - portalSession: []
        - bearerToken: []
      responses:
        '200':
          description: Verified chunk bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary, maxLength: 4194304 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/workspaces/{id}/sync-sessions/{session_id}/blocks/{digest}/ack:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: session_id
        in: path
        required: true
        schema: { type: string, pattern: '^p[a-z0-9]{7}$' }
      - name: digest
        in: path
        required: true
        schema: { type: string, pattern: '^[a-f0-9]{64}$' }
    post:
      tags: [Workspaces]
      operationId: ackWorkspaceSyncBlock
      summary: Confirm a downloaded block is durably available locally
      description: Call only after the required block has been verified and saved to durable local transfer state. A separate download-action acknowledgment confirms the full file operation.
      security:
        - portalSession: []
        - bearerToken: []
      responses:
        '204': { description: Downloaded block durably acknowledged }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/workspaces/{id}/sync-sessions/{session_id}/download-actions/ack:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: session_id
        in: path
        required: true
        schema: { type: string, pattern: '^p[a-z0-9]{7}$' }
    post:
      tags: [Workspaces]
      operationId: ackWorkspaceSyncDownloadAction
      summary: Confirm one downloaded file operation was safely applied
      description: Acknowledge an upsert only after full-file verification and durable atomic application, or a delete only after safe removal and parent-directory sync.
      security:
        - portalSession: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceSyncDownloadActionAck' }
      responses:
        '204': { description: Download action durably acknowledged }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        default: { $ref: '#/components/responses/Error' }
  /api/hosts/{id}/workspace-bindings:
    parameters:
      - $ref: '#/components/parameters/HostId'
    get:
      tags: [Hosts]
      operationId: listHostWorkspaceBindings
      summary: List workspaces bound to a host
      description: Portal sessions follow account role and ownership; API keys require current account access to this host.
      security:
