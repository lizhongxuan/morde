        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
    get:
      tags: [Tasks]
      operationId: getConversationMessageUpload
      summary: Read upload progress
      security: [{ portalSession: [] }, { clientCredential: [] }]
      responses:
        '200':
          description: Upload state and received chunks; committed state contains the receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationMessageUpload' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/conversations/{id}/message-uploads/{client_message_id}/chunks/{sequence}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ConversationId' }
      - name: client_message_id
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9._~-]{8,128}$' }
      - { $ref: '#/components/parameters/ServiceInstanceID' }
      - { $ref: '#/components/parameters/MessageActor' }
      - name: sequence
        in: path
        required: true
        schema: { type: integer, minimum: 0, maximum: 511 }
    put:
