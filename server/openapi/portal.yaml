            application/json:
              schema: { $ref: '#/components/schemas/ConversationPage' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Tasks]
      operationId: createConversation
      summary: Create a persistent cloud task conversation
      description: A conversation is independent of any Host. A Host may be selected separately for each task.
      security: [{ portalSession: [] }, { clientCredential: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/OptionalServiceInstanceID' }
        - { $ref: '#/components/parameters/OptionalMessageActor' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateConversationRequest' }
      responses:
        '201':
          description: Created conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '200':
          description: Exact idempotent replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        default: { $ref: '#/components/responses/Error' }
  /api/conversations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ConversationId' }
    get:
      tags: [Tasks]
      operationId: getConversation
      summary: Get an owned conversation
      security: [{ portalSession: [] }, { clientCredential: [] }]
      responses:
        '200':
          description: Conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
  /api/conversations/{id}/tasks:
    parameters:
      - name: id
        in: path
