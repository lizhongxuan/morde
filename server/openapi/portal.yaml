          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskWorkspaceViewDeletion' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Tasks]
      operationId: requestTaskWorkspaceViewDeletion
