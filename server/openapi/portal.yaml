        kind: { type: string, enum: [plan, model, tool, wait, clarification, budget, verification, verify, batch_item, batch_result, subagent, result] }
        status: { type: string, enum: [queued, running, waiting_user, succeeded, failed, unknown] }
        title: { type: string }
