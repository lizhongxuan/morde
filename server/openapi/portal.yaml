      required: [owner_id, retention_days, limit_bytes, used_bytes, reserved_bytes, version, updated_at]
      properties:
        owner_id: { $ref: '#/components/schemas/UserId' }
        retention_days: { type: integer, format: int32, minimum: 1, maximum: 3650 }
        limit_bytes: { type: integer, format: int64, minimum: 1 }
        used_bytes: { type: integer, format: int64, minimum: 0 }
        reserved_bytes: { type: integer, format: int64, minimum: 0 }
        version: { type: integer, format: int64, minimum: 1 }
        updated_at: { type: string, format: date-time }
      additionalProperties: false
    RecordAdminGrant:
      type: object
      required: [owner_id, admin_id, capability, granted, granted_by, version, updated_at]
      properties:
        owner_id: { $ref: '#/components/schemas/UserId' }
        admin_id: { $ref: '#/components/schemas/UserId' }
        capability: { $ref: '#/components/schemas/RecordCapability' }
        granted: { type: boolean }
        granted_by: { $ref: '#/components/schemas/UserId' }
        version: { type: integer, format: int64, minimum: 1 }
        updated_at: { type: string, format: date-time }
      additionalProperties: false
    AdminRecordSettings:
      type: object
      required: [owner_id, consents, quota, grants]
      properties:
        owner_id: { $ref: '#/components/schemas/UserId' }
        consents: { type: array, items: { $ref: '#/components/schemas/RecordConsent' } }
        quota: { $ref: '#/components/schemas/RecordQuota' }
        grants: { type: array, items: { $ref: '#/components/schemas/RecordAdminGrant' } }
      additionalProperties: false
    AdminRecordAccess:
      type: object
      required: [capabilities, consents]
      properties:
        capabilities:
          type: array
          items: { $ref: '#/components/schemas/RecordCapability' }
        consents: { type: array, items: { $ref: '#/components/schemas/RecordConsent' } }
      additionalProperties: false
    SetAdminRecordQuotaRequest:
      type: object
      required: [expected_version, retention_days, limit_bytes]
      properties:
        expected_version: { type: integer, format: int64, minimum: 1 }
        retention_days: { type: integer, format: int32, minimum: 1, maximum: 3650 }
        limit_bytes: { type: integer, format: int64, minimum: 1 }
      additionalProperties: false
    SetAdminRecordGrantRequest:
      type: object
      required: [admin_id, capability, granted]
      properties:
        admin_id: { $ref: '#/components/schemas/UserId' }
        capability: { $ref: '#/components/schemas/RecordCapability' }
        granted: { type: boolean }
      additionalProperties: false
    RecordMetadata:
      type: object
      required: [id, owner_id, purpose, kind, consent_version, created_at, expires_at, payload_bytes, attachment_bytes, attachment_count, state]
      properties:
        id: { $ref: '#/components/schemas/RecordId' }
        owner_id: { $ref: '#/components/schemas/UserId' }
        purpose: { $ref: '#/components/schemas/RecordPurpose' }
        kind: { type: string, enum: [turn, sample] }
        consent_version: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        payload_bytes: { type: integer, format: int64, minimum: 0 }
        attachment_bytes: { type: integer, format: int64, minimum: 0 }
        attachment_count: { type: integer, format: int32, minimum: 0 }
        state: { type: string, enum: [active] }
      additionalProperties: false
    RecordPage:
      type: object
      required: [items, next_before]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RecordMetadata' } }
        next_before: { type: string, pattern: '^(|v[a-z0-9]{7})$' }
      additionalProperties: false
    RecordCaptureStatus:
      type: object
      required: [id, task_id, purpose, kind, state, failure_code, captured_at, expires_at]
      properties:
        id: { $ref: '#/components/schemas/RecordCaptureQueueId' }
        task_id: { $ref: '#/components/schemas/TaskId' }
        purpose: { $ref: '#/components/schemas/RecordPurpose' }
        kind: { type: string, enum: [turn, sample] }
        state: { type: string, enum: [queued, leased, stored, rejected, failed] }
        failure_code: { type: string, maxLength: 64, pattern: '^[a-z0-9_]*$' }
        captured_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
      additionalProperties: false
    RecordCaptureStatusPage:
      type: object
      required: [items, next_before]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RecordCaptureStatus' } }
        next_before: { type: string, pattern: '^(|j[a-z0-9]{7})$' }
      additionalProperties: false
    RecordContent:
      type: object
      required: [metadata, payload]
      properties:
        metadata: { $ref: '#/components/schemas/RecordMetadata' }
        payload: { description: Valid JSON record payload with known secret formats and Vault markers rejected. }
      additionalProperties: false
    RecordAttachment:
      type: object
      required: [id, record_id, file_name, media_type, size_bytes, sha256]
      properties:
        id: { $ref: '#/components/schemas/RecordAttachmentId' }
        record_id: { $ref: '#/components/schemas/RecordId' }
        file_name: { type: string, minLength: 1, maxLength: 255 }
        media_type: { type: string, minLength: 1, maxLength: 128 }
        size_bytes: { type: integer, format: int64, minimum: 1 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
      additionalProperties: false
    RecordAttachmentPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RecordAttachment' } }
      additionalProperties: false
    RecordDeleteTombstone:
      type: object
      required: [id, owner_id, record_id, state, attempts, requested_at]
      properties:
        id: { type: string, pattern: '^l[a-z0-9]{7}$' }
        owner_id: { $ref: '#/components/schemas/UserId' }
        record_id: { $ref: '#/components/schemas/RecordId' }
        state: { type: string, enum: [pending, failed, completed] }
        attempts: { type: integer, format: int32, minimum: 0 }
        requested_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
      additionalProperties: false
    CreateAdminControlRuleRequest:
      type: object
      required: [threshold]
      properties:
        threshold: { type: integer, format: int64, minimum: 1 }
        note: { type: string, maxLength: 500 }
      additionalProperties: false
    UpdateAdminControlRuleRequest:
      type: object
      required: [expected_version]
      properties:
        expected_version: { type: integer, format: int64, minimum: 1 }
        threshold: { type: integer, format: int64, minimum: 1 }
        enabled: { type: boolean }
        note: { type: string, maxLength: 500 }
        rearm: { type: boolean, default: false }
      additionalProperties: false
    AdminUsageSummary:
      type: object
      required: [calls, settled_calls, unknown_calls, input_tokens, output_tokens, active_accounts]
      properties:
        calls: { type: integer, format: int64, minimum: 0 }
        settled_calls: { type: integer, format: int64, minimum: 0 }
        unknown_calls: { type: integer, format: int64, minimum: 0 }
        input_tokens: { type: integer, format: int64, minimum: 0 }
        output_tokens: { type: integer, format: int64, minimum: 0 }
        active_accounts: { type: integer, format: int64, minimum: 0 }
      additionalProperties: false
    AdminUsageDay:
      type: object
      required: [date, calls, input_tokens, output_tokens, active_accounts]
      properties:
        date: { type: string, format: date }
        calls: { type: integer, format: int64, minimum: 0 }
        input_tokens: { type: integer, format: int64, minimum: 0 }
        output_tokens: { type: integer, format: int64, minimum: 0 }
        active_accounts: { type: integer, format: int64, minimum: 0 }
      additionalProperties: false
    AdminUsageModel:
      type: object
      required: [model_id, calls, input_tokens, output_tokens]
      properties:
        model_id: { type: string }
        calls: { type: integer, format: int64, minimum: 0 }
        input_tokens: { type: integer, format: int64, minimum: 0 }
        output_tokens: { type: integer, format: int64, minimum: 0 }
      additionalProperties: false
    AdminStats:
      type: object
      required: [users, platforms, cohorts, version_tracking_available]
      properties:
        users: { $ref: '#/components/schemas/AdminUserStats' }
        platforms: { type: array, items: { $ref: '#/components/schemas/AdminPlatformStats' } }
        cohorts: { type: array, items: { $ref: '#/components/schemas/AdminCohortStats' } }
        version_tracking_available: { type: boolean }
      additionalProperties: false
    AdminUserStats:
      type: object
      required: [total, approved, pending, rejected, disabled]
      properties:
        total: { type: integer, format: int64, minimum: 0 }
        approved: { type: integer, format: int64, minimum: 0 }
        pending: { type: integer, format: int64, minimum: 0 }
        rejected: { type: integer, format: int64, minimum: 0 }
        disabled: { type: integer, format: int64, minimum: 0 }
      additionalProperties: false
    AdminPlatformStats:
      type: object
      required: [platform, installations, active_installations, users]
      properties:
        platform: { type: string, enum: [desktop, android, ios] }
        installations: { type: integer, format: int64, minimum: 0, description: Total installation records, including revoked records. }
        active_installations: { type: integer, format: int64, minimum: 0, description: Unrevoked, unexpired installations used in the trailing 30 days. }
        users: { type: integer, format: int64, minimum: 0 }
      additionalProperties: false
    AdminCohortStats:
      type: object
      required: [week, signups, with_installation]
      properties:
        week: { type: string, pattern: '^\d{4}-W\d{2}$' }
        signups: { type: integer, format: int64, minimum: 0 }
        with_installation: { type: integer, format: int64, minimum: 0, description: Accounts which ever had a client installation; not a retention measure. }
      additionalProperties: false
    AdminWorkspaceBinding:
      type: object
      required: [host_id, host_name, state, sync_state, desired_revision, applied_revision]
      properties:
        host_id: { $ref: '#/components/schemas/HostId' }
        host_name: { type: string }
        state: { type: string, enum: [preparing, active, unbinding, detached, failed] }
        sync_state: { type: string, enum: [healthy, conflict] }
        desired_revision: { type: integer, format: int64, minimum: 0 }
        applied_revision: { type: integer, format: int64, minimum: 0 }
      additionalProperties: false
    AdminWorkspace:
      type: object
      required: [id, owner_id, owner_name, name, state, revision, used_bytes, quota_bytes, created_at, updated_at, bindings]
      properties:
        id: { $ref: '#/components/schemas/WorkspaceId' }
        owner_id: { $ref: '#/components/schemas/UserId' }
        owner_name: { type: string }
        name: { type: string }
        state: { type: string, enum: [ready, deleting] }
        revision: { type: integer, format: int64, minimum: 0 }
        used_bytes: { type: integer, format: int64, minimum: 0 }
        quota_bytes: { type: integer, format: int64, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        bindings:
          type: array
          items: { $ref: '#/components/schemas/AdminWorkspaceBinding' }
      additionalProperties: false
    AdminWorkspacePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminWorkspace' }
        next_cursor: { type: [string, 'null'], minLength: 1, description: Opaque cursor for the next page; null when exhausted. }
      additionalProperties: false
    UpdateUserRequest:
      type: object
      required: [expected_status]
      minProperties: 2
      additionalProperties: false
      properties:
        expected_status: { $ref: '#/components/schemas/AccountStatus' }
        status: { $ref: '#/components/schemas/AccountStatus' }
        role: { $ref: '#/components/schemas/UserRole' }
        quota: { $ref: '#/components/schemas/Quota' }
        default_host_resources: { $ref: '#/components/schemas/HostResourcesTarget' }
