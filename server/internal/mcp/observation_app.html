<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Morde 桌面观察</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 16px; color: CanvasText; background: Canvas; }
    .card { max-width: 960px; margin: auto; }
    .heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    h1 { margin: 0; font-size: 1.1rem; }
    .badge { border: 1px solid currentColor; border-radius: 999px; padding: 4px 10px; font-size: .82rem; }
    .status { margin: 12px 0; color: GrayText; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; margin: 12px 0; }
    dt { color: GrayText; }
    dd { margin: 0; overflow-wrap: anywhere; }
    img { display: block; max-width: 100%; max-height: 70vh; margin: 14px auto 0; object-fit: contain; border-radius: 8px; }
    img[hidden] { display: none; }
    .note { color: GrayText; font-size: .85rem; }
  </style>
</head>
<body>
  <main class="card">
    <div class="heading">
      <h1>云端电脑画面</h1>
      <span id="badge" class="badge" aria-live="polite">等待授权截图</span>
    </div>
    <p id="status" class="status" role="status" aria-live="polite">等待 MCP 主机连接。</p>
    <dl>
      <dt>目标主机</dt><dd id="target">等待工具调用</dd>
      <dt>画面时间</dt><dd id="captured">尚无画面</dd>
    </dl>
    <img id="screen" alt="云端电脑桌面截图" hidden>
    <p class="note">此卡片只显示单次授权截图，不提供电脑操作，也不会自动刷新画面。</p>
  </main>
  <script>
    (() => {
      const target = document.getElementById("target");
      const captured = document.getElementById("captured");
      const badge = document.getElementById("badge");
      const status = document.getElementById("status");
      const screen = document.getElementById("screen");
      const pending = new Map();
      let nextID = 1;
      let hostID = "";
      let capturedAt = 0;
      let bridgeConnected = false;
      let hasSnapshot = false;
      let snapshotPending = false;
      let snapshotError = false;
      let snapshotCancelled = false;

      function request(method, params, timeoutMs) {
        const id = nextID++;
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => {
            pending.delete(id);
            reject(new Error("MCP host did not respond"));
          }, timeoutMs);
          pending.set(id, { resolve, reject, timer });
          window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
        });
      }

      function notify(method, params) {
        window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
      }

      function renderState() {
        if (!bridgeConnected) {
          badge.textContent = hasSnapshot ? "已断流" : "未连接";
          status.textContent = hasSnapshot ? "MCP 连接中断；保留的画面已过期。" : "MCP 主机连接不可用。";
          return;
        }
        if (!hasSnapshot) {
          if (snapshotCancelled) {
            badge.textContent = "截图已取消";
            status.textContent = "截图请求已取消。可重新请求快照。";
            return;
          }
          if (snapshotError) return;
          if (snapshotPending) {
            badge.textContent = "截图进行中";
            status.textContent = "正在读取已授权主机的桌面画面。";
            return;
          }
          badge.textContent = "已连接";
          status.textContent = "等待授权截图。";
          return;
        }
        if (Date.now() - capturedAt > 30000) {
          badge.textContent = "画面已过期";
          status.textContent = "MCP 主机可达；此截图已过期，不代表当前实时画面。";
          return;
        }
        badge.textContent = "快照新鲜 · 非实时";
        status.textContent = "MCP 主机可达；这是一次性截图，不是实时画面。";
      }

      function showResult(result) {
        snapshotPending = false;
        if (result && result.isError === true) {
          hasSnapshot = false;
          snapshotError = true;
          snapshotCancelled = false;
          screen.removeAttribute("src");
          screen.hidden = true;
          captured.textContent = "请求未成功";
          badge.textContent = "截图失败";
          status.textContent = "截图操作未成功；请查看调用结果后重试。";
          return;
        }
        const metadata = result && result._meta && result._meta["io.morde/observation"];
        const resultHost = metadata && typeof metadata.host_id === "string" ? metadata.host_id : "";
        const timestamp = metadata && typeof metadata.observed_at === "string" ? Date.parse(metadata.observed_at) : NaN;
        const image = result && Array.isArray(result.content) ? result.content.find((item) =>
          item && item.type === "image" && item.mimeType === "image/jpeg" &&
          typeof item.data === "string" && item.data.length > 0 && item.data.length <= 700000 &&
          /^[A-Za-z0-9+/]+={0,2}$/.test(item.data)
        ) : null;
        if (!image || !resultHost || resultHost !== hostID || !Number.isFinite(timestamp)) {
          hasSnapshot = false;
          snapshotError = true;
          snapshotCancelled = false;
          screen.removeAttribute("src");
          screen.hidden = true;
          captured.textContent = "无法验证截图目标或时间";
          badge.textContent = "截图无效";
          status.textContent = "截图响应缺少有效的目标、时间或 JPEG 画面。";
          return;
        }
        capturedAt = timestamp;
        hasSnapshot = true;
        snapshotError = false;
        snapshotCancelled = false;
        target.textContent = resultHost;
        captured.textContent = new Intl.DateTimeFormat(undefined, { dateStyle: "medium", timeStyle: "medium" }).format(timestamp);
        screen.src = `data:image/jpeg;base64,${image.data}`;
        screen.hidden = false;
        renderState();
      }

      window.addEventListener("message", (event) => {
        if (event.source !== window.parent || !event.data || event.data.jsonrpc !== "2.0") return;
        const message = event.data;
        if (pending.has(message.id)) {
          const call = pending.get(message.id);
          pending.delete(message.id);
          clearTimeout(call.timer);
          if (message.error) call.reject(new Error("MCP host request failed"));
          else call.resolve(message.result);
          return;
        }
        if (message.method === "ui/resource-teardown" && message.id !== undefined) {
          window.parent.postMessage({ jsonrpc: "2.0", id: message.id, result: {} }, "*");
          bridgeConnected = false;
          renderState();
          return;
        }
        if (message.method === "ui/notifications/tool-input") {
          const args = message.params && message.params.arguments;
          hostID = args && typeof args.host_id === "string" ? args.host_id : "";
          capturedAt = 0;
          hasSnapshot = false;
          snapshotError = false;
          snapshotCancelled = false;
          screen.removeAttribute("src");
          screen.hidden = true;
          captured.textContent = "等待画面";
          target.textContent = hostID || "未知目标";
          snapshotPending = true;
          renderState();
          return;
        }
        if (message.method === "ui/notifications/tool-result") {
          showResult(message.params);
          return;
        }
        if (message.method === "ui/notifications/tool-cancelled") {
          snapshotPending = false;
          snapshotCancelled = true;
          captured.textContent = "请求已取消";
          renderState();
          return;
        }
      });

      async function checkConnection() {
        try {
          await request("ping", {}, 5000);
          bridgeConnected = true;
        } catch {
          bridgeConnected = false;
        }
        renderState();
      }

      request("ui/initialize", {
        appCapabilities: {},
        appInfo: { name: "morde-desktop-observation", title: "Morde 桌面观察", version: "1.0.0" },
        protocolVersion: "2026-01-26"
      }, 5000).then(() => {
        bridgeConnected = true;
        notify("ui/notifications/initialized", {});
        renderState();
        setInterval(checkConnection, 10000);
      }).catch(() => {
        bridgeConnected = false;
        renderState();
      });
      setInterval(renderState, 1000);
    })();
  </script>
</body>
</html>
