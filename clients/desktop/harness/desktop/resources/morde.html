<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'">
<title>Morde</title><link rel="stylesheet" href="morde.css"></head>
<body>
<header><strong>Morde</strong><span id="account"></span><nav id="navigation" hidden><button id="web" type="button">AI 助手</button><button id="account-settings" type="button">账户设置</button><button id="local-sync" type="button">本机同步</button><button id="logout" type="button">退出登录</button></nav></header>
<main>
  <section id="login"><h1>登录 Morde</h1><p>使用你的 Morde 账号登录。此电脑会自动获得授权。</p>
    <form id="login-form"><label>服务地址<input id="origin" type="url" placeholder="https://your-morde.example" autocomplete="url" required></label>
      <label>账号<input id="name" type="text" autocomplete="username" required></label>
      <label>密码<input id="password" type="password" autocomplete="current-password" required></label>
      <button id="submit" type="submit">登录</button></form>
    <p><button id="register" class="text-button" type="button">注册账号</button><button id="download" class="text-button" type="button">下载安装包</button></p>
  </section>
  <section id="sync-page" hidden><h1>本机 Workspace 同步</h1><p>为每个云端 Workspace 选择本机目录后，可按需指定同步方向和相对路径范围。单次同步与固定实时同步节点由各自控件管理。</p>
    <p id="expiry-warning" class="card" role="status" hidden>客户端登录将在 7 天内到期，请重新登录。</p>
    <div id="workspaces"></div>
  </section>
</main>
<div id="message" role="status" aria-live="polite"></div><script src="morde.js"></script>
</body></html>
