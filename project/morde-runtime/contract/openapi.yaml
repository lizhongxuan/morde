openapi: 3.1.0
info:
  title: Morde Runtime Control API
  version: 2.0.0
  description: >-
    Private Morde-to-morde-runtime protocol. Every request carries the protocol
    header. JSON objects carry the same protocol_version. Unknown major
    versions fail closed; additive optional fields and capabilities may be
    introduced within a major version.
x-morde-request-body-max-bytes: 1048576
x-morde-response-body-max-bytes: 8388608
security:
  - RuntimeCredential: []
paths:
  /runtime/v1/applications:
    get:
      operationId: listApplications
      description: >-
        Read the fixed Codex and WeChat application catalog. The Runtime checks
        its Host and control fence before and after probing. Codex output is
        reduced to a validated version and login enum. WeChat reports the fixed
        package install operation, which can be polled here; command output,
        account data, and credentials are never returned.
      parameters:
        - $ref: '#/components/parameters/ProtocolHeader'
        - name: protocol_version
          in: query
          required: true
          schema: { type: string, const: '2.0' }
        - name: host_id
          in: query
          required: true
          schema: { $ref: '#/components/schemas/HostID' }
        - name: runtime_generation
          in: query
          required: true
          schema: { $ref: '#/components/schemas/RuntimeGeneration' }
        - name: control_version
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ControlVersion' }
      responses:
        '200':
          description: Installed application readiness under the exact current Runtime fence.
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: no-store }
            Pragma:
              required: true
              schema: { type: string, const: no-cache }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Applications' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
        '409': { $ref: '#/components/responses/FenceOrProtocolRejected' }
        '413': { $ref: '#/components/responses/ResultTooLarge' }
        '503': { $ref: '#/components/responses/RuntimeStateUnavailable' }

  /runtime/v1/applications/{app_id}/install:
    post:
      operationId: installApplication
      description: >-
        Idempotently install the fixed official WeChat x86_64 package. The
        Runtime rejects arbitrary package names, URLs, commands, and non-amd64
        hosts. It accepts the asynchronous operation while holding the exact
        Host fence stable; a later control change is ordered after that commit.
        Poll its progress through listApplications.
      parameters:
        - $ref: '#/components/parameters/ProtocolHeader'
        - name: app_id
          in: path
          required: true
          schema: { type: string, const: wechat }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationInstallRequest' }
      responses:
        '202':
          description: Application install started, or its idempotent operation was returned.
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: no-store }
            Pragma:
              required: true
              schema: { type: string, const: no-cache }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationInstallResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
        '409': { $ref: '#/components/responses/FenceOrProtocolRejected' }
        '503': { $ref: '#/components/responses/RuntimeStateUnavailable' }

  /runtime/v1/applications/{app_id}/launch:
    post:
      operationId: launchApplication
      description: >-
        Start only a launcher registered in the fixed application catalog in
        its dedicated cgroup v2. launch_id is durable and idempotent. Runtime
        records the operation before starting it and never re-dispatches an
        uncertain launch. The current catalog contains only WeChat.
      parameters:
        - $ref: '#/components/parameters/ProtocolHeader'
        - name: app_id
          in: path
          required: true
          schema: { type: string, const: wechat }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationLaunchRequest' }
      responses:
        '202':
          description: Launch accepted or its durable idempotent operation returned.
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: no-store }
            Pragma:
              required: true
              schema: { type: string, const: no-cache }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationLaunchResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
        '409': { $ref: '#/components/responses/FenceOrProtocolRejected' }
        '503': { $ref: '#/components/responses/RuntimeStateUnavailable' }

  /runtime/v1/applications/{app_id}/launches/{launch_id}:
    get:
      operationId: getApplicationLaunch
      description: Query a durable application launch operation under its current Host fence.
      parameters:
        - $ref: '#/components/parameters/ProtocolHeader'
        - name: app_id
          in: path
          required: true
          schema: { type: string, const: wechat }
        - name: launch_id
          in: path
          required: true
          schema: { type: string, minLength: 8, maxLength: 128, pattern: '^launch_[A-Za-z0-9][A-Za-z0-9._:-]*$' }
        - name: protocol_version
          in: query
          required: true
          schema: { type: string, const: '2.0' }
        - name: host_id
          in: query
          required: true
          schema: { $ref: '#/components/schemas/HostID' }
        - name: runtime_generation
          in: query
          required: true
          schema: { $ref: '#/components/schemas/RuntimeGeneration' }
        - name: runtime_instance_id
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - name: control_version
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ControlVersion' }
      responses:
        '200':
          description: Current durable operation state.
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: no-store }
            Pragma:
              required: true
              schema: { type: string, const: no-cache }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationLaunchResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
        '404': { $ref: '#/components/responses/OperationNotFound' }
        '409': { $ref: '#/components/responses/FenceOrProtocolRejected' }
        '503': { $ref: '#/components/responses/RuntimeStateUnavailable' }

  /runtime/v1/applications/{app_id}/launches/{launch_id}/stop:
    post:
      operationId: stopApplicationLaunch
      description: >-
        Stop only the cgroup recorded for this launch. Runtime reports stopped
        only after cgroup.events confirms populated=0.
      parameters:
        - $ref: '#/components/parameters/ProtocolHeader'
        - name: app_id
          in: path
          required: true
          schema: { type: string, const: wechat }
        - name: launch_id
          in: path
          required: true
          schema: { type: string, minLength: 8, maxLength: 128, pattern: '^launch_[A-Za-z0-9][A-Za-z0-9._:-]*$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationLaunchRequest' }
      responses:
        '202':
          description: Stop accepted or the current idempotent operation returned.
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: no-store }
            Pragma:
              required: true
              schema: { type: string, const: no-cache }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationLaunchResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
        '404': { $ref: '#/components/responses/OperationNotFound' }
        '409': { $ref: '#/components/responses/FenceOrProtocolRejected' }
        '503': { $ref: '#/components/responses/RuntimeStateUnavailable' }

  /runtime/v1/capabilities:
    get:
      operationId: capabilities
      parameters:
        - $ref: '#/components/parameters/ProtocolHeader'
        - name: protocol_version
          in: query
          required: true
          schema: { type: string, const: '2.0' }
        - name: host_id
          in: query
          required: true
          schema: { $ref: '#/components/schemas/HostID' }
        - name: runtime_generation
          in: query
          required: true
          schema: { $ref: '#/components/schemas/RuntimeGeneration' }
        - name: control_version
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ControlVersion' }
      responses:
        '200':
          description: Actual runtime identity and declared capabilities.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Capabilities' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
        '409': { $ref: '#/components/responses/FenceOrProtocolRejected' }
        '503': { $ref: '#/components/responses/RuntimeStateUnavailable' }

  /runtime/v1/control:
    put:
      operationId: setControl
      parameters:
        - $ref: '#/components/parameters/ProtocolHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetControlRequest' }
      responses:
        '200':
          description: Accepted control state and fence.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetControlResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
        '409': { $ref: '#/components/responses/FenceOrProtocolRejected' }
        '503': { $ref: '#/components/responses/RuntimeStateUnavailable' }

  /runtime/v1/workspace-bindings:
    put:
      operationId: setWorkspaceBindings
      parameters:
        - $ref: '#/components/parameters/ProtocolHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetWorkspaceBindingsRequest' }
      responses:
        '200':
          description: Replaced the complete active Workspace binding snapshot under the current Runtime fence.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetWorkspaceBindingsResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
        '409': { $ref: '#/components/responses/FenceOrProtocolRejected' }
        '503': { $ref: '#/components/responses/RuntimeStateUnavailable' }

  /runtime/v1/tasks/{task_id}/lease:
    put:
      operationId: setTaskLease
      parameters:
        - $ref: '#/components/parameters/ProtocolHeader'
        - name: task_id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/TaskID' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetTaskLeaseRequest' }
      responses:
        '200':
          description: Accepted task lease and fence.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetTaskLeaseResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
        '409': { $ref: '#/components/responses/FenceOrProtocolRejected' }
        '503': { $ref: '#/components/responses/RuntimeStateUnavailable' }

  /runtime/v1/tasks/{task_id}/workspace-view:
    put:
      operationId: setTaskWorkspaceView
      parameters:
        - $ref: '#/components/parameters/ProtocolHeader'
        - name: task_id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/TaskID' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetTaskWorkspaceViewRequest' }
      responses:
        '200':
          description: >-
            Returned the deterministic private view after copying the currently
            bound Host Workspace and verifying its server manifest SHA-256.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetTaskWorkspaceViewResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
        '409': { $ref: '#/components/responses/FenceOrProtocolRejected' }
        '503': { $ref: '#/components/responses/RuntimeStateUnavailable' }
    delete:
      operationId: deleteTaskWorkspaceView
      parameters:
        - $ref: '#/components/parameters/ProtocolHeader'
        - name: task_id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/TaskID' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteTaskWorkspaceViewRequest' }
      responses:
        '200':
          description: >-
            Deleted the Task's private Workspace data and durably recorded the
            request tombstone. Replaying the same request ID is idempotent;
            a live Task lease or unresolved operation is rejected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteTaskWorkspaceViewResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
        '409': { $ref: '#/components/responses/FenceOrProtocolRejected' }
        '503': { $ref: '#/components/responses/RuntimeStateUnavailable' }

  /runtime/v1/tasks/{task_id}/workspace-view/manifest:
    post:
      operationId: readTaskWorkspaceManifestPage
      parameters:
        - $ref: '#/components/parameters/ProtocolHeader'
        - name: task_id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/TaskID' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskWorkspaceManifestRequest' }
      responses:
        '200':
          description: Bounded page from the exact registered private Task view.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskWorkspaceManifestResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
        '409': { $ref: '#/components/responses/FenceOrProtocolRejected' }
        '503': { $ref: '#/components/responses/RuntimeStateUnavailable' }

  /runtime/v1/tasks/{task_id}/workspace-view/block:
    post:
      operationId: readTaskWorkspaceBlock
      parameters:
        - $ref: '#/components/parameters/ProtocolHeader'
        - name: task_id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/TaskID' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskWorkspaceBlockRequest' }
      responses:
        '200':
          description: One SHA-256-verified block from the exact registered private Task view.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskWorkspaceBlockResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
        '409': { $ref: '#/components/responses/FenceOrProtocolRejected' }
        '503': { $ref: '#/components/responses/RuntimeStateUnavailable' }

  /runtime/v1/operations:
    post:
      operationId: executeOperation
      parameters:
        - $ref: '#/components/parameters/ProtocolHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecuteRequest' }
      responses:
        '200':
          description: Existing or newly accepted Host-wide operation record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
        '409': { $ref: '#/components/responses/OperationOrFenceConflict' }
        '413': { $ref: '#/components/responses/ResultTooLarge' }
        '503': { $ref: '#/components/responses/RuntimeStateUnavailable' }

  /runtime/v1/operations/{operation_id}:
    get:
      operationId: getOperation
      parameters:
        - $ref: '#/components/parameters/ProtocolHeader'
        - name: operation_id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/OperationID' }
        - name: host_id
          in: query
          required: true
          schema: { $ref: '#/components/schemas/HostID' }
        - name: runtime_generation
          in: query
          required: true
          schema: { $ref: '#/components/schemas/RuntimeGeneration' }
        - name: runtime_instance_id
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: control_version
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ControlVersion' }
        - name: task_id
          in: query
          required: true
          schema: { $ref: '#/components/schemas/TaskID' }
        - name: lease_version
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Original operation record; querying never restarts work.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationResponse' }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
        '404': { $ref: '#/components/responses/OperationNotFound' }
        '409': { $ref: '#/components/responses/FenceOrProtocolRejected' }
        '413': { $ref: '#/components/responses/ResultTooLarge' }
        '503': { $ref: '#/components/responses/RuntimeStateUnavailable' }

  /runtime/v1/operations/{operation_id}/cancel:
    post:
      operationId: cancelOperation
      parameters:
        - $ref: '#/components/parameters/ProtocolHeader'
        - name: operation_id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/OperationID' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelOperationRequest' }
      responses:
        '200':
          description: Current operation state after cancellation was requested or confirmed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
        '404': { $ref: '#/components/responses/OperationNotFound' }
        '409': { $ref: '#/components/responses/FenceOrProtocolRejected' }
        '503': { $ref: '#/components/responses/RuntimeStateUnavailable' }

  /runtime/v1/quiesce:
    post:
      operationId: quiesce
      parameters:
        - $ref: '#/components/parameters/ProtocolHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuiesceRequest' }
      responses:
        '200':
          description: Draining state, unresolved operation IDs, and a one-use receipt only after verified drain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuiesceResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
        '409': { $ref: '#/components/responses/FenceOrProtocolRejected' }
        '503': { $ref: '#/components/responses/RuntimeStateUnavailable' }

components:
  securitySchemes:
    RuntimeCredential:
      type: http
      scheme: bearer
      bearerFormat: 256-bit per-host runtime credential
      description: Private per-Host credential; only sent over verified private TLS.
  parameters:
    ProtocolHeader:
      name: X-Morde-Runtime-Protocol
      in: header
      required: true
      schema: { type: string, const: '2.0' }
  responses:
    InvalidRequest:
      description: Request validation failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RuntimeError' }
    AuthenticationFailed:
      description: Runtime credential was rejected.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RuntimeError' }
    FenceOrProtocolRejected:
      description: Host or runtime fence is stale, or protocol versions are incompatible.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RuntimeError' }
    OperationOrFenceConflict:
      description: Operation ID conflicts with a prior request or a fence is stale.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RuntimeError' }
    OperationNotFound:
      description: Complete healthy Host-wide registry confirms the operation was never accepted.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RuntimeError' }
    ResultTooLarge:
      description: Runtime result exceeds its per-call limit; it is not truncated.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RuntimeError' }
    RuntimeStateUnavailable:
      description: Runtime operation store is unavailable; no absence or drain is inferred.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RuntimeError' }
  schemas:
    HostID:
      type: string
      pattern: '^h[a-z0-9]{7}$'
    TaskID:
      type: string
      pattern: '^q[a-z0-9]{7}$'
    WorkspaceID:
      type: string
      pattern: '^w[a-z0-9]{7}$'
    OperationID:
      type: string
      pattern: '^o[a-z0-9]{7}$'
    RuntimeGeneration:
      type: integer
      minimum: 1
    ControlVersion:
      type: integer
      minimum: 0
    HostFence:
      type: object
      required: [host_id, runtime_generation, runtime_instance_id, control_version]
      properties:
        host_id: { $ref: '#/components/schemas/HostID' }
        runtime_generation: { $ref: '#/components/schemas/RuntimeGeneration' }
        runtime_instance_id: { type: string, minLength: 1 }
        control_version: { $ref: '#/components/schemas/ControlVersion' }
    Capabilities:
      type: object
      required: [protocol_version, host_id, runtime_generation, runtime_instance_id, control_version, mode, operation_store_ready, capabilities]
      properties:
        protocol_version: { type: string, const: '2.0' }
        host_id: { $ref: '#/components/schemas/HostID' }
        runtime_generation: { $ref: '#/components/schemas/RuntimeGeneration' }
        runtime_instance_id: { type: string, minLength: 1 }
        control_version: { $ref: '#/components/schemas/ControlVersion' }
        mode: { $ref: '#/components/schemas/Mode' }
        operation_store_ready: { type: boolean }
        capabilities:
          type: array
          items: { $ref: '#/components/schemas/Capability' }
    ApplicationLoginStatus:
      type: string
      enum: [logged_in, not_logged_in, unknown, not_applicable]
    ApplicationStatusItem:
      type: object
      additionalProperties: false
      required: [id, installed, version, login_status, installable, install_request_id, install_operation]
      properties:
        id: { type: string, enum: [codex, wechat] }
        installed: { type: boolean }
        version:
          type: string
          maxLength: 64
          anyOf:
            - { const: '' }
            - { type: string, pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))?$' }
        login_status: { $ref: '#/components/schemas/ApplicationLoginStatus' }
        installable: { type: boolean }
        install_request_id:
          type: string
          maxLength: 128
          anyOf:
            - { const: '' }
            - { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$' }
          description: Empty when install_operation is null; otherwise the current operation's original request ID.
        install_operation:
          anyOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/ApplicationInstallOperation' }
      allOf:
        - if:
            properties:
              install_operation: { type: 'null' }
          then:
            properties:
              install_request_id: { const: '' }
          else:
            properties:
              install_request_id: { pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$' }
      oneOf:
        - properties:
            id: { const: codex }
            installable: { const: false }
            install_request_id: { const: '' }
            install_operation: { type: 'null' }
            installed: { const: true }
            version:
              type: string
              pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
            login_status: { enum: [logged_in, not_logged_in] }
        - properties:
            id: { const: codex }
            installable: { const: false }
            install_request_id: { const: '' }
            install_operation: { type: 'null' }
            installed: { const: true }
            version:
              anyOf:
                - { const: '' }
                - { type: string, pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' }
            login_status: { const: unknown }
        - properties:
            id: { const: codex }
            installable: { const: false }
            install_request_id: { const: '' }
            install_operation: { type: 'null' }
            installed: { const: false }
            version: { const: '' }
